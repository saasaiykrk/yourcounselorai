name: ci
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Core safety tests are stdlib-only on purpose: they run even if dependencies break.
      - run: python -m unittest discover -s tests -t . -v
      - name: Skill integrity
        run: |
          python - <<'PY'
          from app.prompt import load_skill
          s = load_skill("skill/clinical-assist")
          assert s.version != "unknown", "skill version missing from SKILL.md"
          print("skill", s.version, "prompt_hash", s.prompt_hash, "cards", len(s.card_index))
          PY
      - name: Guard — safety files changed need the clinician-review label
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(skill/|app/inspector.py|app/deid.py|app/prompt.py|fixtures/|mobile/lib/core/deid/)' || true)
          if [ -n "$CHANGED" ] && [[ "$LABELS" != *"clinician-reviewed"* ]]; then
            echo "Safety-relevant files changed:"; echo "$CHANGED"
            echo "Add the 'clinician-reviewed' label after the clinical reviewer signs off (see CLAUDE.md)."; exit 1
          fi

  mobile:
    # Flutter app: static analysis plus widget tests (layout on small and standard phones,
    # safety behaviours, and safety wording kept in step with the backend and crisis register).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
      - name: Cleaner parity data matches app/deid.py
        working-directory: .
        run: python3 mobile/tool/deid_parity.py --check
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Compiles the native Android code too (MainActivity.kt: screenshot blocking).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Live build (real sign-in + Cloud Run backend from config/live.json), debug-signed
      # for installing on test phones. Download it from the run's Artifacts section.
      - run: flutter build apk --debug --dart-define-from-file=config/live.json
      - uses: actions/upload-artifact@v4
        with:
          name: yourcounselor-live-android
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  mobile-ios:
    # Manual only (macOS minutes cost more): compiles the iOS app, including
    # SceneDelegate.swift's app-switcher blur. No signing, so no secrets.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign

  evals:
    # Manual: runs the real model. Needs repo secrets. Upload the grading pack for the clinician.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m evals.run_evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          WHO_ICD_CLIENT_ID: ${{ secrets.WHO_ICD_CLIENT_ID }}
          WHO_ICD_CLIENT_SECRET: ${{ secrets.WHO_ICD_CLIENT_SECRET }}
          ICD_RELEASE: ${{ vars.ICD_RELEASE }}
      - uses: actions/upload-artifact@v4
        with: { name: eval-grading-pack, path: evals/out }
