name: ci
on:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Also run the clinical evals (real model, costs money; needs the eval secrets in GitHub)"
        type: boolean
        default: false
      eval_suite:
        description: "Which evals: all, vignettes (direct consult) or consultation (guided, Case Snapshot; L2 and L1)"
        type: choice
        options: [all, vignettes, consultation]
        default: all
      verify_icd:
        description: "Check every ICD-11 code in skill/ against WHO (free; needs the WHO_ICD_* secrets)"
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:            # throwaway database for the credit/payment tests (no real data, no secrets)
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: yc_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Core safety tests are stdlib-only on purpose: they run even if dependencies break.
      - run: python -m unittest discover -s tests -t . -v
      - name: Skill integrity
        run: |
          python - <<'PY'
          from app.prompt import load_skill
          s = load_skill("skill/clinical-assist")
          assert s.version != "unknown", "skill version missing from SKILL.md"
          print("skill", s.version, "prompt_hash", s.prompt_hash, "cards", len(s.card_index))
          PY
      - name: API tests (admin panel; needs the app's dependencies)
        run: |
          pip install -r requirements.txt
          python - <<'PY'
          import importlib.util, sys
          missing = [m for m in ("fastapi", "httpx", "psycopg", "cryptography") if not importlib.util.find_spec(m)]
          sys.exit(f"missing {missing}: API tests would be skipped" if missing else 0)
          PY
          python -m unittest tests.test_admin_api tests.test_history_api -v
      - name: Billing tests (credits and payments against a real Postgres; fake Razorpay)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yc_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -c "create schema auth; create table auth.users (id uuid primary key, email text);" \
            -f db/schema.sql -f db/migrations/006_billing.sql
          python -m unittest tests.test_billing_db tests.test_billing_api -v
      # The app's port of the cleaner must match app/deid.py (a CLAUDE.md safety file). This is a
      # quick Python check of the committed parity data; it does not build or test the app.
      - name: Cleaner parity data matches app/deid.py
        run: python3 mobile/tool/deid_parity.py --check
      - name: Guard — safety files changed need the clinician-review label
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(skill/|app/inspector.py|app/deid.py|app/prompt.py|fixtures/|mobile/lib/core/deid/)' || true)
          if [ -n "$CHANGED" ] && [[ "$LABELS" != *"clinician-reviewed"* ]]; then
            echo "Safety-relevant files changed:"; echo "$CHANGED"
            echo "Add the 'clinician-reviewed' label after the clinical reviewer signs off (see CLAUDE.md)."; exit 1
          fi

  mobile:
    # Manual only: the mobile app is built and released by the app owner, not by CI/CD.
    # Run it from Actions → ci → Run workflow for analysis, widget tests and a test APK.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Compiles the native Android code too (MainActivity.kt: screenshot blocking).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Live release build (real sign-in + Cloud Run backend from config/live.json), one
      # small APK per CPU type, signed with the debug key for test phones until the Play
      # upload key exists. Download from the run's Artifacts section.
      - run: flutter build apk --release --split-per-abi --dart-define-from-file=config/live.json
      - uses: actions/upload-artifact@v4
        with:
          name: yourcounselor-live-android
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  mobile-ios:
    # Manual only (macOS minutes cost more): compiles the iOS app, including
    # SceneDelegate.swift's app-switcher blur. No signing, so no secrets.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign

  evals:
    # Manual and opt-in (tick "run_evals"): runs the real model, which costs money. Needs repo
    # secrets. Uploads the grading pack for the clinician.
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Check the eval settings
        id: settings
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          missing=""
          [ "$HAS_KEY" = "true" ] || missing="$missing secret:ANTHROPIC_API_KEY"
          [ -n "$CLAUDE_MODEL" ] || missing="$missing variable:CLAUDE_MODEL"
          if [ -n "$missing" ]; then
            echo "::error::Evals need these in Settings → Secrets and variables → Actions:$missing (see docs/DEPLOY.md)"
            exit 1
          fi
      - name: Vignettes (direct consult)
        if: inputs.eval_suite != 'consultation'
        run: python -m evals.run_evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          WHO_ICD_CLIENT_ID: ${{ secrets.WHO_ICD_CLIENT_ID }}
          WHO_ICD_CLIENT_SECRET: ${{ secrets.WHO_ICD_CLIENT_SECRET }}
          ICD_RELEASE: ${{ vars.ICD_RELEASE }}
      - name: Guided consultation (Case Snapshot), L2
        if: ${{ !cancelled() && steps.settings.outcome == 'success' && inputs.eval_suite != 'vignettes' }}
        run: python -m evals.run_consultation_evals --level L2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          WHO_ICD_CLIENT_ID: ${{ secrets.WHO_ICD_CLIENT_ID }}
          WHO_ICD_CLIENT_SECRET: ${{ secrets.WHO_ICD_CLIENT_SECRET }}
          ICD_RELEASE: ${{ vars.ICD_RELEASE }}
      - name: Guided consultation (Case Snapshot), L1
        if: ${{ !cancelled() && steps.settings.outcome == 'success' && inputs.eval_suite != 'vignettes' }}
        run: python -m evals.run_consultation_evals --level L1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          WHO_ICD_CLIENT_ID: ${{ secrets.WHO_ICD_CLIENT_ID }}
          WHO_ICD_CLIENT_SECRET: ${{ secrets.WHO_ICD_CLIENT_SECRET }}
          ICD_RELEASE: ${{ vars.ICD_RELEASE }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: eval-grading-pack, path: evals/out }

  verify-icd:
    # Manual (tick "verify_icd"): every ICD-11 code in skill/ looked up with WHO in the pinned release.
    # Free; codes and titles only, no case text. Results appear in the run's summary.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_icd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Check every ICD-11 code in skill/ with WHO
        run: python -m evals.verify_icd_codes 6A70 6B23
        env:
          WHO_ICD_CLIENT_ID: ${{ secrets.WHO_ICD_CLIENT_ID }}
          WHO_ICD_CLIENT_SECRET: ${{ secrets.WHO_ICD_CLIENT_SECRET }}
          ICD_RELEASE: ${{ vars.ICD_RELEASE }}
