<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourCounselor | Acceptance and Commitment Therapy (ACT)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* YourCounselor — module reader styles
 * Follows the YourCounselor Brand & Document System v1.1 (locked) and the
 * approved sample work-up. Colours, fonts and components below are the only
 * ones allowed. Light theme only: the brand system defines no dark palette.
 */
:root {
  --plum: #3D0A6B;        /* headings, body text */
  --muted: #6E587E;       /* secondary text */
  --purple: #6A1BB5;      /* primary accent, links, numbers, buttons */
  --pink: #E8336D;        /* brand accent: accent bar only */
  --pink-text: #C2185B;   /* pink for small text */
  --ink: #260644;         /* dark bands */
  --on-ink: #FAF7FD;
  --on-ink-muted: #CDBEDF;
  --paper: #FFFFFF;
  --lilac: #F7F3FB;       /* page tint */
  --soft: #FAF7FC;        /* table header, quiet boxes */
  --tint: #F0E8F9;        /* chips, note boxes */
  --line: #E7DFEF;
  --line-strong: #D1C0DF;
  --ok: #1E7E34;     --ok-bg: #EAF7EC;     --ok-border: #BFE3C6;
  --warn: #9A5B00;   --warn-bg: #FFF4E0;   --warn-border: #F2D9A8;
  --danger: #B4233F; --danger-bg: #FDECEF; --danger-border: #F4C2CC;
  --head: 'Nunito', 'Inter', sans-serif;
  --body: 'Nunito Sans', 'Inter', sans-serif;
  --sidebar: 264px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--lilac); color: var(--plum); font: 400 16px/1.6 var(--body); }
h1, h2, h3, h4 { font-family: var(--head); color: var(--plum); line-height: 1.2; margin: 0; }
p { margin: 0 0 10px; }
strong { font-weight: 700; }
a { color: var(--purple); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { margin: 4px 0 12px; padding-left: 22px; }
li { margin-bottom: 5px; }
.muted { color: var(--muted); }

/* ---------- content protection ---------- */
.yc-protected, .yc-protected * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.yc-protected input, .yc-protected textarea { -webkit-user-select: text; user-select: text; }
@media print {
  body * { display: none !important; }
  body::after { content: "Printing is disabled for YourCounselor modules."; display: block !important; padding: 40px; font: 18px var(--body); color: var(--plum); }
}

/* ---------- watermark (viewer name + email) ---------- */
.yc-watermark { position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .08; background-repeat: repeat; }

/* ---------- logo lockup (logo + wordmark, gap = 1/4 logo height) ---------- */
.yc-lockup { display: flex; align-items: center; gap: 8px; /* gap = 1/4 logo height */ font: 800 19px var(--head); color: var(--plum); text-decoration: none; padding: 16px 0; }
.yc-lockup img { width: 32px; height: 32px; display: block; }
.yc-lockup.cover { padding: 0 0 22px; }
.yc-skip { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--purple); color: #FFFFFF; padding: 8px 14px; border-radius: 8px; font: 700 14px var(--head); }
.yc-skip:focus { left: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- layout ---------- */
.yc-app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.yc-sidebar { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--paper); border-right: 1px solid var(--line); padding: 4px 18px 24px; display: flex; flex-direction: column; }
.yc-sidebar .eyebrow-label { font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .06em; color: var(--purple); margin: 18px 0 6px; }
.yc-modlist a, .yc-toc a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--plum); font-size: 14px; }
.yc-modlist a.active { background: var(--tint); color: var(--purple); font-weight: 700; }
.yc-toc a { color: var(--muted); font-size: 13.5px; }
.yc-toc a .n { color: var(--purple); font-weight: 700; margin-right: 6px; font-family: var(--head); }
.yc-toc a:hover { background: var(--soft); color: var(--plum); text-decoration: none; }
.yc-toc a.is-hidden, .yc-mobile-toc a.is-hidden { opacity: .45; }
.yc-toc a.active { background: var(--tint); color: var(--purple); font-weight: 700; box-shadow: inset 3px 0 0 var(--purple); }
.yc-owner { margin-top: auto; padding-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.yc-owner strong { color: var(--plum); }

.yc-main { min-width: 0; }
.yc-topbar { display: none; }
.yc-sticky { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.yc-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 28px; background: var(--paper); }
.yc-toolbar input[type=search] { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px var(--body); }
.yc-toolbar input[type=search]::placeholder { color: var(--muted); }
.yc-toolbar input[type=search]:focus { outline: 2px solid var(--purple); outline-offset: 0; border-color: var(--purple); }
.yc-seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--paper); }
.yc-seg button { border: 0; background: none; color: var(--muted); padding: 8px 14px; font: 700 13px var(--head); cursor: pointer; }
.yc-seg button + button { border-left: 1px solid var(--line); }
.yc-seg button[aria-pressed=true] { background: var(--purple); color: #FFFFFF; }
.yc-filter-status { padding: 8px 28px; font-size: 14px; background: var(--tint); color: var(--plum); border-top: 1px solid var(--line); }
.yc-filter-status .yc-jump { border: 0; background: none; padding: 4px 2px; font: inherit; color: var(--purple); text-decoration: underline; cursor: pointer; }
.yc-btn { border: 1px solid var(--purple); background: var(--paper); color: var(--purple); border-radius: 999px; padding: 4px 13px; font: 700 13px var(--head); cursor: pointer; }
.yc-btn:hover { background: var(--tint); }
.yc-filter-status .yc-clear { margin-left: 6px; }
.yc-content { max-width: 900px; margin: 0 auto; padding: 24px 28px 80px; }
.yc-mobile-toc { display: none; }

@media (max-width: 900px) {
  .yc-app { grid-template-columns: 1fr; }
  .yc-sidebar { display: none; }
  .yc-topbar { display: flex; align-items: center; padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .yc-topbar .yc-lockup { padding: 10px 0; font-size: 17px; gap: 7px; }
  .yc-topbar .yc-lockup img { width: 28px; height: 28px; }
  .yc-toolbar { padding: 8px 16px; }
  .yc-filter-status { padding: 6px 16px; font-size: 13.5px; }
  .yc-content { padding: 16px 16px 64px; }
  .yc-mobile-toc { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 8px; border-top: 1px solid var(--line); scrollbar-width: none; }
  .yc-mobile-toc a { flex: none; display: inline-flex; align-items: center; min-height: 36px; font: 700 12.5px var(--head); padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--tint); color: var(--purple); text-decoration: none; }
  .yc-mobile-toc a.active { background: var(--purple); border-color: var(--purple); color: #FFFFFF; }
  .yc-seg button { min-height: 40px; }
  .yc-btn { min-height: 36px; }
  .check { min-height: 44px; }
}

/* ---------- module cover (header) ---------- */
.yc-cover { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
.yc-cover-body { padding: 28px 28px 20px; }
.eyebrow { display: inline-block; font: 700 11px var(--head); letter-spacing: .06em; text-transform: uppercase; color: var(--purple); background: var(--tint); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; }
.yc-cover h1 { font-weight: 800; font-size: 36px; letter-spacing: -0.02em; margin: 14px 0 8px; max-width: 640px; }
.yc-cover .sub { font-size: 17px; color: var(--muted); max-width: 600px; margin: 0; }
.yc-cover-meta { display: grid; grid-template-columns: 140px 1fr; row-gap: 6px; margin: 20px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14.5px; }
.yc-cover-meta dt { color: var(--muted); }
.yc-cover-meta dd { margin: 0; color: var(--plum); }
.yc-cover-band { position: relative; background: var(--ink); color: var(--on-ink-muted); padding: 18px 28px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; align-items: flex-end; }
.yc-cover-band::before { content: ''; position: absolute; left: 0; top: 0; height: 5px; width: 100%; background: linear-gradient(90deg, var(--purple) 0 80%, var(--pink) 80% 100%); }
.yc-cover-band strong { color: var(--on-ink); }
@media (max-width: 520px) { .yc-cover h1 { font-size: 28px; } .yc-cover-body { padding: 22px 18px 16px; } .yc-cover-band { padding: 16px 18px 12px; } .yc-cover-meta { grid-template-columns: 110px 1fr; } }

/* ---------- quick reference (pinned) ---------- */
.yc-quickref { margin: 0 0 18px; }

/* ---------- sections ---------- */
details.section { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px; scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
details.section > summary { list-style: none; cursor: pointer; padding: 18px 22px; display: flex; align-items: center; gap: 10px; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary h2 { font-size: 22px; font-weight: 700; flex: 1; }
details.section > summary::after { content: "▾" / ""; color: var(--muted); transition: transform .2s; }
details.section:not([open]) > summary::after { transform: rotate(-90deg); }
details.section[data-always-open] > summary { cursor: default; }
details.section[data-always-open] > summary::after { content: none; }
h2 .num { color: var(--purple); margin-right: 6px; }
.section-body { padding: 0 22px 20px; }
h3 { font-size: 17px; font-weight: 700; margin: 18px 0 6px; }
h4 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; }
.item { border-top: 1px solid var(--line); padding: 18px 0; }
.item:first-child { border-top: 0; padding-top: 4px; }
.item { scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
.item > h3 { margin-top: 0; }
.label-line { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin: 12px 0 4px; display: block; }
.not-covered { color: var(--muted); }

/* ---------- chips (status pills) ---------- */
.chip { display: inline-block; font: 700 11px var(--head); padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--tint); color: var(--purple); white-space: nowrap; vertical-align: 2px; margin-left: 4px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.chip.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.chip.plain { background: var(--paper); color: var(--muted); }

/* ---------- callouts: Why this matters · Note · Caution · Risk ---------- */
.box { border-left: 4px solid var(--purple); background: var(--soft); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0; }
.box .label { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 3px; color: var(--purple); }
.box > :last-child { margin-bottom: 0; }
.box.why { background: var(--tint); }
.box.warn { border-color: var(--warn); background: var(--warn-bg); } .box.warn .label { color: var(--warn); }
.box.danger { border-color: var(--danger); background: var(--danger-bg); } .box.danger .label { color: var(--danger); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 6px 0 12px; }
table.yc { width: 100%; border-collapse: collapse; font-size: 15px; border-color: var(--line); }
table.yc thead, table.yc tbody, table.yc tr { border-color: var(--line); }
table.yc th { background: var(--soft); font: 700 14px var(--head); text-align: left; color: var(--plum); }
table.yc th, table.yc td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
table.yc td { color: var(--muted); }
table.yc td:first-child { color: var(--plum); font-weight: 700; }
table.yc td strong { color: var(--plum); }
table.yc.dialogue td:first-child { width: 96px; font-family: var(--head); }
table.yc.dialogue .note { display: block; font-size: 13.5px; color: var(--purple); margin-top: 3px; }
@media (max-width: 520px) {
  table.yc, table.yc tbody, table.yc tr, table.yc td { display: block; width: 100%; }
  table.yc thead { display: none; }
  table.yc tr { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; padding: 6px 10px; background: var(--paper); }
  table.yc td { border: 0; padding: 4px 0; }
  table.yc td::before { content: attr(data-label); display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); }
  table.yc.dialogue td:first-child { width: auto; }
}

/* ---------- diagrams ---------- */
figure.dg { margin: 12px 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
figure.dg figcaption { font-size: 13.5px; color: var(--muted); margin-top: 8px; text-align: center; }
figure.dg .dg-title { font: 700 14px var(--head); color: var(--plum); margin: 0 0 8px; text-align: center; }
.dg-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.dg-svg { width: 100%; height: auto; display: block; max-width: 680px; margin: 0 auto; }
.dg-hint { display: none; font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 4px; }
@media (max-width: 600px) { .dg-svg { min-width: 560px; } .dg-hint { display: block; } figure.dg { padding: 10px; } }
.dg-box { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1.4; }
.dg-context .dg-box, .dg-question .dg-box { fill: var(--tint); stroke: var(--line-strong); }
.dg-level-0 .dg-box { fill: var(--paper); } .dg-level-1 .dg-box { fill: var(--soft); }
.dg-level-2 .dg-box { fill: var(--tint); } .dg-level-3 .dg-box { fill: var(--line); }
.dg-text { fill: var(--plum); font-family: var(--body); }
.dg-edge { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.dg-edge-back { stroke-dasharray: 5 4; }
.dg-arrowhead { fill: var(--muted); }
.dg-label-bg { fill: var(--paper); stroke: var(--line); }
.dg-label-text, .dg-axis { fill: var(--muted); font-family: var(--body); }
.dg-branch { fill: var(--purple); font-weight: 700; font-family: var(--head); }
.dg-frame { fill: none; stroke: var(--line-strong); stroke-dasharray: 6 5; }

/* ---------- quiz & checklist (quiz uses neutral brand colours, never status colours) ---------- */
.quiz-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.quiz-head .quiz-score { margin: 0; }
.quiz-q { border-top: 1px solid var(--line); padding: 16px 0; }
.quiz-q > p { font-weight: 600; margin: 0 0 8px; }
.quiz-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px/1.5 var(--body); cursor: pointer; }
.quiz-opt:hover:not([aria-disabled]) { border-color: var(--purple); }
.quiz-opt[aria-disabled] { cursor: default; }
.quiz-opt.correct { background: var(--tint); border: 2px solid var(--purple); }
.quiz-opt.picked { background: var(--soft); color: var(--muted); border-style: dashed; }
.quiz-tag:empty { display: none; }
.quiz-tag { display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin-bottom: 2px; }
.quiz-opt.picked .quiz-tag { color: var(--muted); }
.quiz-why { display: none; outline: none; }
.quiz-q.answered .quiz-why { display: block; }
.quiz-score { font: 700 15px var(--head); color: var(--purple); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { color: var(--plum); margin-top: 5px; accent-color: var(--purple); width: 18px; height: 18px; flex: none; }

/* ---------- client handouts ---------- */
.handout-preview { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 8px 0; background: var(--paper); }
.handout-notes { margin: 6px 0 0; font-size: 14px; }
.yc-handout-dl { min-height: 40px; }

/* ---------- crisis lines ---------- */
.crisis-list { margin: 6px 0 0; padding-left: 20px; }
.crisis-list li { margin-bottom: 6px; }
.crisis-list a { font-weight: 700; display: inline-block; padding: 2px 0; }
.crisis-region { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* ---------- disclaimer + copyright & IP notice (always last) ---------- */
.disclaimer { border: 1px dashed var(--line-strong); background: var(--soft); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); margin-top: 22px; }
.disclaimer strong { color: var(--plum); }
.ip-notice { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; font-size: 13px; line-height: 1.55; color: var(--muted); }
.ip-notice strong { color: var(--plum); }

/* ---------- floating Home button + search landing highlight ---------- */
.yc-home-fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 60; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--purple); color: #FFFFFF; font: 800 14px var(--head); box-shadow: 0 5px 18px rgba(61, 10, 107, .24); cursor: pointer; }
.yc-home-fab[hidden] { display: none; }
.yc-home-fab:hover { background: var(--plum); }
.yc-home-fab:focus-visible { background: var(--plum); outline: 2px solid var(--purple); outline-offset: 3px; }
.yc-hit { border-radius: 4px; animation: yc-hit 2.2s ease-out; }
@keyframes yc-hit { 0%, 45% { background: var(--line-strong); box-shadow: 0 0 0 4px var(--line-strong); } 100% { background: transparent; box-shadow: 0 0 0 4px transparent; } }
.yc-sticky { transition: transform .2s ease; }
@media (max-width: 900px) { .yc-sticky.yc-compact { transform: translateY(calc(-1 * var(--yc-toolbar-h, 0px))); } }
@media (prefers-reduced-motion: reduce) { .yc-sticky { transition: none; } .yc-hit { animation-duration: .01s; outline: 2px solid var(--purple); } }
@media print { .yc-home-fab { display: none !important; } }

.hidden-by-filter { display: none !important; }
::highlight(yc-search) { background-color: var(--line-strong); color: var(--plum); }
.handout-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.yc-handout-dl:disabled { opacity: .55; cursor: not-allowed; }
.yc-handout-status { margin: 4px 0 0; font-size: 14px; min-height: 0; }
.yc-handout-status:empty { display: none; }
.yc-preview-toggle { display: none; }
@media (max-width: 520px) {
  .handout-preview:not(.expanded) { max-height: 240px; overflow: hidden; position: relative; }
  .handout-preview:not(.expanded)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(rgba(255,255,255,0), var(--paper)); }
  .yc-preview-toggle { display: inline-flex; }
}
.sheet-inside { font-size: 14px; color: var(--muted); }

/* ---------- responsive refinements: tablet and phone ---------- */
.yc-app, .yc-main, .yc-content, .section-body, .item { min-width: 0; }
.yc-content img, .yc-content video, .yc-content canvas, .yc-content iframe { max-width: 100%; }
.yc-content pre, .yc-content code { overflow-wrap: anywhere; }
.table-wrap, .dg-scroll { max-width: 100%; overscroll-behavior-inline: contain; }
.yc-content :focus-visible, .yc-mobile-toc a:focus-visible, .yc-toolbar button:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
@media (min-width: 901px) and (max-width: 1100px) {
  .yc-app { grid-template-columns: 240px minmax(0, 1fr); }
  .yc-content, .yc-toolbar { padding-left: 22px; padding-right: 22px; }
}
@media (max-width: 900px) {
  .yc-mobile-toc { scroll-snap-type: x proximity; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
  .yc-mobile-toc a { scroll-snap-align: start; min-height: 44px; }
  .yc-topbar { min-height: 52px; }
  .yc-content { width: 100%; }
  .yc-sticky { max-width: 100vw; }
  .yc-toolbar input[type=search] { flex: 1 1 100%; }
  .yc-seg { flex: 1 1 auto; }
  .yc-seg button { flex: 1 1 auto; }
  .yc-filter-status { overflow-wrap: anywhere; }
  details.section > summary { padding: 16px 18px; }
  .section-body { padding: 0 18px 18px; }
  figure.dg { max-width: 100%; }
}
@media (max-width: 520px) {
  html { scroll-padding-top: 150px; }
  .yc-content { padding: 12px 12px 48px; }
  .yc-toolbar { gap: 7px; padding: 8px 12px; }
  .yc-filter-status, .yc-mobile-toc { padding-left: 12px; padding-right: 12px; }
  details.section { margin-bottom: 10px; }
  details.section > summary { gap: 8px; padding: 14px 12px; }
  details.section > summary h2 { font-size: 19px; overflow-wrap: anywhere; }
  .section-body { padding: 0 12px 14px; }
  .item { padding: 14px 0; }
  .box { padding-left: 11px; padding-right: 12px; }
  .yc-cover-meta { grid-template-columns: minmax(88px, 34%) minmax(0, 1fr); }
  .yc-cover-meta dd, .yc-cover-meta dt { overflow-wrap: anywhere; }
  .handout-preview { padding: 12px; }
}

var DATA = {"slug": "acceptance-commitment-therapy", "title": "Acceptance and Commitment Therapy (ACT) for Counsellors and Psychologists", "summary": "A professional practice module on ACT’s psychological flexibility model, functional assessment, experiential methods, values, committed action, and culturally responsive care.", "category": "Contextual · Behavioural", "audience": "Psychologists, professional counsellors, psychotherapists and supervised practitioners", "version": "1.0", "updated": "14 Oct 2026", "diagrams": [{"id": "act-six-processes", "title": "Six linked processes supporting psychological flexibility", "type": "map", "nodes": [{"id": "acceptance", "label": "Acceptance / willingness"}, {"id": "defusion", "label": "Cognitive defusion"}, {"id": "present", "label": "Present-moment awareness", "group": "context"}, {"id": "self", "label": "Self-as-context"}, {"id": "values", "label": "Values"}, {"id": "action", "label": "Committed action"}], "edges": [{"from": "acceptance", "to": "defusion", "bidirectional": true}, {"from": "defusion", "to": "present", "bidirectional": true}, {"from": "present", "to": "self", "bidirectional": true}, {"from": "self", "to": "values", "bidirectional": true}, {"from": "values", "to": "action", "bidirectional": true}, {"from": "action", "to": "acceptance", "bidirectional": true}], "caption": "The six processes are overlapping and context-sensitive. They are not a required sequence or a checklist to complete in every session."}, {"id": "act-functional-cycle", "title": "A functional view of stuck patterns and workable alternatives", "type": "flow", "nodes": [{"id": "context", "label": "Context, history, and current demands"}, {"id": "private", "label": "Thoughts, feelings, memories, sensations"}, {"id": "rule", "label": "Rule or struggle response"}, {"id": "short", "label": "Short-term effect"}, {"id": "long", "label": "Longer-term effect on valued life", "group": "context"}, {"id": "choice", "label": "Pause, notice, and choose a  a contextual behavioural approach oriented toward psychological flexibility, while distinguishing its model from a rigid technique package.", "Use functional questions to understand what a response does in context and how it affects the client’s chosen directions.", "Explain and apply acceptance, defusion, present-moment awareness, self-as-context, values, and committed action without treating them as separate steps or symptom-control tricks.", "Use experiential exercises and metaphors collaboratively, checking fit, meaning, accessibility, and client response.", "Set process-informed goals that include observable behaviour and valued functioning, alongside symptom and risk monitoring when indicated.", "Adapt ACT with cultural humility, retain appropriate safety and safeguarding, and work within competence and supervision."], "overview": {"text": "Acceptance and Commitment Therapy (ACT) is a contextual behavioural approach that uses acceptance, mindfulness, and behaviour-change processes to support psychological flexibility. The six commonly described processes are acceptance or willingness, cognitive defusion, contact with the present moment, self-as-context, values, and committed action. They are related aspects of a flexible repertoire, not six stages that every client must complete in order.\n\nACT asks how behaviour works in its context. A thought or feeling is not automatically a problem to remove, and it is not automatically a guide to follow. The clinician and client explore whether a response is workable in the situation and whether it moves toward what matters, while considering real constraints, safety, and power. ACT does not require abandoning diagnosis, medical care, other evidence-based treatments, or practical problem-solving. The evidence base varies by condition and comparison, and proposed processes of change continue to be studied.\n\nThis module is for psychologists, professional counsellors, psychotherapists, and supervised practitioners. It offers practice guidance, not certification, a substitute for formal training, or an individual treatment plan.", "diagram_id": "act-six-processes"}, "when_to_use": {"indications": ["Consider ACT when a client’s struggle with thoughts, feelings, memories, urges, or pain is restricting meaningful activity and the client is interested in a flexibility- and values-oriented approach.", "ACT may be delivered as a coherent treatment or integrated with other appropriate care. State clearly what model and protocol are being used and why.", "Use a contextual formulation to make sense of avoidance, fusion, rule-following, narrowed behaviour, or disengagement, and test that formulation against the client’s account and environment."], "populations": ["ACT can be adapted for adults and young people when developmental level, language, consent, caregiver involvement, and safeguarding are appropriately addressed.", "Adapt metaphors, mindfulness practices, values discussions, and action plans for disability, neurodivergence, culture, religion, language, trauma history, economic context, and access needs."], "cautions": ["Acceptance is not resignation, tolerating abuse, submitting to discrimination, or abandoning efforts to change unsafe conditions. Address external threats and structural barriers directly.", "Values are chosen life directions, not moral rules or goals imposed by the therapist, family, or culture. Explore possible coercion, guilt, and safety with care.", "Mindfulness, willingness, and experiential exercises can be uncomfortable or unsuitable at a particular time. Offer choice, alternatives, grounding, and a pause option.", "Assess suicide and self-harm risk, severe mental state changes, substance effects, medical issues, and safeguarding needs using established procedures. ACT exercises do not replace risk assessment or crisis care.", "ACT is not a universal replacement for diagnosis-specific or medical treatments. Review evidence and guidelines for the presenting problem, client preference, and level of care."]}, "core_concepts": [{"name": "Functional contextualism and workability", "originator": "Contextual behavioural science", "level": "foundation", "definition": "ACT examines behaviour in relation to context and consequences. Workability is a pragmatic question about what a response does over time in a particular context, not a claim that thoughts are either objectively true or false, and not a moral judgment.", "components": ["What happened before and after the response?", "What did it help with immediately?", "What did it cost or support over time?", "What context or resource could change its function?"], "illustration": "Avoiding a difficult conversation may protect someone from retaliation in one setting and prevent a needed request in another. Function depends on the situation."}, {"name": "Psychological flexibility", "originator": "ACT process model", "level": "foundation", "definition": "The capacity to contact present experience and adjust or persist in behaviour when doing so serves chosen values and fits the context. It is not constant calm, positive thinking, or acting without limits.", "components": ["Open to private experience when workable", "Aware of present context and perspective", "Engaged in chosen, observable action"], "illustration": "A client can feel grief and still choose whether to attend a meaningful family event, including deciding that rest or a boundary is the most workable choice."}, {"name": "Experiential avoidance and willingness", "level": "foundation", "definition": "Experiential avoidance describes attempts to alter, escape, or suppress private events when doing so restricts life or creates other costs. Willingness is the choice to make room for an experience in the service of a valued action when that is safe and useful. It is not passive endurance.", "components": ["Identify the control agenda and its function", "Notice costs without shaming the client", "Offer willingness as an option, not a demand"], "illustration": "A person may be willing to carry some anxiety while making a medical appointment, while still taking appropriate steps to manage the health concern."}, {"name": "Cognitive fusion and defusion", "level": "foundation", "definition": "Fusion describes thoughts functioning as literal commands, facts, or barriers in a particular context. Defusion changes how a person notices or responds to thoughts. It does not prove a thought false, suppress it, or require distance from every thought.", "components": ["Notice “my mind is saying…” if it fits", "Observe thought as an event in context", "Choose whether to follow, test, or let it pass"], "illustration": "“I will fail” can be noticed as a prediction, then the client chooses one preparation step while uncertainty remains."}, {"name": "Present-moment awareness", "level": "foundation", "definition": "Flexible attention to present internal and external events, guided by the task and context. It is not a requirement to meditate, relax, or focus inward when doing so is unhelpful.", "components": ["Notice what is happening now", "Shift attention flexibly", "Include external context and practical demands"], "illustration": "Before a difficult phone call, the client notices feet on the floor, the room, and the first sentence they want to say."}, {"name": "Self-as-context and perspective taking", "level": "advanced", "definition": "A perspective-taking process in which experiences can be noticed without reducing the person to any single thought, feeling, role, diagnosis, or story. It is a clinical perspective, not a metaphysical claim about a permanent or transcendent self.", "components": ["Distinguish observer perspective from self-description", "Use here/there, now/then, I/you carefully", "Avoid imposing a spiritual interpretation"], "illustration": "“I am broken” becomes “I notice the thought that I am broken,” without denying the person’s pain or history."}, {"name": "Values and committed action", "level": "foundation", "definition": "Values are chosen qualities of ongoing action in life domains, not endpoints, approval, or rules about what a good person must do. Committed action involves specific behaviour shaped by values and adjusted when context changes.", "components": ["Ask what matters to the client, not the therapist", "Separate directions from achievable goals", "Plan small actions, barriers, support, and review"], "illustration": "“Be a caring parent” is a direction; “read with my child for ten minutes on Tuesday” is a possible action that may express it."}, {"name": "ACT is contextual, not anti-cognitive or anti-diagnostic", "level": "foundation", "definition": "ACT shifts the function of thoughts and behaviour rather than insisting on disputing thought content. Factual evaluation, problem-solving, diagnosis, medical care, and other therapies can still be appropriate when they serve the client and fit the evidence.", "components": ["Do not set up a false ACT-versus-CBT dichotomy", "Use direct problem-solving when a solvable external problem is present", "Integrate or refer when indicated"]}, {"name": "ACT processes and evidence", "originator": "Research continues", "level": "advanced", "definition": "The six-process model is clinically influential, while measurement and causal claims about specific mechanisms remain active research questions. Track the client’s functioning and goals, not only a single flexibility score.", "components": ["Treat the model as a guide for formulation", "Use measures within their validation limits", "Review process and outcome repeatedly"]}], "assessment_formulation": {"intake_guide": ["Clarify referral question, client priorities, consent, preferred language, access needs, practical constraints, and expectations of therapy.", "Describe the target behaviours and contexts in observable terms. Include what the client does, avoids, approaches, and what happens next.", "Assess symptoms, duration, impairment, strengths, prior care, medication or substance factors, medical issues, trauma, developmental needs, and current risk.", "Explore the function of control strategies and private events without assuming all avoidance or coping is unworkable.", "Identify valued life directions in the client’s terms. Check for social pressure, safety, discrimination, and goals that are not freely chosen.", "Develop a working process formulation, agree goals and measures, and consider whether ACT fits the evidence and client preference."], "assess": ["Context: triggering situations, relationships, history, culture, current threats, resources, and contingencies.", "Behaviour: approach, avoidance, withdrawal, rituals, substance use, reassurance, problem-solving, and patterns of action.", "Private events and their functions: thoughts, feelings, sensations, memories, urges, self-stories, and rule-following.", "Workability: immediate consequences and longer-term effects on health, relationships, work, study, and valued participation.", "Psychological flexibility processes as hypotheses: experiential avoidance, fusion, present-moment contact, perspective taking, values clarity, and committed action.", "Strengths, cultural and spiritual resources, social support, accessibility, safety, and barriers that require practical or systemic action."], "key_questions": ["“When this thought or feeling shows up, what does it invite you to do?”", "“What happens right away, and what happens over time when you respond that way?”", "“What matters to you in this situation, even if the feeling does not change?”", "“Would noticing this experience differently be useful, or would another kind of support fit better?”", "“What is under your control here, and what requires protection, support, or change around you?”", "“What small action would be chosen by you and realistic in the circumstances?”"], "risk_script": ["Ask directly about immediate danger, suicidal thoughts or behaviour, self-harm, violence, abuse, exploitation, and urgent medical needs using local policy.", "Check whether a proposed acceptance or values exercise could be heard as pressure to endure harm or abandon needed protection.", "If immediate risk, medical instability, or safeguarding concern emerges, pause routine ACT exercises and follow the local response pathway."], "instruments": [{"name": "Problem-specific clinical measure", "measures": "Select a validated symptom or functioning measure that fits the referral question, age, language, and service, and follow its administration guidance."}, {"name": "Multidimensional process measure", "measures": "Where appropriate, consider a measure such as the Multidimensional Psychological Flexibility Inventory (MPFI) or CompACT. These support monitoring and do not diagnose or establish mechanism."}, {"name": "Values-based functioning review", "measures": "Use client-selected goals, participation, and specific committed actions alongside symptom ratings."}], "instrument_note": "Measures of psychological flexibility are not interchangeable. Research has raised concerns about treating one scale as a complete measure of all ACT processes. Check licensing, validation, and population limits.", "safety_plan": ["Document immediate risk findings and the response taken in the service record.", "Agree crisis contacts, support roles, information-sharing limits, and follow-up using local procedure.", "Ensure acceptance language does not delay medical, legal, safeguarding, or practical intervention."], "formulation_steps": ["Define the target behaviour and relevant context without reducing the client to a diagnosis or process label.", "Map antecedents, thoughts and feelings, action, immediate consequences, and longer-term effects.", "Ask what the behaviour protects, solves, expresses, avoids, or makes possible in this context.", "Identify one or more flexibility processes that could be useful, and invite the client to correct the formulation.", "Clarify values and practical barriers, including ur was trying to accomplish.", "Check safety, discrimination, access, and environmental constraints.", "Invite the client to revise the formulation."], "prompts": ["“What did that response help you do in the moment?”", "“What did it make harder later?”", "“Would this response be useful in another context?”"], "tip": "Workability is contextual. Avoid turning it into a verdict that a client’s choice is good or bad."}, {"name": "Creative hopelessness, handled with care", "level": "advanced", "purpose": "Explore whether repeated control strategies have delivered what the client hoped for and open room for new options.", "when": "Only when rapport and consent support the conversation; it is not a required ACT stage.", "steps": ["Ask what the client has already tried to change painful private experiences.", "Acknowledge what made each strategy understandable.", "Explore short- and long-term effects without pushing for a conclusion.", "Ask permission to consider another way of responding.", "Offer choice and stop if the exercise feels shaming or invalidating."], "prompts": ["“Would it be useful to look at what these strategies have cost and what they have helped with?”", "“What would you want to try if we did not have to solve the feeling first?”"], "caution": "The term does not mean making a client hopeless. Do not confront, corner, or insist that a coping strategy has failed."}, {"name": "Acceptance and willingness", "level": "foundation", "purpose": "Support open contact with an internal experience when that creates more room for chosen action.", "when": "When efforts to control an experience are costly and willingness fits the client’s goal and context.", "steps": ["Ask permission and explain that acceptance is not approval or resignation.", "Invite the client to notice the experience in a manageable way.", "Offer a choice of attention, distance, grounding, or stopping.", "Link willingness to a chosen activity, not to symptom reduction.", "Review fit and adapt."], "prompts": ["“Would you be willing to make a little room for this feeling while we take the next step?”", "“What would acceptance mean here, and what would it not mean?”"], "caution": "Never use acceptance to encourage tolerating abuse, discrimination, or preventable danger."}, {"name": "Cognitive defusion", "level": "foundation", "purpose": "Help the client notice thoughts as thoughts and choose how to respond, rather than obeying or fighting them automatically.", "when": "When a thought is functioning as a rigid rule or barrier and the client wants to experiment with a different relationship to it.", "steps": ["Identify the exact thought and its effect on behaviour.", "Offer a brief, consented noticing exercise.", "Ask what changed in the thought’s impact, if anything.", "Choose a next action based on context and values.", "Drop the exercise if it feels silly, alienating, or increases distress."], "prompts": ["“Can we try adding ‘I am noticing the thought that…’ and see what you observe?”", "“Does this thought need to be obeyed, argued with, or simply noticed right now?”"], "tip": "Defusion is not a way to prove a thought false, silence it, or force emotional distance."}, {"name": "Present-moment attention", "level": "foundation", "purpose": "Broaden or shift attention flexibly toward relevant present internal and external cues.", "when": "When attention is narrowed by rumination, worry, or disengagement and the client agrees to practise.", "steps": ["Ask what kind of attention would help in this moment.", "Offer eyes-open, movement, sensory, relational, or external-object options.", "Invite brief noticing without insisting on relaxation.", "Return attention to the chosen task or conversation."], "caution": "Some clients find interoceptive or closed-eye exercises difficult. Offer alternatives and monitor response."}, {"name": "Self-as-context and perspective taking", "level": "advanced", "purpose": "Help the client contact a perspective from which thoughts and experiences can be noticed without defining the whole person.", "when": "When rigid self-stories are restricting action and an experiential perspective-taking exercise fits.", "steps": ["Use the client’s own words for a self-story.", "Invite noticing that the story is present now.", "Explore continuity of noticing across changing experiences, without metaphysical claims.", "Ask how holding the story more lightly could affect a chosen action."], "prompts": ["“What do you notice about the thought ‘I am a failure’ as it shows up?”", "“Can the part of you noticing this story also notice what matters in this moment?”"], "caution": "Avoid language of a permanent, pure, or superior self. Do not impose spiritual beliefs."}, {"name": "Values clarification", "level": "foundation", "purpose": "Identify chosen qualities of action that can guide behaviour across changing situations.", "when": "When the client wants direction or when goals have become dominated by avoidance, approval, or external pressure.", "steps": ["Explore life domains the client wants to discuss.", "Ask about qualities of action, not achievement or social status.", "Check whether the value is chosen, culturally meaningful, and safe.", "Notice conflicts between values without forcing a single answer.", "Translate one direction into a small action."], "prompts": ["“How would you want to show up in this relationship, even if the other person responds differently?”", "“Is this something you care about, or something you feel required to want?”"], "tip": "Values are not a test of virtue. Interdependence and family commitments can be chosen values."}, {"name": "Committed action and barrier planning", "level": "foundation", "purpose": "Build flexible, observable patterns of action linked to values.", "when": "When a direction is clear enough to choose a feasible next step.", "steps": ["Name the chosen direction.", "Select a specific, achievable behaviour and when or where it might happen.", "Identify likely barriers and supports.", "Plan a flexible response to discomfort or changed circumstances.", "Review what happened without moralising or grading the client."], "prompts": ["“What is one small step you choose, rather than feel forced to take?”", "“If the first plan does not fit, what could be another workable step?”"]}, {"name": "ACT Matrix or functional map", "level": "advanced", "purpose": "Organize a conversation about inner experiences, away moves, and toward moves in context.", "when": "When a visual map would help the client and it does not oversimplify the situation.", "steps": ["Choose a current situation or valued area.", "Record inner experiences that show up.", "Map actions that move away from discomfort and their function.", "Map actions toward what matters, including boundaries and safety.", "Choose one possible next step and invite corrections."], "caution": "The Matrix is one tool, not a diagnostic instrument or a substitute for formulation."}, {"name": "Metaphors and experiential exercises", "level": "advanced", "purpose": "Make a process easier to notice through a brief, collaborative experience.", "when": "When a metaphor fits the client’s language, culture, and current needs.", "steps": ["Ask whether the client is open to a metaphor or exercise.", "Use a short, adapted example rather than a fixed script.", "Check how the image lands and what it means to the client.", "Link it to behaviour and context, not a generic moral.", "Offer a different method if it does not fit."], "tip": "Metaphors such as carrying a feeling while walking toward a destination can illustrate willingness. Avoid props or role-play that may feel coercive or triggering."}, {"name": "Therapist process awareness and relational stance", "level": "advanced", "purpose": "Notice how therapist behaviour, assumptions, and discomfort shape the interaction.", "when": "Throughout ACT-informed practice and in supervision.", "steps": ["Notice urges to lecture, reassure, rescue, or force a values answer.", ortunity", "Narrowed participation and stronger control rules"], "priority_techniques": ["Functional analysis", "Defusion or willingness as chosen", "Graded committed action and outcome monitoring"], "pitfall": "Do not assume anxiety is always a false alarm or that exposure is required for every ACT case."}, {"problem": "Depression and withdrawal", "model": "ACT-informed work may explore behavioural narrowing, fusion with self-critical stories, and valued re-engagement. Use condition-specific assessment and care.", "maintaining_cycle": ["Low mood, fatigue, or self-judgment", "Withdrawal or reduced activity", "Immediate demand reduction", "Less contact with reinforcement, connection, or meaning"], "priority_techniques": ["Assess risk, sleep, health, and practical stressors", "Values-informed small actions", "Acceptance and defusion without minimizing depression"], "pitfall": "Do not frame severe symptoms, barriers, or lack of energy as unwillingness. Consider other evidence-based treatments and medical review."}, {"problem": "Chronic pain or health-related distress", "model": "ACT may be considered within multidisciplinary care for appropriate pain presentations; acceptance does not mean ignoring symptoms or reducing medical care.", "priority_techniques": ["Coordinate with medical and rehabilitation providers", "Clarify valued activities and pacing", "Explore struggle with pain while respecting symptom changes"], "pitfall": "New, worsening, or concerning symptoms require appropriate medical assessment; do not reinterpret them as fusion."}, {"problem": "Trauma-related distress", "model": "ACT processes may support coping and valued action, but should not replace recommended trauma-focused care where indicated.", "priority_techniques": ["Assess current safety and trauma-related needs", "Use grounding and choice", "Refer or coordinate for trauma-focused protocol when appropriate"], "pitfall": "Do not use acceptance to encourage enduring ongoing abuse or to avoid trauma- ed applying for roles after repeated thoughts that she will embarrass herself. Avoidance lowers anxiety that evening, but increases financial pressure and shame. Her current work situation is also shaped by a difficult hiring market and caring responsibilities. The clinician assesses mood, risk, health, practical needs, and Leena’s goals rather than treating the thought as the whole problem.", "goals": ["Reconnect with work that feels meaningful and feasible.", "Respond to self-critical thoughts with more flexibility.", "Take one practical step without waiting to feel confident."], "sessions": [{"session": "Assessment", "focus": "Understand context, function, and goals.", "highlights": "The clinician asks what avoidance protects and what it costs. They identify financial and caregiving barriers that also need practical planning."}, {"session": "Defusion and values", "focus": "Explore thought function and chosen direction.", "highlights": "Leena notices “I will fail” as a recurring prediction. She identifies creativity and contribution as directions she wants in work."}, {"session": "Committed action", "focus": "Choose one feasible step.", "highlights": "Leena and the clinician plan to update one section of her CV with a friend. They include an alternative if care responsibilities change."}, {"session": "Review", "focus": "Learn from action and context.", "highlights": "Leena updated the CV but did not apply. The review notices that the chosen step felt manageable and identifies a concern about discriminatory hiring practices, which they discuss without reframing it as irrational fear."}], "dialogue": [{"speaker": "Clinician", "line": "When the thought “I will fail” shows up, what does it lead you to do?"}, {"speaker": "Leena", "line": "I close the job site. I feel better for a while, then I feel worse."}, {"speaker": "Clinician", "line": "Would it be useful to notice that thought and decide whether it needs to make the decision today?"}, {"speaker": "Leena", "line": "Maybe. I do care about creative work, but I also need a role that fits caregiving."}, {"speaker": "Clinician", "line": "Let’s include both of those realities. What is one step you choose, with a backup plan if the week changes?"}], "setback": "A new rejection leads Leena to avoid the job site again. The clinician acknowledges the disappointment, checks practical and emotional needs, and revisits the action plan without insisting that acceptance means pushing through.", "outcome": "Illustrative only. ACT does not promise symptom relief or a particular employment outcome. The example includes internal experience and external conditions.", "relapse_prevention": ["Notice when avoidance begins to narrow valued activity.", "Revisit chosen values and check whether they remain current.", "Choose actions that fit current resources and constraints.", "Seek practical, medical, or specialist support where needed."]}, "tools": [{"name": "ACT Matrix", "level": "foundation", "purpose": "Map inner experiences, away moves, toward moves, and context in the client’s terms.", "when": "When a visual map supports formulation and client understanding.", "fields": ["Situation or context", "Inner experiences noticed", "Actions that move away from discomfort", "Immediate and longer-term function", "Actions toward what matters", "Safety, access, or environmental action"], "example": "Example: Situation: ask a supervisor for clearer priorities. Inner event: “They will think I am incompetent.” Away move: stay late and guess. Toward move: request a short check-in, while keeping a record of workload concerns."}, {"name": "Values compass", "level": "foundation", "purpose": "Translate chosen qualities of action into practical directions without turning them into goals or moral rules.", "when": "When the client wants direction or is unsure what action matters.", "fields": ["Life area", "Quality of action the client chooses", "Whose expectation is this?", "A small behaviour that could express it", s": 3}]}, {"heading": "Cultural, ethical, and safety review", "items": [{"t": "line", "label": "Cultural meanings, discrimination, language, and access", "lines": 3}, {"t": "line", "label": "Risk, boundaries, referral, or scope questions", "lines": 3}]}, {"heading": "Supervision outcome", "items": [{"t": "line", "label": "Alternative formulations and agreed actions", "lines": 4}, {"t": "line", "label": "Responsible person and review date", "lines": 2}]}]}], "counsellor_sheets_added": false, "session_note_template": {"fields": [{"label": "Date, duration, mode, attendees", "guidance": "Record minimum necessary service information."}, {"label": "Client priority, consent, and goals", "guidance": "Use the client’s stated language and note relevant consent and choices."}, {"label": "Risk and context", "guidance": "Record direct assessment and actions, including practical, medical, safeguarding, or systemic concerns."}, {"label": "Functional pattern discussed", "guidance": "Describe context, behaviour, and consequences without presenting process labels as diagnoses."}, {"label": "Intervention and client response", "guidance": "Name the experiential or behavioural intervention, rationale, consent, adaptations, and client feedback."}, {"label": "Values-based action and supports", "guidance": "Record the client-chosen action, barriers, support, and alternative plan."}, {"label": "Coordination, supervision, referral", "guidance": "Note decisions, consent or legal basis, and responsible people."}, {"label": "Review plan", "guidance": "State outcome measure, next review, and follow-up."}], "example": "Leena discussed cancelling a job search after the thought “I will fail.” She described short-term relief and longer-term financial stress. The clinician explored both caregiving demands and concerns about discriminatory hiring. Leena identified creative contribution as a chosen direction and planned to update one CV section with a friend. They agreed an alternative if care arrangements changed. The clinician invited feedback on whether the values exercise felt useful.", "note": "Use the organisation’s record system and local legal, safeguarding, and documentation standards. This template does not replace a required clinical record."}, "session_note_template_added": false, "online_adaptations": ["Confirm privacy, location, contact details, and emergency procedures according to service policy.", "Ask whether eyes-open, movement, external focus, or a brief pause is preferable before mindfulness or experiential work.", "Use shared documents or visual maps only with consent and accessible formats. Do not require personal disclosure in chat or recorded sessions.", "Clarify response times and limits for between-session messaging.", "Consider privacy and safety in the client’s physical environment before suggesting an action."], "online_adaptations_added": false, "tips": ["Keep one foot in the client’s actual context and one in the process hypothesis.", "Use the client’s own language for values and private experiences.", "Ask what an exercise is doing for the client rather than assuming its function.", "Make actions small enough to be chosen and reviewable, while allowing context to change the plan.", "Use mindfulness flexibly; eyes-open, movement, external focus, and practical attention may fit better.", "Hold process explanations lightly and include functioning, symptoms, relationship, and client feedback in review."], "pitfalls": ["Treating ACT as a fixed sequence of metaphors or a script-heavy technique package.", "Using acceptance or willingness to normalize harm, oppression, or avoidable danger.", "Treating symptoms as irrelevant or assuming symptom improvement is incompatible with ACT.", "Claiming all CBT disputes thoughts while ACT never evaluates facts; this is a false dichotomy.", "Turning values into therapist-approved goals, social duties, or proof of motivation.", "Presenting self-as-context as a metaphysical or spiritual truth.", "Using defusion or mindfulness to suppress thoughts, force calm, or invalidate a valid concern.", "Assuming psychological inflexibility is the sole cause of distress or that process measures establish mechanism.", "Overusing therapist self-disclosure, confrontation, or “creative hopelessness.”"], "competency_checklist": ["I can explain ACT as a contextual behavioural approach and describe its six interrelated processes.", "I can develop and revise a functional formulation with the client.", "I ask about the function and consequences of behaviour without assuming all coping is unworkable.", "I distinguish acceptance from resignation and protect the client’s right to external change and safety.", "I use defusion and mindfulness as invitations, not control strategies.", "I clarify client-chosen values without imposing moral or cultural assumptions.", "I translate valued directions into observable, flexible actions and include practical supports.", "I assess risk, diagnosis, medical needs, and external conditions using appropriate procedures.", "I can identify limits of competence and seek supervision, consultation, or referral."], "competency_checklist_added": false, "supervision_prompts": ["What is the client’s own account of the problem and valued direction?", "What contextual evidence supports our functional hypothesis, and what alternative explanation should we consider?", "Did I use acceptance language in a way that could minimize harm or block practical change?", "Were values genuinely client-chosen, and how did culture, family, power, or structural barriers shape the options?", "Did the exercise serve the client’s goal, and what feedback did the client give?", "Was my own urge to lecture, reassure, rescue, or self-disclose active in the session?", "Are ACT processes being measured cautiously alongside symptoms, functioning, and alliance?", "What condition-specific guidance, risk management, consultation, or referral is needed?"], "supervision_prompts_added": false, "quiz": [{"question": "What is the general aim of ACT?", "options": ["Eliminate painful thoughts before action", "Increase psychological flexibility in context and in service of chosen values", "Replace diagnosis with the Hexaflex", "Teach every metaphor in sequence"], "answer": 1, "rationale": "ACT supports flexible contact with experience and behaviour that serves chosen ends in context."}, {"question": "Which set names the six commonly described ACT processes?", "options": ["Acceptance, defusion, present moment, self-as-context, values, committed action", "Insight, catharsis, exposure, disputation, relaxation, homework", "Hope, empathy, validation, interpretation, neutrality, diagnosis", "Thought record, hierarchy, reward, exposure, schema, relapse"], "answer": 0, "rationale": "These are six related processes in the psychological flexibility model."}, {"question": "A client’s avoidance protects them from an unsafe person. What should the clinician do?", "options": ["Use acceptance to help them tolerate the person", "Assess safety and support protective action", "Label avoidance as inflexibility", "Insist on contact to test values"], "answer": 1, "rationale": "ACT does not use acceptance to normalize danger or discourage protection."}, {"question": "Defusion is best described as:", "options": ["Proving thoughts are false", "Changing the relationship to a thought so behaviour can be chosen more flexibly", "Suppressing unwanted thoughts", "Distracting from every thought"], "answer": 1, "rationale": "Defusion can help a client notice thoughts as thoughts; it is not thought correction or suppression."}, {"question": "Which is a value rather than a goal?", "options": ["Get promoted by June", "Be a supportive friend", "Finish a degree", "Move to another city"], "answer": 1, "rationale": "A value is an ongoing quality of action. Goals are outcomes or steps that may express a value."}, {"question": "What is the best use of a metaphor?", "options": ["Deliver it exactly as written", "Offer it collaboratively, check fit, and adapt or stop if it does not help", "Use it to make the client agree", "Use a metaphor instead of assessment"], "answer": 1, "rationale": "Metaphors are optional experiential tools and should be adapted to the person and context."}, {"question": "A mindfulness exercise makes a client more distressed. The clinician should:", "options": ["Insist they continue", "Offer choice, stop or adapt, and assess what is needed", "Tell them the distress is avoidance", "Repeat until calm"], "answer": 1, "rationale": "Mindfulness is not mandatory and should not be used to force calm."}, {"question": "How should a committed action plan be formed?", "options": ["As a specific, client-chosen behaviour with barriers and alternatives considered", "As a promise to never avoid again", "As a therapist-defined moral goal", "Only after all symptoms are gone"], "answer": 0, "rationale": "Action should be chosen, observable, flexible, and responsive to context."}, {"question": "What does “workability” ask?", "options": ["Is this response morally good?", "Does this response function effectively over time in this context and toward chosen ends?", "Is the thought factually false?", "Can distress be eliminated?"], "answer": 1, "rationale": "Workability is contextual and pragmatic, not a moral verdict or an instruction to ignore facts."}, {"question": "How should process measures be used?", "options": ["As diagnostic tests", "As one source of discussion within their validation limits", "As proof ACT caused improvement", "As a substitute for client goals"], "answer": 1, "rationale": "Measures support monitoring but do not diagnose or prove a mechanism."}, {"question": "What best describes therapist self-disclosure in ACT?", "options": ["Required for competent ACT", "Optional and considered only when it serves the client and boundaries", "A way to make the therapist and client equal in all respects", "A substitute for supervision"], "answer": 1, "rationale": "Self-disclosure is optional and must be clinically purposeful and boundaried."}, {"question": "A client cannot complete an action because of caregiving demands. A useful response is to:", "options": ["Call it unwillingness", "Explore context and revise the plan collaboratively", "Insist the value is not important", "Use a metaphor to avoid the practical barrier"], "answer": 1, "rationale": "Functional and contextual work includes practical constraints and changes to the action plan."}], "quick_reference": ["**ACT aim:** psychological flexibility, contacting experience and taking or adjusting action in service of chosen values.", "**Six processes:** acceptance / willingness, defusion, present-moment awareness, self-as-context, values, and committed action. They overlap; no fixed sequence.", "**Functional question:** what does this response do in this context, now and over time?", "**Acceptance:** make room for private experience when useful; it never means approving harm or giving up external change.", "**Defusion:** notice thoughts as thoughts; do not suppress or force distance.", "**Values:** chosen directions, not goals, moral rules, or guaranteed outcomes.", "**Action:** small, observable, flexible, supported, and reviewable.", "**Evidence:** ACT processes and mechanisms continue to be evaluated. Use condition-specific guidance, client outcomes, and validated measures cautiously.", "**Reading:** Association for Contextual Behavioral Science, “The Six Core Processes of ACT”; Macri & Rogge (2024), systematic review and meta-analysis of ACT process domains."], "glossary": [{"term": "Acceptance", "definition": "Open and active contact with private experiences when doing so supports workable action. It is not approval, resignation, or tolerating harm."}, {"term": "Committed action", "definition": "Flexible patterns of behaviour linked to chosen values, adjusted as context and learning change."}, {"term": "Cognitive defusion", "definition": "Noticing thoughts as thoughts and changing their influence on behaviour, rather than automatically obeying or fighting them."}, {"term": "Contextual behavioural science", "definition": "A scientific approach that studies behaviour in context and evaluates actions by their function and consequences."}, {"term": "Experiential avoidance", "definition": "Attempts to alter, escape, or suppress private experiences when those attempts create costs or restrict valued action."}, {"term": "Functional contextualism", "definition": "A pragmatic philosophy emphasizing behaviour-in-context and the workability of actions relative to chosen aims."}, {"term": "Psychological flexibility", "definition": "Flexible present-moment contact and behaviour change or persistence in service of chosen values."}, {"term": "Relational Frame Theory", "definition": "A behavioural account of language and cognition involving learned relational responding and transformation of stimulus functions."}, {"term": "Self-as-context", "definition": "A perspective-taking process that allows experiences and self-stories to be noticed without defining the whole person."}, {"term": "Values", "definition": "Chosen qualities of ongoing action in life domains, distinct from goals, outcomes, or social approval."}, {"term": "Workability", "definition": "A contextual question about what a response accomplishes and costs over time in relation to the client’s chosen direction."}, {"term": "Willingness", "definition": "A chosen openness to private experience when that supports meaningful action and fits the context."}], "related_modules": ["cbt", "behavioural-activation", "motivational-interviewing", "person-centred-therapy", "solution-focused-brief-therapy", "dbt", "exposure-therapy"], "safety_note": "ACT education does not replace clinical assessment, diagnosis, medical care, risk assessment, safeguarding, supervision, or condition-specific evidence-based treatment. Acceptance is not a reason to remain in danger or to forgo practical help. If immediate risk or urgent medical concern emerges, pause routine exercises and follow the local emergency and safeguarding pathway."}};
