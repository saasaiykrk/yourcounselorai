<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourCounselor | Dialectical Behavior Therapy (DBT)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* YourCounselor — module reader styles
 * Follows the YourCounselor Brand & Document System v1.1 (locked) and the
 * approved sample work-up. Colours, fonts and components below are the only
 * ones allowed. Light theme only: the brand system defines no dark palette.
 */
:root {
  --plum: #3D0A6B;        /* headings, body text */
  --muted: #6E587E;       /* secondary text */
  --purple: #6A1BB5;      /* primary accent, links, numbers, buttons */
  --pink: #E8336D;        /* brand accent: accent bar only */
  --pink-text: #C2185B;   /* pink for small text */
  --ink: #260644;         /* dark bands */
  --on-ink: #FAF7FD;
  --on-ink-muted: #CDBEDF;
  --paper: #FFFFFF;
  --lilac: #F7F3FB;       /* page tint */
  --soft: #FAF7FC;        /* table header, quiet boxes */
  --tint: #F0E8F9;        /* chips, note boxes */
  --line: #E7DFEF;
  --line-strong: #D1C0DF;
  --ok: #1E7E34;     --ok-bg: #EAF7EC;     --ok-border: #BFE3C6;
  --warn: #9A5B00;   --warn-bg: #FFF4E0;   --warn-border: #F2D9A8;
  --danger: #B4233F; --danger-bg: #FDECEF; --danger-border: #F4C2CC;
  --head: 'Nunito', 'Inter', sans-serif;
  --body: 'Nunito Sans', 'Inter', sans-serif;
  --sidebar: 264px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--lilac); color: var(--plum); font: 400 16px/1.6 var(--body); }
h1, h2, h3, h4 { font-family: var(--head); color: var(--plum); line-height: 1.2; margin: 0; }
p { margin: 0 0 10px; }
strong { font-weight: 700; }
a { color: var(--purple); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { margin: 4px 0 12px; padding-left: 22px; }
li { margin-bottom: 5px; }
.muted { color: var(--muted); }

/* ---------- content protection ---------- */
.yc-protected, .yc-protected * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.yc-protected input, .yc-protected textarea { -webkit-user-select: text; user-select: text; }
@media print {
  body * { display: none !important; }
  body::after { content: "Printing is disabled for YourCounselor modules."; display: block !important; padding: 40px; font: 18px var(--body); color: var(--plum); }
}

/* ---------- watermark (viewer name + email) ---------- */
.yc-watermark { position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .08; background-repeat: repeat; }

/* ---------- logo lockup (logo + wordmark, gap = 1/4 logo height) ---------- */
.yc-lockup { display: flex; align-items: center; gap: 8px; /* gap = 1/4 logo height */ font: 800 19px var(--head); color: var(--plum); text-decoration: none; padding: 16px 0; }
.yc-lockup img { width: 32px; height: 32px; display: block; }
.yc-lockup.cover { padding: 0 0 22px; }
.yc-skip { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--purple); color: #FFFFFF; padding: 8px 14px; border-radius: 8px; font: 700 14px var(--head); }
.yc-skip:focus { left: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- layout ---------- */
.yc-app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.yc-sidebar { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--paper); border-right: 1px solid var(--line); padding: 4px 18px 24px; display: flex; flex-direction: column; }
.yc-sidebar .eyebrow-label { font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .06em; color: var(--purple); margin: 18px 0 6px; }
.yc-modlist a, .yc-toc a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--plum); font-size: 14px; }
.yc-modlist a.active { background: var(--tint); color: var(--purple); font-weight: 700; }
.yc-toc a { color: var(--muted); font-size: 13.5px; }
.yc-toc a .n { color: var(--purple); font-weight: 700; margin-right: 6px; font-family: var(--head); }
.yc-toc a:hover { background: var(--soft); color: var(--plum); text-decoration: none; }
.yc-toc a.is-hidden, .yc-mobile-toc a.is-hidden { opacity: .45; }
.yc-toc a.active { background: var(--tint); color: var(--purple); font-weight: 700; box-shadow: inset 3px 0 0 var(--purple); }
.yc-owner { margin-top: auto; padding-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.yc-owner strong { color: var(--plum); }

.yc-main { min-width: 0; }
.yc-topbar { display: none; }
.yc-sticky { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.yc-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 28px; background: var(--paper); }
.yc-toolbar input[type=search] { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px var(--body); }
.yc-toolbar input[type=search]::placeholder { color: var(--muted); }
.yc-toolbar input[type=search]:focus { outline: 2px solid var(--purple); outline-offset: 0; border-color: var(--purple); }
.yc-seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--paper); }
.yc-seg button { border: 0; background: none; color: var(--muted); padding: 8px 14px; font: 700 13px var(--head); cursor: pointer; }
.yc-seg button + button { border-left: 1px solid var(--line); }
.yc-seg button[aria-pressed=true] { background: var(--purple); color: #FFFFFF; }
.yc-filter-status { padding: 8px 28px; font-size: 14px; background: var(--tint); color: var(--plum); border-top: 1px solid var(--line); }
.yc-filter-status .yc-jump { border: 0; background: none; padding: 4px 2px; font: inherit; color: var(--purple); text-decoration: underline; cursor: pointer; }
.yc-btn { border: 1px solid var(--purple); background: var(--paper); color: var(--purple); border-radius: 999px; padding: 4px 13px; font: 700 13px var(--head); cursor: pointer; }
.yc-btn:hover { background: var(--tint); }
.yc-filter-status .yc-clear { margin-left: 6px; }
.yc-content { max-width: 900px; margin: 0 auto; padding: 24px 28px 80px; }
.yc-mobile-toc { display: none; }

@media (max-width: 900px) {
  .yc-app { grid-template-columns: 1fr; }
  .yc-sidebar { display: none; }
  .yc-topbar { display: flex; align-items: center; padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .yc-topbar .yc-lockup { padding: 10px 0; font-size: 17px; gap: 7px; }
  .yc-topbar .yc-lockup img { width: 28px; height: 28px; }
  .yc-toolbar { padding: 8px 16px; }
  .yc-filter-status { padding: 6px 16px; font-size: 13.5px; }
  .yc-content { padding: 16px 16px 64px; }
  .yc-mobile-toc { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 8px; border-top: 1px solid var(--line); scrollbar-width: none; }
  .yc-mobile-toc a { flex: none; display: inline-flex; align-items: center; min-height: 36px; font: 700 12.5px var(--head); padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--tint); color: var(--purple); text-decoration: none; }
  .yc-mobile-toc a.active { background: var(--purple); border-color: var(--purple); color: #FFFFFF; }
  .yc-seg button { min-height: 40px; }
  .yc-btn { min-height: 36px; }
  .check { min-height: 44px; }
}

/* ---------- module cover (header) ---------- */
.yc-cover { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
.yc-cover-body { padding: 28px 28px 20px; }
.eyebrow { display: inline-block; font: 700 11px var(--head); letter-spacing: .06em; text-transform: uppercase; color: var(--purple); background: var(--tint); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; }
.yc-cover h1 { font-weight: 800; font-size: 36px; letter-spacing: -0.02em; margin: 14px 0 8px; max-width: 640px; }
.yc-cover .sub { font-size: 17px; color: var(--muted); max-width: 600px; margin: 0; }
.yc-cover-meta { display: grid; grid-template-columns: 140px 1fr; row-gap: 6px; margin: 20px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14.5px; }
.yc-cover-meta dt { color: var(--muted); }
.yc-cover-meta dd { margin: 0; color: var(--plum); }
.yc-cover-band { position: relative; background: var(--ink); color: var(--on-ink-muted); padding: 18px 28px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; align-items: flex-end; }
.yc-cover-band::before { content: ''; position: absolute; left: 0; top: 0; height: 5px; width: 100%; background: linear-gradient(90deg, var(--purple) 0 80%, var(--pink) 80% 100%); }
.yc-cover-band strong { color: var(--on-ink); }
@media (max-width: 520px) { .yc-cover h1 { font-size: 28px; } .yc-cover-body { padding: 22px 18px 16px; } .yc-cover-band { padding: 16px 18px 12px; } .yc-cover-meta { grid-template-columns: 110px 1fr; } }

/* ---------- quick reference (pinned) ---------- */
.yc-quickref { margin: 0 0 18px; }

/* ---------- sections ---------- */
details.section { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px; scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
details.section > summary { list-style: none; cursor: pointer; padding: 18px 22px; display: flex; align-items: center; gap: 10px; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary h2 { font-size: 22px; font-weight: 700; flex: 1; }
details.section > summary::after { content: "▾" / ""; color: var(--muted); transition: transform .2s; }
details.section:not([open]) > summary::after { transform: rotate(-90deg); }
details.section[data-always-open] > summary { cursor: default; }
details.section[data-always-open] > summary::after { content: none; }
h2 .num { color: var(--purple); margin-right: 6px; }
.section-body { padding: 0 22px 20px; }
h3 { font-size: 17px; font-weight: 700; margin: 18px 0 6px; }
h4 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; }
.item { border-top: 1px solid var(--line); padding: 18px 0; }
.item:first-child { border-top: 0; padding-top: 4px; }
.item { scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
.item > h3 { margin-top: 0; }
.label-line { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin: 12px 0 4px; display: block; }
.not-covered { color: var(--muted); }

/* ---------- chips (status pills) ---------- */
.chip { display: inline-block; font: 700 11px var(--head); padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--tint); color: var(--purple); white-space: nowrap; vertical-align: 2px; margin-left: 4px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.chip.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.chip.plain { background: var(--paper); color: var(--muted); }

/* ---------- callouts: Why this matters · Note · Caution · Risk ---------- */
.box { border-left: 4px solid var(--purple); background: var(--soft); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0; }
.box .label { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 3px; color: var(--purple); }
.box > :last-child { margin-bottom: 0; }
.box.why { background: var(--tint); }
.box.warn { border-color: var(--warn); background: var(--warn-bg); } .box.warn .label { color: var(--warn); }
.box.danger { border-color: var(--danger); background: var(--danger-bg); } .box.danger .label { color: var(--danger); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 6px 0 12px; }
table.yc { width: 100%; border-collapse: collapse; font-size: 15px; border-color: var(--line); }
table.yc thead, table.yc tbody, table.yc tr { border-color: var(--line); }
table.yc th { background: var(--soft); font: 700 14px var(--head); text-align: left; color: var(--plum); }
table.yc th, table.yc td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
table.yc td { color: var(--muted); }
table.yc td:first-child { color: var(--plum); font-weight: 700; }
table.yc td strong { color: var(--plum); }
table.yc.dialogue td:first-child { width: 96px; font-family: var(--head); }
table.yc.dialogue .note { display: block; font-size: 13.5px; color: var(--purple); margin-top: 3px; }
@media (max-width: 520px) {
  table.yc, table.yc tbody, table.yc tr, table.yc td { display: block; width: 100%; }
  table.yc thead { display: none; }
  table.yc tr { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; padding: 6px 10px; background: var(--paper); }
  table.yc td { border: 0; padding: 4px 0; }
  table.yc td::before { content: attr(data-label); display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); }
  table.yc.dialogue td:first-child { width: auto; }
}

/* ---------- diagrams ---------- */
figure.dg { margin: 12px 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
figure.dg figcaption { font-size: 13.5px; color: var(--muted); margin-top: 8px; text-align: center; }
figure.dg .dg-title { font: 700 14px var(--head); color: var(--plum); margin: 0 0 8px; text-align: center; }
.dg-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.dg-svg { width: 100%; height: auto; display: block; max-width: 680px; margin: 0 auto; }
.dg-hint { display: none; font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 4px; }
@media (max-width: 600px) { .dg-svg { min-width: 560px; } .dg-hint { display: block; } figure.dg { padding: 10px; } }
.dg-box { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1.4; }
.dg-context .dg-box, .dg-question .dg-box { fill: var(--tint); stroke: var(--line-strong); }
.dg-level-0 .dg-box { fill: var(--paper); } .dg-level-1 .dg-box { fill: var(--soft); }
.dg-level-2 .dg-box { fill: var(--tint); } .dg-level-3 .dg-box { fill: var(--line); }
.dg-text { fill: var(--plum); font-family: var(--body); }
.dg-edge { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.dg-edge-back { stroke-dasharray: 5 4; }
.dg-arrowhead { fill: var(--muted); }
.dg-label-bg { fill: var(--paper); stroke: var(--line); }
.dg-label-text, .dg-axis { fill: var(--muted); font-family: var(--body); }
.dg-branch { fill: var(--purple); font-weight: 700; font-family: var(--head); }
.dg-frame { fill: none; stroke: var(--line-strong); stroke-dasharray: 6 5; }

/* ---------- quiz & checklist (quiz uses neutral brand colours, never status colours) ---------- */
.quiz-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.quiz-head .quiz-score { margin: 0; }
.quiz-q { border-top: 1px solid var(--line); padding: 16px 0; }
.quiz-q > p { font-weight: 600; margin: 0 0 8px; }
.quiz-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px/1.5 var(--body); cursor: pointer; }
.quiz-opt:hover:not([aria-disabled]) { border-color: var(--purple); }
.quiz-opt[aria-disabled] { cursor: default; }
.quiz-opt.correct { background: var(--tint); border: 2px solid var(--purple); }
.quiz-opt.picked { background: var(--soft); color: var(--muted); border-style: dashed; }
.quiz-tag:empty { display: none; }
.quiz-tag { display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin-bottom: 2px; }
.quiz-opt.picked .quiz-tag { color: var(--muted); }
.quiz-why { display: none; outline: none; }
.quiz-q.answered .quiz-why { display: block; }
.quiz-score { font: 700 15px var(--head); color: var(--purple); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { color: var(--plum); margin-top: 5px; accent-color: var(--purple); width: 18px; height: 18px; flex: none; }

/* ---------- client handouts ---------- */
.handout-preview { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 8px 0; background: var(--paper); }
.handout-notes { margin: 6px 0 0; font-size: 14px; }
.yc-handout-dl { min-height: 40px; }

/* ---------- crisis lines ---------- */
.crisis-list { margin: 6px 0 0; padding-left: 20px; }
.crisis-list li { margin-bottom: 6px; }
.crisis-list a { font-weight: 700; display: inline-block; padding: 2px 0; }
.crisis-region { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* ---------- disclaimer + copyright & IP notice (always last) ---------- */
.disclaimer { border: 1px dashed var(--line-strong); background: var(--soft); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); margin-top: 22px; }
.disclaimer strong { color: var(--plum); }
.ip-notice { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; font-size: 13px; line-height: 1.55; color: var(--muted); }
.ip-notice strong { color: var(--plum); }

/* ---------- floating Home button + search landing highlight ---------- */
.yc-home-fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 60; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--purple); color: #FFFFFF; font: 800 14px var(--head); box-shadow: 0 5px 18px rgba(61, 10, 107, .24); cursor: pointer; }
.yc-home-fab[hidden] { display: none; }
.yc-home-fab:hover { background: var(--plum); }
.yc-home-fab:focus-visible { background: var(--plum); outline: 2px solid var(--purple); outline-offset: 3px; }
.yc-hit { border-radius: 4px; animation: yc-hit 2.2s ease-out; }
@keyframes yc-hit { 0%, 45% { background: var(--line-strong); box-shadow: 0 0 0 4px var(--line-strong); } 100% { background: transparent; box-shadow: 0 0 0 4px transparent; } }
.yc-sticky { transition: transform .2s ease; }
@media (max-width: 900px) { .yc-sticky.yc-compact { transform: translateY(calc(-1 * var(--yc-toolbar-h, 0px))); } }
@media (prefers-reduced-motion: reduce) { .yc-sticky { transition: none; } .yc-hit { animation-duration: .01s; outline: 2px solid var(--purple); } }
@media print { .yc-home-fab { display: none !important; } }

.hidden-by-filter { display: none !important; }
::highlight(yc-search) { background-color: var(--line-strong); color: var(--plum); }
.handout-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.yc-handout-dl:disabled { opacity: .55; cursor: not-allowed; }
.yc-handout-status { margin: 4px 0 0; font-size: 14px; min-height: 0; }
.yc-handout-status:empty { display: none; }
.yc-preview-toggle { display: none; }
@media (max-width: 520px) {
  .handout-preview:not(.expanded) { max-height: 240px; overflow: hidden; position: relative; }
  .handout-preview:not(.expanded)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(rgba(255,255,255,0), var(--paper)); }
  .yc-preview-toggle { display: inline-flex; }
}
.sheet-inside { font-size: 14px; color: var(--muted); }

/* ---------- responsive refinements: tablet and phone ---------- */
.yc-app, .yc-main, .yc-content, .section-body, .item { min-width: 0; }
.yc-content img, .yc-content video, .yc-content canvas, .yc-content iframe { max-width: 100%; }
.yc-content pre, .yc-content code { overflow-wrap: anywhere; }
.table-wrap, .dg-scroll { max-width: 100%; overscroll-behavior-inline: contain; }
.yc-content :focus-visible, .yc-mobile-toc a:focus-visible, .yc-toolbar button:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
@media (min-width: 901px) and (max-width: 1100px) {
  .yc-app { grid-template-columns: 240px minmax(0, 1fr); }
  .yc-content, .yc-toolbar { padding-left: 22px; padding-right: 22px; }
}
@media (max-width: 900px) {
  .yc-mobile-toc { scroll-snap-type: x proximity; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
  .yc-mobile-toc a { scroll-snap-align: start; min-height: 44px; }
  .yc-topbar { min-height: 52px; }
  .yc-content { width: 100%; }
  .yc-sticky { max-width: 100vw; }
  .yc-toolbar input[type=search] { flex: 1 1 100%; }
  .yc-seg { flex: 1 1 auto; }
  .yc-seg button { flex: 1 1 auto; }
  .yc-filter-status { overflow-wrap: anywhere; }
  details.section > summary { padding: 16px 18px; }
  .section-body { padding: 0 18px 18px; }
  figure.dg { max-width: 100%; }
}
@media (max-width: 520px) {
  html { scroll-padding-top: 150px; }
  .yc-content { padding: 12px 12px 48px; }
  .yc-toolbar { gap: 7px; padding: 8px 12px; }
  .yc-filter-status, .yc-mobile-toc { padding-left: 12px; padding-right: 12px; }
  details.section { margin-bottom: 10px; }
  details.section > summary { gap: 8px; padding: 14px 12px; }
  details.section > summary h2 { font-size: 19px; overflow-wrap: anywhere; }
  .section-body { padding: 0 12px 14px; }
  .item { padding: 14px 0; }
  .box { padding-left: 11px; padding-right: 12px; }
  .yc-cover-meta { grid-template-columns: minmax(88px, 34%) minmax(0, 1fr); }
  .yc-cover-meta dd, .yc-cover-meta dt { overflow-wrap: anywhere; }
  .handout-preview { padding: 12px; }
}

e follows the treatment model, service protocol, and current clinical priorities."}], "sections": {"learning_objectives": ["Explain DBT as a structured, principle-driven behavioral treatment that balances acceptance and change.", "Distinguish comprehensive DBT from a skills group, a DBT-informed intervention, or use of selected skills.", "Use behavioral principles, target hierarchy, diary-card review, chain analysis, and solution analysis within competence and supervision.", "Teach and coach core mindfulness, interpersonal effectiveness, emotion regulation, and distress-tolerance skills without presenting skills as substitutes for assessment or care.", "Integrate risk management, consultation, cultural humility, treatment fidelity, and generalisation across settings."], "overview": {"text": "Dialectical Behavior Therapy (DBT), developed by Marsha M. Linehan, is a cognitive-behavioral treatment grounded in a biosocial account of pervasive emotion dysregulation. It combines behavioral assessment and change strategies with validation, acceptance, mindfulness, and a dialectical stance. The central clinical task is to help a person build a life worth living while reducing behaviors that threaten life, treatment, or quality of life.\n\nStandard outpatient DBT is a coordinated treatment, not a list of skills. It commonly includes individual psychotherapy, skills training, between-session coaching, and a therapist consultation team. Programs differ in setting and adaptation. A clinician using selected skills should describe the service accurately and avoid implying that skills-only work is comprehensive DBT. The four skills areas are core mindfulness, interpersonal effectiveness, emotion regulation, and distress tolerance.", "diagram_id": "dbt-biosocial"}, "when_to_use": {"indications": ["Consider DBT when recurrent high-risk behaviors, severe emotion dysregulation, impulsivity, self-injury, suicidal behavior, or persistent interpersonal and quality-of-life problems call for structured behavioral treatment and skills generalisation. Match the approach to a full assessment, client preference, goals, available service, and clinician competence.", "DBT has a developed evidence base for some populations and presentations, including people with borderline personality disorder and recurrent suicidal or self-injurious behavior. The evidence for a specific adaptation depends on its population, protocol, provider training, and outcome data."], "populations": ["Adults and adolescents may receive DBT or adapted DBT programs when the service has appropriate training, developmental adaptations, caregiver involvement where indicated, and safeguarding procedures.", "DBT principles and skills have been adapted for different settings and clinical problems. A skills group or selected skills in another treatment should be named as such, with a clear account of scope."], "cautions": ["Assess immediate risk, medical needs, substance effects, trauma-related responses, neurodevelopmental needs, and environmental danger. DBT does not replace crisis care, psychiatric assessment, medication review, or safeguarding.", "Do not use a DBT label to imply fidelity or competence where the coordinated treatment modes, training, consultation, and service supports are absent.", "Skills can be misapplied as demands to tolerate abuse, suppress emotion, or manage structural harm alone. Validate context and support practical protection and advocacy."]}, "core_concepts": [{"name": "Dialectics", "originator": "Marsha M. Linehan", "definition": "A practice of holding apparently opposing truths together and looking for a synthesis that allows movement. In DBT, acceptance and change are both necessary.", "components": ["Both-and thinking", "Balance and flexibility", "Thesis, antithesis, and a workable synthesis", "Therapist awareness of polarised positions"], "illustration": "A client can be doing the best they can and still need to learn new behaviors. The therapist can validate the pain and ask for a concrete change.", "level": "foundation"}, {"name": "Biosocial theory", "originator": "Marsha M. Linehan", "definition": "A transactional model in which biological emotional vulnerability and environments that respond invalidatingly or do not fit the person’s needs can contribute to difficulties learning emotion regulation.", "components": ["Emotional sensitivity", "Rapid or intense response", "Slower return to baseline", "Transactions with environment over time"], "illustration": "A strong emotional response is understood in context. Formulation explores learning history and current contingencies without blaming the client or family.", "level": "foundation"}, {"name": "Validation", "originator": "Marsha M. Linehan", "definition": "Communicating that the person’s experience makes sense in context, while not necessarily agreeing with every interpretation or endorsing every action.", "components": ["Attend", "Reflect accurately", "Name the understandable part", "Validate the person’s effort or context", "Maintain boundaries and change focus"], "illustration": "“Given the uncertainty and what happened before, I can see why your alarm rose quickly. Let’s also look at what would help you stay safe tonight.”", "level": "foundation"}, {"name": "Behavioral target hierarchy", "originator": "Marsha M. Linehan", "definition": "An ordered way of prioritising targets in individual DBT so that life-threatening behavior is addressed first, followed by therapy-interfering behavior, quality-of-life-interfering behavior, and skills acquisition.", "components": ["Life-threatening behaviors", "Therapy-interfering behaviors", "Quality-of-life-interfering behaviors", "Skills acquisition and generalisation"], "illustration": "A missed appointment is explored, but an active life-threatening behavior takes priority in the session.", "level": "foundation"}, {"name": "Behavioral chain analysis", "originator": "Marsha M. Linehan", "definition": "A detailed, nonjudgmental analysis of one target episode, tracing prompting events, vulnerability factors, links, behavior, and consequences.", "components": ["Specific episode", "Vulnerability factors", "Sequential links across domains", "Target behavior and consequences", "Solution analysis"], "illustration": "Rather than “I always lose control,” identify the evening, message, bodily tension, interpretations, urge, action, and what happened next.", "level": "foundation"}, {"name": "Skills generalisation", "originator": "Marsha M. Linehan", "definition": "Supporting the use of learned behaviors in the situations where they are needed, with practice, coaching, prompting, rehearsal, and review.", "components": ["Skill acquisition", "Practice in context", "Prompting and troubleshooting", "Reinforcement of effective behavior"], "illustration": "A client rehearses a brief DEAR MAN request and plans when to use it, what might get in the way, and how to recover if the conversation changes.", "level": "foundation"}, {"name": "Dialectical abstinence and harm reduction", "originator": "Marsha M. Linehan", "definition": "A treatment stance that aims for abstinence from a target behavior while planning for lapses with rapid return to the plan, learning, and safety rather than all-or-nothing collapse. Use only where clinically appropriate and consistent with the treatment agreement.", "components": ["Clear behavioral target", "Commitment to change", "Lapse response and repair", "Safety and nonjudgmental learning"], "illustration": "After a lapse, the team addresses immediate safety and consequences, analyzes the chain, and renews the next effective step.", "level": "foundation"}, {"name": "Contingency management", "originator": "Marsha M. Linehan", "definition": "Attending to the consequences that strengthen or weaken behavior and arranging responses that reinforce effective behavior while avoiding inadvertent reinforcement of dangerous patterns.", "components": ["Identify consequences", "Assess function", "Coordinate responses", "Reinforce skillful alternatives"], "illustration": "A team responds consistently to skill use and maintains safety boundaries without withdrawing warmth.", "level": "foundation"}, {"name": "Consultation-to-the-patient stance", "originator": "Marsha M. Linehan", "definition": "A therapist stance that treats the client as the primary agent in solving their problems while offering consultation, skills, and care rather than taking over.", "components": ["Respect agency", "Offer options and coaching", "Avoid rescuing or controlling", "Maintain responsibility for professional duties"], "illustration": "“I can help you map the options and practice the call. You decide which step fits, while we follow our agreed safety plan.”", "level": "foundation"}], "assessment_formulation": {"assess": ["Clarify referral question, client priorities, treatment history, strengths, goals, access needs, and expectations. Obtain consent for information sharing and coordinated care.", "Assess suicidal thoughts and behavior, self-injury, violence risk, substance use, medical issues, trauma, exploitation, and immediate environmental danger using local procedures and direct, respectful questions. A diary card supports monitoring but is not a risk assessment.", "Identify behaviors that threaten life, interfere with therapy, or seriously impair quality of life. Define targets in observable terms, including frequency, intensity, duration, context, and consequences.", "Assess the functions and contingencies around target behavior, emotion-regulation capacity, skill use, social context, culture, disability, and practical barriers."], "key_questions": ["What would make treatment worth your effort?", "What happened immediately before the behavior, and what happened next?", "What made the situation more vulnerable that day?", "What did the behavior do for you in the short term? What did it cost later?", "What has helped you remain safe or use a skill, even briefly?", "What ive factors, capacity to collaborate, and relevant collateral information according to policy and competence. Do not substitute a risk score or worksheet for clinical judgment.", "Develop or update a collaborative safety plan appropriate to the situation, including warning signs, coping steps, supportive contacts, professional services, and means-safety steps where indicated.", "Consult the appropriate supervisor or multidisciplinary team. Escalate promptly when imminent danger, serious injury, intoxication, psychosis, inability to maintain safety, or other urgent needs exceed the service’s capacity."], "goal_setting": ["Write goals in the client’s language and connect them to a life worth living. Translate broad wishes into observable behavior and skills practice.", "Agree target definitions, monitoring, treatment modes available, between-session expectations, contact boundaries, and what happens during lapses or crises.", "Balance acceptance and change. Revisit goals collaboratively and document disagreement, uncertainty, and client choice."], "tracking": ["Review diary-card data with curiosity, not as a compliance grade. Look for patterns, missing information, skills tried, and consequences.", "Track target frequency or severity and relevant client-defined quality-of-life outcomes at intervals suited to the service.", "Use changes in data to guide treatment, not to infer motive or replace conversation."], "instrument_note": "A diary card is a monitoring and treatment-planning aid, not a diagnostic measure or stand-alone risk instrument. Explain its purpose, limits, storage, and how the client can request accessible alternatives.", "diagram_id": "dbt-chain", "intake_guide": ["Define treatment fit and client priorities", "Assess current safety and urgent care needs", "Identify target behaviors in observable language", "Map strengths, supports, context, and access needs", "Agree on treatment modes, boundaries, and coordination", "Set up collaboratively tailored moni aution": "Follow local crisis procedures; a hierarchy does not replace clinical risk decisions."}, {"name": "Diary-card review", "level": "foundation", "purpose": "Use brief repeated monitoring to identify patterns, targets, skills, and priorities.", "when": "When diary cards or an agreed monitoring method are part of the treatment.", "steps": ["Invite the client to review what they recorded and what was difficult to record.", "Notice target behavior, urges, emotions, and skills without moral language.", "Link entries to specific events and consequences.", "Choose one episode for further analysis and reinforce any effective skill use."], "prompts": ["What stands out to you in the week?", "What was happening around the strongest urge?", "What made tracking easier or harder?"], "dialogue": [], "if_client_says": [], "tip": "Ask permission before exploring a sensitive entry; accept accessible formats and partial data.", "caution": "Diary cards are not risk screens. Ask direct risk questions and follow protocol."}, {"name": "Behavior chain analysis", "level": "advanced", "purpose": "Understand the sequence and function of one target behavior so intervention can begin earlier.", "when": "After a clearly defined episode, when the client is sufficiently regulated to examine it.", "steps": ["Name the exact behavior and episode.", "Identify prompting event and vulnerability factors.", "Map each link across thoughts, feelings, body sensations, urges, actions, and responses.", "Clarify immediate and delayed consequences.", "Ask what links were missed and what could interrupt the chain."], "prompts": ["What was the first sign the situation was shifting?", "What happened next, step by step?", "What did the behavior change for a few minutes?"], "dialogue": [{"speaker": "Therapist", "line": "Let’s slow this down and map what happened, without deciding yet what it means about you.", "note": "Validation and behavioral specificity."}, {"speaker": "Client", "line": "I saw the message, felt heat in my face, and thought I was being ignored. I sent several angry replies.", "note": "Illustrative client speech."}], "if_client_says": [], "tip": "Keep the chain episode-specific. Ask about overlooked links and environmental contingencies.", "caution": "Do not conduct a detailed chain when urgent stabilization or medical care is needed."}, {"name": "Solution analysis and rehearsal", "level": "foundation", "purpose": "Turn a chain into a concrete change plan by identifying skillful alternatives at earlier links.", "when": "Immediately after chain analysis, once the client and therapist have a shared account.", "steps": ["Mark the earliest realistic intervention point.", "Generate skills or environmental changes matched to that link.", "Choose one alternative that fits the client’s values and context.", "Rehearse the action and likely obstacles.", "Plan prompts, support, repair, and review."], "prompts": ["At which point did another option first become possible?", "Which skill fits that moment, not just the crisis peak?", "How will you remember or access it?"], "dialogue": [], "if_client_says": [], "tip": "Rehearse in the client’s own words and include a fallback plan.", "caution": "Avoid presenting skill use as a guarantee that distress or risk will disappear."}, {"name": "Validation strategies", "level": "foundation", "purpose": "Reduce invalidation and support engagement while remaining truthful and boundaried.", "when": "Across treatment, particularly when shame, conflict, or therapist-client polarisation is present.", "steps": ["Attend fully and reflect accurately.", "Name the understandable part in context.", "Validate effort, feelings, or learning history without endorsing harmful action.", "Pair validation with a clear next step toward change."], "prompts": ["What makes this response understandable in the situation?", "What can I acknowledge without agreeing with the behavior?"], "dialogue": [{"speaker": "Therapist", "line": "It makes sense that you wanted the panic to stop. Sending the threat has put someone at risk, and we need to work out how to prevent another one.", "note": "Validates the function, sets a behavioral limit."}], "if_client_says": [], "tip": "Validation is precise, not automatic agreement or praise.", "caution": "Never use validation to minimise danger, abuse, discrimination, or a client’s report of harm."}, {"name": "Core mindfulness skills", "level": "foundation", "purpose": "Teach observing, describing, and participating, with a nonjudgmental, one-mindful, effective stance.", "when": "When attention to present experience is a treatment target and the practice is appropriate for the client.", "steps": ["Explain the skill and invite choice about eyes-open, movement, or sensory focus.", "Practice noticing one present experience without immediately changing it.", "Describe observations in concrete terms, separating observation from interpretation.", "Return attention gently when it wanders.", "Review what made practice safer or more accessible."], "prompts": ["What did you notice directly?", "What label or judgment did the mind add?", "What helped you return to this moment?"], "dialogue": [], "if_client_says": [], "tip": "Offer external anchors or movement-based practice when inward attention is uncomfortable.", "caution": "Mindfulness is not a substitute for trauma-informed assessment; stop or adapt if practice increases dissociation or destabilisation."}, {"name": "Wise Mind practice", "level": "foundation", "purpose": "Help the client notice emotion-based and fact-based information and choose an effective next action.", "when": "When the client is pulled toward an urgent either-or response and is able to pause safely.", "steps": ["Name the immediate emotion and action urge.", "Separate observable facts from predictions or interpretations.", "Ask what matters in the longer view.", "Invite a both-and perspective and choose one effective action."], "prompts": ["What is the emotion telling you? What do the facts show?", "What action fits both the facts and what matters to you?"], "dialogue": [], "if_client_says": [], "tip": "Avoid treating Wise Mind as a hidden correct answer the therapist knows.", "caution": "Do not encourage pausing when immediate protective action is needed."}, {"name": "Distress-tolerance crisis survival", "level": "foundation", "purpose": "Help the client get through a short-term crisis without making it worse, while arranging appropriate safety support.", "when": "During high arousal when solving the whole problem is not immediately possible.", "steps": ["Check immediate danger, medical need, and agreed crisis plan.", "Select a brief skill suited to health status and context, such as paced breathing, grounding, self-soothing, distraction, or pros and cons.", "Practice for a defined period and reassess.", "After the crisis, return to problem solving, chain analysis, or repair."], "prompts": ["What needs attention first for safety?", "Which brief action can lower the chance of making this worse?", "What support should be contacted now?"], "dialogue": [], "if_client_says": [], "tip": "Teach several options in advance, then select collaboratively.", "caution": "Cold exposure, intense exercise, breath manipulation, and other body-based skills may be medically unsuitable. Check contraindications and individual needs."}, {"name": "Opposite action", "level": "foundation", "purpose": "Use a behavior opposite to an emotion-driven urge when the emotion does not fit the facts or acting on it would be ineffective.", "when": "After checking facts and function; not as a blanket instruction to suppress emotion.", "steps": ["Name the emotion and action urge.", "Check whether the emotion fits the facts and whether its intensity fits.", "If opposite action is indicated, identify the full opposite behavior.", "Act all the way, with mindful attention, and review the effect."], "prompts": ["What is the urge asking you to do?", "Does that action fit the facts and your goals?", "What would the opposite action look like in posture, words, and behavior?"], "dialogue": [], "if_client_says": [], "tip": "For fear, approach safely; for unjustified anger, use a non-attacking stance; for shame that does not fit the facts, move toward the situation.", "caution": "Do not apply opposite action to valid fear in a dangerous setting or to grief and other emotions that call for care."}, {"name": "DEAR MAN request or boundary", "level": "foundation", "purpose": "Structure an interpersonal request or refusal while maintaining focus and self-respect.", "when": "When the client has a clear interpersonal objective and the interaction is safe enough for direct communication.", "steps": ["Describe the situation in observable terms.", "Express feelings or views briefly.", "Assert a request or no.", "Reinforce likely benefits.", "Stay mindful, appear confident in a way that fits the client, and negotiate."], "prompts": ["What outcome do you want from this interaction?", "What is the clearest respectful request?", "What will help you stay on topic if the other person changes it?"], "dialogue": [{"speaker": "Client", "line": "When the shift changes are posted after Friday, I cannot arrange care. I feel stressed. Could you send my schedule by Wednesday? That would let me confirm coverage.", "note": "Illustrative DEAR MAN request."}], "if_client_says": [], "tip": "Clarify the objective, relationship, and self-respect priorities before scripting.", "caution": "Consider power, retaliation risk, cultural communication norms, and safer alternatives."}, {"name": "GIVE and FAST", "level": "foundation", "purpose": "Support relationship effectiveness and self-respect while balancing interpersonal priorities.", "when": "When preserving a relationship or acting consistently with values matters alongside the objective.", "steps": ["Use GIVE: be gentle, show interest, validate, and use an easy manner where appropriate.", "Use FAST: be fair, avoid needless apologies, stick to values, and be truthful.", "Select only the elements that fit the interaction and safety context.", "Rehearse a short response and a boundary."], "prompts": ["Which matters most here: the objective, the relationship, or self-respect?", "What would fairness and truthfulness look like?"], "dialogue": [], "if_client_says": [], "tip": "These are skills for flexible choice, not rules that require pleasing others.", "caution": "Gentleness or relationship preservation must not override safety or consent."}, {"name": "Commitment strategies", "level": "advanced", "purpose": "Strengthen commitment to a treatment target while acknowledging ambivalence and choice.", "when": "When motivation fluctuates or the client is uncertain about a behavioral goal.", "steps": ["Clarify the client’s reasons for change and reasons for not changing.", "Explore pros and cons of the target behavior and the alternative.", "Use a commitment strategy that fits the person and treatment agreement.", "Make a small observable commitment and identify how to repair a lapse."], "prompts": ["What makes change worth considering now?", "What would make the next step doable rather than perfect?"], "dialogue": [], "if_client_says": [], "tip": "Return to the client’s own goals and values.", "caution": "Do not use coercion, shame, or threats as commitment strategies."}], "technique_selection": {"diagram_id": "dbt-hierarchy", "table": [{"target": "Immediate life-threatening behavior or urgent risk", "techniques": ["Direct risk assessment and local escalation pathway", "Collaborative safety planning and coordination", "Target hierarchy; chain analysis only when clinically appropriate"]}, {"target": "Therapy-interfering patterns", "techniques": ["Behavioral description and functional analysis", "Validation plus clear treatment agreements", "Problem solving, commitment strategies, consultation"]}, {"target": "Quality-of-life-interfering behavior", "techniques": ["Chain and solution analysis", "Emotion regulation and interpersonal effectiveness skills", "Environmental problem solving and referral as indicated"]}, {"target": "High arousal or crisis without immediate danger", "techniques": ["Distress-tolerance skill matched to health and context", "Mindfulness or grounding with consent", "Reassess, then return to problem solving"]}, {"target": "Emotion-driven action urge", "techniques": ["Check the facts", "Opposite action when indicated", "Problem solving when emotion fits the facts"]}, {"target": "Interpersonal goal or boundary", "techniques": ["Prioritise objective, relationship, and self-respect", "DEAR MAN, GIVE, or FAST rehearsal", "Assess power and safety before direct communication"]}]}, "problem_applications": [{"problem": "Suicidal or self-injurious behavior", "model": "Target hierarchy, chain analysis, commitment, skills generalisation, and coordinated risk management.", "originator": "Linehan", "maintaining_cycle": ["Acute distress and vulnerability factors", "Suicidal or self-injury urge", "Behavior may rapidly change internal or interpersonal conditions", "Relief or response can reinforce the pattern; later costs and renewed distress follow"], "priority_techniques": ["Direct assessment and safety pathway", "Behavior chain and solution analysis", "Distress tolerance and emotion regulation practice", "Coordination across the treatment team"], "pitfall": "Do not assume all self-harm has the same function or rely on skills coaching alone when urgent risk or medical care is needed.", "diagram_id": "dbt-chain"}, {"problem": "Rapid emotion escalation", "model": "Biosocial and behavioral formulation that includes vulnerability, prompting events, links, and consequences.", "originator": "Linehan", "maintaining_cycle": ["Sleep, illness, conflict, or other vulnerabilities", "Cue interpreted as threat or rejection", "Strong emotion and action urge", "Impulsive action changes the moment but creates later costs"], "priority_techniques": ["Diary-card review", "Check the facts and emotion regulation skills", "Opposite action when clinically indicated", "Chain and solution analysis"], "pitfall": "Do not frame emotional sensitivity as manipulation or ask the client to regulate without addressing the environment.", "diagram_id": "dbt-biosocial"}, {"problem": "Interpersonal conflict and ineffective requests", "model": "Interpersonal effectiveness, contingency analysis, validation, and attention to power and safety.", "originator": "Linehan", "maintaining_cycle": ["Unclear goal or high arousal", "Urgent demand, withdrawal, or appeasement", "Other person reacts or boundary is missed", "Relationship strain reinforces fear and ineffective strategies"], "priority_techniques": ["Prioritise objective, relationship, and self-respect", "DEAR MAN, GIVE, and FAST rehearsal", "Mindfulness of current interaction"], "pitfall": "Do not assume assertiveness is safe or culturally neutral. Consider power, dependence, and retaliation.", "diagram_id": "dbt-wise"}, {"problem": "Avoidance and reduced quality of life", "model": "Behavioral analysis of avoidance and reinforcement, paired with emotion regulation and distress-tolerance practice.", "originator": "Linehan", "maintaining_cycle": ["Anticipated distress", "Avoidance or escape", "Short-term relief", "Fewer opportunities for mastery and valued activity"], "priority_techniques": ["Identify reinforcing consequences", "Break a valued action into steps", "Use distress-tolerance and mindfulness skills to support approach"], "pitfall": "Do not use exposure-like tasks without consent, rationale, pacing, and competence.", "diagram_id": "dbt-chain"}, {"problem": "Therapy-interfering behavior", "model": "Collaborative analysis of behaviors that obstruct treatment access, participation, or effectiveness, including therapist and service contributions.", "originator": "Linehan", "maintaining_cycle": ["Treatment demand or mismatch", "Missed session, non-disclosure, conflict, or therapist response", "Short-term relief or rupture", "Treatment becomes less effective"], "priority_techniques": ["Describe behavior without labels", "Validate barriers and examine contingencies", "Negotiate an observable change and service adaptation", "Seek supervision or consultation"], "pitfall": "Do not label disagreement, disability-related access needs, or structural barriers as noncompliance.", "diagram_id": "dbt-hierarchy"}], "session_structure": {"single_session": ["Review immediate safety and agreed target hierarchy.", "Review diary card or monitoring tool; identify missing data without blame.", "Select the highest-priority current target and define one episode.", "Conduct chain analysis and solution analysis, or use another intervention that fits the target and treatment plan.", "Practice a matched skill, rehearse generalisation, and confirm supports or referrals.", "Summarise commitments, barriers, between-session plan, and feedback."], "course": ["Comprehensive outpatient DBT coordinates individual therapy, skills training, between-session coaching, and a therapist consultation team. The available modes and schedule depend on the service model.", "Skills training commonly cycles through mindfulness, interpersonal effectiveness, emotion regulation, and distress tolerance, with review and practice. Programme duration and sequencing vary; avoid presenting one schedule as universal.", "Individual therapy prioritises behavioral targets and supports motivation and application of skills to the client’s life.", "Coaching supports skill use in the moment within explicit boundaries, availability, and risk procedures. It is not emergency care.", "Consultation team supports therapist adherence, effectiveness, and sustainability. Skills-only or adapted programs should be named accurately."], "session_diagram_id": "dbt-session", "course_diagram_id": "dbt-hierarchy", "ending_script": ["“What is the main thing you are taking from today?”", "“What is the next skillful step, and what could get in its way?”", "“Is there a safety, access, or coordination issue we need to address before we finish?”"]}, "worked_case": {"client": "“Maya,” a fictional adult attending an outpatient DBT-informed service with recurrent conflict-related self-injury urges. This example does not prescribe care or replace a full assessment.", "presenting_problem": "Maya describes a sharp rise in shame and anger after receiving a brief message from a close friend. She sent multiple messages, then scratched her arm. The clinician first assesses injury and current suicide/self-harm risk, follows local procedures, and confirms the service can safely meet her needs.", "formulation_diagram_id": "dbt-chain", "goals": ["Maya’s own priority is to stay connected without injuring herself after conflict.", "Define the target behavior and urge monitoring collaboratively.", "Practice an earlier interruption point and one direct interpersonal request."], "sessions": [{"session": "Assessment and agreement", "focus": "Clarify goals, risk, treatment fit, modes and boundaries.", "highlights": "Maya chooses a brief diary card and identifies sleep loss and being alone as relevant vulnerabilities."}, {"session": "Chain and solution analysis", "focus": "Map the message episode and identify alternatives.", "highlights": "The first workable link is noticing heat and the thought “I am being rejected.” Maya rehearses pausing, grounding, and checking the facts before replying."}, {"session": "Skills generalisation", "focus": "Practice distress tolerance and interpersonal effectiveness.", "highlights": "Maya scripts a short request for clarification and identifies a trusted support person, with consent and appropriate boundaries."}, {"session": "Review and repair", "focus": "Review data, barriers, and outcomes without treating a lapse as failure.", "highlights": "A later urge occurs. Maya uses the agreed contact plan, delays sending messages, and brings the episode for review. Risk is reassessed."}], "setback": "Maya misses a skills session after a conflict. The therapist asks what got in the way, assesses any change in safety, and examines whether shame, access barriers, or treatment fit contributed. They agree a feasible re-entry step rather than assuming lack of motivation.", "dialogue": [{"speaker": "Therapist", "line": "Given how painful that message felt, the urge to stop the pain makes sense. Let’s slow down and identify the point where a different action became possible.", "note": "Validation followed by chain analysis."}, {"speaker": "Client", "line": "I noticed my hands shaking before I sent the next message. I might have been able to put the phone down then.", "note": "Illustrative client speech."}, {"speaker": "Therapist", "line": "Let’s rehearse what putting it down would look like, and decide who or what could help you remember.", "note": "Solution analysis and generalisation."}], "relapse_prevention": ["Track early warning signs and vulnerability factors.", "Keep the crisis and support plan current and accessible.", "Practice selected skills during lower-intensity moments.", "Define how to respond to lapses, seek help, and review the chain.", "Revisit treatment fit and goals collaboratively."]}, "tools": [{"name": "DBT diary card", "level": "foundation", "purpose": "Monitor agreed targets, urges, emotions, and skill use across the week.", "when": "When monitoring is part of the treatment agreement.", "fields": ["Client-specific target behaviors and urges", "Emotion intensity or agreed ratings", "Skills practiced and timing", "Optional vulnerability factors"], "example": "Example entry: conflict after a message; urge to send repeated replies 9/10; anger 8/10; grounded before replying; urge later 5/10.", "added": false}, {"name": "Behavior chain and solution analysis", "level": "foundation", "purpose": "Understand a specific target episode and identify early intervention points.", "when": "After safety needs are addressed and a recent episode can be reviewed collaboratively.", "fields": ["Prompting event", "Vulnerability factors", "Links in sequence", "Target behavior", "Immediate and delayed consequences", "Skillful alternatives and supports"], "example": "Short message → “I am being rejected” → hot face → repeated replies → brief relief, then shame. Possible earlier intervention: put down phone and ground.", "added": false}, {"name": "Skills rehearsal card", "level": "foundation", "purpose": "Plan practice and generalisation of a selected DBT skill.", "when": "When a client needs help using a skill in a predictable situation.", "fields": ["Situation and target link", "Skill to practice", "Prompt or cue", "Likely barrier", "Fallback/support", "Review date"], "example": "Before replying to a difficult message, place phone face down, describe five things in the room, then reread the message and choose a response.", "added": false}], "troubleshooting": [{"if": "The client arrives without a diary card.", "try": "Ask what made tracking difficult, check current safety directly, and reconstruct only what is useful. Adjust the format or reminder plan collaboratively."}, {"if": "A chain analysis becomes global or self-critical.", "try": "Return to one episode and one observable link. Validate the pain and separate behavior description from moral judgment."}, {"if": "The client says a skill did not work.", "try": "Ask what the skill was expected to do, when and how it was used, what happened, and whether another skill or environmental action fits better."}, {"if": "The clinician feels pulled to rescue, punish, or argue.", "try": "Pause, check the target hierarchy and contingencies, seek consultation, and return to validation plus behavioral specificity."}, {"if": "The client cannot use a skill at peak arousal.", "try": "Move practice earlier in the chain, simplify prompts, rehearse in lower intensity, and address access or neurocognitive barriers."}, {"if": "The client is in an unsafe or invalidating environment.", "try": "Do not frame distress as only an internal skills deficit. Assess protection, advocacy, safeguarding, housing, medical care, and referral needs."}, {"if": "A skills group is being treated as comprehensive DBT.", "try": "Clarify the model and its limits, identify missing treatment modes or supports, and discuss referral or service redesign."}], "troubleshooting_added": false, "cultural_adaptation": ["Ask how the client understands emotion, self-harm, family responsibility, privacy, directness, and help-seeking. Do not assume meanings from identity labels.", "Discuss language, migration, discrimination, economic pressure, family and community context, and structural threats as part of formulation when relevant.", "Adapt examples, metaphors, and skills practice with the client. Keep the behavioral function and skill purpose clear while avoiding rigid scripts.", "Consider whether direct requests or boundary-setting may carry cultural, workplace, family, or safety consequences. Explore options without ranking communication styles.", "Offer translated and accessible monitoring tools when available. Confirm that translations preserve meaning and confidentiality.", "Involve family, carers, or community supports only with appropriate consent, legal authority, and safeguarding consideration."], "cultural_adaptation_added": false, "ethics_referral": ["DBT is a specialized treatment. Practitioners should work within training and competence, seek supervision or consultation, and represent the service accurately. A skills group or DBT-informed practice is not automatically comprehensive DBT.", "Agree treatment goals, modes, attendance and contact boundaries, coaching availability, confidentiality, information sharing, record keeping, and crisis responsibilities. Explain limits in plain language.", "Use direct risk assessment and follow local emergency, safeguarding, and documentation procedures. Coordinate with relevant medical and psychiatric services when needed.", "Avoid punitive or coercive interpretations of target hierarchy, commitment, contingencies, or missed sessions. Assess therapist, service, and environmental contributions to barriers.", "Monitor the evidence for the specific population and program. In a randomized trial of 101 clinically referred women with recent suicidal and self-injurious behavior meeting DSM-IV BPD criteria, DBT showed advantages over expert community treatment on several outcomes. In a separate one-year trial of 180 people with BPD and recent suicidal or self-injurious episodes, DBT and general psychiatric management both improved, with no significant between-group differences. These findings do not establish a universal treatment effect.", "Key sources: Linehan et al., 2006, Archives of General Psychiatry, 63(7), 757-766, doi:10.1001/archpsyc.63.7.757; McMain et al., 2009, American Journal of Psychiatry, 166(12), 1365-1374, doi:10.1176/appi.ajp.2009.09010039; Behavioral Tech Institute, “What is DBT?” and “DBT Skills Training: Introduction.”"], "ethics_referral_added": false, "client_handouts": [{"id": "dbt-client-diary-card", "title": "My DBT Weekly Practice Card", "give_when": "Use after agreeing together what to track and how the card will be stored. Tailor the behaviors and emotion words to the client. Review it in session; it is not an emergency monitor.", "body": ["This card helps you and your clinician notice patterns, urges, emotions, and skills. It is not a test and does not measure whether you are trying hard enough.", "Example: “After the argument, anger was 8/10. I wanted to send repeated messages. I used paced breathing and contacted my agreed support. The urge fell to 5/10.” Use your own words.", "If filling it in feels unsafe, confusing, or too much, tell your clinician. Follow your agreed crisis plan if you may be in immediate danger."], "try_this": ["Record briefly and as soon as practical, if safe.", "Notice one skill you tried and what happened, even if it did not help as expected.", "Bring questions or missing sections to your next session."], "questions": ["What tends to make the day more vulnerable?", "Which skill did I try, and at what point?", "What do I want help understanding?"], "notes_prompt": "What I want my clinician to know", "form": [{"t": "guide", "text": "Worked example: conflict after a difficult message · anger 8/10 · urge to send repeated replies 9/10 · paused and used grounding · urge later 5/10."}, {"t": "table", "columns": ["Day or event", "Target or urge", "Emotion 0-10", "Skill tried", "What happened"], "rows": 6, "first": ["Example: Tue evening", "Repeated messages; urge 9", "Anger 8", "Grounding; wait before replying", "Urge 5; brought it to session"]}, {"t": "line", "label": "One thing that made me more vulnerable this week", "lines": 2}, {"t": "line", "label": "One skill or support I want to practice next", "lines": 2}]}, {"id": "dbt-client-chain", "title": "Understanding One Difficult Moment", "give_when": "Use collaboratively after immediate safety needs are addressed. Complete a specific event with the clinician; skip or pause any part that feels overwhelming.", "body": ["A behavior chain helps us understand what happened before, during, and after one difficult moment. It is not about blame. Understanding the steps can show where support or a skill might help next time.", "Example: slept poorly → received a short message → thought “I am being rejected” → face felt hot → urge to send many replies → sent them → felt relief, then shame. A useful change point might be noticing the heat and putting the phone down while grounding."], "try_this": ["Choose one event, not “everything that goes wrong.”", "Write what happened in order, using observations and your own words.", "Ask your clinician to help find an early, realistic skill or support."], "questions": ["What happened just before the moment shifted?", "What did the behavior do for me right away?", "What could help me earlier next time?"], "notes_prompt": "What I want to remember from this chain", "form": [{"t": "guide", "text": "Worked example: short message → “I am being rejected” → hot face and shaking hands → repeated replies → brief relief, then worry about the friendship. Possible earlier action: pause the phone and use a grounding skill."}, {"t": "table", "columns": ["Step", "What happened in this example", "My event"], "rows": 7, "first": [["Prompting event", "Received a short message", ""], ["First thought or image", "“I am being rejected”", ""], ["Emotion and body", "Anger 8/10; hot face", ""], ["Urge or action", "Send repeated replies", ""], ["What happened after", "Brief relief, then shame", ""], ["Earlier point for support", "Ground before replying", ""]]}, {"t": "line", "label": "A skill or support to try at that earlier point", "lines": 2}]}, {"id": "dbt-client-wise-mind", "title": "Pause, Notice, Choose", "give_when": "Use for practice between sessions when there is enough safety and time to pause. Adapt for clients who find inward attention uncomfortable.", "body": ["Wise Mind practice means noticing feelings and facts, then choosing an action that fits what matters. It does not mean ignoring emotion or finding a perfect answer.", "Example: “I feel angry and want to quit today. The facts are that I received critical feedback. I also care about finishing this course. I can ask what needs changing before I decide.”"], "try_this": ["Name one feeling without judging it.", "Separate what you know from what you are predicting.", "Choose one next step that fits your values and the situation."], "questions": ["What is the emotion telling me?", "What do I know for sure?", "What is one effective next step?"], "notes_prompt": "My practice notes", "form": [{"t": "guide", "text": "Worked example: feeling: angry and embarrassed. Facts: supervisor asked for revisions. Value: learning the role. Next step: ask which two revisions matter most."}, {"t": "pair", "fields": ["What I feel and notice in my body", "What I know from the facts"]}, {"t": "line", "label": "What matters to me in this situation", "lines": 2}, {"t": "line", "label": "One effective next step", "lines": 2}]}, {"id": "dbt-client-interpersonal", "title": "Plan a Clear Request or Boundary", "give_when": "Use in session to plan a conversation after considering safety, power, and the client’s goals. The client chooses whether and when to use the plan.", "body": ["DBT interpersonal skills can help you ask clearly, protect a relationship, or act in line with self-respect. You do not have to use a direct request if it would be unsafe.", "Example: “When the rota changes after Friday, I cannot arrange care. I feel stressed. Could you send next week’s rota by Wednesday? That would help me confirm cover.”"], "try_this": ["Decide what matters most: the outcome, the relationship, or your self-respect.", "Use a short description, feeling or view, and clear request.", "Plan how you will stay on topic and what safer alternative is available."], "questions": ["Is this conversation safe enough to have?", "What is the clearest request I can make?", "What boundary or support do I need?"], "notes_prompt": "My words and reflections", "form": [{"t": "guide", "text": "Worked example: “When I receive the schedule after Friday, I cannot arrange care. I feel stressed. Could I receive it by Wednesday?”"}, {"t": "line", "label": "My objective or request", "lines": 2}, {"t": "line", "label": "Describe the situation without judgment", "lines": 2}, {"t": "line", "label": "Express my view or feeling", "lines": 2}, {"t": "line", "label": "What I will ask for or say no to", "lines": 2}, {"t": "line", "label": "What matters for the relationship or my self-respect", "lines": 2}, {"t": "line", "label": "Safety concern or alternative plan", "lines": 2}]}], "client_handouts_added": false, "counsellor_sheets": [{"id": "dbt-targets-diary", "title": "DBT Target Hierarchy and Diary-Card Review", "use_when": "At the start of individual work or when reviewing treatment priorities an
