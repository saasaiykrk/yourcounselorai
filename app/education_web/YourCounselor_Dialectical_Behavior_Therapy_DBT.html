ider", "options": ["Gentle", "Interested", "Validate", "Easy manner", "Fair", "No unnecessary apology", "Stick to values", "Truthful"]}, {"t": "line", "label": "Power, retaliation, consent, or cultural factors", "lines": 3}, {"t": "line", "label": "Safer alternative, support, or boundary", "lines": 2}]}, {"heading": "Rehearsal and review", "items": [{"t": "line", "label": "Practice feedback and revision", "lines": 3}, {"t": "line", "label": "Client’s choice about whether and when to use the plan", "lines": 2}, {"t": "line", "label": "Review outcome and learning at next session", "lines": 2}]}]}, {"id": "dbt-crisis-review", "title": "DBT Crisis Response and Post-Crisis Review", "use_when": "Use only within training, service policy, and local crisis pathways. This sheet does not replace a full risk assessment or emergency response.", "cover": {"title": "Crisis response and review", "note": "Record the minimum necessary information. Store completed sheets securely and follow local law and service policy.", "items": [{"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}, {"t": "line", "label": "Current treatment agreement, relevant consent, and people involved", "lines": 2}]}, "sections": [{"heading": "Immediate response", "items": [{"t": "crisis"}, {"t": "guide", "text": "Follow local emergency, medical, safeguarding, and documentation procedures. Use direct assessment and involve appropriate supports."}, {"t": "line", "label": "Current location, immediate danger, injury, or urgent medical need", "lines": 3}, {"t": "line", "label": "Risk assessment completed and findings", "lines": 4}], "danger": true}, {"heading": "Collaborative safety and coordination", "items": [{"t": "line", "label": "Agreed immediate safety steps and responsible people", "lines": 3}, {"t": "line", "label": "Means-safety or protective actions, where indicated", "lines": 2}, {"t": "line", "label": "Referral, consultation, or information-sharing decision and consent/legal basis", "lines": 3}]}, {"heading": "Post-crisis learning", "items": [{"t": "guide", "text": "When clinically appropriate and the client is ready, review the episode without blame. A crisis worksheet is not a substitute for individualized care."}, {"t": "table", "columns": ["Vulnerability", "Early warning link", "Skill or support tried", "What helped or did not", "Next plan"], "rows": 5, "first": ["Sleep loss", "Hands shaking", "Called agreed support", "Helped me pause", "Add phone reminder"]}]}, {"heading": "Review and follow-up", "items": [{"t": "pair", "fields": ["Follow-up contact or appointment", "Responsible clinician / team"]}, {"t": "line", "label": "Client’s corrections to the account", "lines": 2}, {"t": "line", "label": "Learning for treatment plan and supervision", "lines": 2}]}]}], "counsellor_sheets_added": false, "session_note_template": {"fields": [{"label": "Date, duration, mode, attendees", "guidance": "Record minimum necessary identifying and service information."}, {"label": "Client’s stated priorities and consent", "guidance": "Include relevant consent, agenda, and information-sharing decisions."}, {"label": "Risk and safety", "guidance": "Record direct assessment, findings, actions, consultation, and follow-up. Do not write only “risk discussed.”"}, {"label": "Target hierarchy and episode reviewed", "guidance": "Specify observable target and why it was prioritised."}, {"label": "Intervention and client response", "guidance": "Document chain analysis, validation, skills practice, and client feedback without unsupported interpretation."}, {"label": "Between-session plan and boundaries", "guidance": "Record agreed practice, support, coaching limits, and crisis alternatives."}, {"label": "Coordination, referral, supervision", "guidance": "Note decisions and responsible people."}, {"label": "Next session focus", "guidance": "State the intended review or next treatment target."}], "example": "Maya reviewed a conflict-related target episode. Current safety was assessed directly; no new injury requiring medical care was reported, and the agreed service protocol was reviewed. Chain analysis identified poor sleep, a brief message, “I am being rejected,” facial heat, and repeated replies. She rehearsed placing the phone face down, grounding, and using a concise clarification request. She chose to practice grounding once daily and bring any new episode to the next session.", "note": "Use the organisation’s record system and local legal, safeguarding, and documentation standards. This template is educational and does not replace required clinical records."}, "session_note_template_added": false, "online_adaptations": ["Confirm the client’s current location, callback details, privacy, and local emergency pathway at the start of remote care as required by service policy.", "Agree what to do if connection drops during a high-risk discussion. Keep relevant local supports and escalation options available.", "Use accessible diary-card formats, secure systems, and clear guidance on what channels are monitored and when.", "Skills practice can use shared screens or simple visual prompts with consent. Avoid recording unless policy and consent explicitly allow it.", "Between-session coaching requires explicit availability, purpose, boundaries, response times, and emergency alternatives. Do not imply continuous monitoring.", "Assess whether remote group participation offers privacy and safety; plan alternatives when household members may overhear."], "online_adaptations_added": false, "tips": ["Stay behaviorally specific. “Client became difficult” is not a target description.", "Validate the understandable part and name the change task clearly.", "Analyze one episode in depth rather than several episodes vaguely.", "Use skills as practiced behaviors linked to a specific chain link.", "Ask what the client learned from a skill that did not work as expected.", "Keep the treatment model and its limits explicit to clients and referral partners.", "Use consultation to examine therapist responses, contingencies, and possible invalidation."], "pitfalls": ["Calling a skills group or selected skills “comprehensive DBT” without the coordinated treatment structure.", "Treating a diary card as proof of safety, motivation, or treatment success.", "Skipping solution analysis after a chain and leaving the client with a detailed account but no plan.", "Using skills to suppress emotion or tolerate a harmful environment that needs protection or change.", "Assuming every self-injury or suicidal behavior has the same function.", "Using contingencies punitively or interpreting barriers as willful noncompliance.", "Teaching body-based crisis skills without checking health, disability, trauma, or sensory needs.", "Treating the hierarchy as rigid when urgent medical, safeguarding, or contextual needs require action."], "competency_checklist": ["I can explain the distinction between comprehensive DBT, skills training, and DBT-informed work.", "I define treatment targets in observable, nonjudgmental terms.", "I can use the hierarchy while remaining collaborative and responsive to risk.", "I can conduct a chain analysis and follow it with solution analysis.", "I teach a skill accurately and connect it to a specific target or chain link.", "I use validation without endorsing harmful behavior or minimizing danger.", "I explain diary-card purpose, limits, confidentiality, and accessible alternatives.", "I know my service’s risk, coaching, referral, and emergency boundaries.", "I seek supervision or consultation and review the therapist’s contribution to treatment barriers."], "competency_checklist_added": false, "supervision_prompts": ["Was the target hierarchy applied appropriately, and what risk or context changed the priority?", "Did I validate the client’s experience while remaining clear about behavior change?", "What contingencies may be reinforcing the target behavior, including responses from the service?", "Did my chain analysis identify a useful early intervention point and lead to a rehearsed solution?", "Could access needs, culture, discrimination, trauma, or power dynamics explain an apparent treatment barrier?", "Am I representing the level of DBT service accurately? What training, consultation, or referral is needed?", "How did my own emotional response influence the session? What do I want to bring to the consultation team?"], "supervision_prompts_added": false, "quiz": [{"question": "Which description best distinguishes comprehensive DBT from skills-only work?", "options": ["Comprehensive DBT coordinates multiple treatment modes; skills-only work is one component or adaptation", "They are interchangeable names", "Comprehensive DBT is a worksheet series", "Skills-only work always provides phone coaching"], "answer": 0, "rationale": "Standard outpatient DBT includes coordinated treatment modes. A skills group or adapted program may be useful, but should be described accurately."}, {"question": "What follows a DBT behavior chain analysis?", "options": ["A moral judgment about the client", "Solution analysis that identifies earlier alternatives and rehearses a plan", "A conclusion that the client should try harder", "A diagnosis based only on the chain"], "answer": 1, "rationale": "The chain identifies the sequence and function. Solution analysis turns that understanding into specific skills, supports, or environmental changes."}, {"question": "A diary card is best understood as:", "options": ["A stand-alone suicide risk assessment", "A monitoring aid reviewed with clinical conversation", "A compliance score", "A diagnostic test"], "answer": 1, "rationale": "Monitoring can support pattern recognition and treatment planning, but cannot replace direct risk assessment or clinical judgment."}, {"question": "A client’s diary card is blank. What is the most useful first response?", "options": ["Assume resistance", "Explore barriers, assess current safety directly, and adapt monitoring collaboratively", "End treatment", "Record that the client is unmotivated"], "answer": 1, "rationale": "Missing data may reflect access, burden, shame, confusion, or other factors. Explore rather than infer."}, {"question": "When is opposite action most appropriate?", "options": ["Whenever the client feels a difficult emotion", "After checking whether the emotion fits the facts and whether acting on the urge is effective", "When a client reports danger", "To stop grief quickly"], "answer": 1, "rationale": "Opposite action is selected after checking the facts and function. It is not a universal instruction to suppress emotion."}, {"question": "Which is an example of validation without endorsing harmful behavior?", "options": ["“That behavior was fine because you were upset.”", "“Your urge to stop the pain makes sense; we also need to plan how to prevent harm.”", "“You should not feel that way.”", "“Let’s ignore what happened.”"], "answer": 1, "rationale": "The response acknowledges understandable experience and keeps a clear change and safety focus."}, {"question": "In target hierarchy, which target generally takes precedence in individual DBT?", "options": ["A quality-of-life goal", "A life-threatening behavior", "A preferred skills topic", "A missed homework item"], "answer": 1, "rationale": "The hierarchy prioritizes life-threatening behaviors, then therapy-interfering targets, quality-of-life targets, and skills acquisition."}, {"question": "What should a clinician consider before recommending a direct interpersonal request?", "options": ["Only whether the script is grammatically correct", "Power, safety, retaliation risk, culture, and the client’s priorities", "Whether the therapist prefers direct communication", "Whether the other person will agree"], "answer": 1, "rationale": "Interpersonal effectiveness is flexible and context-sensitive. Directness may be unsafe or unsuitable in some contexts."}, {"question": "Which statement about evidence is appropriately cautious?", "options": ["DBT is proven superior for every condition", "One trial found benefits in a specific sample, while another active-comparator trial found both treatments improved without significant between-group differences", "A skills handout proves treatment effectiveness", "Evidence does not need population details"], "answer": 1, "rationale": "Clinical evidence should be described in relation to the actual participants, comparator, outcomes, and limits of each study."}, {"question": "A client cannot use a mindfulness skill during peak distress. What is a DBT-consistent next step?", "options": ["Call it unwillingness", "Identify an earlier chain link, simplify practice, and adapt for access and safety", "Demand longer meditation", "Stop assessing the behavior"], "answer": 1, "rationale": "Skills may need to be practiced earlier, simplified, adapted, and paired with environmental support."}, {"question": "What is the therapist consultation team’s role in comprehensive DBT?", "options": ["Replace individual therapy", "Support therapist effectiveness, adherence, and sustainability", "Monitor clients continuously", "Provide emergency services"], "answer": 1, "rationale": "Consultation teams support clinicians; they are not client emergency services or a substitute for individual treatment."}, {"question": "A person is in immediate danger and has a serious injury. What comes first?", "options": ["Complete the worksheet", "Use the local emergency and medical pathway, then arrange follow-up", "Teach GIVE", "Finish the diary card"], "answer": 1, "rationale": "Immediate safety and medical needs take priority over routine skills work."}], "quick_reference": ["**DBT stance:** acceptance and change, held together through dialectical thinking.", "**Hierarchy:** life-threatening behavior → therapy-interfering behavior → quality-of-life-interfering behavior → skills acquisition. Respond to immediate danger using local procedures.", "**Chain:** prompting event + vulnerabilities → links → target behavior → consequences → solution analysis.", "**Mindfulness:** observe, describe, participate; nonjudgmentally, one-mindfully, effectively.", "**Interpersonal effectiveness:** balance objective, relationship, and self-respect priorities; consider DEAR MAN, GIVE, FAST.", "**Emotion regulation:** understand and name emotion, check facts, reduce vulnerability, build positive experiences, and use opposite action when indicated.", "**Distress tolerance:** use crisis-survival skills to get through the moment safely; return to problem solving after arousal changes.", "**Diary card:** monitoring support, not a risk assessment or compliance score.", "**Comprehensive DBT:** coordinated modes and consultation; clearly label skills-only and adapted programs."], "glossary": [{"term": "Biosocial theory", "definition": "A transactional account of emotion dysregulation involving emotional vulnerability and environments that may invalidate or mismatch the person’s needs."}, {"term": "Behavior chain analysis", "definition": "A step-by-step analysis of a target episode, including prompting event, vulnerabilities, links, behavior, and consequences."}, {"term": "Dialectical abstinence", "definition": "A stance that maintains commitment to stop a target behavior while planning skillful response and repair if a lapse occurs, where clinically appropriate."}, {"term": "Dialectics", "definition": "Holding apparently opposing truths together and seeking a workable synthesis."}, {"term": "Diary card", "definition": "A client-specific monitoring tool for target behaviors, urges, emotions, and skill use."}, {"term": "Emotion Mind", "definition": "A state in which emotion strongly shapes interpretations and action."}, {"term": "Interpersonal effectiveness", "definition": "Skills for pursuing objectives, maintaining relationships, and acting with self-respect."}, {"term": "Invalidation", "definition": "Responses that dismiss, misread, punish, or fail to fit a person’s experience; context and impact matter."}, {"term": "Opposite action", "definition": "Acting opposite to an emotion-driven urge when the emotion does not fit the facts or acting on it is ineffective."}, {"term": "Radical acceptance", "definition": "Acknowledging reality as it is in the present, without approving of it, to reduce additional suffering and support effective action."}, {"term": "Reasonable Mind", "definition": "A mode of thinking strongly guided by facts, logic, and planning."}, {"term": "Solution analysis", "definition": "A deliberate search for changes in the chain, including skills, supports, and environmental actions, followed by rehearsal."}, {"term": "Therapy-interfering behavior", "definition": "Behavior by client, therapist, or service that obstructs effective treatment; it is described behaviorally and explored collaboratively."}, {"term": "Wise Mind", "definition": "A way of knowing that integrates emotional information and reason to guide effective action."}], "related_modules": ["cbt", "behavioural-activation", "motivational-interviewing", "person-centred-therapy", "solution-focused-brief-therapy"], "safety_note": "DBT education does not replace a full risk assessment, crisis response, medical care, supervision, or a coordinated treatment program. If risk to life or immediate safety emerges, pause routine skills work and follow the local emergency and safeguarding pathway."}};
