<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourCounselor | Exposure-Based Therapies and Inhibitory Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* YourCounselor — module reader styles
 * Follows the YourCounselor Brand & Document System v1.1 (locked) and the
 * approved sample work-up. Colours, fonts and components below are the only
 * ones allowed. Light theme only: the brand system defines no dark palette.
 */
:root {
  --plum: #3D0A6B;        /* headings, body text */
  --muted: #6E587E;       /* secondary text */
  --purple: #6A1BB5;      /* primary accent, links, numbers, buttons */
  --pink: #E8336D;        /* brand accent: accent bar only */
  --pink-text: #C2185B;   /* pink for small text */
  --ink: #260644;         /* dark bands */
  --on-ink: #FAF7FD;
  --on-ink-muted: #CDBEDF;
  --paper: #FFFFFF;
  --lilac: #F7F3FB;       /* page tint */
  --soft: #FAF7FC;        /* table header, quiet boxes */
  --tint: #F0E8F9;        /* chips, note boxes */
  --line: #E7DFEF;
  --line-strong: #D1C0DF;
  --ok: #1E7E34;     --ok-bg: #EAF7EC;     --ok-border: #BFE3C6;
  --warn: #9A5B00;   --warn-bg: #FFF4E0;   --warn-border: #F2D9A8;
  --danger: #B4233F; --danger-bg: #FDECEF; --danger-border: #F4C2CC;
  --head: 'Nunito', 'Inter', sans-serif;
  --body: 'Nunito Sans', 'Inter', sans-serif;
  --sidebar: 264px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--lilac); color: var(--plum); font: 400 16px/1.6 var(--body); }
h1, h2, h3, h4 { font-family: var(--head); color: var(--plum); line-height: 1.2; margin: 0; }
p { margin: 0 0 10px; }
strong { font-weight: 700; }
a { color: var(--purple); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { margin: 4px 0 12px; padding-left: 22px; }
li { margin-bottom: 5px; }
.muted { color: var(--muted); }

/* ---------- content protection ---------- */
.yc-protected, .yc-protected * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.yc-protected input, .yc-protected textarea { -webkit-user-select: text; user-select: text; }
@media print {
  body * { display: none !important; }
  body::after { content: "Printing is disabled for YourCounselor modules."; display: block !important; padding: 40px; font: 18px var(--body); color: var(--plum); }
}

/* ---------- watermark (viewer name + email) ---------- */
.yc-watermark { position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .08; background-repeat: repeat; }

/* ---------- logo lockup (logo + wordmark, gap = 1/4 logo height) ---------- */
.yc-lockup { display: flex; align-items: center; gap: 8px; /* gap = 1/4 logo height */ font: 800 19px var(--head); color: var(--plum); text-decoration: none; padding: 16px 0; }
.yc-lockup img { width: 32px; height: 32px; display: block; }
.yc-lockup.cover { padding: 0 0 22px; }
.yc-skip { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--purple); color: #FFFFFF; padding: 8px 14px; border-radius: 8px; font: 700 14px var(--head); }
.yc-skip:focus { left: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- layout ---------- */
.yc-app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.yc-sidebar { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--paper); border-right: 1px solid var(--line); padding: 4px 18px 24px; display: flex; flex-direction: column; }
.yc-sidebar .eyebrow-label { font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .06em; color: var(--purple); margin: 18px 0 6px; }
.yc-modlist a, .yc-toc a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--plum); font-size: 14px; }
.yc-modlist a.active { background: var(--tint); color: var(--purple); font-weight: 700; }
.yc-toc a { color: var(--muted); font-size: 13.5px; }
.yc-toc a .n { color: var(--purple); font-weight: 700; margin-right: 6px; font-family: var(--head); }
.yc-toc a:hover { background: var(--soft); color: var(--plum); text-decoration: none; }
.yc-toc a.is-hidden, .yc-mobile-toc a.is-hidden { opacity: .45; }
.yc-toc a.active { background: var(--tint); color: var(--purple); font-weight: 700; box-shadow: inset 3px 0 0 var(--purple); }
.yc-owner { margin-top: auto; padding-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.yc-owner strong { color: var(--plum); }

.yc-main { min-width: 0; }
.yc-topbar { display: none; }
.yc-sticky { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.yc-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 28px; background: var(--paper); }
.yc-toolbar input[type=search] { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px var(--body); }
.yc-toolbar input[type=search]::placeholder { color: var(--muted); }
.yc-toolbar input[type=search]:focus { outline: 2px solid var(--purple); outline-offset: 0; border-color: var(--purple); }
.yc-seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--paper); }
.yc-seg button { border: 0; background: none; color: var(--muted); padding: 8px 14px; font: 700 13px var(--head); cursor: pointer; }
.yc-seg button + button { border-left: 1px solid var(--line); }
.yc-seg button[aria-pressed=true] { background: var(--purple); color: #FFFFFF; }
.yc-filter-status { padding: 8px 28px; font-size: 14px; background: var(--tint); color: var(--plum); border-top: 1px solid var(--line); }
.yc-filter-status .yc-jump { border: 0; background: none; padding: 4px 2px; font: inherit; color: var(--purple); text-decoration: underline; cursor: pointer; }
.yc-btn { border: 1px solid var(--purple); background: var(--paper); color: var(--purple); border-radius: 999px; padding: 4px 13px; font: 700 13px var(--head); cursor: pointer; }
.yc-btn:hover { background: var(--tint); }
.yc-filter-status .yc-clear { margin-left: 6px; }
.yc-content { max-width: 900px; margin: 0 auto; padding: 24px 28px 80px; }
.yc-mobile-toc { display: none; }

@media (max-width: 900px) {
  .yc-app { grid-template-columns: 1fr; }
  .yc-sidebar { display: none; }
  .yc-topbar { display: flex; align-items: center; padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .yc-topbar .yc-lockup { padding: 10px 0; font-size: 17px; gap: 7px; }
  .yc-topbar .yc-lockup img { width: 28px; height: 28px; }
  .yc-toolbar { padding: 8px 16px; }
  .yc-filter-status { padding: 6px 16px; font-size: 13.5px; }
  .yc-content { padding: 16px 16px 64px; }
  .yc-mobile-toc { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 8px; border-top: 1px solid var(--line); scrollbar-width: none; }
  .yc-mobile-toc a { flex: none; display: inline-flex; align-items: center; min-height: 36px; font: 700 12.5px var(--head); padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--tint); color: var(--purple); text-decoration: none; }
  .yc-mobile-toc a.active { background: var(--purple); border-color: var(--purple); color: #FFFFFF; }
  .yc-seg button { min-height: 40px; }
  .yc-btn { min-height: 36px; }
  .check { min-height: 44px; }
}

/* ---------- module cover (header) ---------- */
.yc-cover { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
.yc-cover-body { padding: 28px 28px 20px; }
.eyebrow { display: inline-block; font: 700 11px var(--head); letter-spacing: .06em; text-transform: uppercase; color: var(--purple); background: var(--tint); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; }
.yc-cover h1 { font-weight: 800; font-size: 36px; letter-spacing: -0.02em; margin: 14px 0 8px; max-width: 640px; }
.yc-cover .sub { font-size: 17px; color: var(--muted); max-width: 600px; margin: 0; }
.yc-cover-meta { display: grid; grid-template-columns: 140px 1fr; row-gap: 6px; margin: 20px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14.5px; }
.yc-cover-meta dt { color: var(--muted); }
.yc-cover-meta dd { margin: 0; color: var(--plum); }
.yc-cover-band { position: relative; background: var(--ink); color: var(--on-ink-muted); padding: 18px 28px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; align-items: flex-end; }
.yc-cover-band::before { content: ''; position: absolute; left: 0; top: 0; height: 5px; width: 100%; background: linear-gradient(90deg, var(--purple) 0 80%, var(--pink) 80% 100%); }
.yc-cover-band strong { color: var(--on-ink); }
@media (max-width: 520px) { .yc-cover h1 { font-size: 28px; } .yc-cover-body { padding: 22px 18px 16px; } .yc-cover-band { padding: 16px 18px 12px; } .yc-cover-meta { grid-template-columns: 110px 1fr; } }

/* ---------- quick reference (pinned) ---------- */
.yc-quickref { margin: 0 0 18px; }

/* ---------- sections ---------- */
details.section { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px; scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
details.section > summary { list-style: none; cursor: pointer; padding: 18px 22px; display: flex; align-items: center; gap: 10px; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary h2 { font-size: 22px; font-weight: 700; flex: 1; }
details.section > summary::after { content: "▾" / ""; color: var(--muted); transition: transform .2s; }
details.section:not([open]) > summary::after { transform: rotate(-90deg); }
details.section[data-always-open] > summary { cursor: default; }
details.section[data-always-open] > summary::after { content: none; }
h2 .num { color: var(--purple); margin-right: 6px; }
.section-body { padding: 0 22px 20px; }
h3 { font-size: 17px; font-weight: 700; margin: 18px 0 6px; }
h4 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; }
.item { border-top: 1px solid var(--line); padding: 18px 0; }
.item:first-child { border-top: 0; padding-top: 4px; }
.item { scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
.item > h3 { margin-top: 0; }
.label-line { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin: 12px 0 4px; display: block; }
.not-covered { color: var(--muted); }

/* ---------- chips (status pills) ---------- */
.chip { display: inline-block; font: 700 11px var(--head); padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--tint); color: var(--purple); white-space: nowrap; vertical-align: 2px; margin-left: 4px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.chip.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.chip.plain { background: var(--paper); color: var(--muted); }

/* ---------- callouts: Why this matters · Note · Caution · Risk ---------- */
.box { border-left: 4px solid var(--purple); background: var(--soft); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0; }
.box .label { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 3px; color: var(--purple); }
.box > :last-child { margin-bottom: 0; }
.box.why { background: var(--tint); }
.box.warn { border-color: var(--warn); background: var(--warn-bg); } .box.warn .label { color: var(--warn); }
.box.danger { border-color: var(--danger); background: var(--danger-bg); } .box.danger .label { color: var(--danger); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 6px 0 12px; }
table.yc { width: 100%; border-collapse: collapse; font-size: 15px; border-color: var(--line); }
table.yc thead, table.yc tbody, table.yc tr { border-color: var(--line); }
table.yc th { background: var(--soft); font: 700 14px var(--head); text-align: left; color: var(--plum); }
table.yc th, table.yc td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
table.yc td { color: var(--muted); }
table.yc td:first-child { color: var(--plum); font-weight: 700; }
table.yc td strong { color: var(--plum); }
table.yc.dialogue td:first-child { width: 96px; font-family: var(--head); }
table.yc.dialogue .note { display: block; font-size: 13.5px; color: var(--purple); margin-top: 3px; }
@media (max-width: 520px) {
  table.yc, table.yc tbody, table.yc tr, table.yc td { display: block; width: 100%; }
  table.yc thead { display: none; }
  table.yc tr { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; padding: 6px 10px; background: var(--paper); }
  table.yc td { border: 0; padding: 4px 0; }
  table.yc td::before { content: attr(data-label); display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); }
  table.yc.dialogue td:first-child { width: auto; }
}

/* ---------- diagrams ---------- */
figure.dg { margin: 12px 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
figure.dg figcaption { font-size: 13.5px; color: var(--muted); margin-top: 8px; text-align: center; }
figure.dg .dg-title { font: 700 14px var(--head); color: var(--plum); margin: 0 0 8px; text-align: center; }
.dg-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.dg-svg { width: 100%; height: auto; display: block; max-width: 680px; margin: 0 auto; }
.dg-hint { display: none; font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 4px; }
@media (max-width: 600px) { .dg-svg { min-width: 560px; } .dg-hint { display: block; } figure.dg { padding: 10px; } }
.dg-box { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1.4; }
.dg-context .dg-box, .dg-question .dg-box { fill: var(--tint); stroke: var(--line-strong); }
.dg-level-0 .dg-box { fill: var(--paper); } .dg-level-1 .dg-box { fill: var(--soft); }
.dg-level-2 .dg-box { fill: var(--tint); } .dg-level-3 .dg-box { fill: var(--line); }
.dg-text { fill: var(--plum); font-family: var(--body); }
.dg-edge { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.dg-edge-back { stroke-dasharray: 5 4; }
.dg-arrowhead { fill: var(--muted); }
.dg-label-bg { fill: var(--paper); stroke: var(--line); }
.dg-label-text, .dg-axis { fill: var(--muted); font-family: var(--body); }
.dg-branch { fill: var(--purple); font-weight: 700; font-family: var(--head); }
.dg-frame { fill: none; stroke: var(--line-strong); stroke-dasharray: 6 5; }

/* ---------- quiz & checklist (quiz uses neutral brand colours, never status colours) ---------- */
.quiz-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.quiz-head .quiz-score { margin: 0; }
.quiz-q { border-top: 1px solid var(--line); padding: 16px 0; }
.quiz-q > p { font-weight: 600; margin: 0 0 8px; }
.quiz-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px/1.5 var(--body); cursor: pointer; }
.quiz-opt:hover:not([aria-disabled]) { border-color: var(--purple); }
.quiz-opt[aria-disabled] { cursor: default; }
.quiz-opt.correct { background: var(--tint); border: 2px solid var(--purple); }
.quiz-opt.picked { background: var(--soft); color: var(--muted); border-style: dashed; }
.quiz-tag:empty { display: none; }
.quiz-tag { display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin-bottom: 2px; }
.quiz-opt.picked .quiz-tag { color: var(--muted); }
.quiz-why { display: none; outline: none; }
.quiz-q.answered .quiz-why { display: block; }
.quiz-score { font: 700 15px var(--head); color: var(--purple); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { color: var(--plum); margin-top: 5px; accent-color: var(--purple); width: 18px; height: 18px; flex: none; }

/* ---------- client handouts ---------- */
.handout-preview { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 8px 0; background: var(--paper); }
.handout-notes { margin: 6px 0 0; font-size: 14px; }
.yc-handout-dl { min-height: 40px; }

/* ---------- crisis lines ---------- */
.crisis-list { margin: 6px 0 0; padding-left: 20px; }
.crisis-list li { margin-bottom: 6px; }
.crisis-list a { font-weight: 700; display: inline-block; padding: 2px 0; }
.crisis-region { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* ---------- disclaimer + copyright & IP notice (always last) ---------- */
.disclaimer { border: 1px dashed var(--line-strong); background: var(--soft); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); margin-top: 22px; }
.disclaimer strong { color: var(--plum); }
.ip-notice { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; font-size: 13px; line-height: 1.55; color: var(--muted); }
.ip-notice strong { color: var(--plum); }

/* ---------- floating Home button + search landing highlight ---------- */
.yc-home-fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 60; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--purple); color: #FFFFFF; font: 800 14px var(--head); box-shadow: 0 5px 18px rgba(61, 10, 107, .24); cursor: pointer; }
.yc-home-fab[hidden] { display: none; }
.yc-home-fab:hover { background: var(--plum); }
.yc-home-fab:focus-visible { background: var(--plum); outline: 2px solid var(--purple); outline-offset: 3px; }
.yc-hit { border-radius: 4px; animation: yc-hit 2.2s ease-out; }
@keyframes yc-hit { 0%, 45% { background: var(--line-strong); box-shadow: 0 0 0 4px var(--line-strong); } 100% { background: transparent; box-shadow: 0 0 0 4px transparent; } }
.yc-sticky { transition: transform .2s ease; }
@media (max-width: 900px) { .yc-sticky.yc-compact { transform: translateY(calc(-1 * var(--yc-toolbar-h, 0px))); } }
@media (prefers-reduced-motion: reduce) { .yc-sticky { transition: none; } .yc-hit { animation-duration: .01s; outline: 2px solid var(--purple); } }
@media print { .yc-home-fab { display: none !important; } }

.hidden-by-filter { display: none !important; }
::highlight(yc-search) { background-color: var(--line-strong); color: var(--plum); }
.handout-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.yc-handout-dl:disabled { opacity: .55; cursor: not-allowed; }
.yc-handout-status { margin: 4px 0 0; font-size: 14px; min-height: 0; }
.yc-handout-status:empty { display: none; }
.yc-preview-toggle { display: none; }
@media (max-width: 520px) {
  .handout-preview:not(.expanded) { max-height: 240px; overflow: hidden; position: relative; }
  .handout-preview:not(.expanded)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(rgba(255,255,255,0), var(--paper)); }
  .yc-preview-toggle { display: inline-flex; }
}
.sheet-inside { font-size: 14px; color: var(--muted); }

/* ---------- responsive refinements: tablet and phone ---------- */
.yc-app, .yc-main, .yc-content, .section-body, .item { min-width: 0; }
.yc-content img, .yc-content video, .yc-content canvas, .yc-content iframe { max-width: 100%; }
.yc-content pre, .yc-content code { overflow-wrap: anywhere; }
.table-wrap, .dg-scroll { max-width: 100%; overscroll-behavior-inline: contain; }
.yc-content :focus-visible, .yc-mobile-toc a:focus-visible, .yc-toolbar button:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
@media (min-width: 901px) and (max-width: 1100px) {
  .yc-app { grid-template-columns: 240px minmax(0, 1fr); }
  .yc-content, .yc-toolbar { padding-left: 22px; padding-right: 22px; }
}
@media (max-width: 900px) {
  .yc-mobile-toc { scroll-snap-type: x proximity; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
  .yc-mobile-toc a { scroll-snap-align: start; min-height: 44px; }
  .yc-topbar { min-height: 52px; }
  .yc-content { width: 100%; }
  .yc-sticky { max-width: 100vw; }
  .yc-toolbar input[type=search] { flex: 1 1 100%; }
  .yc-seg { flex: 1 1 auto; }
  .yc-seg button { flex: 1 1 auto; }
  .yc-filter-status { overflow-wrap: anywhere; }
  details.section > summary { padding: 16px 18px; }
  .section-body { padding: 0 18px 18px; }
  figure.dg { max-width: 100%; }
}
@media (max-width: 520px) {
  html { scroll-padding-top: 150px; }
  .yc-content { padding: 12px 12px 48px; }
  .yc-toolbar { gap: 7px; padding: 8px 12px; }
  .yc-filter-status, .yc-mobile-toc { padding-left: 12px; padding-right: 12px; }
  details.section { margin-bottom: 10px; }
  details.section > summary { gap: 8px; padding: 14px 12px; }
  details.section > summary h2 { font-size: 19px; overflow-wrap: anywhere; }
  .section-body { padding: 0 12px 14px; }
  .item { padding: 14px 0; }
  .box { padding-left: 11px; padding-right: 12px; }
  .yc-cover-meta { grid-template-columns: minmax(88px, 34%) minmax(0, 1fr); }
  .yc-cover-meta dd, .yc-cover-meta dt { overflow-wrap: anywhere; }
  .handout-preview { padding: 12px; }
}

n guidance. Distress ratings are optional process information, not a universal exposure endpoint."}, "techniques": [{"name": "Functional analysis of avoidance and rituals", "level": "foundation", "purpose": "Identify the specific response that may be maintaining the problem and the function it serves.", "when": "Before selecting an exposure target, and when practice is not producing useful learning.", "steps": ["Choose one recent, specific episode.", "Describe the cue, prediction, emotion or sensation, response, immediate relief, and longer-term cost.", "Include covert responses and reassurance where relevant.", "Check whether a response is adaptive protection, an access support, or a maintaining safety behaviour.", "Share the formulation and invite correction."], "prompts": ["“What happened just before the urge to leave or check?”", "“What did the ritual help you feel certain about?”", "“Is there any real hazard or access need we need to account for?”"], "tip": "Keep the account descriptive and collaborative. A behavior can have more than one function."}, {"name": "Collaborative exposure planning", "level": "foundation", "purpose": "Turn a valued goal into a clear, feasible approach task with an agreed prediction and review.", "when": "When assessment supports exposure and the client chooses to proceed.", "steps": ["Name the situation or cue and why it matters to the client.", "Ask what the client predicts and how that prediction could be observed.", "Agree the step, setting, duration or stopping point, supports, and response to practise.", "Clarify consent, pause options, real safety boundaries, and follow-up.", "Review what happened without forcing a reassuring interpretation."], "prompts": ["“What would make this a useful experiment for you?”", "“What do you predict will happen, and what could we observe?”", "“What would make this step feel chosen and manageable enough to try?”"], "caution": "Do not spring an exposure on a client or frame refusal as noncompliance."}, {"name": "In vivo approach practice", "level": "foundation", "purpose": "Approach a real situation, object, activity, or context relevant to the client’s formulation.", "when": "When the feared cue can be approached safely and the selected protocol includes in vivo practice.", "steps": ["Define the cue and feared prediction.", "Choose a collaborative approach step and confirm it is safe.", "Notice urges to escape or use a maintaining response.", "Practise the agreed alternative response while staying oriented to the task.", "Review outcome, learning, and next practice."], "tip": "Use ordinary infection-control, traffic, food-safety, and other protective practices. Exposure does not mean creating hazards."}, {"name": "Imaginal exposure", "level": "advanced", "purpose": "Approach a feared memory, image, thought, or future scenario that cannot or should not be recreated in real life, within a protocol that uses imaginal exposure.", "when": "Within a relevant evidence-based protocol, such as PE or selected OCD treatment, delivered by a trained practitioner.", "steps": ["Explain the protocol rationale and alternatives.", "Assess consent, current stability, dissociation, risk, and support needs.", "Agree the focus and format, and use the protocol’s guidance for pacing and review.", "Monitor engagement and clinical response without requiring a fixed script length or forced repetition.", "Close and follow up according to the treatment protocol."], "caution": "Trauma-memory processing and highly distressing imaginal work require protocol-specific competence. Do not prescribe graphic scripts or loop durations as universal rules."}, {"name": "ERP for OCD", "level": "advanced", "purpose": "Approach an OCD trigger while practising an agreed reduction or prevention of compulsions and mental neutralising.", "when": "When OCD is assessed and ERP fits the client’s goals, with appropriate training and supervision.", "steps": ["Map triggers, feared consequences, rituals, avoidance, reassurance, and family accommodation.", "Agree a graded or otherwise protocol-consistent practice.", "Approach the trigger while preventing the selected ritual or neutralising response.", "Use ordinary hygiene and reasonable precautions; distinguish those from compulsions collaboratively.", "Review learning and plan repeated practice and generalisation."], "prompts": ["“Which ritual would you like to practise leaving out or changing?”", "“Is reassurance or mental reviewing part of what happens afterwards?”"], "caution": "Avoid reassurance battles, forced exposure, and blanket instructions to stop all washing or checking."}, {"name": "Interoceptive exposure", "level": "advanced", "purpose": "Approach feared bodily sensations in a structured protocol when panic or related fear of sensations is part of the formulation.", "when": "Only after appropriate assessment and when the specific exercise is clinically indicated.", "steps": ["Assess physical health, medications, disability, pregnancy where relevant, and contraindications.", "Explain the chosen protocol and obtain specific consent.", "Select a graded exercise from the relevant manual with supervision where needed.", "Monitor symptoms and stop for unexpected medical warning signs or withdrawal of consent.", "Review the feared prediction, actual experience, and next step."], "caution": "Do not use generic hyperventilation, breath restriction, spinning, or exertion instructions. Exercise choice and intensity require individualized clinical screening."}, {"name": "Expectancy violation and learning review", "level": "foundation", "purpose": "Help the client compare a specific prediction with what was observed and what they learned about coping or uncertainty.", "when": "When a prediction can be stated and the review fits the treatment protocol.", "steps": ["Record the client’s prediction before the practice.", "Define the observable test and any safety conditions.", "Conduct the agreed approach task.", "Record what happened, including mixed or ambiguous outcomes.", "Ask what the client makes of it and update the next experiment."], "tip": "Do not claim that one practice proves an outcome can never occur."}, {"name": "Reducing a maintaining safety behaviour", "level": "advanced", "purpose": "Test whether a chosen response prevents useful learning, while retaining reasonable protection and accessibility.", "when": "When functional assessment suggests the response is maintaining avoidance or threat beliefs.", "steps": ["Name the response and its perceived purpose.", "Check actual risk, access, identity, medical, and cultural considerations.", "Choose one small, voluntary change.", "Observe what happens and review the effect on learning and functioning.", "Retain or adapt the support if it is protective, accessible, or otherwise useful."], "caution": "Removing every support or companion is not a general exposure requirement."}, {"name": "Variability and practice across contexts", "level": "advanced", "purpose": "Support transfer of learning to relevant settings rather than relying on one clinic context.", "when": "When the client has a useful initial plan and variability is safe, feasible, and consistent with the protocol.", "steps": ["Identify contexts that matter to the client’s goals.", "Vary one feature at a time when it helps clarify learning.", "Plan practice in ordinary settings with practical and safety arrangements.", "Review what generalized and what needs more practice."], "caution": "Do not add unpredictability or complexity for its own sake."}, {"name": "Optional inhibitory-learning strategies", "level": "advanced", "purpose": "Consider prediction testing, context variation, retrieval cues, affect labelling, or carefully combined cues when useful to the client’s formulation.", "when": "When the strategy fits the treatment protocol, the client’s goals, and an individual safety and access assessment.", "steps": ["Explain that these are optional strategies, not a guarantee of outcome.", "Select one strategy with the client and define its purpose.", "Use only ordinary, safe, consented practice; do not stage adverse events or remove necessary supports.", "Review whether the strategy helped learning or fit."], "caution": "Research support for individual augmentation strategies is mixed and developing. Do not imply that all eight strategies are established treatment ingredients."}, {"name": "Technology-supported or virtual exposure", "level": "advanced", "purpose": "Use a simulated environment as an adjunct or bridge when the protocol and client circumstances support it.", "when": "When real-world access is impractical, a simulation is available and appropriate, and its limitations are understood.", "steps": ["Confirm the target and that the simulation maps to it.", "Check accessibility, motion sensitivity, privacy, and consent.", "Agree settings, duration, pause controls, and support.", "Review whether learning transfers to relevant real-world activity."], "caution": "A simulation is not automatically equivalent to in vivo exposure and should not replace the established protocol without a rationale."}, {"name": "Relapse planning and approach maintenance", "level": "foundation", "purpose": "Prepare for expected fluctuation in fear and maintain progress in valued activities.", "when": "Throughout treatment and especially when reducing session frequency or ending.", "steps": ["Review what the client learned and which practices helped.", "Name contexts or times when fear may return.", "Plan a proportionate approach response and support options.", "Agree when to seek review or a higher level of care."], "tip": "Describe return of fear as a possible part of learning, not a personal failure."}], "technique_selection": {"diagram_id": "exposure-hierarchy", "table": [{"target": "OCD obsessions, compulsions, or mental neutralising", "techniques": ["OCD-focused CBT with ERP", "Response prevention for observable and covert rituals", "Family accommodation work when appropriate"]}, {"target": "Panic and fear of bodily sensations", "techniques": ["Panic-focused CBT", "Interoceptive exposure after medical and protocol-specific assessment", "In vivo approach to avoided situations"]}, {"target": "Specific phobia", "techniques": ["Protocol-based in vivo exposure", "Graded or otherwise collaboratively paced approach", "Virtual exposure when appropriate and linked to real-world goals"]}, {"target": "Social anxiety", "techniques": ["Social anxiety-focused CBT", "Behavioural experiments and in vivo practice", "Attention and safety-behaviour work within the protocol"]}, {"target": "PTSD", "techniques": ["A validated trauma-focused protocol such as PE or another recommended treatment", "Protocol-specific imaginal and in vivo work where indicated", "Specialist assessment, training, supervision, and ongoing risk review"]}, {"target": "Current realistic danger, abuse, medical instability, or safeguarding need", "techniques": ["Protection, medical care, safeguarding, and risk management", "Do not use exposure to extinguish a proportionate response to current danger"]}, {"target": "Exposure is declined, unsuitable, or not the best fit", "techniques": ["Discuss the client’s preferences and suitable alternatives", "For OCD, consider OCD-adapted cognitive therapy when ERP is declined or not feasible, consistent with guidance", "Coordinate medication questions with an authorized prescriber; never recommend doses in this module"]}]}, "problem_applications": [{"problem": "Obsessive-compulsive disorder", "model": "OCD-focused CBT with ERP. Assess obsessions, overt and covert rituals, avoidance, reassurance, insight, impairment, and family accommodation.", "originator": "NICE CG31", "maintaining_cycle": ["Trigger, intrusive thought, doubt, or sensation", "Threat, responsibility, disgust, or uncertainty appraisal", "Compulsion, checking, avoidance, reassurance, or mental neutralising", "Short-term relief reinforces ritual use and narrows daily life"], "priority_techniques": ["Collaborative exposure plan linked to the client’s formulation", "Response prevention for a selected ritual, including covert neutralising", "Family or carer involvement when appropriate and acceptable"], "pitfall": "Do not equate ordinary hygiene, carefulness, or reasonable safety actions with compulsions without functional assessment."}, {"problem": "Panic disorder and fear of bodily sensations", "model": "Panic-focused CBT may include interoceptive and situational exposure, alongside individualized assessment and the protocol’s cognitive and behavioural components.", "originator": "Protocol-specific CBT", "maintaining_cycle": ["Bodily sensation or context", "Catastrophic interpretation of the sensation", "Escape, checking, avoidance, or safety response", "Short relief and increased monitoring of sensations"], "priority_techniques": ["Assess medical and medication factors", "Use protocol-selected interoceptive exercises only after screening", "Practise approaching avoided situations with an agreed plan"], "pitfall": "Do not assume a new, severe, or atypical physical symptom is anxiety. Follow medical assessment and emergency procedures when indicated."}, {"problem": "Specific phobia", "model": "A focused CBT approach commonly uses planned approach to the feared object or situation, tailored to the phobia and client.", "maintaining_cycle": ["Anticipatory threat", "Avoidance or escape", "Immediate relief", "Reduced opportunity for corrective learning and valued activity"], "priority_techniques": ["In vivo approach practice when safe", "Virtual exposure as an adjunct if appropriate", "Review prediction, coping, and real-world generalisation"], "pitfall": "Do not expose to genuinely dangerous animals, heights, traffic, or other hazards. The task must preserve actual safety."}, {"problem": "Social anxiety", "model": "Use the specific CBT model and treatment protocol. Exposure may take the form of behavioural experiments and social approach practice.", "maintaining_cycle": ["Social situation and prediction of scrutiny or rejection", "Self-focused attention and safety strategies", "Avoidance or constrained participation", "Short-term relief and ongoing fear of evaluation"], "priority_techniques": ["Collaboratively test a specific social prediction", "Attend to the task and interaction, not only internal monitoring", "Review safety behaviours and post-event processing"], "pitfall": "Do not treat discrimination, bullying, or unsafe power dynamics as irrational fear. Account for the social context."}, {"problem": "Post-traumatic stress disorder", "model": "Use an evidence-based trauma-focused treatment delivered by a practitioner trained in that protocol. PE is one option; exposure is not a stand-alone generic trauma exercise.", "originator": "VA National Center for PTSD", "maintaining_cycle": ["Trauma reminders and trauma-related meanings", "Avoidance of safe reminders and memories", "Short-term reduction in distress", "Ongoing restriction and unprocessed trauma-related learning"], "priority_techniques": ["Shared decision-making about recommended trauma-focused options", "Protocol-specific imaginal and in vivo work when indicated", "Monitor safety, dissociation, readiness, and treatment response"], "pitfall": "Do not use graphic trauma recounting or unsupervised memory exposure as a generic intervention. Assess actual ongoing threat and current safety first."}], "session_structure": {"single_session": ["Check current safety, consent, client priorities, and whether exposure remains appropriate today.", "Review a recent practice and any approach, avoidance, ritual, or reassurance response without blame.", "Agree one specific target, prediction, task, response plan, and safety boundary.", "Conduct practice only if it fits the selected protocol and the client continues to consent.", "Review what happened, what was learned, distress if useful, and any remaining uncertainty.", "Agree the next practice, access supports, follow-up, and feedback."], "course": ["Assessment and shared formulation, including diagnosis-specific needs and suitability.", "Psychoeducation and collaborative goals, with protocol and consent clarified.", "Plan and practise exposure or ERP steps, integrating response prevention where indicated.", "Review learning, troubleshoot barriers, and generalise to relevant contexts.", "Monitor symptoms and functioning using agreed measures.", "Consolidate gains, plan for setbacks, ending, and any ongoing or stepped care."], "session_diagram_id": "exposure-session", "course_diagram_id": "exposure-hierarchy", "ending_script": ["Summarise the client’s learning in their own words.", "Review how to respond if fear returns and when to seek support.", "Confirm agreed follow-up, referral, and emergency arrangements."]}, "worked_case": {"client": "“Ravi,” a fictional adult receiving OCD-focused CBT with ERP.", "presenting_problem": "Ravi fears that touching a frequently used office door handle will make him ill and lead him to infect an older relative. He repeatedly sanitises, asks colleagues whether the handle was cleaned, and avoids shared spaces. The clinician assesses ordinary infection-control needs, medical context, impairment, rituals, and Ravi’s own goals. They agree not to relax routine hygiene or public health guidance.", "goals": ["Use the shared office space more freely.", "Reduce repeated reassurance and ritualised sanitising after ordinary contact.", "Practise tolerating uncertainty while retaining reasonable hygiene."], "sessions": [{"session": "Assessment and planning", "focus": "Understand the OCD cycle, safety, and goals.", "highlights": "Ravi identifies repeated checking and reassurance. The clinician explains ERP and offers choices, including alternatives and a pause option."}, {"session": "First agreed practice", "focus": "Approach a routine, low-risk office cue.", "highlights": "Ravi touches an ordinary shared surface, follows usual hand hygiene guidance, and practises not repeating the sanitising ritual. Distress remains noticeable; they record the prediction and outcome."}, {"session": "Review and adapt", "focus": "Review learning and barriers.", "highlights": "Ravi reports that the feared illness did not follow, while acknowledging uncertainty. They notice reassurance seeking later that day and plan one small change."}, {"session": "Generalisation", "focus": "Apply the plan in another relevant, safe setting.", "highlights": "With consent, Ravi practises using the break room while retaining ordinary precautions and seeks less repeated reassurance. The clinician reviews functioning and any new risk."}], "dialogue": [{"speaker": "Clinician", "line": "What would make this practice useful to you, even if anxiety does not fall much today?"}, {"speaker": "Ravi", "line": "I want to stay for lunch without asking everyone whether the room is safe."}, {"speaker": "Clinician", "line": "Let’s choose one ordinary, safe step and agree what hygiene guidance still applies. You can change or pause the plan."}, {"speaker": "Ravi", "line": "I can use the room and wash once before eating, then leave out the extra checks."}], "setback": "After a news story about infection, Ravi seeks reassurance repeatedly. The clinician checks whether any actual public health guidance changed, then revisits the formulation and chooses a proportionate next practice.", "outcome": "Illustrative only. The case shows collaborative formulation and ordinary safety boundaries, not a guaranteed outcome or a universal ERP prescription.", "relapse_prevention": ["Name early signs that avoidance or ritualising is returning.", "Use the agreed practice plan and review what each practice teaches.", "Check changing real-world health guidance rather than treating every caution as OCD.", "Seek further care if symptoms worsen, risk changes, or functioning remains substantially impaired."]}, "tools": [{"name": "Exposure practice and learning record", "level": "foundation", "purpose": "Record one agreed practice and the learning that matters to the client.", "when": "When exposure practice is part of the treatment plan.", "fields": ["Date and context", "Chosen cue or activity", "Client’s prediction before practice", "Agreed approach step and safety boundary", "Response or ritual practised differently", "What happened", "Learning or remaining uncertainty", "Next step"], "example": "Example: “Before the team call, I predicted I would freeze and be unable to speak. I asked my prepared question. I felt anxious and finished the sentence. I learned I can speak while anxious; I do not know whether everyone agreed.”"}, {"name": "OCD trigger and response map", "level": "foundation", "purpose": "Make overt and covert rituals, avoidance, and reassurance visible in a nonjudgmental formulation.", "when": "During OCD assessment and ERP planning.", "fields": ["Trigger or intrusive cue", "Feared outcome or meaning", "Overt ritual or avoidance", "Mental neutralising or reassurance", "Immediate effect", "Longer-term cost", "Client’s chosen response to practise"], "example": "Example: “Sent an email; feared being blamed for a mistake; reread it six times; asked a colleague to confirm; felt briefly relieved; lost time and confidence.”"}, {"name": "Collaborative approach ladder", "level": "foundation", "purpose": "Plan a range of possible approach steps and choose one together.", "when": "When a ladder is useful for planning; it is not required for every protocol.", "fields": ["Client-valued goal", "Possible approach step", "Predicted outcome", "Distress estimate if helpful", "Real safety conditions", "Client preference and chosen next step"], "example": "Example: “Ask one short question in a familiar meeting; prediction: voice will shake and I will be unable to finish; safe conditions: ordinary meeting, chosen topic.”"}, {"name": "Exposure response review", "level": "advanced", "purpose": "Review learning, functioning, and treatment fit after practice.", "when": "After a planned exposure or ERP practice.", "fields": ["What was practised", "Prediction and observable outcome", "Distress pattern, if tracked", "Response prevented or changed", "What the client learned", "What remains uncertain", "Adaptation or next step"], "example": "Example: “Prediction partly occurred: hands shook, but the client completed the task. They learned shaking did not prevent speaking. Plan: repeat once with a different colleague.”"}], "troubleshooting": [{"if": "The client declines the proposed practice.", "try": "Respect the decision. Explore what feels unsafe, unhelpful, or too much; revisit the rationale, alternatives, pacing, access needs, and consent."}, {"if": "Anxiety does not fall during practice.", "try": "Do not treat this as failure. Review whether the client approached the agreed cue, what they predicted, what happened, and whether the task should be repeated or adapted."}, {"if": "The client performs a covert ritual or asks for reassurance.", "try": "Notice it without blame. Assess the function and agree how to address mental neutralising or reassurance within the protocol."}, {"if": "A feared outcome partly occurs.", "try": "Assess actual harm and safety first. Review whether it was the predicted outcome, whether ordinary risk management worked, and what the client learned. Do not dismiss real events as anxiety."}, {"if": "The practice feels too easy or too difficult.", "try": "Ask what the client wants to test. Adjust one feature with consent; a hierarchy is a planning aid, not a rigid ladder."}, {"if": "The client relies on a support person or aid.", "try": "Assess whether it is access support, reasonable protection, or a maintaining safety response. Do not remove it automatically."}, {"if": "Symptoms worsen, dissociation increases, or risk changes.", "try": "Pause routine exposure and reassess. Follow local safety, medical, safeguarding, and supervision procedures."}, {"if": "Between-session practice is not completed.", "try": "Explore feasibility, burden, privacy, competing demands, and clarity of the task. Re-plan collaboratively rather than label the client as unmotivated."}], "troubleshooting_added": false, "cultural_adaptation": ["Ask what the feared outcome means in the client’s family, community, faith, and cultural context. Do not label a proportionate concern irrational without understanding the setting.", "Assess real exposure to discrimination, harassment, violence, poverty, insecure housing, or other structural threats. Treatment should not frame justified vigilance as pathology.", "Offer language access, interpreters, accessible formats, and adaptations for sensory, cognitive, mobility, or communication needs.", "Discuss privacy, family involvement, and community roles with the client. Family participation should be consensual and safe.", "Adapt examples and practice settings with the client while keeping the intervention’s clinical rationale clear.", "Consider how power, stigma, prior coercive care, and trauma affect trust and consent."], "cultural_adaptation_added": false, "ethics_referral": ["Work within training and competence. Exposure-based treatments are not interchangeable; obtain protocol-specific training, supervision, or consultation.", "Explain rationale, foreseeable distress, alternatives, confidentiality, consent, pause options, and follow-up in accessible language.", "Never use exposure coercively, deceptively, as punishment, or to demonstrate therapist authority. The client remains an active decision-maker.", "Assess actual danger and medical factors. Preserve reasonable safety practices, accommodations, and protective action.", "Use local emergency, safeguarding, and documentation procedures when immediate danger, abuse, medical instability, or risk is identified.", "Refer for specialist assessment when the presentation, protocol, medical risk, developmental needs, trauma complexity, or service capacity exceeds the practitioner’s competence.", "Educational content does not confer qualification, treatment fidelity, or competence and cannot substitute for supervision or a validated treatment manual."], "ethics_referral_added": false, "client_handouts": [{"id": "exposure-what-to-expect", "title": "Exposure: what we are practising together", "give_when": "Review with the client before beginning a planned exposure-based treatment.", "body": ["Exposure means approaching a situation, thought, memory, or body sensation that fear has led you to avoid. The kind of practice depends on your treatment plan.", "The aim is to make room for the life you want and learn from what happens. The goal is not to force yourself, prove perfect safety, or wait until anxiety disappears.", "You and your clinician agree each practice. You can ask questions, change the step, or pause. Ordinary safety and health guidance still apply."], "try_this": ["Write one activity you would like fear to interfere with less.", "Ask your clinician how the practice connects to your treatment plan.", "After a practice, note what you predicted and what actually happened, including anything you are still unsure about."], "questions": ["What would make this practice feel chosen and respectful?", "What safety or access needs should be part of the plan?", "What did I learn about what I can do while feeling anxious?"], "notes_prompt": "My questions and notes"}, {"id": "exposure-practice-log", "title": "My approach practice log", "give_when": "Use after agreeing with the clinician what information is useful and safe to record.", "body": ["This log is a way to notice practice and learning. It is not a score, test, or emergency contact tool.", "Record only what is helpful. Distress can change or stay high. A practice can still matter if anxiety did not go down."], "try_this": ["Name the activity or cue.", "Write your prediction before the practice.", "Afterwards, record what happened and what you want to remember."], "questions": ["What did I choose to approach?", "What response did I practise changing?", "What would I like to try next time?"], "form": [{"t": "line", "label": "Date and situation", "lines": 1}, {"t": "line", "label": "What I predicted", "lines": 2}, {"t": "line", "label": "What happened", "lines": 2}, {"t": "line", "label": "What I learned or still wonder", "lines": 2}, {"t": "line", "label": "Question for my clinician", "lines": 1}], "notes_prompt": "My notes"}, {"id": "ocd-response-practice", "title": "OCD: noticing urges and choosing a response", "give_when": "Offer only as part of a jointly planned OCD treatment, after explaining ERP and normal safety practices.", "body": ["OCD can create strong urges to check, wash, ask for reassurance, avoid, or repeat something in your mind. These urges can feel urgent even when you are trying to follow ordinary safety guidance.", "In ERP, you and your clinician choose a trigger and a response to practise changing. The plan should fit your situation and keep reasonable hygiene and safety.", "You do not have to do this worksheet alone. Bring it to your clinician, especially if you are unsure what counts as a compulsion or a sensible precaution."], "try_this": ["Notice the urge without judging yourself.", "Follow ordinary health and safety advice.", "Use the plan you and your clinician agreed, and make a note of questions or difficulties."], "questions": ["What did OCD ask me to do?", "Was there a practice plan for this situation?", "What would help me discuss it with my clinician?"], "notes_prompt": "Questions for my clinician"}, {"id": "fear-return-plan", "title": "When fear returns: my practice plan", "give_when": "Complete collaboratively during consolidation or when planning for setbacks.", "body": ["Fear can return after a helpful practice, in a new place, or during a stressful period. That does not mean you failed or that earlier learning was false.", "Use your agreed treatment plan. Check whether there is a real new safety concern, and contact your clinician or service as agreed."], "try_this": ["Notice what changed in the situation.", "Choose one safe, meaningful approach step from your plan.", "Review what happened and seek support when needed."], "questions": ["What helps me remember what I learned?", "Which person or service can I contact, and when?", "What should I do if my safety or health situation changes?"], "form": [{"t": "line", "label": "Early signs fear or avoidance is returning", "lines": 2}, {"t": "line", "label": "Approach step from my plan", "lines": 2}, {"t": "line", "label": "Support and contact arrangements agreed with clinician", "lines": 2}], "notes_prompt": "My plan and notes"}], "client_handouts_added": false, "counsellor_sheets": [{"id": "exposure-formulation", "title": "Exposure formulation and readiness review", "use_when": "Use during assessment and collaborative planning. This sheet supports clinical reasoning and does not establish readiness by itself.", "cover": {"title": "Exposure formulation", "note": "Record the minimum necessary information. Store completed sheets securely and follow local law and service policy.", "items": [{"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}]}, "sections": [{"heading": "Client’s goals and consent", "items": [{"t": "line", "label": "Client’s own goal and reason for considering exposure", "lines": 3}, {"t": "line", "label": "Information provided, alternatives discussed, and consent or questions", "lines": 3}]}, {"heading": "Functional formulation", "items": [{"t": "table", "columns": ["Cue or context", "Prediction / meaning", "Response", "Immediate effect", "Longer-term cost"], "rows": 4, "first": [["Before a meeting…", "I will freeze…", "Avoid or overprepare…", "Relief…", "Missed participation…"]]}, {"t": "line", "label": "Covert rituals, reassurance, family accommodation, or other maintaining responses", "lines": 3}]}, {"heading": "Safet ety, consultation, and referral record", "use_when": "Use when medical, safeguarding, current danger, complexity, or scope-of-practice questions affect exposure planning.", "cover": {"title": "Safety and consultation record", "note": "Use alongside the service’s full risk and safeguarding processes. This form is not itself a risk assessment.", "items": [{"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}]}, "sections": [{"heading": "Concern and direct assessment", "items": [{"t": "line", "label": "Concern, current context, and source of information", "lines": 3}, {"t": "line", "label": "Direct assessment completed and findings", "lines": 4}, {"t": "ticks", "label": "Domains considered", "options": ["Immediate danger", "Suicide / self-harm", "Medical symptoms", "Ongoing victimisation", "Safeguarding", "Dissociation", "Substance use", "Capacity / consent"]}]}, {"heading": "Decision and action", "items": [{"t": "line", "label": "Exposure plan paused, adapted, or continued, and clinical rationale", "lines": 3}, {"t": "line", "label": "Emergency, medical, safeguarding, or referral action", "lines": 3}, {"t": "line", "label": "Consultation, supervisor, and advice received", "lines": 3}]}, {"heading": "Coordination and review", "items": [{"t": "line", "label": "Information sharing, consent or legal basis, and people involved", "lines": 3}, {"t": "pair", "fields": ["Follow-up date", "Responsible practitioner / service"]}, {"t": "line", "label": "Client’s corrections and agreed next steps", "lines": 3}]}]}], "counsellor_sheets_added": false, "session_note_template": {"fields": [{"label": "Date, duration, mode, attendees", "guidance": "Record minimum necessary service information."}, {"label": "Client priorities, consent, and protocol", "guidance": "Document the client’s stated goal, information provided, choices, consent, and the treatment protocol or adaptation."}, {"label": "Risk, medical, and safety review", "guidance": "Record relevant direct assessment, actual hazards, medical considerations, decisions, consultation, and follow-up."}, {"label": "Exposure target and rationale", "guidance": "Describe the cue, prediction, maintaining response, and why the practice fits the formulation."}, {"label": "Practice and client response", "guidance": "Record observable task, response prevention or approach, distress if useful, and client feedback. Do not infer success from a score alone."}, {"label": "Learning and outcome", "guidance": "Note prediction, observed result, learning, remaining uncertainty, and functioning."}, {"label": "Between-session plan and support", "guidance": "Record chosen practice, safety boundaries, access needs, contact limits, and emergency alternatives."}, {"label": "Coordination, supervision, referral", "guidance": "Note decisions, consent or legal basis, responsible people, and review date."}], "example": "Ravi reviewed an agreed ERP practice involving an ordinary office surface. The clinician checked that routine hygiene guidance remained unchanged. Ravi predicted that he would become ill and infect a relative if he did not repeat sanitising. He touched the surface, followed ordinary hygiene once, and left out the additional ritual. Anxiety remained present. Ravi reported that no immediate illness occurred and that uncertainty remained. The next practice was chosen collaboratively; no claim of guaranteed safety was made.", "note": "Use the organisation’s record system and local legal, safeguarding, and documentation standards. This template does not replace a required clinical record."}, "session_note_template_added": false, "online_adaptations": ["Confirm privacy, current location, contact details, and local emergency arrangements according to service policy before remote clinical work.", "For remote exposure, agree the setting, camera use, stop signal, support person involvement, and what happens if connection drops. Do not record without explicit consent and policy approval.", "Do not ask a client to travel, handle objects, use appliances, or perform physical exercises during a video session unless the activity has been assessed and planned as safe.", "Use secure, accessible practice logs. Clarify that messages are not monitored continuously and state response times and emergency alternatives.", "Consider whether shared screens, VR, or phone practice add value and whether they preserve privacy, accessibility, and protocol fidelity."], "online_adaptations_added": false, "tips": ["Start with the client’s goal and a functional formulation, not with a preselected exposure exercise.", "Use concrete, observable language for the cue, prediction, response, and outcome.", "Treat distress ratings as optional information; assess approach behaviour, learning, functioning, and client experience too.", "Distinguish rituals and maintaining safety behaviours from ordinary protection, cultural practice, and access support.", "Build in time to review learning and plan transfer to daily life.", "When using inhibitory-learning ideas, describe them as strategies informed by a developing evidence base, not guaranteed mechanisms."], "pitfalls": ["Using distress reduction or a fixed percentage drop as the universal definition of a successful exposure.", "Assuming that exposure erases the original fear memory or proves that no harm can ever occur.", "Applying the same procedure to OCD, panic, phobia, social anxiety, and PTSD without following problem-specific protocols.", "Making categorical claims that all cognitive restructuring or insight-oriented therapies are contraindicated for OCD without evidence or case-specific reasoning.", "Mandating a fixed exposure duration, frequency, hierarchy, or imaginal script across clients.", "Removing every safety aid, support person, or reasonable precaution without assessing its function and the actual context.", "Using interoceptive exercises without individualized medical and protocol screening.", "Treating real discrimination, violence, illness, or unsafe living conditions as a false alarm.", "Continuing when consent is withdrawn or using flooding to overcome hesitation."], "competency_checklist": ["I can explain the selected exposure protocol and distinguish it from other exposure-based treatments.", "I can formulate the client’s cue, prediction, response, and maintaining consequences collaboratively.", "I assess actual danger, medical factors, risk, consent, access, and safeguarding before planning practice.", "I can describe a practice in observable, client-centred terms with a clear prediction and review.", "I distinguish compulsions and maintaining safety behaviours from appropriate protection and access supports.", "I do not treat distress reduction as the only outcome or promise that exposure will eliminate fear.", "I can adapt or pause practice while following the treatment model and local procedures.", "I recognise when supervision, specialist referral, or a different intervention is needed.", "I have a plan for generalisation, setbacks, follow-up, and ending."], "competency_checklist_added": false, "supervision_prompts": ["Is the chosen intervention appropriate to the assessed problem and consistent with a specific evidence-based protocol?", "Did the client understand the rationale, have meaningful choice, and retain a clear pause option?", "Have we separated current danger from overgeneralised threat learning? What evidence supports that distinction?", "Which response may be maintaining the problem, and what alternative explanations or access needs should we consider?", "Did the practice test a clear prediction or support a valued activity? What did the client say they learned?", "Did I overemphasise distress reduction, remove a useful support, or reassure in a way that undermined the agreed plan?", "What medical, cultural, trauma, safeguarding, or service factors require consultation or referral?", "How will the client generalise learning and respond if fear returns?"], "supervision_prompts_added": false, "quiz": [{"question": "What is the best description of exposure therapy?", "options": ["One fixed procedure used for every anxiety problem", "A family of planned behavioural interventions matched to a formulation and protocol", "A way to prove that feared outcomes are impossible", "A task the therapist assigns without client agreement"], "answer": 1, "rationale": "Exposure approaches vary by clinical problem and protocol. Assessment, consent, safety, and fit matter."}, {"question": "A client’s distress remains high after an agreed practice. What does this mean?", "options": ["The practice automatically failed", "The client must repeat it until distress drops by half", "Review approach behaviour, prediction, outcome, and learning; distress reduction is not a universal endpoint", "The client was unwilling"], "answer": 2, "rationale": "Distress ratings can be useful, but they do not define success on their own across exposure protocols."}, {"question": "What is response prevention in ERP?", "options": ["Withholding necessary medical care", "Collaboratively practising a change to a selected compulsion or neutralising response", "Removing all hygiene practices", "Avoiding every trigger"], "answer": 1, "rationale": "ERP targets the client’s OCD-related responses while retaining ordinary safety and health guidance."}, {"question": "How should a therapist treat a client’s support aid during exposure planning?", "options": ["Remove it every time", "Assess its function, actual safety, and accessibility, then decide collaboratively", "Assume it is a compulsion", "Tell the client it is unnecessary"], "answer": 1, "rationale": "Some aids maintain fear; others provide reasonable safety or access. Functional assessment is essential."}, {"question": "Which statement about inhibitory learning is most accurate?", "options": ["It proves exposure permanently erases fear memories", "It is a useful learning account in which new learning can compete with older threat learning", "It means distress must remain high", "It makes protocol-specific care unnecessary"], "answer": 1, "rationale": "New learning may coexist with older learning and can be context dependent. Inhibitory-learning strategies are not guarantees."}, {"question": "Before interoceptive exposure, the clinician should:", "options": ["Use a standard exercise on every client", "Assess health and contraindications, explain the protocol, and obtain specific consent", "Ignore physical symptoms as anxiety", "Ask the client to hyperventilate at home"], "answer": 1, "rationale": "Exercise choice and intensity must be individualized and consistent with training and protocol."}, {"question": "A person fears a situation that is currently unsafe. What comes first?", "options": ["Exposure to prove the fear is irrational", "Protection, medical or safeguarding action, and accurate risk assessment", "A distress rating", "Response prevention"], "answer": 1, "rationale": "Exposure must never override a real hazard or needed protective response."}, {"question": "How should the clinician respond when a client declines an exposure step?", "options": ["Proceed because avoidance is the problem", "Respect the decision and revisit rationale, choice, pacing, and alternatives", "Record noncompliance", "End treatment immediately"], "answer": 1, "rationale": "Exposure is collaborative. Consent and client choice remain central."}, {"question": "What is the role of a hierarchy?", "options": ["A mandatory sequence that every client must complete", "A planning aid that can be adapted or omitted according to the protocol and client", "A diagnostic test", "A way to rank clients by courage"], "answer": 1, "rationale": "A hierarchy may help plan graded steps but is not a universal requirement or measure of motivation."}, {"question": "A client reports shaking during a presentation but finishes speaking. A useful review would:", "options": ["Say the fear was completely false", "Explore the prediction, what happened, what the client learned, and what remains uncertain", "Insist they repeat it until calm", "Focus only on the distress score"], "answer": 1, "rationale": "Review specific observable outcomes without overclaiming certainty or reducing learning to distress."}, {"question": "When treating PTSD with exposure components, practitioners should:", "options": ["Use graphic memory scripts as a general exercise", "Deliver a validated trauma-focused protocol with relevant training, supervision, and safety review", "Avoid all assessment", "Assume every trauma memory needs exposure"], "answer": 1, "rationale": "Trauma-focused treatments are protocol specific and require appropriate competence and assessment."}, {"question": "What best supports treatment generalisation?", "options": ["Deliberately creating unpredictable risk", "Planning relevant, safe practice across contexts and reviewing setbacks", "Promising fear will never return", "Stopping all follow-up"], "answer": 1, "rationale": "Planned variation and follow-up may support transfer. Setbacks are reviewed rather than treated as failure."}], "quick_reference": ["**Exposure:** a family of planned approaches, selected for the presentation and delivered within a suitable protocol.", "**ERP:** approach an OCD trigger and collaboratively practise changing a selected compulsion or neutralising response while keeping reasonable precautions.", "**Plan:** goal + cue + prediction + observable task + consent + real safety boundary + review.", "**Distress:** can be recorded, but a fixed reduction is not a universal measure of success.", "**Inhibitory learning:** new learning may compete with older fear learning; generalisation and return of fear need planning.", "**Safety:** never use exposure to override actual danger, medical guidance, safeguarding, consent, or access needs.", "**Specialist protocols:** PE and other trauma-focused treatments, ERP, and interoceptive exposure require relevant protocol competence.", "**Evidence:** NICE OCD/BDD guideline CG31; VA National Center for PTSD provider guidance; Craske et al. (2014), *Maximizing Exposure Therapy: An Inhibitory Learning Approach*.", "**Practice principle:** approach a valued activity with choice and curiosity, not coercion or a promise of certainty."], "glossary": [{"term": "Avoidance", "definition": "A behavior that limits contact with a cue or situation. It may reduce distress in the short term and restrict valued activity; it must be distinguished from reasonable protection."}, {"term": "Behavioural experiment", "definition": "A planned test of a prediction through observation or action, reviewed collaboratively."}, {"term": "Covert ritual", "definition": "A mental act used to neutralise doubt or prevent a feared outcome, such as reviewing, counting, or repeating phrases."}, {"term": "Expectancy violation", "definition": "A mismatch between a specific prediction and what is observed during an agreed practice. It does not prove that an outcome is impossible."}, {"term": "Exposure", "definition": "Planned approach to a relevant external or internal cue within a treatment formulation and protocol."}, {"term": "Extinction learning", "definition": "New learning after a cue is encountered without the expected threat. It may compete with, rather than erase, earlier fear learning."}, {"term": "Habituation", "definition": "A decrease in response with repeated or sustained exposure. It may occur but is not a universal required endpoint."}, {"term": "Inhibitory learning", "definition": "A model in which new non-threat learning can inhibit expression of older threat learning; the two may coexist and retrieval varies by context."}, {"term": "Interoceptive exposure", "definition": "Protocol-guided approach to feared bodily sensations, used when clinically indicated and medically appropriate."}, {"term": "Imaginal exposure", "definition": "Approach to a feared memory, thought, or scenario through structured imagination within a suitable treatment protocol."}, {"term": "In vivo exposure", "definition": "Approach to a real-world cue, activity, or situation that is relevant to the client’s treatment goal."}, {"term": "Negative reinforcement", "definition": "A response becomes more likely because it removes or reduces an unpleasant state. Immediate relief after avoidance or ritualising can contribute to maintenance."}, {"term": "Response prevention", "definition": "In ERP, a planned change to a selected compulsion or neutralising response while the client approaches a relevant trigger."}, {"term": "Safety behaviour", "definition": "A response intended to prevent a feared outcome. Its function and context determine whether it maintains fear or provides appropriate protection or access."}, {"term": "Subjective distress rating", "definition": "A client-reported rating of distress, such as a 0-to-10 scale. It is a measure of experience, not an objective risk or treatment-success score."}, {"term": "Return of fear", "definition": "Reappearance of fear after time, context change, or stress. It can be anticipated and addressed in maintenance planning."}], "related_modules": ["cbt", "behavioural-activation", "motivational-interviewing", "person-centred-therapy", "solution-focused-brief-therapy", "dbt"], "safety_note": "Exposure education does not replace a full clinical assessment, medical care, safeguarding response, protocol training, supervision, or emergency care. Exposure must not be used to override actual danger, reasonable health guidance, consent, or access needs. If immediate risk or medical concern emerges, pause routine exposure work and follow the local emergency and safeguarding pathway."}};
