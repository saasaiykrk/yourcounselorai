rofessional Standards Authority accredited-register directory](https://www.professionalstandards.org.uk/organisations-we-oversee/our-work-accredited-registers) and the register’s own membership criteria. Public-service and crisis pathways vary across England, Scotland, Wales and Northern Ireland.", "**United Arab Emirates:** Licensing depends on the emirate and authority. Dubai applicants should check [Dubai Health Authority Sheryan](https://dha.gov.ae/en/healthregulation/dubaihealthlicensingsystem); Abu Dhabi applicants should check the [Department of Health Abu Dhabi licensing requirements](https://www.doh.gov.ae/en/pqr) and its TAMM application pathway. The [Unified Healthcare Professional Qualification Requirements](https://mohap.gov.ae/en/) are used by UAE health regulators. Confirm the relevant authority, role title, specialty and facility requirements before applying. For public mental-health services, use the [UAE Government mental-health directory](https://u.ae/en/information-and-services/health-and-fitness/mental-health). The [Abu Dhabi Department of Health](https://www.doh.gov.ae/en/news/doh-activates-247-mental-health-support-hotline-800-sakina-%28725462%29) announced 800-SAKINA (800-725462) for Abu Dhabi; do not assume this service covers other emirates.", "**Australia:** Psychologists must meet the national requirements of the [Psychology Board of Australia](https://www.psychologyboard.gov.au/Registration/General), with registration administered through [Ahpra](https://www.ahpra.gov.au/). Counsellors and psychotherapists may have different membership, accreditation and employer requirements; do not describe voluntary membership as statutory psychologist registration.", "**India:** For relevant regulated rehabilitation roles, verify current qualifications and registration requirements with the [Rehabilitation Council of India](https://rehabcouncil.nic.in/) and its [Central Rehabilitation Register portal](https://rciregistration.nic.in/index_registration.html). Do not imply that every counsellor is registered with RCI. Consult the [Mental Healthcare Act, 2017 on India Code](https://www.indiacode.nic.in/indiacode/handle/123456789/2249?view_type=browse) and applicable local rules.", "**Government service and crisis routes:** Identify the current government mental-health service, local referral directory and emergency contact for the client’s location. For India, see [National Mental Health Programme and Tele-MANAS](https://dghs.mohfw.gov.in/national-mental-health-programme.php). For England, use [NHS mental-health service finder](https://www.nhs.uk/nhs-services/mental-health-services/how-to-find-local-mental-health-services/). In the US, [SAMHSA FindTreatment.gov](https://findtreatment.gov/) locates treatment services. In Australia, use [healthdirect service finder](https://www.healthdirect.gov.au/australian-health-services). In the UAE, verify current federal and emirate health-service directories.", "**Legal and service review:** Localize laws and procedures on consent, confidentiality, safeguarding, privacy, records, telehealth, mandatory reporting and emergency response. Have the country section reviewed by an appropriately qualified local professional and date every review.", "**Referral and transfer:** Explain the reason, discuss options and barriers, obtain consent where applicable, share only necessary information and clarify who is responsible for the next contact. Maintain continuity until transfer is confirmed where possible.", "**Emergency planning:** Confirm the client’s location and use the emergency route for that jurisdiction. Do not rely on a single international number or an unverified directory."], "ethics_referral_added": false, "client_handouts": [{"id": "h-working-together", "title": "What to expect when we work together", "give_when": "After the practitioner has explained the service and checked that this plain-language sheet fits the client’s needs.", "body": ["Counselling is a conversation where we work together on what matters to you. You can ask questions, tell me if something does not feel right, or ask to slow down.", "Before we begin, we will talk about my role, what sessions may involve, how your information is kept and the situations where I may need to share information to protect someone or meet a legal duty.", "You do not have to discuss something before you are ready. We can talk about what would feel useful to focus on today.", "If you are worried about your safety or someone else’s safety, tell me if you can. We can work out the next safe step together."], "try_this": ["Write down one question you want to ask about privacy or how sessions work.", "Think about what would help you feel comfortable enough to talk."]}, {"id": "h-safety", "title": "Planning for safety with your counsellor", "give_when": "Only after the practitioner has assessed immediate needs and confirms that a written plan is safe and appropriate to take away.", "body": ["A safety plan is made with you. It is a practical list of steps and people who may help when things feel less safe.", "The plan should use contact details that work where you are. Your counsellor can help check them with you.", "If you are in immediate danger, contact local emergency services or go to a place where urgent help is available. Tell your counsellor if using a written plan or contacting someone could make things less safe."], "try_this": ["What are my early signs that I need support?", "Who can I safely contact?", "What is the right local emergency number for where I am now?"]}], "client_handouts_added": false, "counsellor_sheets": [{"id": "s-intake", "title": "Foundations intake and safety record", "use_when": "Use this worksheet to organize information relevant to the referral question, client priorities and immediate needs. Explain the purpose of sensitive questions, invite the client to pause or decline, and transfer relevant information to the approved record system. This is a practice aid, not a substitute for service procedures.", "sections": [{"heading": "Client priorities and consent", "items": [{"t": "guide", "text": "Clarify what the client wants help with before moving into structured questions. Check understanding and revisit consent if the purpose, information sharing or plan changes."}, {"t": "line", "label": "Referral source and question", "lines": 2}, {"t": "line", "label": "What would be useful to the client today?", "lines": 2}, {"t": "line", "label": "Consent, confidentiality limits and information-sharing discussion", "lines": 2}]}, {"heading": "Presenting concern and functioning", "items": [{"t": "guide", "text": "Record onset, pattern, frequency, intensity, triggers, exceptions and impact. Ask what the client has tried and what they hope will change."}, {"t": "line", "label": "Current concern and timeline", "lines": 3}, {"t": "line", "label": "Impact on relationships, work or study, sleep, self-care and valued activities", "lines": 3}, {"t": "pair", "fields": ["Client’s description of severity or impact", "Changes since onset"]}]}, {"heading": "Health, history and context", "items": [{"t": "guide", "text": "Ask only about history that is relevant to current needs, safety or the referral question. Do not assume that a past event explains the present concern."}, {"t": "line", "label": "Relevant physical health, medicines, supplements and possible medical review", "lines": 2}, {"t": "line", "label": "Previous support and what the client found helpful or unhelpful", "lines": 2}, {"t": "line", "label": "Relevant developmental, education, work, relationship or family context", "lines": 3}, {"t": "line", "label": "Culture, identity, language, access needs, housing, finances or other pressures the client wants considered", "lines": 3}]}, {"heading": "Strengths and supports", "items": [{"t": "guide", "text": "Include coping, valued activities, practical resources and people the client identifies as supportive. Ask what has helped, even briefly."}, {"t": "line", "label": "Strengths, values and existing coping", "lines": 2}, {"t": "line", "label": "Supportive people and community or practical resources", "lines": 2}, {"t": "line", "label": "What the client wants to protect or build on", "lines": 2}]}, {"heading": "Risk and safeguarding enquiry", "danger": true, "items": [{"t": "guide", "text": "Ask directly and compassionately when indicated. Clarify current circumstances, immediacy, intent, access to means, protective supports, risk from others and any safeguarding concerns. A checklist or promise is not a substitute for fuller assessment and action."}, {"t": "line", "label": "Questions asked and the client’s responses, with relevant timing and context", "lines": 3}, {"t": "line", "label": "Protective factors, uncertainty and information still needed", "lines": 2}, {"t": "line", "label": "Consultation, safeguarding or emergency action and rationale", "lines": 3}, {"t": "line", "label": "Person responsible and time for follow-up", "lines": 2}]}, {"heading": "Assessment, uncertainty and consultation", "items": [{"t": "guide", "text": "Separate what the client reported, what another person reported, what you observed and what you infer. Name limits and open questions."}, {"t": "table", "columns": ["Information source", "Relevant information", "Date or context"], "rows": 3}, {"t": "line", "label": "Working understanding and points to check with the client", "lines": 3}, {"t": "line", "label": "Consultation, supervision or referral considered", "lines": 2}]}, {"heading": "Agreed actions, owner and review time", "items": [{"t": "guide", "text": "Make the next steps specific. Include who will act, by when and how progress or safety will be reviewed."}, {"t": "table", "columns": ["Action", "Responsible person", "Due or review time"], "rows": 4}, {"t": "line", "label": "What the client understands and agrees to", "lines": 2}]}], "cover": {"title": "Foundations intake and safety record", "note": "Use the approved clinical record system for identifiable information. Collect only what is relevant and necessary for care.", "items": [{"t": "guide", "text": "Begin by explaining your role, the purpose of the meeting, consent, confidentiality limits, note-taking and the client’s options."}, {"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}, {"t": "line", "label": "Client priorities in the client’s own words", "lines": 2}]}}, {"id": "s-formulation", "title": "Collaborative formulation and review", "use_when": "Complete collaboratively where appropriate. Treat each explanation as a working idea to test, not a fact or diagnosis. Revisit it when new information emerges or the client says it does not fit.", "sections": [{"heading": "Client’s account and goal", "items": [{"t": "guide", "text": "Start with the client’s language and what they want the formulation to help with. Ask what should be left out or approached later."}, {"t": "line", "label": "What the client says is happening", "lines": 3}, {"t": "line", "label": "What the client hopes will be different", "lines": 2}]}, {"heading": "Recent situation and response", "items": [{"t": "guide", "text": "Choose a recent, specific example. Map what happened and how the client responded without assuming a single cause."}, {"t": "table", "columns": ["Part of the situation", "Client’s account", "Thoughts, feelings, body or action"], "rows": 3, "first": ["Before", "During", "After"]}, {"t": "line", "label": "What the client noticed or learned from this example", "lines": 2}]}, {"heading": "Context and possible links", "items": [{"t": "guide", "text": "Consider relevant history, relationships, health and current social conditions. Make tentative links and note evidence that supports or challenges each idea."}, {"t": "table", "columns": ["Possible link", "What supports it", "What does not fit"], "rows": 3}, {"t": "line", "label": "Important information that remains unknown", "lines": 2}]}, {"heading": "Strengths and protective factors", "items": [{"t": "guide", "text": "Include the client’s existing skills, relationships, values, resources and conditions that make things more manageable."}, {"t": "line", "label": "Strengths and coping already present", "lines": 2}, {"t": "line", "label": "People, routines, communities or practical resources that support the client", "lines": 2}]}, {"heading": "Hypotheses to check", "items": [{"t": "guide", "text": "Write hypotheses in tentative language. Avoid presenting an interpretation as the client’s fact or as a diagnosis."}, {"t": "table", "columns": ["Working hypothesis", "How we could check it", "What would change our view"], "rows": 3}]}, {"heading": "Client’s corrections", "items": [{"t": "guide", "text": "Invite disagreement. A correction is useful information and may show that the account needs to change."}, {"t": "line", "label": "What the client says fits", "lines": 2}, {"t": "line", "label": "What the client corrects, rejects or wants reconsidered", "lines": 3}]}, {"heading": "Plan and review date", "items": [{"t": "guide", "text": "Agree one proportionate next step linked to the client’s goal. Record the responsible person and when the formulation will be reviewed."}, {"t": "table", "columns": ["Next step", "Owner", "Review date or measure"], "rows": 3}, {"t": "line", "label": "What would tell the client that this step is useful?", "lines": 2}]}], "cover": {"title": "Collaborative formulation and review", "note": "Record only information needed for the work. Keep the client’s account, observations and practitioner hypotheses distinct.", "items": [{"t": "guide", "text": "A formulation is a shared, revisable account that helps guide the next step. Invite corrections and record what does not fit."}, {"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Review date"]}, {"t": "line", "label": "Question the formulation should help answer", "lines": 2}]}}, {"id": "s-case-history-mse", "title": "Case history and mental status examination", "use_when": "Use as a structured practitioner worksheet for supervised training or appropriate clinical work. Select questions that fit the client’s needs and referral question. Do not treat the MSE as a diagnostic instrument or a substitute for a fuller safety assessment.", "cover": {"title": "Case history and mental status examination", "note": "Confidential working document. Use the service’s approved record system for identifiable clinical information and follow local privacy, retention and safeguarding requirements.", "items": [{"t": "guide", "text": "Explain your role, purpose, consent, confidentiality limits and note-taking before collecting sensitive information. The client may ask for a pause or choose not to answer."}, {"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}, {"t": "line", "label": "Referral question and client’s main priority", "lines": 2}]}, "sections": [{"heading": "Referral, priorities and current concern", "page_after": true, "items": [{"t": "guide", "text": "Clarify who initiated contact, the referral question and what the client wants from the meeting. Begin with the client’s own account."}, {"t": "line", "label": "Client’s account of the concern and what feels most important", "lines": 3}, {"t": "line", "label": "Onset, course, frequency, intensity, triggers, exceptions and impact", "lines": 3}, {"t": "line", "label": "What the client has tried and what helped or made things harder", "lines": 2}, {"t": "guide", "text": "Example prompt: “What would you most like help with, and what feels important for me to understand first?”"}]}, {"heading": "Functioning, health and relevant history", "page_after": true, "items": [{"t": "guide", "text": "Explore only details relevant to current needs, safety or the referral question. Make clear why sensitive information may matter."}, {"t": "line", "label": "Daily functioning: relationships, work or study, sleep, appetite, energy, concentration and self-care", "lines": 3}, {"t": "line", "label": "Relevant health changes, medicines, supplements, substance use or medical review", "lines": 3}, {"t": "line", "label": "Previous support and what was helpful or unhelpful", "lines": 2}, {"t": "line", "label": "Relevant developmental, education, work or family history", "lines": 2}, {"t": "line", "label": "Current social context: housing, finances, caregiving, discrimination, legal or migration pressures", "lines": 3}, {"t": "guide", "text": "Do not assume that history explains the present. Identify what is known and what still needs checking."}]}, {"heading": "Relationships, culture, strengths and support", "page_after": true, "items": [{"t": "guide", "text": "Ask in the client’s own terms. Do not infer beliefs, identity or family meaning from background or appearance."}, {"t": "line", "label": "Important relationships and the client’s current support network", "lines": 2}, {"t": "line", "label": "Cultural, community, identity, language, faith or spiritual context the client wants considered", "lines": 3}, {"t": "line", "label": "Values, strengths, coping, interests and practical resources", "lines": 3}, {"t": "line", "label": "What the client wants to protect, maintain or build on", "lines": 2}, {"t": "guide", "text": "Example prompt: “Are there cultural, family, faith or community perspectives you would like me to keep in mind?”"}]}, {"heading": "MSE guide: presentation, behaviour and communication", "page_after": true, "items": [{"t": "guide", "text": "Describe what was observed. Consider culture, neurodiversity, trauma, disability, language access, hearing or vision, fatigue and the setting before interpreting behaviour."}, {"t": "subhead", "text": "Appearance and presentation"}, {"t": "guide", "text": "Note relevant observable presentation and physical comfort. Example: “Clean work clothes; appeared tired.” Do not infer character or diagnosis from dress or grooming."}, {"t": "line", "label": "Observation and context", "lines": 2}, {"t": "subhead", "text": "Behaviour, engagement and attitude"}, {"t": "guide", "text": "Describe interaction, engagement, rapport and any behavior affecting the interview. Example: “Engaged; looked away while thinking and responded to questions.”"}, {"t": "line", "label": "Observation and context", "lines": 2}, {"t": "subhead", "text": "Alertness and consciousness"}, {"t": "guide", "text": "Note ability to participate or unusual drowsiness, confusion or fluctuation. A sudden marked change may require prompt medical assessment through local procedures."}, {"t": "line", "label": "Observation and action if needed", "lines": 2}, {"t": "subhead", "text": "Motor activity"}, {"t": "guide", "text": "Describe observable pace or movement and context. Example: “Shifted position frequently while discussing work.”"}, {"t": "line", "label": "Observation and context", "lines": 2}, {"t": "subhead", "text": "Speech and communication"}, {"t": "guide", "text": "Describe rate, volume, amount, articulation, fluency and pauses. Example: “Speech clear and coherent, with pauses before answering questions about sleep.”"}, {"t": "line", "label": "Observation and access needs", "lines": 2}]}, {"heading": "MSE guide: mood, thought and perception", "page_after": true, "items": [{"t": "subhead", "text": "Mood and affect"}, {"t": "guide", "text": "Mood is the person’s reported emotional state. Affect is observed emotional expression. Record them separately. Example: “Mood ‘worn out’; affect subdued and reactive.”"}, {"t": "line", "label": "Mood in the client’s words and observed affect", "lines": 2}, {"t": "subhead", "text": "Thought process"}, {"t": "guide", "text": "Describe organization, coherence, pace and direction of ideas. Use technical terms only when they fit what was observed."}, {"t": "line", "label": "Relevant observations", "lines": 2}, {"t": "subhead", "text": "Thought content"}, {"t": "guide", "text": "Record themes in the client’s words, meaning, distress and impact. If thoughts of harm arise, ask follow-up questions and complete a separate safety assessment as indicated."}, {"t": "line", "label": "Relevant themes and follow-up questions", "lines": 3}, {"t": "subhead", "text": "Perception"}, {"t": "guide", "text": "Describe any unusual sensory experience in the client’s words, including context, timing, distress and impact. Example: “No unusual perceptual experiences reported when asked.”"}, {"t": "line", "label": "What was asked, reported and left unassessed", "lines": 2}]}, {"heading": "MSE guide: cognition, insight and judgment", "page_after": true, "items": [{"t": "subhead", "text": "Cognition"}, {"t": "guide", "text": "Assess attention, concentration, memory, orientation or language only as relevant. Record the task and limits. Example: “Followed the discussion and recalled the agreed next step; no formal cognitive testing undertaken.” Formal screening tools require appropriate training."}, {"t": "line", "label": "Task, response and conditions", "lines": 2}, {"t": "subhead", "text": "Insight and understanding"}, {"t": "guide", "text": "Describe the person’s understanding of their experience and options with an example. Avoid unsupported global grades."}, {"t": "line", "label": "Client’s understanding in their own words", "lines": 2}, {"t": "subhead", "text": "Judgment and decision-making"}, {"t": "guide", "text": "Use a specific example and context. Do not treat disagreement or an unfamiliar choice as impaired judgment."}, {"t": "line", "label": "Decision discussed and the client’s reasoning", "lines": 2}, {"t": "guide", "text": "An MSE is a time-limited description of current functioning. It does not establish diagnosis by itself. State what was not assessed and relevant limits such as fatigue, distress, language access or time."}]}, {"heading": "Integrated MSE note and documentation check", "page_after": true, "items": [{"t": "guide", "text": "Describe organization, coherence, pace and direction of ideas. Example: “Responses were relevant and generally linear; the client returned to the concern about work several times.” Use technical terms only when they fit what was observed."}, {"t": "line", "label": "Integrated MSE note for this appointment", "lines": 6}, {"t": "guide", "text": "From vague to useful: Vague wording: “Client seemed strange and had poor judgment.” More useful wording: “Client paused for several seconds before answering, then described feeling watched at work. They were unsure what might explain the experience. When discussing next steps, they considered contacting a trusted colleague and chose to wait until after the meeting.” The revised note separates observation, client report and a specific decision."}, {"t": "line", "label": "What is observed, reported, inferred, uncertain or not assessed?", "lines": 3}]}, {"heading": "Safety, consultation and agreed follow-up", "danger": true, "items": [{"t": "guide", "text": "MSE documentation does not replace a fuller risk assessment. When safety concerns arise, explore immediate context, thoughts, intent, plans, access, protective support, risk from others and safeguarding needs. Do not use a global low, medium or high label as a prediction. Follow the local pathway."}, {"t": "line", "label": "Safety or safeguarding enquiry and relevant responses", "lines": 3}, {"t": "line", "label": "Actions, consultation, referral and rationale", "lines": 3}, {"t": "table", "columns": ["Next step", "Responsible person", "Due or review time"], "rows": 3}, {"t": "guide", "text": "If alertness or cognition changes suddenly, consider medical causes and seek appropriate urgent assessment. Record the action and who was contacted."}]}, {"heading": "Practice case and supervision reflection", "items": [{"t": "guide", "text": "Practice case: Sam attends after a referral for reduced sleep and missed deadlines. Sam says, “My mind keeps going over everything I might have done wrong.” Sam speaks clearly, pauses before answering and remains engaged. Sam describes feeling “tense and tired”, reports no unusual sensory experiences when asked, outlines a work meeting in sequence and identifies a supportive sibling. Safety, medication, substance use and recent health changes have not yet been explored."}, {"t": "guide", "text": "Practice task: Draft a short case-history summary and MSE. Mark what is known, what remains unasked and what needs follow-up. Do not infer diagnosis or risk level."}, {"t": "guide", "text": "Suggested learning points: Describe the reported sleep difficulty, repetitive worry and missed deadlines, alongside the pauses and continued engagement observed in the meeting. Note the client’s wording, the sequence of the work meeting, the response about perception and the supportive sibling. State that safety, medication, substance use and health changes remain unassessed. Identify relevant follow-up questions and consultation needs. There is not enough information here to diagnose or characterize risk."}, {"t": "line", "label": "Learner or practitioner notes", "lines": 4}, {"t": "line", "label": "Questions for supervision or consultation", "lines": 3}]}]}], "counsellor_sheets_added": false, "session_note_template": {"fields": [{"label": "Session details", "guidance": "Client identifier, date, time, duration, mode, attendees and practitioner role. For remote work, record location and emergency details according to service policy."}, {"label": "Client’s account and focus", "guidance": "Relevant concerns and priorities in the client’s words where useful."}, {"label": "Observation", "guidance": "Relevant observable information, distinct from client report and interpretation."}, {"label": "Assessment and formulation", "guidance": "Reasoning, uncertainty, strengths and any limits to assessment."}, {"label": "Risk and safeguarding", "guidance": "Enquiry, relevant findings, consultation, actions, information shared and rationale."}, {"label": "Intervention and response", "guidance": "What was done, why it was relevant and how the client responded."}, {"label": "Plan and follow-up", "guidance": "Specific action, named owner, timing, referral or consultation and review date."}], "example": "Client reported feeling ‘on edge’ most evenings and described cancelling two social plans after difficult workdays. Practitioner observed tearfulness while discussing a meeting; client paused and chose to continue. Together they reviewed one recent situation and agreed to note sleep and meeting anxiety before the next session. Safety enquiry completed; actions and follow-up recorded in the service record."}, "session_note_template_added": false, "online_adaptations": ["Confirm the client’s current physical location and call-back details at the start of each remote session, in line with service policy.", "Check privacy, accessibility, interpreter needs, technology limits and whether it is safe to speak.", "Agree what will happen if the connection drops or an emergency arises.", "Know the emergency and safeguarding pathway for the client’s location, not only the practitioner’s location.", "Use approved platforms and follow local privacy, security and record-keeping rules."], "online_adaptations_added": false, "tips": ["Follow the client’s pace and priorities while maintaining responsibility for safety.", "Use tentative language for interpretations and direct language for consent and safety questions.", "Name who will act and by when; vague plans are difficult to follow up.", "Use supervision early when scope, risk, ethics or strong practitioner reactions are unclear."], "pitfalls": ["Treating the manual as authorisation to practise or as a substitute for supervised training.", "Using a foreign law, registration title or crisis number as if it applied everywhere.", "Confusing a client’s account, a practitioner’s observation and a clinical hypothesis.", "Recording labels or conclusions without relevant examples.", "Treating the safety plan as proof of safety or a promise not to act.", "Making a referral without clarifying consent, handover and continuity."], "competency_checklist": ["Introduces role, competence and service boundaries accurately.", "Explains consent, privacy and limits in language the client can understand.", "Checks understanding and revisits consent when circumstances change.", "Uses open questions, accurate reflections, summaries and pacing.", "Asks directly about safety when indicated and considers safeguarding.", "Agrees specific actions, responsibilities and review timing.", "Notices and attempts repair when the relationship is strained.", "Distinguishes report, observation, inference and uncertainty in assessment and notes.", "Builds a collaborative, revisable formulation linked to the client’s goals.", "Uses local registration and referral resources appropriately.", "Seeks supervision or referral when needs exceed competence."], "competency_checklist_added": false, "supervision_prompts": ["What is the client asking for, and what have they said would be useful?", "What do I know, what have I inferred and what remains unknown?", "Have I explained consent and confidentiality clearly for this service and location?", "What safety or safeguarding question needs action, by whom and when?", "Does the formulation fit the client’s account? What evidence does not fit?", "Am I working within my training, authorisation and role?", "What reaction in me may be affecting the work?", "What local registration, legal or service guidance should I verify?"], "supervision_prompts_added": false, "quiz": [{"question": "A client does not want to discuss earlier family experiences at the first meeting. What is the best response?", "options": ["Insist because history is essential", "Respect the preference, clarify present needs and safety, and revisit only with agreement", "Assume the client is avoiding treatment", "End the session"], "answer": 1, "rationale": "The client’s preference should be respected while the practitioner still assesses relevant current needs and safety. The pace can be revisited collaboratively."}, {"question": "Which statement best describes a formulation?", "options": ["A diagnosis that confirms the cause", "A fixed explanation written by the practitioner", "A shared, tentative account that is checked and revised", "A substitute for assessment"], "answer": 2, "rationale": "A formulation should remain collaborative and open to correction. It is not a diagnosis or a substitute for assessment."}, {"question": "What should happen if immediate danger emerges?", "options": ["Finish the planned intervention", "Ask the client to promise to stay safe", "Pause routine work and follow the relevant local emergency and supervision pathway", "Wait until the next scheduled supervision"], "answer": 2, "rationale": "Immediate safety takes priority. Follow the local emergency process and involve the appropriate support without relying on a promise."}, {"question": "How should a practitioner document an observation?", "options": ["Use a judgement label", "Separate what was observed from what the client reported and what the practitioner infers", "Record only the diagnosis", "Leave uncertainty out"], "answer": 1, "rationale": "Clear records distinguish report, observation and interpretation, and make uncertainty visible."}, {"question": "A counsellor moves between countries. What is the safest registration assumption?", "options": ["Registration transfers automatically", "A degree alone authorises practice everywhere", "Check the title, regulator and local requirements for the exact jurisdiction", "Use the same crisis and privacy rules"], "answer": 2, "rationale": "Professional titles and legal requirements vary by jurisdiction. Practitioners need confirmation from the responsible local authority."}], "quick_reference": ["Clarify the reason for contact, the client’s priorities, role, consent, privacy limits and practical arrangements.", "Explore current concern and timeline, functioning, relevant health and history, relationships and context, strengths, access needs and safety.", "Ask sensitive questions with an explanation and permission to pause. Collect and retain only information needed for care.", "Describe the MSE domains with neutral, observable language and the client’s own words. State what was assessed and what remains unknown.", "Keep the MSE distinct from diagnosis and from a fuller risk assessment. Focus safety planning on needs, context, supports and concrete action.", "Agree next steps, named responsibility, timing, consultation or referral, and when the plan will be reviewed."], "glossary": [{"term": "Informed consent", "definition": "An ongoing, voluntary agreement made with understandable information about the service, choices and relevant limits."}, {"term": "Scope of practice", "definition": "The work a practitioner is qualified, competent and authorised to undertake in their role and jurisdiction."}, {"term": "Safeguarding", "definition": "Actions and procedures to protect a person, child or dependant from abuse, neglect, exploitation or other harm."}, {"term": "Mental status examination", "definition": "A structured description of relevant current mental functioning based on interview and observation, within competence."}, {"term": "Formulation", "definition": "A collaborative and revisable account of how a person’s difficulties may have developed and what may be maintaining them."}, {"term": "Rupture and repair", "definition": "A strain in the working relationship and the process of acknowledging and addressing it."}, {"term": "Protective factor", "definition": "A personal, relational or contextual resource that may support safety or wellbeing."}, {"term": "Supervision", "definition": "Structured professional support for reviewing practice, client welfare, competence, uncertainty and accountability."}], "related_modules": [], "safety_note": "If risk to life or safety emerges at any point, pause routine work and follow the verified emergency and safeguarding pathway for the client’s current location."}};
