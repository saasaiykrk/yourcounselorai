<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourCounselor | Foundations for Counsellors and Psychologists</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* YourCounselor — module reader styles
 * Follows the YourCounselor Brand & Document System v1.1 (locked) and the
 * approved sample work-up. Colours, fonts and components below are the only
 * ones allowed. Light theme only: the brand system defines no dark palette.
 */
:root {
  --plum: #3D0A6B;        /* headings, body text */
  --muted: #6E587E;       /* secondary text */
  --purple: #6A1BB5;      /* primary accent, links, numbers, buttons */
  --pink: #E8336D;        /* brand accent: accent bar only */
  --pink-text: #C2185B;   /* pink for small text */
  --ink: #260644;         /* dark bands */
  --on-ink: #FAF7FD;
  --on-ink-muted: #CDBEDF;
  --paper: #FFFFFF;
  --lilac: #F7F3FB;       /* page tint */
  --soft: #FAF7FC;        /* table header, quiet boxes */
  --tint: #F0E8F9;        /* chips, note boxes */
  --line: #E7DFEF;
  --line-strong: #D1C0DF;
  --ok: #1E7E34;     --ok-bg: #EAF7EC;     --ok-border: #BFE3C6;
  --warn: #9A5B00;   --warn-bg: #FFF4E0;   --warn-border: #F2D9A8;
  --danger: #B4233F; --danger-bg: #FDECEF; --danger-border: #F4C2CC;
  --head: 'Nunito', 'Inter', sans-serif;
  --body: 'Nunito Sans', 'Inter', sans-serif;
  --sidebar: 264px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--lilac); color: var(--plum); font: 400 16px/1.6 var(--body); }
h1, h2, h3, h4 { font-family: var(--head); color: var(--plum); line-height: 1.2; margin: 0; }
p { margin: 0 0 10px; }
strong { font-weight: 700; }
a { color: var(--purple); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { margin: 4px 0 12px; padding-left: 22px; }
li { margin-bottom: 5px; }
.muted { color: var(--muted); }

/* ---------- content protection ---------- */
.yc-protected, .yc-protected * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.yc-protected input, .yc-protected textarea { -webkit-user-select: text; user-select: text; }
@media print {
  body * { display: none !important; }
  body::after { content: "Printing is disabled for YourCounselor modules."; display: block !important; padding: 40px; font: 18px var(--body); color: var(--plum); }
}

/* ---------- watermark (viewer name + email) ---------- */
.yc-watermark { position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .08; background-repeat: repeat; }

/* ---------- logo lockup (logo + wordmark, gap = 1/4 logo height) ---------- */
.yc-lockup { display: flex; align-items: center; gap: 8px; /* gap = 1/4 logo height */ font: 800 19px var(--head); color: var(--plum); text-decoration: none; padding: 16px 0; }
.yc-lockup img { width: 32px; height: 32px; display: block; }
.yc-lockup.cover { padding: 0 0 22px; }
.yc-skip { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--purple); color: #FFFFFF; padding: 8px 14px; border-radius: 8px; font: 700 14px var(--head); }
.yc-skip:focus { left: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- layout ---------- */
.yc-app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.yc-sidebar { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--paper); border-right: 1px solid var(--line); padding: 4px 18px 24px; display: flex; flex-direction: column; }
.yc-sidebar .eyebrow-label { font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .06em; color: var(--purple); margin: 18px 0 6px; }
.yc-modlist a, .yc-toc a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--plum); font-size: 14px; }
.yc-modlist a.active { background: var(--tint); color: var(--purple); font-weight: 700; }
.yc-toc a { color: var(--muted); font-size: 13.5px; }
.yc-toc a .n { color: var(--purple); font-weight: 700; margin-right: 6px; font-family: var(--head); }
.yc-toc a:hover { background: var(--soft); color: var(--plum); text-decoration: none; }
.yc-toc a.is-hidden, .yc-mobile-toc a.is-hidden { opacity: .45; }
.yc-toc a.active { background: var(--tint); color: var(--purple); font-weight: 700; box-shadow: inset 3px 0 0 var(--purple); }
.yc-owner { margin-top: auto; padding-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.yc-owner strong { color: var(--plum); }

.yc-main { min-width: 0; }
.yc-topbar { display: none; }
.yc-sticky { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.yc-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 28px; background: var(--paper); }
.yc-toolbar input[type=search] { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px var(--body); }
.yc-toolbar select { flex: 0 1 220px; min-width: 150px; min-height: 42px; padding: 8px 34px 8px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 600 14px var(--body); }
.yc-toolbar select:focus { outline: 2px solid var(--purple); outline-offset: 0; border-color: var(--purple); }
.yc-toolbar input[type=search]::placeholder { color: var(--muted); }
.yc-toolbar input[type=search]:focus { outline: 2px solid var(--purple); outline-offset: 0; border-color: var(--purple); }
.yc-seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--paper); }
.yc-seg button { border: 0; background: none; color: var(--muted); padding: 8px 14px; font: 700 13px var(--head); cursor: pointer; }
.yc-seg button + button { border-left: 1px solid var(--line); }
.yc-seg button[aria-pressed=true] { background: var(--purple); color: #FFFFFF; }
.yc-filter-status { padding: 8px 28px; font-size: 14px; background: var(--tint); color: var(--plum); border-top: 1px solid var(--line); }
.yc-filter-status .yc-jump { border: 0; background: none; padding: 4px 2px; font: inherit; color: var(--purple); text-decoration: underline; cursor: pointer; }
.yc-btn { border: 1px solid var(--purple); background: var(--paper); color: var(--purple); border-radius: 999px; padding: 4px 13px; font: 700 13px var(--head); cursor: pointer; }
.yc-btn:hover { background: var(--tint); }
.yc-filter-status .yc-clear { margin-left: 6px; }
.yc-content { max-width: 900px; margin: 0 auto; padding: 24px 28px 80px; }
.yc-mobile-toc { display: none; }

@media (min-width: 521px) and (max-width: 900px) {
  .yc-content { max-width: 820px; padding-left: 24px; padding-right: 24px; }
  .yc-cover h1 { font-size: clamp(30px, 4vw, 36px); }
}
@media (max-width: 900px) {
  .yc-app { grid-template-columns: 1fr; }
  .yc-sidebar { display: none; }
  .yc-topbar { display: flex; align-items: center; padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .yc-topbar .yc-lockup { padding: 10px 0; font-size: 17px; gap: 7px; }
  .yc-topbar .yc-lockup img { width: 28px; height: 28px; }
  .yc-toolbar { padding: 8px 16px; }
  .yc-filter-status { padding: 6px 16px; font-size: 13.5px; }
  .yc-content { padding: 16px 16px 64px; }
  .yc-mobile-toc { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 8px; border-top: 1px solid var(--line); scrollbar-width: none; }
  .yc-mobile-toc a { flex: none; display: inline-flex; align-items: center; min-height: 36px; font: 700 12.5px var(--head); padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--tint); color: var(--purple); text-decoration: none; }
  .yc-mobile-toc a.active { background: var(--purple); border-color: var(--purple); color: #FFFFFF; }
  .yc-seg button { min-height: 40px; }
  .yc-btn { min-height: 36px; }
  .check { min-height: 44px; }
}

/* ---------- module cover (header) ---------- */
.yc-cover { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
.yc-cover-body { padding: 28px 28px 20px; }
.eyebrow { display: inline-block; font: 700 11px var(--head); letter-spacing: .06em; text-transform: uppercase; color: var(--purple); background: var(--tint); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; }
.yc-cover h1 { font-weight: 800; font-size: 36px; letter-spacing: -0.02em; margin: 14px 0 8px; max-width: 640px; }
.yc-cover .sub { font-size: 17px; color: var(--muted); max-width: 600px; margin: 0; }
.yc-cover-meta { display: grid; grid-template-columns: 140px 1fr; row-gap: 6px; margin: 20px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14.5px; }
.yc-cover-meta dt { color: var(--muted); }
.yc-cover-meta dd { margin: 0; color: var(--plum); }
.yc-cover-band { position: relative; background: var(--ink); color: var(--on-ink-muted); padding: 18px 28px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; align-items: flex-end; }
.yc-cover-band::before { content: ''; position: absolute; left: 0; top: 0; height: 5px; width: 100%; background: linear-gradient(90deg, var(--purple) 0 80%, var(--pink) 80% 100%); }
.yc-cover-band strong { color: var(--on-ink); }
@media (max-width: 520px) { .yc-toolbar input[type=search] { flex-basis: 100%; min-height: 44px; } .yc-toolbar select { flex: 1 1 100%; min-width: 0; } .yc-toolbar { gap: 6px; } .yc-topbar { min-height: 52px; } .yc-content { padding-left: 12px; padding-right: 12px; } .yc-cover h1 { font-size: 28px; } .yc-cover-body { padding: 22px 18px 16px; } .yc-cover-band { padding: 16px 18px 12px; } .yc-cover-meta { grid-template-columns: 110px 1fr; } }

/* ---------- quick reference (pinned) ---------- */
.yc-quickref { margin: 0 0 18px; }

/* ---------- sections ---------- */
details.section { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px; scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
details.section > summary { list-style: none; cursor: pointer; padding: 18px 22px; display: flex; align-items: center; gap: 10px; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary h2 { font-size: 22px; font-weight: 700; flex: 1; }
details.section > summary::after { content: "▾" / ""; color: var(--muted); transition: transform .2s; }
details.section:not([open]) > summary::after { transform: rotate(-90deg); }
details.section[data-always-open] > summary { cursor: default; }
details.section[data-always-open] > summary::after { content: none; }
h2 .num { color: var(--purple); margin-right: 6px; }
.section-body { padding: 0 22px 20px; }
h3 { font-size: 17px; font-weight: 700; margin: 18px 0 6px; }
h4 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; }
.item { border-top: 1px solid var(--line); padding: 18px 0; }
.item:first-child { border-top: 0; padding-top: 4px; }
.item { scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
.item > h3 { margin-top: 0; }
.label-line { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin: 12px 0 4px; display: block; }
.not-covered { color: var(--muted); }

/* ---------- chips (status pills) ---------- */
.chip { display: inline-block; font: 700 11px var(--head); padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--tint); color: var(--purple); white-space: nowrap; vertical-align: 2px; margin-left: 4px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.chip.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.chip.plain { background: var(--paper); color: var(--muted); }

/* ---------- callouts: Why this matters · Note · Caution · Risk ---------- */
.box { border-left: 4px solid var(--purple); background: var(--soft); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0; }
.box .label { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 3px; color: var(--purple); }
.box > :last-child { margin-bottom: 0; }
.box.why { background: var(--tint); }
.box.warn { border-color: var(--warn); background: var(--warn-bg); } .box.warn .label { color: var(--warn); }
.box.danger { border-color: var(--danger); background: var(--danger-bg); } .box.danger .label { color: var(--danger); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 6px 0 12px; }
table.yc { width: 100%; border-collapse: collapse; font-size: 15px; border-color: var(--line); }
table.yc thead, table.yc tbody, table.yc tr { border-color: var(--line); }
table.yc th { background: var(--soft); font: 700 14px var(--head); text-align: left; color: var(--plum); }
table.yc th, table.yc td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
table.yc td { color: var(--muted); }
table.yc td:first-child { color: var(--plum); font-weight: 700; }
table.yc td strong { color: var(--plum); }
table.yc.dialogue td:first-child { width: 96px; font-family: var(--head); }
table.yc.dialogue .note { display: block; font-size: 13.5px; color: var(--purple); margin-top: 3px; }
@media (max-width: 520px) {
  table.yc, table.yc tbody, table.yc tr, table.yc td { display: block; width: 100%; }
  table.yc thead { display: none; }
  table.yc tr { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; padding: 6px 10px; background: var(--paper); }
  table.yc td { border: 0; padding: 4px 0; }
  table.yc td::before { content: attr(data-label); display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); }
  table.yc.dialogue td:first-child { width: auto; }
}

/* ---------- diagrams ---------- */
figure.dg { margin: 12px 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
figure.dg figcaption { font-size: 13.5px; color: var(--muted); margin-top: 8px; text-align: center; }
figure.dg .dg-title { font: 700 14px var(--head); color: var(--plum); margin: 0 0 8px; text-align: center; }
.dg-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.dg-svg { width: 100%; height: auto; display: block; max-width: 680px; margin: 0 auto; }
.dg-hint { display: none; font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 4px; }
@media (max-width: 600px) { .dg-svg { min-width: 560px; } .dg-hint { display: block; } figure.dg { padding: 10px; } }
.dg-box { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1.4; }
.dg-context .dg-box, .dg-question .dg-box { fill: var(--tint); stroke: var(--line-strong); }
.dg-level-0 .dg-box { fill: var(--paper); } .dg-level-1 .dg-box { fill: var(--soft); }
.dg-level-2 .dg-box { fill: var(--tint); } .dg-level-3 .dg-box { fill: var(--line); }
.dg-text { fill: var(--plum); font-family: var(--body); }
.dg-edge { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.dg-edge-back { stroke-dasharray: 5 4; }
.dg-arrowhead { fill: var(--muted); }
.dg-label-bg { fill: var(--paper); stroke: var(--line); }
.dg-label-text, .dg-axis { fill: var(--muted); font-family: var(--body); }
.dg-branch { fill: var(--purple); font-weight: 700; font-family: var(--head); }
.dg-frame { fill: none; stroke: var(--line-strong); stroke-dasharray: 6 5; }

/* ---------- quiz & checklist (quiz uses neutral brand colours, never status colours) ---------- */
.quiz-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.quiz-head .quiz-score { margin: 0; }
.quiz-q { border-top: 1px solid var(--line); padding: 16px 0; }
.quiz-q > p { font-weight: 600; margin: 0 0 8px; }
.quiz-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px/1.5 var(--body); cursor: pointer; }
.quiz-opt:hover:not([aria-disabled]) { border-color: var(--purple); }
.quiz-opt[aria-disabled] { cursor: default; }
.quiz-opt.correct { background: var(--tint); border: 2px solid var(--purple); }
.quiz-opt.picked { background: var(--soft); color: var(--muted); border-style: dashed; }
.quiz-tag:empty { display: none; }
.quiz-tag { display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin-bottom: 2px; }
.quiz-opt.picked .quiz-tag { color: var(--muted); }
.quiz-why { display: none; outline: none; }
.quiz-q.answered .quiz-why { display: block; }
.quiz-score { font: 700 15px var(--head); color: var(--purple); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { color: var(--plum); margin-top: 5px; accent-color: var(--purple); width: 18px; height: 18px; flex: none; }

/* ---------- client handouts ---------- */
.handout-preview { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 8px 0; background: var(--paper); }
.handout-notes { margin: 6px 0 0; font-size: 14px; }
.yc-handout-dl { min-height: 40px; }

/* ---------- crisis lines ---------- */
.crisis-list { margin: 6px 0 0; padding-left: 20px; }
.crisis-list li { margin-bottom: 6px; }
.crisis-list a { font-weight: 700; display: inline-block; padding: 2px 0; }
.crisis-region { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* ---------- disclaimer + copyright & IP notice (always last) ---------- */
.disclaimer { border: 1px dashed var(--line-strong); background: var(--soft); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); margin-top: 22px; }
.disclaimer strong { color: var(--plum); }
.ip-notice { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; font-size: 13px; line-height: 1.55; color: var(--muted); }
.ip-notice strong { color: var(--plum); }

/* ---------- floating Home button + search landing highlight ---------- */
.yc-home-fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 60; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--purple); color: #FFFFFF; font: 800 14px var(--head); box-shadow: 0 5px 18px rgba(61, 10, 107, .24); cursor: pointer; }
.yc-home-fab[hidden] { display: none; }
.yc-home-fab:hover { background: var(--plum); }
.yc-home-fab:focus-visible { background: var(--plum); outline: 2px solid var(--purple); outline-offset: 3px; }
.yc-hit { border-radius: 4px; animation: yc-hit 2.2s ease-out; }
@keyframes yc-hit { 0%, 45% { background: var(--line-strong); box-shadow: 0 0 0 4px var(--line-strong); } 100% { background: transparent; box-shadow: 0 0 0 4px transparent; } }
.yc-sticky { transition: transform .2s ease; }
@media (max-width: 900px) { .yc-sticky.yc-compact { transform: translateY(calc(-1 * var(--yc-toolbar-h, 0px))); } }
@media (prefers-reduced-motion: reduce) { .yc-sticky { transition: none; } .yc-hit { animation-duration: .01s; outline: 2px solid var(--purple); } }
@media print { .yc-home-fab { display: none !important; } }

.hidden-by-filter { display: none !important; }
::highlight(yc-search) { background-color: var(--line-strong); color: var(--plum); }
.handout-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.yc-handout-dl:disabled { opacity: .55; cursor: not-allowed; }
.yc-handout-status { margin: 4px 0 0; font-size: 14px; min-height: 0; }
.yc-handout-status:empty { display: none; }
.yc-preview-toggle { display: none; }
@media (max-width: 520px) {
  .handout-preview:not(.expanded) { max-height: 240px; overflow: hidden; position: relative; }
  .handout-preview:not(.expanded)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(rgba(255,255,255,0), var(--paper)); }
  .yc-preview-toggle { display: inline-flex; }
}
.sheet-inside { font-size: 14px; color: var(--muted); }

/* ---------- responsive refinements: tablet and phone ---------- */
.yc-app, .yc-main, .yc-content, .section-body, .item { min-width: 0; }
.yc-content img, .yc-content video, .yc-content canvas, .yc-content iframe { max-width: 100%; }
.yc-content pre, .yc-content code { overflow-wrap: anywhere; }
.table-wrap, .dg-scroll { max-width: 100%; overscroll-behavior-inline: contain; }
.yc-content :focus-visible, .yc-mobile-toc a:focus-visible, .yc-toolbar button:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
@media (min-width: 901px) and (max-width: 1100px) {
  .yc-app { grid-template-columns: 240px minmax(0, 1fr); }
  .yc-content, .yc-toolbar { padding-left: 22px; padding-right: 22px; }
}
@media (max-width: 900px) {
  .yc-mobile-toc { scroll-snap-type: x proximity; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
  .yc-mobile-toc a { scroll-snap-align: start; min-height: 44px; }
  .yc-topbar { min-height: 52px; }
  .yc-content { width: 100%; }
  .yc-sticky { max-width: 100vw; }
  .yc-toolbar input[type=search] { flex: 1 1 100%; }
  .yc-seg { flex: 1 1 auto; }
  .yc-seg button { flex: 1 1 auto; }
  .yc-filter-status { overflow-wrap: anywhere; }
  details.section > summary { padding: 16px 18px; }
  .section-body { padding: 0 18px 18px; }
  figure.dg { max-width: 100%; }
}
@media (max-width: 520px) {
  html { scroll-padding-top: 150px; }
  .yc-content { padding: 12px 12px 48px; }

  /* ---------- handout download ----------
   * Production: YC_CONFIG.onHandoutDownload({ slug, handoutId, region }) asks the server for the PDF

   * subscription. It may return a Promise; a rejection shows its message under the button.

  function subMsg() { var b = cfg().brand; return (b && b.subscription_message) || SUBSCRIPTION_MSG; }
  var POPUP_MSG = "Your browser blocked the print window. Allow pop-ups for this site, then try again.";
  function downloadHandout(data, hd, report, kind) {
    kind = kind || "client_handout";
    var c = cfg(); report = report || function () {};
    if (c.subscriptionActive === false) { report(subMsg()); return; }
    report("");

        if (r && typeof r.then === "function") {

        }

    var parts = kind === "counsellor_sheet" ? {} : global.YCHandout.diagramParts(data, hd);
    var html = kind === "counsellor_sheet"
      ? global.YCHandout.buildSheetHtml({ sheet: hd, brand: c.brand, crisis: c.crisis, region: c.region, logoUrl: absUrl(logo), diagrams: global.YCHandout.sheetDiagrams(data, hd) })
      : global.YCHandout.buildHtml({ handout: hd, module: data, brand: c.brand, crisis: c.crisis, region: c.region, practitioner: c.viewer && c.viewer.name,
      logoUrl: absUrl(logo), diagramSvg: parts.diagramSvg, diagramTitle: parts.diagramTitle,
      diagramCaption: parts.diagramCaption, diagramType: parts.diagramType });

    if (!w) { report(POPUP_MSG); return; }

    var imgs = Array.prototype.slice.call(w.document.images || []).map(function (im) {

    });
    var waits = [w.document.fonts && w.document.fonts.ready].concat(imgs).filter(Boolean);
    Promise.all(waits).then(function () { setTimeout(go, 150); }, go);
    setTimeout(go, 3000);
  }

  /* ---------- quiz: neutral colours + text labels; keyboard-friendly ---------- */
  function setupQuiz(root, s) {
    var qs = root.querySelectorAll(".quiz-q"); if (!qs.length) return;
    var scoreEl = root.querySelector(".quiz-score"), live = root.querySelector(".quiz-live"), reset = root.querySelector(".quiz-reset");
    var answered = 0, right = 0;
    function score() {
      scoreEl.textContent = "Score: " + right + " / " + answered + (answered === s.quiz.length ? " · complete" : " · " + (s.quiz.length - answered) + " to go");
      reset.hidden = answered === 0;
    }
    qs.forEach(function (qEl) {
      var q = s.quiz[+qEl.getAttribute("data-q")];
      qEl.querySelectorAll(".quiz-opt").forEach(function (btn) {
        on(btn, "click", function () {
          if (qEl.classList.contains("answered")) return;
          var o = +btn.getAttribute("data-o");
          qEl.querySelectorAll(".quiz-opt").forEach(function (x, i) {
            x.setAttribute("aria-disabled", "true");
            if (i === q.answer) { x.classList.add("correct"); x.querySelector(".quiz-tag").textContent = "Correct answer"; }
          });
          if (o !== q.answer) { btn.classList.add("picked"); btn.querySelector(".quiz-tag").textContent = "Your answer"; } else right++;
          answered++; qEl.classList.add("answered");
          live.textContent = (o === q.answer ? "Correct. " : "Not quite. ") + qEl.querySelector(".quiz-why").textContent;
          qEl.querySelector(".quiz-why").focus({ preventScroll: true });
          score();
        });
      });
    });
    on(reset, "click", function () {
      answered = 0; right = 0;
      qs.forEach(function (qEl) {
        qEl.classList.remove("answered");
        qEl.querySelectorAll(".quiz-opt").forEach(function (x) { x.removeAttribute("aria-disabled"); x.classList.remove("correct", "picked"); x.querySelector(".quiz-tag").textContent = ""; });
      });
      scoreEl.textContent = "Answer each question to see your score."; reset.hidden = true;
      qs[0].querySelector(".quiz-opt").focus();
    });
  }

  /* ---------- level filter + search ---------- */

    return norm(t);

    // search-term highlight (CSS Custom Highlight API where supported; silently skipped elsewhere)
    function highlight() {
      if (!global.CSS || !CSS.highlights || typeof Highlight === "undefined") return;
      CSS.highlights.delete("yc-search");
      if (!q || q.length < 2) return;
      var ranges = [], walker = document.createTreeWalker(root.querySelector(".yc-content"), NodeFilter.SHOW_TEXT), n;
      while ((n = walker.nextNode()) && ranges.length < 400) {
        if (!n.parentElement || n.parentElement.closest(".hidden-by-filter, svg, .yc-btn, .yc-handout-status")) continue;
        // one-to-one character replacements keep offsets aligned with the original text node
        var text = n.nodeValue.toLowerCase().replace(/[‘’ʼ]/g, "'").replace(/[“”]/g, '"').replace(/\s/g, " ");
        var i = text.indexOf(q);
        while (i > -1 && ranges.length < 400) { var r = new Range(); r.setStart(n, i); r.setEnd(n, i + q.length); ranges.push(r); i = text.indexOf(q, i + q.length); }
      }
      if (ranges.length) { var hl = new Highlight(); ranges.forEach(function (r) { hl.add(r); }); CSS.highlights.set("yc-search", hl); }
    }
    return { clear: clearAll };
  }

  /* ---------- sticky header metrics → CSS variable, so anchors land exactly below it ---------- */
  function stickyBottom() { var s = document.querySelector(".yc-sticky"); return s ? Math.max(0, s.getBoundingClientRect().bottom) : 0; }
  function setupStickyMetrics(root) {
    var el = root.querySelector(".yc-sticky"), bar = el.querySelector(".yc-toolbar"), search = el.querySelector("input[type=search]");
    function measure() {
      var tb = bar ? bar.offsetHeight : 0, compact = el.classList.contains("yc-compact");
      document.documentElement.style.setProperty("--yc-toolbar-h", tb + "px");
      document.documentElement.style.setProperty("--sticky-h", Math.ceil(el.getBoundingClientRect().height - (compact ? tb : 0)) + "px");
    }
    measure();
    // phones and tablets: the search bar slides away while scrolling down and returns on any scroll up,
    // so the sticky header does not cover half the screen
    var lastY = global.scrollY, acc = 0;
    function compact(onOff) { if (el.classList.contains("yc-compact") !== onOff) { el.classList.toggle("yc-compact", onOff); measure(); } }
    on(global, "scroll", function () {
      var y = global.scrollY, dy = y - lastY; lastY = y;
      if (global.innerWidth > 900 || y < 160 || document.activeElement === search) { acc = 0; compact(false); return; }
      acc = (acc > 0) === (dy > 0) ? acc + dy : dy;
      if (acc > 24) compact(true); else if (acc < -24) compact(false);
    }, { passive: true });
    on(search, "focus", function () { compact(false); });
    if (global.ResizeObserver) { var ro = new ResizeObserver(measure); ro.observe(el); state.cleanup.push(function () { ro.disconnect(); }); }
    on(global, "resize", measure);
    on(root, "yc-layout", measure);
  }

  /* ---------- active-section highlight in sidebar + mobile chips ---------- */
  function scrollSpy(root, filters) {
    var links = {}, chips = {};
    root.querySelectorAll(".yc-toc a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
    root.querySelectorAll(".yc-mobile-toc a").forEach(function (a) { chips[a.getAttribute("href").slice(1)] = a; });
    var sections = Array.prototype.slice.call(root.querySelectorAll("details.section"));
    var current = null, ticking = false, lockUntil = 0, lastClicked = null;
    root.querySelectorAll(".yc-toc a, .yc-mobile-toc a").forEach(function (a) {
      on(a, "click", function (e) {
        var id = a.getAttribute("href").slice(1), sec = document.getElementById(id);
        if (!sec) return;
        e.preventDefault();
        if (sec.classList.contains("hidden-by-filter")) filters.clear(false);   // a hidden section is revealed, not ignored
        sec.open = true;
        lockUntil = Date.now() + 900; lastClicked = id; setActive(id);
        sec.scrollIntoView({ behavior: "smooth", block: "start" });
        if (history.replaceState) history.replaceState(null, "", "#" + id);
      });
    });
    function setActive(id) {
      if (id === current) return;
      current = id;
      [links, chips].forEach(function (set) {
        Object.keys(set).forEach(function (k) {
          var isOn = k === id;
          set[k].classList.toggle("active", isOn);
          if (isOn) set[k].setAttribute("aria-current", "location"); else set[k].removeAttribute("aria-current");
        });
      });
      keepVisible(links[id], root.querySelector(".yc-sidebar"), "y");
      keepVisible(chips[id], root.querySelector(".yc-mobile-toc"), "x");
    }
    function update() {
      ticking = false;
      if (Date.now() < lockUntil) { ticking = true; global.requestAnimationFrame(update); return; }
      var offset = stickyBottom() + 40, id = null;
      var vis = sections.filter(function (x) { return !x.classList.contains("hidden-by-filter"); });
      vis.forEach(function (sec) { if (sec.getBoundingClientRect().top <= offset) id = sec.id; });
      if (global.innerHeight + global.scrollY >= document.documentElement.scrollHeight - 4) {
        // at the bottom: the clicked section if still on screen, else the last section starting in the upper half
        var clicked = lastClicked && document.getElementById(lastClicked), cr = clicked && clicked.getBoundingClientRect();
        if (cr && cr.top >= 0 && cr.top < global.innerHeight) id = lastClicked;
        else {
          var upper = vis.filter(function (x) { return x.getBoundingClientRect().top < global.innerHeight / 2; });
          if (upper.length) id = upper[upper.length - 1].id;
        }
      }
      setActive(id);
    }
    function keepVisible(el, box, axis) {
      if (!el || !box || box.getClientRects().length === 0) return;
      var r = el.getBoundingClientRect(), br = box.getBoundingClientRect();
      if (axis === "y" && (r.top < br.top + 60 || r.bottom > br.bottom - 60)) box.scrollTop += r.top - br.top - br.height / 2;
      if (axis === "x" && (r.left < br.left || r.right > br.right)) box.scrollLeft += r.left - br.left - 16;
    }
    ["wheel", "touchmove", "keydown"].forEach(function (ev) { on(global, ev, function () { if (Date.now() > lockUntil) lastClicked = null; }, { passive: true }); });
    function onScroll() { if (!ticking) { ticking = true; global.requestAnimationFrame(update); } }
    on(global, "scroll", onScroll, { passive: true });
    on(global, "resize", onScroll);
    on(root, "toggle", onScroll, true);
    on(root, "yc-layout", onScroll);
    update();
  }

  /* ---------- content protection ---------- */
  function protect(root) {
    root.classList.add("yc-protected");
    ["copy", "cut", "contextmenu", "selectstart", "dragstart"].forEach(function (ev) {
      on(root, ev, function (e) { if (!(e.target.closest && e.target.closest("input,textarea"))) e.preventDefault(); });
    });
    on(document, "keydown", function (e) {
      var k = (e.key || "").toLowerCase();
      if ((e.ctrlKey || e.metaKey) && k.length === 1 && "cpsax".indexOf(k) > -1) {
        if (!(e.target.closest && e.target.closest("input,textarea"))) e.preventDefault();
      }
    });
    on(global, "beforeprint", function () { document.body.style.visibility = "hidden"; });
    on(global, "afterprint", function () { document.body.style.visibility = ""; });
  }

  /* ---------- watermark: repeating SVG tile, covers any screen size ---------- */
  function watermark(viewer, b) {
    var old = document.querySelector(".yc-watermark"); if (old) old.remove();
    var who = viewer && (viewer.name || viewer.email) ? [viewer.name, viewer.email].filter(Boolean).join(" · ") : b.name + " · Professional use only";
    var x = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]; }); };
    var w = Math.max(340, Math.round(who.length * 8.2) + 90);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="200"><text x="' + w / 2 + '" y="105" text-anchor="middle" transform="rotate(-28 ' + w / 2 + ' 100)" fill="#6E587E" font-family="Nunito Sans, Inter, sans-serif" font-size="15" font-weight="600">' + x(who) + "</text></svg>";
    var el = document.createElement("div"); el.className = "yc-watermark"; el.setAttribute("aria-hidden", "true");
    el.style.backgroundImage = 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")';
    document.body.appendChild(el);
  }

  /* ---------- floating Home button: appears after scrolling, jumps straight to the module cover ---------- */
  function homeButton(root) {
    var old = document.querySelector(".yc-home-fab"); if (old) old.remove();
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "yc-home-fab"; btn.hidden = true;
    btn.setAttribute("aria-label", "Back to the top of the module");
    btn.innerHTML = 'Home <span aria-hidden="true">↑</span>';
    document.body.appendChild(btn);
    // the page itself, plus any scrolling container the app may wrap the module in
    function scrollers() {
      var list = [document.scrollingElement || document.documentElement], el = root.parentElement;
      while (el && el !== document.body && el !== document.documentElement) {
        var o = global.getComputedStyle(el).overflowY;
        if ((o === "auto" || o === "scroll") && el.scrollHeight > el.clientHeight) list.push(el);
        el = el.parentElement;
      }
      return list;
    }
    function offset() { return Math.max(global.scrollY || 0, scrollers().reduce(function (m, el) { return Math.max(m, el.scrollTop); }, 0)); }
    function update() { btn.hidden = offset() < 400; }
    on(document, "scroll", update, { capture: true, passive: true });
    on(btn, "click", function () {
      var st = root.querySelector(".yc-sticky"); if (st) st.classList.remove("yc-compact");
      // jump in one step: a smooth scroll can be interrupted part-way and leave the reader mid-page
      var html = document.documentElement, prev = html.style.scrollBehavior;
      html.style.scrollBehavior = "auto";
      scrollers().forEach(function (el) { el.scrollTop = 0; });
      global.scrollTo(0, 0);
      var side = root.querySelector(".yc-sidebar"); if (side) side.scrollTop = 0;   // sidebar back to its first tab
      var chips = root.querySelector(".yc-mobile-toc"); if (chips) chips.scrollLeft = 0;
      html.style.scrollBehavior = prev;
      var main = root.querySelector(".yc-content"); if (main && main.focus) main.focus({ preventScroll: true });
      update();
    });
    state.cleanup.push(function () { btn.remove(); });
    update();
  }

  /* ---------- region can change without re-mounting (e.g. profile update) ---------- */
  function setRegion(code) {
    cfg().region = code;
    var sec = document.querySelector("#sec-safety_note .section-body"); if (sec) sec.innerHTML = R.safety_note(null);
    var d = document.querySelector(".disclaimer"); if (d) d.innerHTML = disclaimerHtml();
  }

  global.YCReader = { mount: mount, setRegion: setRegion, _downloadHandout: downloadHandout, SECTIONS: SECTIONS, _md: md, _norm: norm };
})(window);
</script>
<script>
var DATA = {"slug": "foundations", "title": "Foundations for Counsellors and Psychologists", "summary": "A practical training guide to safe, collaborative and accountable practice, from consent and safety to assessment, formulation, documentation and supervision.", "category": "Professional practice", "audience": "Counsellors, psychologists, trainees and supervisors working within their competence and local requirements", "version": "1.0", "updated": "13 Oct 2026", "diagrams": [], "sections": {"learning_objectives": ["Explain role, scope, competence and the difference between professional title and service role.", "Establish informed consent, confidentiality limits, boundaries and a clear working agreement.", "Ask directly and compassionately about safety, safeguarding and immediate needs, then act through local pathways.", "Use core counselling micro-skills and attend to the therapeutic relationship, including repair after strain.", "Complete a relevant intake and descriptive mental status examination without exceeding competence.", "Build a collaborative, revisable formulation and connect it to an agreed plan.", "Keep accurate, secure records and use supervision, consultation and referral appropriately.", "Locate current professional registration and government service resources for the client’s country and jurisdiction."], "overview": {"text": "This guide covers the shared foundations that support safe, collaborative and accountable counselling and psychological practice. It is written for counsellors, psychologists, trainees and supervisors. It brings together ethical contracting, risk response, listening skills, relationship work, intake, formulation, documentation and reflective practice. The examples use Noor, a fictional adult client. They are teaching examples, not scripts or a substitute for qualification, supervision, local law or service procedures."}, "when_to_use": {"indications": ["Use as an orientation and supervised practice resource before or alongside client work.", "Use the repeat case and skills activities for teaching, role-play and observed feedback.", "Revisit the relevant sections when planning an intake, reviewing a safety concern, repairing a rupture or writing a record."], "populations": ["Counsellors and psychologists at different career stages, including trainees working under appropriate supervision.", "Facilitators and supervisors adapting activities to learner role, service setting and local requirements."], "cautions": ["This guide does not confer a qualification, registration, licence, competence or authority to practise.", "The law, protected titles, professional registers and service pathways differ by country and sometimes by state, nation, emirate or territory. Verify the current rule with the responsible authority.", "Use only assessment tools and interventions for which the practitioner has appropriate training, authorisation and supervision."]}, "core_concepts": [{"name": "Role, scope and competence", "definition": "A practitioner’s title and scope arise from their education, registration, legal authority, role and service context. Similar conversations may be delivered under different roles, but the authority and accountability are not interchangeable.", "components": ["Describe qualifications and role accurately.", "Check local title protection, registration and service requirements.", "Work within demonstrated competence, seek supervision and refer when needs exceed scope."], "level": "foundation"}, {"name": "Informed and ongoing consent", "definition": "Consent is a continuing conversation about the service, choices, likely process, practical arrangements, information use and the client’s right to ask questions or change their mind.", "components": ["Use understandable language and check understanding.", "Explain limits before collecting sensitive information.", "Revisit consent when plans, risks, referrals or information sharing change."], "level": "foundation"}, {"name": "Confidentiality and its limits", "definition": "Privacy supports trust, but confidentiality is not absolute. Explain applicable limits in advance and consult local law, professional duties and service policy before disclosure decisions where circumstances allow.", "components": ["Avoid promising absolute secrecy.", "Share only information that is necessary and authorised or required.", "Explain decisions to the client when safe and lawful, and document the rationale."], "level": "foundation"}, {"name": "Therapeutic alliance", "definition": "The working relationship includes agreement about goals, tasks and how the work will proceed. It is collaborative and should be reviewed as the client’s needs change.", "components": ["Invite the client’s priorities and feedback.", "Attend to power, culture, access and difference.", "Treat disagreement and repair as part of the work, not as client failure."], "level": "foundation"}, {"name": "Risk and safeguarding", "definition": "Risk enquiry is a proportionate, direct and compassionate process for understanding immediate safety needs, protective factors, uncertainty and next steps. A score or promise cannot replace clinical judgement and action.", "components": ["Ask about relevant harm to self, harm to others, risk from others and safeguarding of dependants.", "Collaborate on practical steps, named responsibilities and timing.", "Escalate through verified local pathways when indicated."], "level": "foundation"}, {"name": "Assessment and formulation", "definition": "Assessment gathers information relevant to the client’s goals, needs and safety. Formulation is a shared, tentative account of how difficulties may have developed and what may be maintaining them.", "components": ["Separate client report, practitioner observation and interpretation.", "Include context, strengths, culture and structural pressures.", "Review the formulation when new information does not fit."], "level": "foundation"}, {"name": "Documentation as care", "definition": "A record supports continuity, accountability and safe decision-making. It should be timely, relevant, factual, secure and understandable to an appropriate professional reader.", "components": ["Record what was reported and observed separately.", "Include assessment, reasoning, consultation, decisions, actions and follow-up ownership.", "Follow local retention, access, correction and security requirements."], "level": "foundation"}, {"name": "Supervision and reflective practice", "definition": "Supervision creates a protected space to review client welfare, practitioner decisions, uncertainty, competence and emotional responses. It does not transfer the practitioner’s accountability to the supervisor.", "components": ["Bring focused questions and relevant facts.", "Protect client identity and share only what is necessary.", "Agree actions, ownership and review dates."], "level": "foundation"}], "assessment_formulation": {"intake_guide": ["Clarify the client’s reason for seeking help and what they hope will be different.", "Explain role, service, consent, confidentiality limits, records, contact arrangements and practical terms.", "Explore current concerns, onset, pattern, impact, previous support, health and relevant context.", "Ask about strengths, preferences, access needs, language and what should not be discussed yet.", "Complete relevant safety and safeguarding enquiry, agree actions and follow-up.", "Summarise what is known, what remains uncertain and the next step."], "assess": ["Presenting concern in the client’s words, timing, frequency, intensity, triggers and impact.", "Daily functioning, relationships, work or study, sleep, appetite, energy, concentration and self-care.", "Relevant physical health, medication, substance use and whether medical review may be needed.", "Previous support and what the client found helpful or unhelpful.", "Social and cultural context, identity, faith, language, discrimination, disability, housing, finances and caregiving.", "Strengths, coping, supportive relationships, values, interests and practical resources.", "Current safety, history relevant to the concern, protective factors and uncertainty."], "risk_script": ["What has felt most difficult or unsafe recently?", "Have you had thoughts about harming yourself or not wanting to be alive?", "Have you thought about how or when you might act, or taken any steps to prepare?", "Are you worried someone else may harm you, or that someone in your care may be unsafe?", "What has helped you stay safe so far, and who can support you?", "What would make the next few hours or days safer?"], "safety_plan": ["Warning signs and situations that tell the client risk is rising.", "Immediate coping steps and safer surroundings, agreed collaboratively.", "Trusted people and professional contacts, checked for safe use.", "Specific local crisis or emergency contact verified for the client’s current location.", "Named person responsible for each action and the time for follow-up."], "formulation_steps": ["Agree the question the formulation should help answer.", "Map recent situations, thoughts or meanings, emotions, bodily responses and actions where useful.", "Add relevant history, relationships, health and social context without treating a hypothesis as fact.", "Identify strengths, protective factors and what has helped, even briefly.", "State a small number of tentative links that explain the current difficulty.", "Check the account with the client, identify what does not fit and revise it.", "Use the shared account to choose one proportionate next step, then review its effect."], "goal_setting": ["Use the client’s own words and priorities.", "Make goals observable and meaningful without turning them into performance demands.", "Agree what progress would look like to the client and when to review it."], "tracking": ["Ask whether the client experiences change, not only whether a score moved.", "Use validated measures only when trained and when they fit the referral question.", "Document limitations, context and actions prompted by findings."], "measurement_note": "This foundations guide does not prescribe a diagnostic battery. Measure selection, administration and interpretation require suitable training, permission and local service guidance.", "case_history_intro": "A case history is a focused conversation that helps the practitioner understand the client’s priorities, context, functioning and support needs. It is not an interrogation or a checklist to complete at any cost. Explain why sensitive questions may be relevant, invite the client to pause or decline, and return to unanswered topics only when useful and agreed.", "case_history_domains": [{"name": "Referral and purpose", "focus": "Who initiated the contact, what question or concern prompted it, and what the client understands about the referral. Clarify the practitioner’s role and the limits of the service.", "prompt": "“What would you most like help with, and what feels important for me to understand first?”", "example": "Client says they booked after several weeks of poor sleep. A family member encouraged the appointment, but the client wants to decide what to discuss."}, {"name": "Current concern and timeline", "focus": "The client’s own description, onset, course, frequency, intensity, triggers, exceptions, impact and what they have already tried. Ask what has changed recently and what remains uncertain.", "prompt": "“When did you first notice this? What tends to make it easier or harder?”", "example": "Client reports difficulty falling asleep on work nights for about six weeks, with less difficulty on days off."}, {"name": "Daily functioning and needs", "focus": "Effects on relationships, work or study, self-care, sleep, appetite, energy, concentration, responsibilities and valued activities. Consider disability, access and communication needs.", "prompt": "“What has this changed in an ordinary day?”", "example": "Client is still attending work but has stopped meeting friends after evening shifts."}, {"name": "Health and previous support", "focus": "Relevant physical health, medication and supplements, substance use, past and current mental health support, previous assessments, helpful or unhelpful care, and whether medical review may be appropriate. Ask within role and competence.", "prompt": "“Have health changes, medicines, alcohol or other substances affected this recently?”", "example": "Client reports a recent change in medication and agrees to contact the prescriber. The practitioner does not infer causation."}, {"name": "Development, education and work", "focus": "Ask about developmental, learning, education and work experiences only where relevant to the referral question or client’s goals. Avoid assuming that a past difficulty explains a current concern.", "prompt": "“Is there anything from school, training or work that you think helps me understand what is happening now?”", "example": "Client describes longstanding difficulty concentrating in noisy settings and says quiet rooms help."}, {"name": "Relationships, family and social context", "focus": "Current household and important relationships, caregiving, family history relevant to the concern, social connection, housing, finances, legal or migration pressures, discrimination and support. Do not collect names or identifying details unless necessary.", "prompt": "“Who feels supportive at the moment? Is anything in your living situation affecting how safe or settled you feel?”", "example": "Client identifies a trusted friend and worries about housing costs. No family member is contacted without appropriate consent or another lawful basis."}, {"name": "Culture, identity, values and spirituality", "focus": "The client’s own language for the concern, cultural and community context, identity, faith or spirituality, values, and experiences of stigma or exclusion. Ask with curiosity and do not treat identity as an explanation by itself.", "prompt": "“Are there cultural, family, faith or community perspectives you would like me to keep in mind?”", "example": "Client says prayer and a community group are important sources of support, while also describing concerns they prefer to discuss privately."}, {"name": "Strengths, coping and hopes", "focus": "What the client values, has managed before, finds meaningful, and wants to protect or build on. Include practical resources and the client’s own ideas about what would count as progress.", "prompt": "“What has helped you get through difficult moments, even a little?”", "example": "Client says a regular morning walk and one supportive colleague make the week more manageable."}, {"name": "Safety and safeguarding", "focus": "Ask directly and sensitively about relevant immediate safety concerns, harm to self or others, abuse, coercion, neglect or risks to dependants. Consider context, protective factors, uncertainty and next actions. Complete a fuller risk assessment when indicated and follow local policy.", "prompt": "“Given what you have shared, I ask everyone about safety. Have you recently thought about harming yourself or someone else, or felt unsafe because of another person?”", "example": "Client denies current thoughts of self-harm but describes a recent episode of feeling unable to cope. The practitioner clarifies timing, context, support and next steps rather than relying on the denial alone."}], "case_history_documentation": ["Separate the client’s account, information from another source, direct observation and practitioner interpretation.", "Use the client’s own words for key concerns where useful, and identify the source and date of collateral information.", "Record relevant positives, relevant negatives, unanswered questions, uncertainty, consent and any agreed follow-up.", "Avoid copying sensitive details that are not needed for the purpose of care. Use the approved record system, access controls and retention rules for the service and jurisdiction."], "mse_intro": "The mental status examination is a time-limited description of relevant current mental functioning based on interview and observation. It complements the case history. It does not establish a diagnosis by itself, and it should be proportionate to the referral question, the practitioner’s training and the client’s communication context.", "mse_domains": [{"name": "Appearance and presentation", "assess": "Describe only relevant, observable features such as clothing, grooming, apparent physical comfort and whether these differ from the person’s usual presentation if known. Do not infer character, diagnosis, poverty or culture from appearance.", "prompt": "Observe respectfully; if a detail matters, ask rather than assume.", "example": "“Wearing work uniform; clothing clean and appropriate for the weather. Appeared tired.”"}, {"name": "Behaviour, engagement and attitude", "assess": "Describe interaction, cooperation, eye contact when relevant, rapport, guardedness, willingness to engage and any behavior that affects the interview. Account for culture, neurodiversity, trauma, disability, language and personal preference.", "prompt": "“Would you like a different pace, more explanation, or a break?”", "example": "“Engaged throughout; looked away while thinking and responded to questions.” Avoid labelling this as evasive without evidence."}, {"name": "Alertness and consciousness", "assess": "Note whether the person appears alert and able to participate, or unusually drowsy, confused or fluctuating. A sudden or marked change may require prompt medical assessment under local procedures.", "prompt": "If participation is difficult, check immediate physical wellbeing and seek appropriate support.", "example": "“Alert and responsive throughout the meeting.”"}, {"name": "Motor activity", "assess": "Describe pace and observable movement, such as stillness, restlessness, slowing, tremor or repeated movement. Record onset or context if known; do not treat one sign as diagnostic.", "prompt": "Observe over the conversation and ask about discomfort when appropriate.", "example": "“Shifted position frequently and tapped one foot while discussing work.”"}, {"name": "Speech and communication", "assess": "Describe rate, volume, amount, articulation, fluency, latency and whether responses were easy to follow. Distinguish communication differences, language access or hearing needs from a presumed symptom.", "prompt": "“Would an interpreter, written prompt or quieter space make this easier?”", "example": "“Speech clear and coherent, with pauses before answering questions about sleep.”"}, {"name": "Mood and affect", "assess": "Mood is the person’s reported emotional state. Affect is the observed emotional expression, including range, intensity, stability and fit with the conversation. Record both separately and note the client’s own words.", "prompt": "“How would you describe your mood recently?”", "example": "“Client described mood as ‘worn out’. Affect appeared subdued and became brighter when discussing a friend.”"}, {"name": "Thought process", "assess": "Describe how ideas are connected and expressed, including coherence, organization, pace and goal direction. Use technical terms only when they accurately fit what was observed and can be explained.", "prompt": "Ask the client to describe a recent event or concern in their own way.", "example": "“Responses were relevant and generally linear; returned to the concern about work several times.”"}, {"name": "Thought content", "assess": "Record themes or beliefs the client reports, including preoccupation, intrusive thoughts, unusual beliefs or thoughts of harm when relevant. Attribute the content to the client and explore meaning, conviction, distress and impact without arguing or prematurely labelling.", "prompt": "“What has been occupying your mind most?” For safety concerns, ask clear follow-up questions and complete a separate risk assessment as indicated.", "example": "“Client worries that a colleague is critical of their work; they are unsure whether this is accurate and have not raised it with the colleague.”"}, {"name": "Perception", "assess": "Ask about unusual sensory experiences when relevant. Describe the experience in the client’s words, including modality, timing, context, distress, impact and the client’s own understanding. Consider sleep, health, substances and cultural context.", "prompt": "“Have you noticed any experiences, such as hearing or seeing things, that others around you do not seem to notice?”", "example": "“No unusual perceptual experiences reported in this interview.” Use only when asked or otherwise adequately assessed."}, {"name": "Cognition", "assess": "Consider orientation, attention, concentration, memory, language and other cognitive functions only as relevant. Record the task or question used and the conditions. Screening tools require appropriate training; do not infer overall intelligence from a brief conversation.", "prompt": "Check whether fatigue, distress, language, hearing, vision, medication or the setting affected performance.", "example": "“Followed the conversation and recalled the agreed next step. Formal cognitive testing was not undertaken.”"}, {"name": "Insight and understanding", "assess": "Describe the person’s understanding of their experiences, needs, possible explanations and options. Avoid global grades such as “good” or “poor” without examples.", "prompt": "“What do you make of what has been happening, and what kind of help feels useful?”", "example": "“Client links increased worry with recent workload and is open to reviewing sleep and work stress.”"}, {"name": "Judgment and decision-making", "assess": "Describe decision-making only where relevant, with a specific example and context. Do not equate disagreement, risk-taking or an unfamiliar choice with impaired judgment. Consider capacity and legal duties only within relevant training and jurisdiction.", "prompt": "Explore how the person weighed options and what support they want with decisions.", "example": "“Client considered two ways to request a workload review and chose to discuss the options with their manager.”"}], "mse_documentation_rules": ["Describe before interpreting. Use observable language and the client’s own words where helpful.", "State what was assessed, what was not assessed and any limits such as language access, fatigue, distress, remote connection or time.", "A single behavior does not establish a disorder. Compare with context and, when relevant, the person’s usual functioning.", "Thoughts of harm recorded in the MSE do not replace a fuller assessment of immediacy, intent, plans, access, context, protective factors and actions.", "Do not assign a global low, medium or high risk label as a prediction. Focus on needs, immediate and longer-term safety, support and action, in line with local guidance."], "mse_note_example": "Presentation: Clean work clothes; appeared tired. Behaviour: Engaged, with brief pauses before answering questions about sleep. Speech: Clear, normal volume, slightly slowed. Mood: “Worn out”; affect subdued and reactive. Thought process: Relevant and generally linear. Thought content: Worry about work performance; no unusual belief elicited in the topics explored. Perception: No unusual perceptual experience reported when asked. Cognition: Followed the discussion and recalled the agreed next step; no formal cognitive testing undertaken. Insight: Linked increased worry with recent workload. Judgment: Considered options for requesting a work review. Scope: This is a description from one meeting, not a diagnosis or a complete risk assessment.", "mse_vague_revision": {"vague": "“Client seemed strange and had poor judgment.”", "clear": "“Client paused for several seconds before answering, then described feeling watched at work. They were unsure what might explain the experience. When discussing next steps, they considered contacting a trusted colleague and chose to wait until after the meeting.”", "why": "The revised note separates observed behavior, client report and a specific decision. It avoids a stigmatizing label and leaves interpretation open."}, "practice_case": {"title": "Practice case: Sam’s first appointment", "text": "Sam, an adult client, attends after a referral for reduced sleep and missed deadlines. Sam says, “My mind keeps going over everything I might have done wrong.” They speak clearly, pause before answering, and remain engaged. They describe feeling “tense and tired”. They report no unusual sensory experiences when asked. They can outline a recent work meeting in sequence and identify a supportive sibling. Sam has not yet been asked about self-harm, medication, substance use or recent health changes. Write a short case-history summary and MSE. Mark what is known, what remains unasked, and what needs follow-up. Do not infer a diagnosis or risk level."}, "practice_answer": {"title": "Suggested learning points", "text": "A careful response can describe Sam’s report of reduced sleep, repetitive worry and missed deadlines, alongside the observable pauses and continued engagement. It can note the sequence of the meeting, the stated tension and tiredness, the relevant response about perception, and the identified sibling support. It should explicitly state that safety, medication, substance use and health changes remain unassessed, then identify appropriate follow-up questions and supervision or referral needs. There is not enough information to diagnose or characterize risk."}, "further_reading": [{"label": "Mental Status Examination, StatPearls, NCBI Bookshelf", "url": "https://www.ncbi.nlm.nih.gov/books/NBK546682/"}, {"label": "Self-harm: assessment, management and preventing recurrence, NICE NG225, UK guidance", "url": "https://www.nice.org.uk/guidance/ng225/chapter/recommendations"}]}, "techniques": [{"name": "Consent and confidentiality conversation", "level": "foundation", "purpose": "Create a transparent, understandable basis for collaboration before sensitive information is collected.", "when": "At the start of work and whenever the service, risk, information sharing or plan changes.", "steps": ["Explain the practitioner’s role, the service and what sessions may involve.", "Describe privacy, record keeping and the limits that apply in this setting.", "Check the client’s understanding and invite questions or concerns.", "Ask what would help the client feel informed and in control.", "Record consent, questions and any agreed adjustments."], "prompts": ["“What would you like to understand about privacy before we begin?”", "“Could I check how that explanation sounded to you?”"], "caution": "Do not use a generic legal statement as a substitute for the applicable local explanation."}, {"name": "Reflect, clarify and summarise", "level": "foundation", "purpose": "Help the client feel heard, clarify meaning and agree a shared focus without rushing to advice.", "when": "Throughout sessions, especially when the account is complex or emotion is strong.", "steps": ["Listen for content, feeling, meaning and what matters to the client.", "Reflect one point in tentative language.", "Pause and allow correction.", "Ask an open question only when it helps the client continue.", "Summarise the shared understanding and check what should happen next."], "prompts": ["“It sounds as though the meetings take a lot out of you. Have I understood?”", "“What feels most important for us to focus on today?”"], "dialogue": [{"speaker": "Client", "line": "I keep cancelling. Maybe I am just lazy."}, {"speaker": "Counsellor", "line": "You have been pulling back after difficult workdays, and you are judging yourself for it. What is it like when you decide to cancel?"}]}, {"name": "Direct safety enquiry", "level": "foundation", "purpose": "Understand immediate safety concerns and guide proportionate next steps.", "when": "At intake and whenever presentation, disclosure or context indicates a need to check safety, following local protocol.", "steps": ["Explain why the questions matter and ask directly in calm, plain language.", "Clarify timing, intent, planning, access, recent actions and relevant history as indicated.", "Ask about risk from other people and the safety of children or dependants when relevant.", "Explore protective factors and immediate practical needs.", "Consult and act through the local pathway, name who will do what and when, and document."], "prompts": ["“Have you had thoughts about harming yourself?”", "“Are you safe to return to where you are staying today?”"], "caution": "If danger is immediate, follow local emergency procedures. Do not rely on a no-harm promise or a risk score as the intervention."}, {"name": "Repairing a relationship strain", "level": "foundation", "purpose": "Address a possible mismatch or rupture openly, reduce defensiveness and restore collaboration where possible.", "when": "When the client gives direct feedback or the practitioner notices a change in engagement, trust or participation.", "steps": ["Describe the observation without blame.", "Invite the client’s account and listen without defending the original choice.", "Acknowledge impact, even when intent differed.", "Ask what would feel more useful or safer now.", "Agree a change, check whether further repair is needed and take the issue to supervision."], "prompts": ["“I may have moved too quickly earlier. How did that land for you?”", "“What would you like me to do differently now?”"], "caution": "Do not press for reassurance or ask the client to take care of the practitioner’s feelings."}, {"name": "Building a shared formulation", "level": "foundation", "purpose": "Organise information into a tentative explanation that can guide a useful and reviewable next step.", "when": "After enough relevant information has been gathered, and again as understanding changes.", "steps": ["Ask permission to share a possible pattern.", "Use the client’s language and specific examples.", "Separate what is known from what is a question or hypothesis.", "Invite the client to correct, reject or add to the account.", "Link the working idea to one agreed action and a review point."], "prompts": ["“I have a possible link in mind. Would it be useful to see whether it fits for you?”", "“What have I missed or got wrong?”"], "caution": "A formulation is not a diagnosis and should not be presented as a settled explanation."}], "technique_selection": {"table": [{"target": "Unclear expectations or uncertainty about privacy", "techniques": ["Role and consent conversation", "Check understanding", "Document agreement"]}, {"target": "Immediate safety concern", "techniques": ["Direct risk enquiry", "Collaborative safety planning", "Local escalation and consultation"]}, {"target": "Client feels unheard or overwhelmed", "techniques": ["Reflection", "Pacing", "Summary and focus check"]}, {"target": "Possible rupture or disagreement", "techniques": ["Name the observation gently", "Invite the client’s view", "Acknowledge impact and repair"]}, {"target": "Complex or fragmented information", "techniques": ["Structured intake", "Descriptive MSE when indicated", "Tentative shared formulation"]}, {"target": "Uncertainty about scope or next step", "techniques": ["Pause", "Consult supervisor or specialist", "Refer or transfer with continuity"]}]}, "problem_applications": [{"problem": "Work stress and withdrawal", "maintaining_cycle": ["Work meetings feel difficult and Noor anticipates being judged.", "Noor stays quiet and later replays the meeting, but the meaning of colleagues’ responses remains uncertain.", "Poor sleep may make the next workday harder.", "Cancelling plans offers short-term relief but reduces supportive contact."], "priority_techniques": ["Ask Noor what they want from counselling and what feels safe to explore now.", "Reflect the self-criticism without endorsing it.", "Assess sleep, functioning and safety as indicated.", "Co-create a small step Noor chooses, then review what happened."], "pitfall": "Do not assume a diagnosis, cause, cultural meaning or readiness to discuss family history."}, {"problem": "Possible safeguarding concern", "maintaining_cycle": ["The client’s account may indicate current danger, coercion or risk to a dependant.", "Privacy and safety needs may conflict with routine contact or disclosure practices."], "priority_techniques": ["Ask privately and directly, using the local safeguarding process.", "Check whether contacting another person or leaving a message could increase danger.", "Consult the designated safeguarding lead and document decisions and ownership."], "pitfall": "Do not promise secrecy or make a disclosure plan without considering the client’s immediate safety and local duties."}, {"problem": "A mismatch in expectations", "maintaining_cycle": ["The practitioner’s agenda may differ from what the client considers useful.", "The client may comply, withdraw or miss sessions rather than disagree openly."], "priority_techniques": ["Ask what the client hoped would happen.", "Acknowledge the mismatch and renegotiate goals or referral options.", "Review whether the current service is the right fit."], "pitfall": "Do not interpret quiet agreement as informed consent or progress."}], "session_structure": {"single_session": ["Confirm the client’s current needs, privacy and any urgent safety concern.", "Check what has happened since the last meeting and review agreed actions.", "Agree a focus and how the client would like to use the time.", "Explore the issue at the client’s pace, using reflection and clarification.", "Summarise what is understood, including uncertainty and strengths.", "Agree a next step, responsibility and timing.", "Ask for feedback and check how the client is leaving the session."], "course": ["Orientation and working agreement, with ongoing consent and review.", "Assessment and shared goals, paced to the client’s needs and role requirements.", "Collaborative work guided by an agreed formulation or service plan.", "Review progress, safety, fit and barriers; adapt or consult where needed.", "Planned ending, referral or transfer with continuity and clear records."], "ending_script": ["“What are you taking away from today?”", "“Is there anything important we have not covered before we finish?”", "“What is the next step, and who will follow up?”"]}, "worked_case": {"client": "Noor, an adult referred by a primary care service.", "presenting_problem": "Noor says work meetings have become difficult and they have started cancelling plans with friends. They sleep poorly and are unsure whether counselling will help. Noor wants practical support and does not want to discuss earlier family experiences at the first meeting. The practitioner does not assume diagnosis, risk level, culture or cause.", "goals": ["Understand what Noor hopes practical support will change.", "Establish consent, privacy expectations and a pace Noor can accept.", "Clarify sleep, work impact, social withdrawal, relevant health context and safety.", "Agree one small next step and a review point."], "sessions": [{"session": "1", "focus": "Role, consent, initial priorities and safety", "highlights": "The practitioner explains confidentiality limits, checks understanding, asks what Noor wants from counselling and explores current functioning. Noor’s wish not to discuss family history is respected."}, {"session": "2", "focus": "A recent meeting and its effects", "highlights": "Noor describes a meeting, self-critical thoughts and replaying the event. The practitioner reflects, checks accuracy and asks what would be useful to explore."}, {"session": "3", "focus": "Shared formulation and next step", "highlights": "The pair consider whether anticipation, silence and replaying may be linked. Noor corrects one assumption and chooses a small experiment in speaking once during a meeting."}, {"session": "Review and adjust", "focus": "What changed and what remains difficult", "highlights": "The practitioner asks what Noor learned, reviews sleep and safety, and revises the formulation if the experiment did not fit."}], "dialogue": [{"speaker": "Counsellor", "line": "What would make these meetings useful for you, even if we do not talk about family history today?"}, {"speaker": "Noor", "line": "I want to stop feeling so tense at work and maybe see my friends again."}, {"speaker": "Counsellor", "line": "We can start with what is happening at work and keep checking whether the pace feels right. Would it help to look at one recent meeting?"}], "setback": "Noor cancels the next appointment. The practitioner follows the agreed contact plan, avoids a blaming message, and uses supervision to consider whether the service or appointment arrangements need adjustment.", "outcome": "The case is a teaching example, not a promised outcome. Learners should identify missing information and explain what they would consult or assess before deciding on care."}, "tools": [{"name": "Consent conversation checklist", "level": "foundation", "purpose": "Support a clear first conversation; it does not replace local consent forms or legal advice.", "when": "At intake and when arrangements change.", "fields": ["Role and qualifications accurately described", "Service purpose and likely process", "Voluntary choice and right to ask questions or stop", "Confidentiality and its limits", "Records, access, storage and information sharing", "Fees, cancellation, contact and remote-session arrangements", "Client understanding, questions and agreed adjustments"], "example": "Ask the client to explain in their own words what they understand about privacy and how to contact the service."}, {"name": "Structured intake map", "level": "foundation", "purpose": "Keep assessment relevant, collaborative and paced.", "when": "At intake and during review when relevant information is missing.", "fields": ["Client’s priorities and hoped-for change", "Presenting concern and recent example", "Impact and functioning", "Health and previous support", "Relationships and social context", "Strengths and resources", "Safety and safeguarding", "Preferences, access needs and next steps"]}, {"name": "Brief formulation map", "level": "foundation", "purpose": "Record a shared working idea and make uncertainty visible.", "when": "When sufficient information is available to guide a next step.", "fields": ["Situation and context", "Client’s meaning or thoughts", "Emotion and bodily response", "Action, avoidance or coping", "Short-term and longer-term effects", "History or context that may matter", "Strengths and exceptions", "Hypothesis to check", "Client’s corrections", "Agreed next step and review date"]}, {"name": "Supervision preparation", "level": "foundation", "purpose": "Bring a focused, anonymised question to supervision.", "when": "When risk, scope, uncertainty, stuckness or practitioner response needs review.", "fields": ["What is known, reported and observed", "Immediate safety and actions already taken", "The question I need help answering", "My uncertainty or emotional response", "Relevant policy or rule checked", "Decision needed, owner and deadline"]}], "troubleshooting": [{"if": "The client asks whether everything will remain secret", "try": "Clarify the question behind the concern, explain limits in plain language and check understanding. Do not promise absolute secrecy."}, {"if": "The client does not want to answer a question", "try": "Acknowledge the choice, explain why the information may matter, offer a pause or different wording, and assess what can be done safely with what is known."}, {"if": "The practitioner feels pulled to give advice quickly", "try": "Pause, reflect the client’s concern, ask what kind of help they want and consult if the request exceeds role or competence."}, {"if": "A formulation does not fit", "try": "Treat this as useful feedback. Ask what is missing, revise the hypothesis and avoid defending it."}, {"if": "A referral is recommended", "try": "Explain the reason and options, discuss access barriers and consent, clarify who will make contact and how continuity will be maintained."}, {"if": "The client misses an appointment", "try": "Follow the agreed contact and welfare policy. Use neutral language and consider access, safety and service fit rather than assuming motivation."}], "troubleshooting_added": false, "cultural_adaptation": ["Ask how the client describes their identity, family, community, faith, language and priorities; do not infer these from appearance or background.", "Consider power, discrimination, migration, poverty, disability, caregiving and access barriers as possible parts of context, not individual deficits.", "Offer qualified interpreters and accessible formats where available. Do not use family members as interpreters for sensitive assessment when safer alternatives are possible.", "Check whether an intervention, safety plan or contact method could create risk in the client’s home or community.", "Invite correction and consultation when the practitioner’s assumptions or limits may affect care."], "cultural_adaptation_added": false, "ethics_referral": ["**Professional scope:** Verify protected titles, registration, qualification and practice requirements with the regulator for the exact role and location. A resource list is a starting point, not an eligibility decision.", "**United States:** Psychology licences are issued by state and territorial boards. Use the [ASPPB board directory](https://asppb.net/contact-licensing-board/) to locate the responsible board and check its rules. Counsellor, therapist and social-work credentials have separate state-specific boards. A federal provider identifier is not a professional licence.", "**United Kingdom:** Practitioner psychologist titles, including counselling psychologist, are regulated by the [HCPC register](https://www.hcpc-uk.org/check-the-register/). Counselling and psychotherapy may use voluntary professional registers. Check the [P
