ation (rapport, the Meta Model, the Milton Model), of subjective experience (representational systems, submodalities, strategies) and a large set of structured change techniques. For professional practice the evidence matters: a [Sturt and colleagues, 2012 systematic review](https://pmc.ncbi.nlm.nih.gov/articles/PMC3481516/) found little evidence that NLP interventions improve health outcomes, largely because studies were few and of poor quality, and some of NLP’s specific claims have not held up when tested. This module therefore treats NLP as a toolkit of communication and experiential methods that a trained psychologist or counsellor may integrate, with consent and within a sound formulation, alongside evidence-based treatments. It is not a stand-alone therapy for mental health conditions, and it is not a certification or a substitute for supervised training.", "diagram_id": "nlp-comm"}, "when_to_use": {"indications": ["**Communication and rapport:** strengthening the working alliance, especially when conversations feel stuck or the practitioner and client keep missing each other.", "**Clarifying goals:** turning a vague complaint into a specific, positively stated outcome the client can act on.", "**Vague or absolute language:** “I always fail”, “they make me anxious”, where precise questions can open up options.", "**Performance confidence:** presentations, interviews or examinations, as an adjunct to graded practice and skills work.", "**Interpersonal difficulty:** seeing a conflict from more than one viewpoint before a hard conversation.", "**Mild, specific fears:** as an adjunct to exposure-based treatment, where the client consents and the practitioner is competent."], "populations": ["Adults in counselling and psychological practice, where NLP methods are woven into an established approach.", "Clients who prefer imagery-based, experiential or language-focused ways of working.", "Settings focused on wellbeing, adjustment, communication and performance rather than treatment of a diagnosed disorder."], "cautions": ["**Not a first-line treatment for a mental health condition.** For depression, anxiety disorders, OCD and PTSD, offer or refer for an evidence-based treatment first; NLP methods can only be adjuncts.", "**Trauma memories:** do not use rewind, timeline or memory-changing techniques for trauma outside a trained, structured protocol and appropriate supervision. Trauma-focused CBT and EMDR are the recommended first-line treatments for PTSD in major guidelines.", "**Risk first:** active suicidal thoughts, self-harm, psychosis, mania, intoxication or acute crisis need assessment and a safety plan, not technique work.", "**Dissociation and imagery:** clients with marked dissociation, or who find imagery overwhelming, may be harmed by dissociative or trance-based exercises; choose grounded methods.", "**Pain and physical symptoms:** never use dissociation techniques to mask pain or symptoms that have not been medically assessed.", "**Hypnotic language and trance work** need separate training and explicit consent."]}, "core_concepts": [{"name": "The map is not the territory", "originator": "Alfred Korzybski; adopted by Bandler and Grinder", "level": "foundation", "definition": "People respond to their internal representation of events, not to the events directly. Two people can live through the same event and build very different maps of it.", "components": ["A map is useful when it helps the person get where they want to go, not because it is “true”.", "Respecting the client’s map comes before helping them widen it.", "Language is part of the map: words point to experience but are not the experience."], "diagram_id": "", "illustration": "A client says the meeting was “a disaster”. Exploring the map shows one critical comment, two neutral ones and a decision that went the client’s way."}, {"name": "The NLP communication model", "originator": "NLP teaching model", "level": "foundation", "definition": "Information from the senses passes through filters (values, beliefs, memories, language) that delete, distort and generalise it. The result is an internal representation that shapes state, physiology and behaviour.", "components": ["**Deletion:** selective attention; much is left out.", "**Distortion:** meaning is added or changed.", "**Generalisation:** one experience comes to stand for a whole category.", "**State:** the person’s overall emotional and physical condition in the moment."], "diagram_id": "nlp-comm", "illustration": "After one rejected application, a client concludes “no one will ever hire me” (generalisation) and stops noticing positive feedback (deletion)."}, {"name": "Working presuppositions", "originator": "NLP trainers", "level": "foundation", "definition": "A set of working assumptions that guide NLP practice, for example: every behaviour has a positive intention; there is no failure, only feedback; the meaning of a communication is the response it gets; people have the resources they need. They are attitudes to try on, not facts.", "components": ["Useful for curiosity and respect: asking what a behaviour is trying to achieve.", "Harmful if used to dismiss real harm or structural barriers: “no failure” must not become “your distress is your fault”.", "Hold them lightly and drop them when they do not serve the client."], "diagram_id": "", "illustration": "Asking “what is drinking at night doing for you?” invites curiosity about relief and connection, without approving the harm."}, {"name": "Rapport, pacing and leading", "originator": "Bandler and Grinder, drawing on Erickson and Satir", "level": "foundation", "definition": "Rapport is a sense of connection and trust. Pacing means accurately meeting the client where they are, in pace, tone and language; leading means gently inviting a new direction once the client feels understood.", "components": ["Match pace and energy respectfully; obvious mimicry damages trust.", "Use the client’s own words for their difficulties and goals.", "Lead only toward the client’s chosen outcome, never toward the practitioner’s agenda."], "diagram_id": "", "illustration": "With a client speaking slowly and quietly, the practitioner slows down first, then gradually brings more energy as the client begins to describe what they want."}, {"name": "Calibration and sensory acuity", "originator": "NLP", "level": "foundation", "definition": "Calibration is noticing a particular person’s observable changes (breathing, posture, colour, voice, words) and linking them to their reported states, then checking, rather than assuming what they mean.", "components": ["Calibrate to this client, not to general rules about body language.", "Always check: “I noticed your breathing changed just then. What was happening for you?”", "Eye-movement “accessing cues” are not reliable; [Wiseman and colleagues, 2012](https://pmc.ncbi.nlm.nih.gov/articles/PMC3394779/) found eye movements do not indicate lying."], "diagram_id": "", "illustration": "The practitioner notices that the client’s shoulders rise each time their manager is mentioned and asks about it, instead of interpreting it."}, {"name": "Representational systems and sensory language", "originator": "Bandler and Grinder", "level": "foundation", "definition": "People represent experience through seeing, hearing, feeling, smelling, tasting and inner talk, and their words often reflect this (“I see what you mean”, “that rings a bell”, “it feels heavy”). Matching a client’s sensory language can support understanding.", "components": ["**Visual, auditory, kinaesthetic, olfactory, gustatory, and inner dialogue.**", "The original claim that each person has one fixed preferred representational system, detectable from words or eye movements, was not supported by research in the 1980s.", "Do not label or type clients as “visual” or “kinaesthetic”; simply notice and use their words in context."], "diagram_id": "", "illustration": "A client says “I can’t see a way forward.” The practitioner asks, “If a way forward became a little clearer, what might you see first?”"}, {"name": "Submodalities", "originator": "Richard Bandler", "level": "advanced", "definition": "The finer qualities of an inner representation: for an image, its size, brightness, colour, distance and movement; for a sound, its volume, tone and location; for a feeling, its intensity, temperature and place in the body.", "components": ["Changing a quality (for example making an image smaller or more distant) sometimes changes how intense the experience feels.", "This is a subjective, experiential method; effects vary and are not guaranteed.", "Explain it as an experiment and check its effect with a rating."], "diagram_id": "", "illustration": "A client imagines a critical voice further away and quieter, and reports their tension falling from 7 to 5 out of 10."}, {"name": "States and anchoring", "originator": "NLP, drawing on classical conditioning", "level": "foundation", "definition": "A state is a person’s overall emotional and physical condition. An anchor is a cue (a word, image or touch chosen by the client) that, through repeated pairing, helps the client recall a resourceful state.", "components": ["Anchors are learned associations and need practice; they are not instant switches.", "The client chooses the cue; any touch needs explicit consent and is usually best self-applied.", "An anchor supports skills; it does not replace exposure, problem solving or safety planning."], "diagram_id": "", "illustration": "Before presentations a client presses thumb and finger together while recalling a calm, confident memory, practised daily for two weeks."}, {"name": "The Meta Model", "originator": "Bandler and Grinder, 1975", "level": "foundation", "definition": "A set of question patterns that recover information lost through deletion, distortion and generalisation in everyday speech, helping the client build a fuller and more flexible map.", "components": ["**Deletions:** simple deletions, unspecified people, comparisons without a standard, unspecified verbs, nominalisations.", "**Generalisations:** universal words (always, never, everyone) and modal operators (must, can’t, should).", "**Distortions:** mind reading, cause and effect, complex equivalence (A means B), lost performatives (judgements without a source), presuppositions.", "Use sparingly and warmly; strings of challenges feel like interrogation."], "diagram_id": "nlp-meta", "illustration": "“He makes me so angry.” “What does he do, specifically, and what happens in you just before the anger?”"}, {"name": "The Milton Model", "originator": "Bandler and Grinder, modelling Milton Erickson", "level": "advanced", "definition": "Deliberately general, permissive language (for example “you may notice…”) that leaves room for the client to fill in their own meaning, used in relaxation, imagery and hypnosis.", "components": ["Use only with the client’s knowledge and consent, and with appropriate hypnosis training.", "Never use embedded commands, confusion or double binds to influence a client without their awareness.", "Keep it to inviting choice, never to reducing it."], "diagram_id": "", "illustration": "In a consented relaxation exercise: “And as you settle, you might notice which part of you feels calmest first.”"}, {"name": "Reframing", "originator": "NLP, drawing on family therapy", "level": "foundation", "definition": "Changing the frame around an experience so its meaning or usefulness shifts. **Content reframing** asks what else something could mean; **context reframing** asks where the same behaviour would be useful.", "components": ["A reframe must be believable to the client and offered tentatively.", "It never minimises harm or tells the client how to feel.", "Related: six-step reframing, which works with the positive intention behind a behaviour."], "diagram_id": "", "illustration": "“I’m too stubborn.” “Where has that determination helped you?” The client links it to finishing a hard degree."}, {"name": "Perceptual positions", "originator": "John Grinder and Judith DeLozier", "level": "foundation", "definition": "Viewing a situation from first position (one’s own view), second position (imagining the other person’s view) and third position (a neutral observer).", "components": ["Second position is an act of imagination, not mind reading; check it against what the other person actually says.", "Third position supports calmer problem solving.", "Avoid second position with an abusive person if it encourages self-blame or excusing harm."], "diagram_id": "nlp-positions", "illustration": "Before a difficult talk with her sister, a client notices from third position that both of them are frightened of being left out."}, {"name": "Logical levels", "originator": "Robert Dilts, after Gregory Bateson", "level": "advanced", "definition": "A framework that organises change at the levels of environment, behaviour, capabilities, beliefs and values, identity and purpose, to locate where a difficulty sits.", "components": ["A practical heuristic for formulation conversations, not a tested psychological theory.", "A problem at one level often needs work at the level above it.", "Keep identity statements respectful and open to change."], "diagram_id": "nlp-levels", "illustration": "A client has the skills (capability) but holds “people like me don’t lead” (identity), so skills practice alone has not helped."}, {"name": "Strategies, modelling and meta programmes", "originator": "NLP; TOTE model from Miller, Galanter and Pribram", "level": "advanced", "definition": "A strategy is the sequence of inner and outer steps a person runs to do something; modelling studies how someone does something well. Meta programmes describe habitual patterns of attention, such as moving toward goals or away from problems.", "components": ["**TOTE:** Test, Operate, Test, Exit; a simple loop for describing how a person checks progress.", "Modelling: ask how someone achieves a result, step by step, then test the steps.", "Meta programmes are descriptive patterns that vary with context, not fixed personality types."], "diagram_id": "", "illustration": "A client who studies well at night is asked to describe the steps; she sets up the same cues for morning study."}, {"name": "Evidence and limits", "originator": "Research reviews", "level": "foundation", "definition": "NLP is widely used but weakly researched. The [Sturt and colleagues, 2012 systematic review](https://pmc.ncbi.nlm.nih.gov/articles/PMC3481516/) found little evidence of benefit for health outcomes, mostly because of few, low-quality studies. Specific claims about fixed representational systems and eye-movement cues have not been supported.", "components": ["Describe NLP methods to clients honestly as experiential techniques, not proven treatments.", "Some derived protocols are being studied: Reconsolidation of Traumatic Memories (RTM), developed from the visual-kinaesthetic dissociation technique, has shown promising early results in small trials, for example the [RTM feasibility trial, 2023](https://pmc.ncbi.nlm.nih.gov/articles/PMC10571284/), but it is not yet an established first-line treatment.", "Measure outcomes for every client and change course when NLP methods are not helping."], "diagram_id": "", "illustration": "A practitioner explains: “This is an imagery exercise some people find helpful. Research is limited, so we’ll rate how you feel before and after and decide together.”"}], "assessment_formulation": {"intake_guide": ["**Consent and expectations:** explain your role, confidentiality and its limits, and what NLP-informed work involves, including that the evidence for many NLP methods is limited.", "**The client’s concern in their own words:** what, since when, where and with whom, and what they have already tried.", "**Risk and safety:** self-harm, suicidal thoughts, harm to others, safeguarding concerns, substance use, and current safety.", "**Health and mental health history:** diagnoses, medication, trauma, dissociation, and any physical symptoms not yet assessed.", "**Suitability check:** does the problem call for an evidence-based treatment first? If so, offer or refer for it.", "**Desired outcome:** what the client wants instead, stated in the positive.", "**Resources:** times the client has managed well, supports, strengths and values."], "assess": ["**Present state:** a recent, specific example: what happened, what the client saw, heard, said to themselves and felt.", "**Language patterns:** absolutes, mind reads, cause and effect statements and missing detail worth exploring later.", "**Calibration baseline:** how this client looks and sounds when calm and when distressed.", "**Imagery and dissociation tolerance:** can the client imagine scenes comfortably and return to the room easily?", "**Context and ecology:** family, culture, work, finances and safety that any change has to fit.", "**Standard measures** for the presenting problem, chosen for the clinical question."], "key_questions": ["“What would you like instead?”", "“How will you know when this has changed? What will you see, hear and feel?”", "“When does this happen, specifically? When does it not happen?”", "“What stops you, right now?”", "“If this changed, what else in your life would be affected?”", "“What has helped before, even a little?”"], "risk_script": ["**Ask every session, directly and calmly:** “Since we last met, have you had thoughts of harming yourself or of not wanting to be alive?”", "**If yes:** ask about plans, intent, means and protective factors, follow local risk procedures, and pause all technique work until a safety plan is in place.", "**Before any imagery or dissociation exercise:** check current distress, grounding skills and that the client knows they can stop at any time."], "instruments": [{"name": "PHQ-9", "measures": "Depressive symptoms; any positive answer on the self-harm item needs a risk conversation the same session."}, {"name": "GAD-7", "measures": "Generalised anxiety symptoms."}, {"name": "Fear and avoidance rating (0-10)", "measures": "For a specific fear: how strong the fear is and how much the client avoids the situation."}, {"name": "Outcome rating (0-10)", "measures": "How close the client feels to their well-formed outcome, in their own terms."}], "instrument_note": "Choose measures for the clinical question. NLP has no validated measures of its own; use standard, validated tools and the client’s ratings to judge whether the work is helping.", "safety_plan": ["Agree a written safety plan whenever risk is present: warning signs, coping steps, people and places, professional and emergency contacts.", "Teach a simple grounding method before any imagery or dissociation work."], "formulation_steps": ["Describe the **present state** using a recent, specific example.", "Describe the **desired state** as a well-formed outcome.", "Note the **filters** at work: deletions, distortions and generalisations in the client’s account.", "Locate the difficulty using **logical levels**: environment, behaviour, capability, belief, identity.", "List **resources** and check the **ecology** of change.", "Agree an **approach**: evidence-based treatment, NLP-informed adjuncts, or referral."], "diagram_id": "nlp-outcome", "goal_setting": ["**Stated in the positive:** what the client wants, not what they want to stop.", "**Within the client’s influence:** something they can start and maintain.", "**Sensory evidence:** what they will see, hear and feel when it is achieved.", "**Context:** where, when and with whom.", "**Resources:** what they already have and what they need.", "**Ecology:** what might be lost or affected, and whether it is worth it.", "**First step:** small, specific and soon."], "tracking": ["Rate the main concern and the outcome each session (0-10).", "Before and after any technique, rate distress or confidence so the effect is visible.", "Review standard measures at agreed points and change course if there is no progress."], "measurement_schedule": [{"when": "Session 1 (baseline)", "measure": "Standard measure for the presenting problem, risk check, outcome rating (0-10).", "look_for": "A clear starting point; any risk item answered positively needs a risk conversation that session."}, {"when": "Every session", "measure": "Outcome rating and a brief risk check; before and after ratings for any technique.", "look_for": "Whether techniques are helping in practice, not only in the room."}, {"when": "Every four sessions", "measure": "Repeat the standard measure.", "look_for": "Little or no change: review the formulation, consider an evidence-based treatment and take it to supervision."}, {"when": "Ending", "measure": "Standard measure, outcome rating and a relapse-prevention plan.", "look_for": "Gains that hold in daily life, and a plan for setbacks."}], "measurement_note": "Ratings in the room can rise quickly after experiential exercises; check whether change holds between sessions before concluding a technique worked.", "added": true}, "techniques": [{"name": "Pacing and leading for rapport", "level": "foundation", "purpose": "To help the client feel understood before any change work, then to invite movement toward their chosen outcome.", "when": "Throughout, and especially at the start of work or when a conversation feels stuck.", "steps": ["Notice the client’s pace, volume, energy and key words.", "Match these respectfully and briefly reflect the client’s experience in their own words.", "Check understanding: “Have I got that right?”", "Once the client feels understood, gently shift pace or focus toward their outcome.", "If the client does not follow, return to pacing; the lead came too early."], "prompts": ["“So it’s been a long, heavy week, and you’re tired of feeling this way. Is that right?”", "“What would you like to be different, even a little?”"], "dialogue": [{"speaker": "Client", "line": "Nothing works. I’m just tired of it all.", "note": ""}, {"speaker": "Practitioner", "line": "You’ve tried a lot, and you’re worn out.", "note": "Pacing the client’s words and energy."}, {"speaker": "Client", "line": "Exactly. I just want some evenings that aren’t a fight.", "note": ""}, {"speaker": "Practitioner", "line": "Some evenings without a fight. What would one of those look like?", "note": "Leading toward a positive outcome."}], "if_client_says": [{"says": "“Are you copying me?”", "respond": "“I’m trying to keep up with how you’re seeing this. Tell me if I get it wrong.” Then match less obviously."}], "tip": "Rapport comes from accurate understanding; matching behaviour only helps when it is subtle and sincere.", "caution": "Never use rapport to steer a client toward the practitioner’s agenda or to influence them without their awareness.", "diagram_id": ""}, {"name": "Calibration and checking", "level": "foundation", "purpose": "To track a client’s state from observable cues and check meaning rather than assume it.", "when": "Throughout, and before and after every technique.", "steps": ["Note this client’s baseline: breathing, posture, colour, voice and words when calm.", "Notice shifts as topics change.", "Name what you notice neutrally and ask about it.", "Use what the client says, not the cue itself, to guide the next step."], "prompts": ["“I noticed you took a deep breath just then. What was happening for you?”", "“On a scale of 0 to 10, how strong is that feeling right now?”"], "dialogue": [], "if_client_says": [{"says": "“Nothing. Why?”", "respond": "“Just checking in. Let me know if something comes up.” Do not press."}], "tip": "Combine calibration with ratings so both of you can see change.", "caution": "Do not interpret eye movements or posture as proof of thoughts, honesty or personality.", "diagram_id": ""}, {"name": "Setting a well-formed outcome", "level": "foundation", "purpose": "To turn a complaint into a specific, positive and achievable goal that fits the client’s life.", "when": "Early in work, and whenever the direction becomes unclear.", "steps": ["Ask what the client wants instead.", "Check it is within their influence.", "Ask how they will know they have it: what they will see, hear and feel.", "Specify where, when and with whom.", "Identify resources they have and need.", "Run an ecology check: what might be lost, and who else is affected?", "Agree a small first step."], "prompts": ["“What would you like instead?”", "“How will you know you’ve got it?”", "“Is there any part of you that has doubts about this goal?”"], "dialogue": [{"speaker": "Client", "line": "I want to stop being so anxious at work.", "note": ""}, {"speaker": "Practitioner", "line": "If you weren’t so anxious, what would you be doing instead?", "note": "Positive outcome."}, {"speaker": "Client", "line": "Speaking up in team meetings.", "note": ""}, {"speaker": "Practitioner", "line": "How would you know you’d done that? What would you see and hear?", "note": "Sensory evidence."}], "if_client_says": [{"says": "“I just want them to change.”", "respond": "“That would help. While we can’t control them, what could you do differently that might make a difference?”"}], "tip": "Keep the outcome in the client’s words and write it down together.", "caution": "If the outcome conflicts with safety or someone else’s rights, explore that before any technique.", "diagram_id": "nlp-outcome"}, {"name": "Meta Model questioning", "level": "foundation", "purpose": "To recover missing detail and loosen absolute or distorted statements so the client sees more options.", "when": "When the client’s language is vague, absolute or assumes causes and other people’s thoughts.", "steps": ["Listen for one key pattern that matters to the problem.", "Ask one gentle, specific question.", "Reflect the fuller answer.", "Stop when the client has enough detail to act; do not challenge every pattern."], "prompts": ["Deletion: “Unhappy about what, specifically?”", "Universal: “Always? Has there been a time it didn’t happen?”", "Modal operator: “What would happen if you didn’t?” or “What stops you?”", "Mind reading: “How do you know what she thinks?”", "Cause and effect: “How does what he does lead to you feeling angry?”", "Lost performative: “Who says that? According to whom?”"], "dialogue": [{"speaker": "Client", "line": "Nobody at work respects me.", "note": ""}, {"speaker": "Practitioner", "line": "Nobody at all? Who in particular comes to mind?", "note": "Universal quantifier, then unspecified referential index."}, {"speaker": "Client", "line": "Well, my supervisor talks over me.", "note": ""}, {"speaker": "Practitioner", "line": "So it’s mainly your supervisor, in meetings. What happens when he talks over you?", "note": ""}], "if_client_says": [{"says": "“You’re picking at my words.”", "respond": "“You’re right, sorry. I’m trying to understand exactly what happens. Shall I slow down?” Repair, then ask fewer questions."}], "tip": "Soften questions with curiosity and tone; the same question can sound supportive or hostile.", "caution": "Never use Meta Model patterns to win an argument, confuse, or influence someone without their awareness.", "diagram_id": "nlp-meta"}, {"name": "Matching sensory language", "level": "foundation", "purpose": "To support understanding by using the same kind of sensory words the client uses.", "when": "Throughout, especially when explaining ideas or exploring goals.", "steps": ["Notice the client’s sensory words: see, look, hear, sounds, feel, grasp.", "Use similar words when you reflect or explain.", "If the client struggles to describe something, offer more than one sense: “What would you see, hear or feel?”"], "prompts": ["“How does that look to you now?”", "“What does that sound like when you say it to yourself?”", "“Where do you feel that in your body?”"], "dialogue": [], "if_client_says": [], "tip": "Treat this as good listening, not as a way of typing people.", "caution": "Research has not supported fixed “preferred representational systems”; do not label clients or plan treatment around a supposed type.", "diagram_id": ""}, {"name": "Content and context reframing", "level": "foundation", "purpose": "To widen the meaning of an experience or behaviour so new responses become possible.", "when": "When a client is stuck in one fixed meaning, after they feel heard.", "steps": ["Acknowledge the client’s meaning first.", "Ask what else it could mean (content reframe), or where the same behaviour is useful (context reframe).", "Offer a reframe tentatively, as a question.", "Check whether it fits; drop it if it does not."], "prompts": ["“What else could that mean?”", "“Where would that quality be an advantage?”", "“How might someone who cares about you see this?”"], "dialogue": [{"speaker": "Client", "line": "I’m so sensitive. I hate it.", "note": ""}, {"speaker": "Practitioner", "line": "It sounds exhausting at times. I wonder where that sensitivity has helped you or the people around you?", "note": "Context reframe, offered tentatively."}], "if_client_says": [{"says": "“You’re just trying to make me feel better.”", "respond": "“Fair point. I don’t want to dismiss how hard it is. Is there any part of this that fits for you?”"}], "tip": "The best reframes often come from the client; ask before offering one.", "caution": "Never reframe abuse, discrimination or danger as positive; address safety and protection instead.", "diagram_id": ""}, {"name": "Perceptual positions", "level": "foundation", "purpose": "To understand a relationship or conflict from three viewpoints and choose a more effective response.", "when": "Before a difficult conversation, after a conflict, or when a client feels stuck with another person.", "steps": ["Set out three chairs or spaces with the client’s agreement.", "First position: the client describes the situation from their own view.", "Second position: the client imagines the other person’s view, using “I” as that person.", "Third position: the client observes both from a neutral distance.", "Return to first position and ask what the client now notices or wants to do.", "Check the second-position guesses against what the other person actually says later."], "prompts": ["“As your sister, what matters most to you here?”", "“From over here, watching the two of them, what do you notice?”"], "dialogue": [], "if_client_says": [{"says": "“I don’t want to be in his shoes.”", "respond": "“That’s fine. We can stay with your view and the observer’s view.” Never insist."}], "tip": "Physically changing chairs helps clients switch viewpoints.", "caution": "Avoid second position with an abusive person if it leads to self-blame or excusing harm; prioritise safety planning.", "diagram_id": "nlp-positions"}, {"name": "Anchoring a resourceful state", "level": "foundation", "purpose": "To help the client recall a calm or confident state on cue in a specific situation.", "when": "For performance situations or recurring stress, once safety and formulation are in place.", "steps": ["Agree the target situation and the state wanted (for example calm and focused).", "Help the client recall a specific time they felt that state; ask for sights, sounds and feelings.", "As the state peaks, the client applies a self-chosen cue (for example pressing thumb and finger together).", "Break state, then test the cue and rate the effect (0-10).", "Plan daily practice and use before the target situation."], "prompts": ["“Think of a time you felt calm and capable. Where were you?”", "“As that feeling builds, press your thumb and finger together.”"], "dialogue": [], "if_client_says": [{"says": "“I can’t think of a time I felt confident.”", "respond": "“That’s common. What about a time you felt even a little calmer, or someone you admire who handles this well?”"}], "tip": "Combine anchoring with real practice of the situation; the anchor supports, it does not replace, graded exposure.", "caution": "Ask before any touch; a self-applied cue is usually best. Do not anchor states in clients who are currently unsafe.", "diagram_id": ""}, {"name": "Future pacing and mental rehearsal", "level": "foundation", "purpose": "To rehearse a new response in imagination so it is easier to carry out in real life.", "when": "At the end of any change work and before a planned challenge.", "steps": ["Ask the client to imagine a specific future situation where the change matters.", "Rehearse the new response step by step, including likely difficulties.", "Check confidence (0-10) and adjust the plan.", "Agree when and where the client will try it for real."], "prompts": ["“Imagine next Monday’s meeting. What do you notice yourself doing differently?”", "“What might get in the way, and what will you do then?”"], "dialogue": [], "if_client_says": [], "tip": "Rehearse obstacles as well as success; plans that include setbacks hold up better.", "caution": "Rehearsal in the room is not evidence of change; review what happens in real life.", "diagram_id": ""}, {"name": "Submodality shifts", "level": "advanced", "purpose": "To reduce the intensity of a distressing image or inner voice by changing its sensory qualities.", "when": "For a specific, non-traumatic memory or inner voice that keeps intruding, after explanation and consent.", "steps": ["Rate current distress (0-10).", "Ask the client to describe the image or voice: size, brightness, distance, colour, volume, tone.", "Invite small experiments: smaller, dimmer, further away, quieter, a different tone.", "Keep the changes that lower distress; undo any that raise it.", "Re-rate and note what helped."], "prompts": ["“What happens if the picture moves further away?”", "“What if that critical voice spoke more slowly, or from further off?”"], "dialogue": [], "if_client_says": [{"says": "“It’s getting worse.”", "respond": "“Let’s stop and change it back. Look around the room and name what you see.” Ground first."}], "tip": "Frame it as an experiment the client controls.", "caution": "Do not intensify distressing memories, and do not use with trauma memories outside a trained protocol.", "diagram_id": ""}, {"name": "The swish pattern", "level": "advanced", "purpose": "To link a habitual trigger to a preferred self-image so a new response becomes more likely.", "when": "For a specific habit or unwanted response with a clear cue, as part of a wider plan.", "steps": ["Identify the cue image just before the unwanted response.", "Build an image of the preferred self, already responding differently.", "Start with the cue image large and close, with the preferred image small and distant.", "Quickly swap them: the cue shrinks away as the preferred image grows close.", "Clear the screen and repeat several times, then test with the original cue."], "prompts": ["“What do you see just before you reach for your phone?”", "“Picture yourself as someone who chooses differently. What do you look like?”"], "dialogue": [], "if_client_says": [], "tip": "Pair the swish with practical habit changes such as removing cues and planning alternatives.", "caution": "Evidence is limited; review real-life change and do not present it as a cure for addiction or compulsive behaviour.", "diagram_id": ""}, {"name": "Six-step reframing", "level": "advanced", "purpose": "To work with the positive intention behind an unwanted behaviour and find better ways to meet it.", "when": "When a client feels torn about a habit or behaviour (“part of me wants to stop”).", "steps": ["Identify the behaviour the client wants to change.", "Invite the client to notice the “part” responsible, using it as a metaphor.", "Explore its positive intention (for example rest, safety or connection).", "Generate at least three other ways to meet that intention.", "Check whether the part would try one for a week.", "Run an ecology check and future pace."], "prompts": ["“What is this behaviour trying to do for you?”", "“What else could give you that, in a way that fits better?”"], "dialogue": [], "if_client_says": [], "tip": "Keep the “parts” language as a metaphor and remind the client they are a whole person.", "caution": "Do not imply that harmful behaviour is acceptable because it has a positive intention.", "diagram_id": ""}, {"name": "Visual squash for inner conflict", "level": "advanced", "purpose": "To help a client hold two conflicting wishes, find the shared intention and integrate them.", "when": "For indecision or inner conflict where both sides matter to the client.", "steps": ["Name the two sides and place one image in each hand.", "Explore each side’s positive intention.", "Look for the shared, higher intention.", "Bring the hands together slowly as the client imagines a combined image.", "Reflect on what the client now wants to do."], "prompts": ["“What does this side want for you? And this one?”", "“What do they both want for you in the end?”"], "dialogue": [], "if_client_says": [], "tip": "The conversation about intentions often matters more than the gesture.", "caution": "Avoid with clients who experience strong dissociation or identity disturbance; use a grounded decision-making approach instead.", "diagram_id": ""}, {"name": "Logical levels alignment", "level": "advanced", "purpose": "To locate where a difficulty sits and align action with values and identity.", "when": "When a client has the skills but still feels stuck, or when changes do not last.", "steps": ["Explore each level in turn: environment, behaviour, capabilities, beliefs and values, identity, purpose.", "Notice which level carries the strongest charge or block.", "Work at that level (for example belief or values work) and then return through the levels to a concrete next step."], "prompts": ["“What do you believe about yourself in that situation?”", "“What matters to you here?”", "“Given that, what will you do next week?”"], "dialogue": [], "if_client_says": [], "tip": "Lay out cards or spaces on the floor for each level so the client can walk through them.", "caution": "A heuristic for conversation, not a diagnosis; keep identity language respectful and open.", "diagram_id": "nlp-levels"}, {"name": "Visual-kinaesthetic dissociation for a specific fear", "level": "advanced", "purpose": "To reduce the emotional charge of a specific, single fear memory by viewing it from a distant observer position.", "when": "Only for a specific, non-complex fear, after assessment and consent, within the practitioner’s competence, and alongside exposure-based treatment.", "steps": ["Assess suitability, risk and dissociation; explain the method and its limited evidence; agree a stop signal.", "Build a safe anchor and grounding first.", "Invite the client to imagine sitting in a cinema, then watching themselves from a further observer position.", "Watch a distant, black and white film of the event from just before it began to a safe point afterwards.", "Briefly run the film backwards, quickly, from the safe end to the start, if the client is comfortable.", "Re-rate distress, ground, and future pace; plan real-world exposure practice."], "prompts": ["“You are in control of the film and can stop it at any time.”", "“How strong is the fear now, from 0 to 10?”"], "dialogue": [], "if_client_says": [{"says": "“I’m back in it, it’s too much.”", "respond": "Stop at once, ground the client in the room and do not continue that session. Review the plan and consider referral."}], "tip": "Treat it as an adjunct; graded, real-life exposure remains the main treatment for specific phobia.", "caution": "Not a trauma treatment outside a trained protocol such as RTM. It does not erase memories; do not promise a cure.", "diagram_id": "nlp-vk"}, {"name": "Future timeline planning", "level": "advanced", "purpose": "To clarify a desired future and work backwards to present-day steps.", "when": "For goal setting and life planning, not for changing past memories.", "steps": ["Invite the client to imagine a line from now into the future.", "Step to a point where the outcome is achieved; describe what they see, hear and feel.", "From there, notice the key steps that led to it.", "Walk back to the present, collecting those steps.", "Agree the first small step and when it will happen."], "prompts": ["“From that future point, what were the three things that made the difference?”", "“What advice would that future you give you today?”"], "dialogue": [], "if_client_says": [], "tip": "Combine with a well-formed outcome so the plan stays specific.", "caution": "This module does not include timeline techniques for releasing past emotions or removing memories; refer trauma to trained, evidence-based care.", "diagram_id": ""}, {"name": "Permissive Milton Model language in consented relaxation", "level": "advanced", "purpose": "To support relaxation or imagery with gentle, choice-giving language.", "when": "Within a relaxation or imagery exercise the client has agreed to, by practitioners with appropriate training.", "steps": ["Explain the exercise and gain consent.", "Use permissive, open language that offers choices.", "Pace the client’s current experience before inviting change.", "Close by reorienting fully to the room and checking how the client is."], "prompts": ["“You might notice your breathing slowing, or you might not, and either is fine.”", "“In a moment, when you’re ready, you can open your eyes.”"], "dialogue": [], "if_client_says": [], "tip": "Choice-giving language respects autonomy and reduces pressure.", "caution": "Never use embedded commands, confusion or double binds without the client’s awareness; hypnosis requires separate training.", "diagram_id": ""}], "technique_selection": {"diagram_id": "nlp-session", "table": [{"target": "Risk to safety", "techniques": ["Risk assessment and safety plan before any technique"]}, {"target": "Weak alliance or stuck conversation", "techniques": ["Pacing and leading for rapport", "Calibration and checking", "Matching sensory language"]}, {"target": "Vague complaint, no clear goal", "techniques": ["Setting a well-formed outcome", "Future timeline planning"]}, {"target": "Absolute or vague language", "techniques": ["Meta Model questioning", "Content and context reframing"]}, {"target": "Conflict with another person", "techniques": ["Perceptual positions", "Meta Model questioning"]}, {"target": "Performance anxiety", "techniques": ["Anchoring a resourceful state", "Future pacing and mental rehearsal", "Plus graded real practice"]}, {"target": "Intrusive image or inner critic (non-traumatic)", "techniques": ["Submodality shifts", "Content and context reframing"]}, {"target": "Unwanted habit with a clear cue", "techniques": ["The swish pattern", "Six-step reframing"]}, {"target": "Inner conflict or indecision", "techniques": ["Visual squash for inner conflict", "Logical levels alignment"]}, {"target": "Specific, single fear", "techniques": ["Exposure-based treatment first", "Visual-kinaesthetic dissociation as an adjunct, within competence"]}, {"target": "Trauma memories", "techniques": ["Refer for trauma-focused CBT or EMDR, or a trained structured protocol"]}]}, "problem_applications": [{"problem": "Performance and presentation anxiety", "model": "State management with rehearsal", "originator": "NLP", "diagram_id": "", "maintaining_cycle": ["Anticipating the event triggers images of failure and an anxious state.", "The person avoids practice or over-prepares.", "The event goes less well, or is avoided, confirming “I always freeze”."], "priority_techniques": ["Setting a well-formed outcome", "Meta Model questioning of “always”", "Anchoring a resourceful state", "Future pacing and mental rehearsal", "Graded real-life practice"], "pitfall": "Using an anchor instead of practice; the client needs repeated real experience to build confidence."}, {"problem": "Interpersonal conflict", "model": "Multiple viewpoints", "originator": "Grinder and DeLozier", "diagram_id": "", "maintaining_cycle": ["Each person reads the other’s intent negatively (mind reading).", "Responses escalate the conflict.", "Neither feels heard, so the pattern repeats."], "priority_techniques": ["Perceptual positions", "Meta Model questioning", "Content and context reframing"], "pitfall": "Encouraging empathy for someone who is abusive; assess safety and power first."}, {"problem": "Low motivation and unclear goals", "model": "Outcome orientation", "originator": "NLP", "diagram_id": "", "maintaining_cycle": ["Goals stated as “not this” leave no direction.", "Small steps are not defined.", "Lack of progress lowers confidence further."], "priority_techniques": ["Setting a well-formed outcome", "Future timeline planning", "Logical levels alignment"], "pitfall": "Pushing goals the client has not chosen; where ambivalence is strong, use Motivational Interviewing."}, {"problem": "Unwanted habits", "model": "Cue and response", "originator": "NLP", "diagram_id": "", "maintaining_cycle": ["A cue triggers an automatic response.", "The response brings short-term relief or reward.", "The habit strengthens with repetition."], "priority_techniques": ["The swish pattern", "Six-step reframing", "Practical cue control and planned alternatives"], "pitfall": "Treating dependence or compulsive behaviour with NLP alone; assess and refer for evidence-based treatment where needed."}, {"problem": "Specific fears", "model": "Avoidance maintains fear", "originator": "Learning theory", "diagram_id": "", "maintaining_cycle": ["The feared situation triggers intense fear.", "Avoidance brings relief.", "Without approach, the fear is never updated."], "priority_techniques": ["Exposure-based treatment (see the Exposure module)", "Anchoring a resourceful state", "Visual-kinaesthetic dissociation as an adjunct"], "pitfall": "Promising a one-session cure; plan and review graded exposure."}, {"problem": "Distressing memories and trauma", "model": "Refer and protect", "originator": "Clinical guidance", "diagram_id": "", "maintaining_cycle": ["Intrusive memories and avoidance maintain distress.", "Untrained memory work can increase distress or dissociation."], "priority_techniques": ["Grounding and safety", "Referral for trauma-focused CBT or EMDR", "Structured protocols such as RTM only with specific training"], "pitfall": "Using rewind, timeline or memory-removal techniques for trauma without training, assessment and supervision."}], "session_structure": {"single_session": ["**Beginning frame:** welcome, agree the focus for today and remind the client they can pause or decline any exercise.", "**State and safety check:** current state, outcome rating and a brief risk check.", "**Outcome for today:** what the client wants from this session, in positive terms.", "**Current situation:** a recent, specific example, explored with Meta Model questions.", "**Technique, with choice:** explain the option, its rationale and limited evidence, and gain consent.", "**Test and calibrate:** re-rate and check what the client notices.", "**Future pace:** rehearse where and when the client will use this.", "**End frame and feedback:** summarise, agree practice, ask what helped and what did not."], "session_diagram_id": "nlp-session", "course": ["**Sessions 1-2:** assessment, risk, suitability, well-formed outcome and agreement on approach.", "**Sessions 3-5:** rapport, language and outcome work; first experiential techniques with ratings.", "**Sessions 6-8:** apply techniques to real situations, combine with practice, review measures.", "**Final sessions:** consolidate, plan for setbacks and end or refer as needed.", "Length varies; NLP-informed work is usually brief and integrated with the main treatment plan."], "course_diagram_id": "", "ending_script": ["“What stands out for you from today?”", "“When and where will you try this before we meet?”", "“Was there anything today that didn’t suit you?”"]}, "worked_case": {"client": "Riya (name changed), 29, software analyst, lives with her parents.", "presenting_problem": "Strong anxiety before speaking in team meetings for two years; she stays silent, then criticises herself for hours. GAD-7 of 9; no risk identified after a direct risk check. She asked for practical, imagery-based help and agreed to graded speaking practice.", "formulation_diagram_id": "nlp-comm", "goals": ["Speak at least once in each weekly team meeting.", "Reduce pre-meeting anxiety from 8 to 4 out of 10.", "Respond to her own mistakes with less self-criticism."], "sessions": [{"session": "1-2", "focus": "Assessment and outcome", "highlights": "Risk checked; well-formed outcome set: “I’ll share one update clearly in Monday’s meeting.” Meta Model questions revealed “everyone will think I’m stupid” rested on one manager’s comment a year ago."}, {"session": "3-4", "focus": "State and rehearsal", "highlights": "Calm, focused state anchored from a memory of teaching her cousin; practised daily. Future pacing of Monday meetings, including what to do if she lost her words."}, {"session": "5-6", "focus": "Perspectives and practice", "highlights": "Perceptual positions with her manager showed he was rushed rather than critical. She spoke in two meetings; anxiety fell to 6."}, {"session": "7-8", "focus": "Consolidation", "highlights": "Reframed a stumble as evidence she can recover. GAD-7 of 5; speaks most weeks. Relapse plan written."}], "dialogue": [{"speaker": "Practitioner", "line": "You said everyone will think you’re stupid. Who, specifically, comes to mind?", "note": "Meta Model: universal quantifier and mind reading."}, {"speaker": "Client", "line": "Mostly my manager. He once said my point was off-topic.", "note": ""}, {"speaker": "Practitioner", "line": "Once, a year ago. And since then, what has he said about your work?", "note": "Recovering deleted information."}, {"speaker": "Client", "line": "He actually praised my report last month.", "note": ""}], "setback": "In week 6 Riya froze when a senior director attended and felt she was back at the start. Reviewing it, she noticed she had skipped her anchor practice and that she still spoke later in the meeting. The plan was adjusted to include practising with senior colleagues.", "outcome": "After eight sessions Riya speaks in most meetings with anxiety around 4 out of 10 and recovers from mistakes faster. Graded practice and the NLP-informed techniques worked together; her ratings guided each step.", "relapse_prevention": ["Keep practising the anchor twice a week.", "Prepare one point before each meeting.", "Notice “everyone” thoughts and ask who, specifically.", "If anxiety rises above 7 for two weeks, book a review."]}, "tools": [{"name": "Well-formed outcome sheet", "level": "foundation", "purpose": "To turn a complaint into a specific, positive goal.", "when": "Sessions 1-2 and whenever direction is unclear.", "fields": ["**What I want instead**", "**How I will know:** see, hear, feel", "**Where, when and with whom**", "**Resources I have and need**", "**Ecology:** what might change or be lost", "**First small step**"], "example": "“I will share one update in Monday’s meeting. I’ll know because I’ll hear my own voice steady and see my manager nodding.”"}, {"name": "Meta Model question card", "level": "foundation", "purpose": "A quick reference for respectful precision questions.", "when": "In session, as a prompt for the practitioner.", "fields": ["**Deletions:** about what? who, specifically? compared with what?", "**Generalisations:** always? never? what stops you? what would happen if?", "**Distortions:** how do you know? how does that lead to this? who says?"], "example": "“I can’t cope.” “Can’t cope with what, specifically, and what would coping look like?”"}, {"name": "Anchor practice log", "level": "foundation", "purpose": "To track practice and the effect of a resourceful anchor.", "when": "Between sessions, once an anchor is set.", "fields": ["**Date and situation**", "**State before (0-10)**", "**Anchor used**", "**State after (0-10)**", "**What I noticed**"], "example": "Tuesday, before the stand-up: anxiety 7, used anchor, anxiety 5; spoke first this time."}, {"name": "Perceptual positions worksheet", "level": "foundation", "purpose": "To capture what each viewpoint shows.", "when": "Before or after a difficult conversation.", "fields": ["**First position:** what I see, hear and feel", "**Second position:** what the other person may want and fear", "**Third position:** what an observer notices", "**What I will do now**"], "example": "Third position: “Two tired people, both worried about the deadline.”"}, {"name": "Reframe record", "level": "foundation", "purpose": "To explore other meanings and contexts for a stuck interpretation.", "when": "When one meaning dominates.", "fields": ["**The situation and my first meaning**", "**What else it could mean**", "**Where this quality is useful**", "**The meaning that fits best now**"], "example": "“I’m too careful” became “I’m careful, which my team relies on for audits.”"}, {"name": "Submodality comparison chart", "level": "advanced", "purpose": "To note which sensory qualities change the intensity of an inner image or voice.", "when": "During submodality work.", "fields": ["**Image:** size, brightness, colour, distance", "**Sound:** volume, tone, location", "**Feeling:** intensity, place in body", "**Rating before and after**"], "example": "Making the critic’s voice slower and further away lowered tension from 7 to 4."}, {"name": "Logical levels map", "level": "advanced", "purpose": "To locate where a difficulty sits.", "when": "When skills are present but change is stuck.", "fields": ["**Environment**", "**Behaviour**", "**Capabilities**", "**Beliefs and values**", "**Identity**", "**Purpose**"], "example": "Identity: “I’m not a leader.” Values: “Fairness matters to me.” Next step: lead the fairness review."}, {"name": "Technique consent and rating note", "level": "foundation", "purpose": "To record consent, rationale and effect for any experiential technique.", "when": "Every time an experiential technique is used.", "fields": ["**Technique and rationale explained**", "**Evidence discussed and consent given**", "**Rating before and after**", "**Client’s feedback**"], "example": "Swish explained as an experiment with limited research; consent given; urge 8 before, 6 after; client wants to try it at home."}], "troubleshooting": [{"if": "The client feels interrogated by questions", "try": "Repair the relationship, slow down, and ask one question at a time with more reflection between them."}, {"if": "An imagery exercise raises distress", "try": "Stop, ground the client in the room, reverse any changes made, and do not continue that exercise today. Review suitability."}, {"if": "The client cannot form images", "try": "Use other senses (sounds, words, body sensations) or practical, behavioural methods instead."}, {"if": "Change in the room does not last", "try": "Add real-world practice, check the ecology of the outcome, and review whether an evidence-based treatment is needed."}, {"if": "The client asks whether NLP is proven", "try": "Answer honestly: some methods help some people, research support is limited, and you will measure progress together."}, {"if": "The client wants a one-session cure", "try": "Explain that most change takes practice, agree realistic goals, and set review points."}, {"if": "The outcome depends on someone else changing", "try": "Return to what is within the client’s influence, while acknowledging the real constraints."}, {"if": "Trauma memories come up", "try": "Ground, contain and slow down. Do not process the memory; assess and refer for trauma-focused care."}], "troubleshooting_added": true, "cultural_adaptation": ["**Ask, don’t assume:** explore what the client’s culture, faith, family and community mean to them before setting outcomes.", "**Goals may be shared:** in collectivist settings, a well-formed outcome may include family wishes; explore this with care and consent.", "**Language and metaphor:** use the client’s own language and metaphors; translate imagery exercises into familiar scenes.", "**Body and touch:** touch-based anchors may be unsuitable for cultural, religious or trauma-related reasons; use self-applied or word anchors.", "**Directness:** Meta Model questions can feel rude in cultures that value indirect speech; soften, explain why you ask, and ask fewer questions.", "**Spiritual frameworks:** the client may bring faith-based images or resources; follow their lead without adding your own beliefs.", "**Structural barriers:** discrimination, caste, poverty and gender roles are real constraints, not “limiting beliefs”; address them as such.", "**Interpreters:** experiential and language-based techniques may not translate well; keep instructions simple and check understanding.", "**Hierarchy and gender:** consider how perceived authority affects rapport and consent in the room."], "cultural_adaptation_added": true, "ethics_referral": ["**Honest framing:** describe NLP methods as experiential techniques with limited research support, never as proven cures.", "**Informed consent:** explain each technique, its rationale and its limits, and confirm the client can decline or stop at any time.", "**No covert influence:** do not use embedded commands, confusion, nested loops, double binds or rapport to influence a client without their awareness.", "**Excluded from this module:** memory removal or “erasing”, intensifying distressing memories, pain dissociation without medical assessment, subliminal persuasion, and patterns claiming to cure allergies, addictions or physical illness.", "**Scope of practice:** NLP training alone is not a qualification to treat mental health conditions; work within your professional registration and competence.", "**Evidence-based care first:** offer or refer for recommended treatments for depression, anxiety disorders, OCD and PTSD.", "**Trauma:** refer for trauma-focused care; use structured protocols only with specific training and supervision.", "**Hypnosis and trance work:** need separate training, consent and local professional guidance.", "**Touch:** never touch without explicit consent; prefer self-applied anchors.", "**Confidentiality and records:** record techniques used, consent and ratings, and store notes securely.", "**Trademarks:** some NLP methods are marketed under trademarked names; this module describes general techniques, not branded trainings.", "**Supervision:** take experiential work, unexpected reactions and lack of progress to supervision.", "**Referral:** refer when risk is high, when progress stalls, or when the presentation is outside your competence.", "**Complaints:** clients can raise concerns with your service or professional body."], "ethics_referral_added": true, "client_handouts": [{"id": "nlp-what-to-expect", "title": "What we may try in our sessions", "give_when": "Session 1 or 2, when introducing NLP-informed exercises.", "body": ["Some of our sessions may include short exercises using imagery, questions about the words you use, or seeing a situation from different viewpoints.", "These exercises come from an approach called neuro-linguistic programming. Some people find them helpful, but research on them is limited, so we will check together whether they help you.", "You can say no to any exercise, ask questions, or stop at any time."], "diagram_id": "", "try_this": ["Tell me if an exercise feels uncomfortable or does not suit you.", "Notice what changes between sessions, not only in the room.", "Bring your questions to each session."], "questions": ["What would I like to be different by the end of our work?", "Which kinds of exercises suit me best?"], "notes_prompt": "My questions and notes"}, {"id": "nlp-my-outcome", "title": "My goal, clearly stated", "give_when": "After setting a well-formed outcome together in session.", "body": ["A clear goal says what you want, not only what you want to stop.", "It also says how you will know you have got there, and what the first small step is."], "diagram_id": "", "try_this": ["Write your goal as something you want to do or feel.", "Describe what you will see, hear and feel when you achieve it.", "Choose one small first step for this week."], "questions": [], "form": [{"t": "line", "label": "What I want instead", "lines": 2}, {"t": "line", "label": "How I will know I have it: what I will see, hear and feel", "lines": 3}, {"t": "line", "label": "Where, when and with whom", "lines": 2}, {"t": "line", "label": "What might change or be affected, and is that all right?", "lines": 2}, {"t": "line", "label": "My first small step, and when", "lines": 2}, {"t": "scale", "label": "How close I feel to my goal today", "low": "not at all", "high": "fully there", "top": 10}], "notes_prompt": "My notes"}, {"id": "nlp-calm-anchor", "title": "Practising my calm cue", "give_when": "After setting a resourceful anchor in session.", "body": ["In session we linked a calm, focused feeling to a cue you chose, such as pressing your thumb and finger together.", "Like any skill, it gets stronger with practice. Use it alongside, not instead of, the real practice we have planned.", "If you ever feel unsafe or might harm yourself, stop and contact emergency services or a crisis line."], "diagram_id": "", "try_this": ["Once a day, recall your calm memory clearly.", "As the feeling builds, use your cue.", "Before the situation you are working on, use your cue and take a slow breath."], "questions": [], "form": [{"t": "line", "label": "My cue", "lines": 1}, {"t": "scale", "label": "How I felt before using it", "low": "calm", "high": "very anxious", "top": 10}, {"t": "scale", "label": "How I felt after", "low": "calm", "high": "very anxious", "top": 10}, {"t": "line", "label": "When I used it and what I noticed", "lines": 3}], "notes_prompt": "My notes"}, {"id": "nlp-three-views", "title": "Seeing a situation from three views", "give_when": "After practising perceptual positions in session.", "body": ["When we are stuck with someone, it can help to look at the situation from three places: your own view, how the other person might see it, and how a calm observer might see it.", "The other person’s view is only your best guess; check it with them if it is safe to do so.", "If the other person has hurt or threatened you, skip their view and focus on your safety."], "diagram_id": "", "try_this": ["Write what you see, hear and feel from your own view.", "Imagine the other person’s view: what might they want or fear?", "Step back as a calm observer: what do you notice?", "Decide what you want to do next."], "questions": [], "form": [{"t": "line", "label": "My view", "lines": 3}, {"t": "line", "label": "The other person’s possible view", "lines": 3}, {"t": "line", "label": "What a calm observer would notice", "lines": 3}, {"t": "line", "label": "What I will do next", "lines": 2}], "notes_prompt": "My notes"}], "client_handouts_added": true, "counsellor_sheets": [{"id": "nlp-assessment-sheet", "title": "NLP-informed assessment and outcome sheet", "use_when": "At assessment and at review points. Complete with the client, in their words where possible.", "cover": {"title": "NLP-informed assessment", "note": "Record the minimum necessary information. Store completed sheets securely and follow local law and service policy.", "items": [{"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}]}, "sections": [{"heading": "Consent and suitability", "items": [{"t": "guide", "text": "Explain NLP-informed exercises, their limited evidence, and the right to decline or stop."}, {"t": "ticks", "label": "Discussed", "options": ["Role and confidentiality", "Limited evidence for NLP methods", "Right to decline or stop", "Evidence-based options"]}, {"t": "ticks", "label": "Suitability", "options": ["Suitable as adjunct", "Evidence-based treatment needed first", "Referral needed"]}]}, {"heading": "Safety check", "danger": true, "items": [{"t": "line", "label": "Thoughts of self-harm or suicide, harm to scale", "label": "Outcome rating", "low": "not at all", "high": "fully there", "top": 10}, {"t": "line", "label": "Risk check and any action taken", "lines": 2}, {"t": "crisis"}]}, {"heading": "Technique used", "items": [{"t": "line", "label": "Technique and rationale", "lines": 2}, {"t": "ticks", "label": "Consent", "options": ["Explained, including limited evidence", "Client agreed", "Client declined; alternative used"]}, {"t": "table", "columns": ["Rating", "Before", "After"], "rows": 2, "first": ["Distress or urge", "Confidence"]}, {"t": "line", "label": "Client’s feedback and any adverse reaction", "lines": 2}]}, {"heading": "Between sessions and next steps", "items": [{"t": "line", "label": "Practice agreed", "lines": 2}, {"t": "line", "label": "Supervision points", "lines": 2}]}]}], "counsellor_sheets_added": true, "session_note_template": {"fields": [{"label": "Session details", "guidance": "Client identifier, date, duration, session number, in person or online, and the practitioner’s name. For online sessions, the client’s location and privacy."}, {"label": "Ratings and measures", "guidance": "Outcome rating and any standard measures completed; change since last time."}, {"label": "Risk check", "guidance": "Whether risk was asked about, what the client said, and any action taken."}, {"label": "Focus and outcome", "guidance": "The well-formed outcome and today’s focus."}, {"label": "Technique and consent", "guidance": "Technique used, rationale given, evidence discussed, consent, and before and after ratings."}, {"label": "Client response", "guidance": "What the client noticed, any discomfort or adverse reaction, and how it was managed."}, {"label": "Between-session practice", "guidance": "What was agreed and when the client will practise."}, {"label": "Plan and supervision", "guidance": "Next session plan, review points, and anything to take to supervision or referral."}], "example": "Session 4, online, client at home and private. Outcome rating 5 (from 3). Risk asked: none reported. Anchor for calm focus reviewed; used 5 times; anxiety before meetings 6 (from 8). Perceptual positions with manager: client noticed he was rushed rather than critical. Consent confirmed; no adverse reaction. Practice: anchor daily, speak once in Monday meeting. Plan: review GAD-7 next session.", "note": "Record experiential techniques clearly enough that another practitioner could understand what was done and why."}, "session_note_template_added": true, "online_adaptations": ["**Consent for online work:** explain privacy limits, records and what happens in an emergency; use a secure platform.", "**Location and safety:** confirm where the client is and a contact number at the start of every session.", "**Imagery online:** keep exercises shorter, check in often, and agree a clear signal to stop.", "**Grounding first:** practise a grounding method before any imagery, and reorient fully at the end.", "**Calibration:** cues are harder to see on screen; ask for ratings more often.", "**Perceptual positions:** use objects or chairs in the client’s room, or describe the positions in words.", "**Avoid dissociation work online** unless the client is well known to you, stable and has support nearby.", "**Handouts:** share forms securely and review them together at the next session."], "online_adaptations_added": true, "tips": ["**Formulate before you use a technique:** know what the technique is for and how you will judge whether it helped.", "**Pace before you lead:** the client needs to feel understood before any change work.", "**One question at a time:** Meta Model work is precise, not rapid-fire.", "**Rate before and after:** make change visible and honest.", "**Offer, don’t impose:** every technique is an invitation the client can decline.", "**Combine with real practice:** most change holds when it is tested in daily life.", "**Use the client’s words:** for goals, problems and resources.", "**Keep a light touch with presuppositions:** use them for curiosity, never to dismiss distress."], "pitfalls": ["**Overclaiming:** calling NLP methods cures or proven treatments.", "**Typing clients:** labelling people as visual or kinaesthetic, or reading eye movements as proof of thoughts or lies.", "**Interrogation:** challenging every Meta Model pattern breaks rapport.", "**Blaming the client:** “there is no resistance” or “no failure, only feedback” used to imply the client is not trying.", "**Technique before formulation:** jumping to a swish or anchor without understanding the problem.", "**Trauma shortcuts:** rewind or timeline techniques for trauma without training and supervision.", "**Covert influence:** using hypnotic language or rapport to steer a client without their awareness.", "**Ignoring context:** treating poverty, discrimination or abuse as limiting beliefs."], "competency_checklist": ["Explains NLP-informed work and its limited evidence honestly, and gains informed consent.", "Completes a risk check and judges suitability before any technique.", "Builds rapport through accurate pacing and the client’s own words.", "Calibrates using observable cues and checks meaning with the client.", "Helps the client set a well-formed outcome with an ecology check.", "Uses Meta Model questions sparingly, warmly and with purpose.", "Offers reframes tentatively and checks their fit.", "Uses perceptual positions safely, with attention to power and safety.", "Sets and tests an anchor with consent and links it to real practice.", "Rates distress or confidence before and after experiential techniques.", "Recognises when to use an evidence-based treatment or refer.", "Records techniques, consent and ratings clearly."], "competency_checklist_added": true, "supervision_prompts": ["What is my formulation, and how does each technique I used fit it?", "Did I explain the evidence honestly, and did the client genuinely consent?", "Is there an evidence-based treatment this client should be offered instead or as well?", "Where did I lead before I had paced well enough?", "Did any exercise raise distress or dissociation, and how did I respond?", "Am I using any NLP idea in a way that could blame the client for their difficulties?", "What do the ratings and measures show about real-life change?", "Is anything in my use of language or rapport drifting toward influence the client has not chosen?", "What cultural factors am I missing in how I set outcomes or use imagery?", "Is this work within my competence, or should I refer?"], "supervision_prompts_added": true, "quiz": [{"question": "Which statement best reflects the current research on NLP?", "options": ["NLP is a proven treatment for anxiety disorders", "Reviews have found little evidence that NLP improves health outcomes, mainly due to few and weak studies", "NLP has been shown to be harmful in all cases", "NLP is the recommended first-line treatment for PTSD"], "answer": 1, "rationale": "The 2012 systematic review found little evidence of benefit, largely because research is limited and of low quality. That is not proof of harm, but it rules out calling NLP a proven treatment."}, {"question": "A client says, “Everyone at work thinks I’m useless.” Which Meta Model question fits best?", "options": ["“Why do you always think so negatively?”", "“Everyone? Who, specifically, comes to mind?”", "“You must change that belief.”", "“Let’s anchor a confident state.”"], "answer": 1, "rationale": "It gently questions the universal quantifier and the missing referential index, recovering specific detail."}, {"question": "What is the safest use of visual-kinaesthetic dissociation in counselling?", "options": ["For any trauma memory, in the first session", "As an adjunct for a specific, single fear, within competence, alongside exposure-based treatment", "To erase painful memories", "For clients with marked dissociation"], "answer": 1, "rationale": "It does not erase memories and is not a trauma treatment outside a trained protocol. Use it cautiously as an adjunct for specific fears."}, {"question": "Which idea about representational systems is supported by research?", "options": ["Each person has one fixed preferred system", "Eye movements reveal which system a person is using", "Noticing and matching a client’s sensory words can support understanding, without typing the client", "Visual people should only be given visual techniques"], "answer": 2, "rationale": "Fixed preferred systems and eye-movement cues were not supported by research; using the client’s own language is simply good listening."}, {"question": "What makes an outcome well-formed?", "options": ["It is stated as what the client wants to stop", "It depends on someone else changing", "It is positive, within the client’s influence, sensory-specific and ecologically checked", "It is set by the practitioner"], "answer": 2, "rationale": "Well-formed outcomes are positive, within the client’s control, specific in sensory terms and checked for their effects on the client’s wider life."}, {"question": "A client becomes very distressed during a submodality exercise. What should the practitioner do?", "options": ["Continue so the client gets used to it", "Make the image brighter to finish quickly", "Stop, ground the client in the room, reverse the changes and review suitability", "End the session without discussion"], "answer": 2, "rationale": "Safety and grounding come first; distress during imagery is a signal to stop and reassess."}, {"question": "Which use of the Milton Model is ethical?", "options": ["Embedded commands to change a client’s decision without their knowledge", "Permissive, choice-giving language in a relaxation exercise the client has agreed to", "Double binds to overcome a client’s refusal", "Confusion techniques during assessment"], "answer": 1, "rationale": "Language must respect autonomy and be used with awareness and consent."}, {"question": "When is perceptual positions work likely to be inappropriate?", "options": ["With a colleague conflict", "Before a family conversation", "When it leads a client to excuse or blame themselves for someone’s abuse", "When the client wants to understand a friend"], "answer": 2, "rationale": "With abuse, the priority is safety and protection, not empathy for the person causing harm."}], "quick_reference": ["**Risk first:** check safety before any technique, every session.", "**Pace, then lead:** understand the client’s map before inviting change.", "**Outcome:** positive, within influence, sensory-specific, ecologically checked, with a first step.", "**Meta Model:** who, what, how specifically? always? what stops you? how do you know?", "**Techniques are invitations:** explain, gain consent, rate before and after.", "**Evidence:** limited for NLP methods; use evidence-based treatments first for mental health conditions.", "**Trauma:** ground and refer; no memory removal or untrained rewind work.", "**No covert influence:** language and rapport are used openly, for the client’s chosen goals."], "glossary": [{"term": "Anchor", "definition": "A cue, chosen by the client, linked through practice to a particular state."}, {"term": "Calibration", "definition": "Noticing a specific person’s observable changes and checking what they mean."}, {"term": "Chunking", "definition": "Moving between general (chunking up) and specific (chunking down) levels of detail."}, {"term": "Complex equivalence", "definition": "Treating one thing as meaning another, for example “he’s late, so he doesn’t care”."}, {"term": "Deletion", "definition": "Leaving information out of an account; a natural part of attention."}, {"term": "Distortion", "definition": "Changing or adding meaning to experience."}, {"term": "Ecology check", "definition": "Considering how a change would affect the rest of the client’s life and relationships."}, {"term": "Future pacing", "definition": "Rehearsing a new response in an imagined future situation."}, {"term": "Generalisation", "definition": "Letting one experience stand for a whole category."}, {"term": "Lost performative", "definition": "A judgement stated as fact without saying whose judgement it is."}, {"term": "Map and territory", "definition": "The difference between a person’s representation of the world and the world itself."}, {"term": "Meta Model", "definition": "Question patterns that recover detail lost through deletion, distortion and generalisation."}, {"term": "Meta programmes", "definition": "Habitual patterns of attention, such as moving toward goals or away from problems."}, {"term": "Milton Model", "definition": "Permissive, general language patterns drawn from Milton Erickson’s hypnotic work."}, {"term": "Modal operator", "definition": "Words of necessity or possibility, such as must, should, can’t."}, {"term": "Nominalisation", "definition": "A process turned into a noun, for example “the relationship” instead of “how we relate”."}, {"term": "Pacing and leading", "definition": "Meeting the client where they are, then gently inviting a new direction."}, {"term": "Perceptual positions", "definition": "Viewing a situation from one’s own, another’s and an observer’s viewpoint."}, {"term": "Rapport", "definition": "A sense of connection and trust in the working relationship."}, {"term": "Reframing", "definition": "Changing the meaning or context of an experience so new responses become possible."}, {"term": "Representational systems", "definition": "The senses through which experience is represented: seeing, hearing, feeling, smelling, tasting and inner talk."}, {"term": "State", "definition": "A person’s overall emotional and physical condition at a given moment."}, {"term": "Submodalities", "definition": "The finer qualities of an inner representation, such as size, brightness or volume."}, {"term": "TOTE", "definition": "Test, Operate, Test, Exit: a simple model of how people pursue a goal."}, {"term": "Universal quantifier", "definition": "Absolute words such as always, never, everyone, no one."}, {"term": "Visual-kinaesthetic dissociation", "definition": "Viewing a memory from a distant observer position to reduce its emotional charge; the basis of the rewind and RTM protocols."}], "related_modules": ["cbt", "motivational-interviewing", "solution-focused-brief-therapy", "acceptance-commitment-therapy", "exposure-therapy"], "safety_note": "If risk to life or safety emerges at any point, stop the exercise, ground the client and follow your risk protocol."}};
