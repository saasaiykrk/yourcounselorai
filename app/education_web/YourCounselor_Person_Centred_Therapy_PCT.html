r acute medical/psychiatric emergency is suspected, do not rely on a non-directive stance alone: activate emergency and organisational procedures."], "formulation_steps": ["Start with the client’s narrative and agreed concerns; avoid imposing a diagnostic explanation prematurely.", "Describe the context and the client’s own meanings, emotions, bodily experiences, self-concept and relationships.", "Consider possible incongruence or conditions of worth only when supported by the client’s material; identify alternative explanations.", "Include strengths, adaptive functions of coping, social and material constraints, and relevant medical or psychiatric factors.", "Co-create a provisional summary in plain language and explicitly ask for corrections.", "Translate the client’s hopes into flexible markers of meaningful change, while allowing goals to evolve."], "goal_setting": ["Goals should be defined in the client’s language and chosen by the client, not prescribed as therapist compliance targets.", "Use lived markers: feeling more able to express needs, tolerating a previously disowned feeling, making a values-consistent decision, or relating to oneself with less shame.", "If rating scales or structured measures are useful, explain their purpose and limitations; do not treat scores as the whole person."], "tracking": ["Ask how the client experiences the relationship and whether the pace and focus feel right.", "Review changes in self-understanding, emotional openness, self-acceptance, agency, relationships and daily functioning.", "Use routine outcome or feedback measures only when suitable, interpreted collaboratively and not as a replacement for dialogue."], "measurement_schedule": [{"when": "Initial sessions", "measure": "Client-defined concerns, functioning, safety where indicated, hopes and expectations", "look_for": "Shared understanding, fit, consent, context and baseline"}, {"when": "Every session", "measure": "Client’s experience of the session, emerging concerns, safety where indicated and relationship fit", "look_for": "Whether the client feels heard, able to disagree and involved in direction"}, {"when": "Review point", "measure": "Client-defined markers, functioning, feedback or suitable outcome measures", "look_for": "What is helpful, what is not, what needs adjustment or additional support"}, {"when": "Ending and follow-up", "measure": "Client’s account of change, remaining concerns, supports and future needs", "look_for": "Agency, realistic expectations, planned ending and access to further care if needed"}], "measurement_note": "There is no single psychometric scale that captures person-centred change in every client. Use validated measures only when appropriate, follow licensing and administration requirements, and interpret results in context. A measure is an aid to dialogue, not a verdict."}, "techniques": [{"name": "Empathic listening and reflection", "level": "foundation", "purpose": "Communicate an accurate, tentative understanding of the client’s felt experience and meaning.", "when": "When the client is exploring emotions, ambiguity, shame, grief, conflict or an experience that feels difficult to articulate.", "steps": ["Attend to words, tone, pauses, emotion and the client’s own metaphors.", "Form a tentative sense of the feeling or meaning; do not rush to interpret.", "Offer a concise reflection in ordinary language.", "Pause and notice the client’s response; invite correction or elaboration.", "Revise your understanding if the reflection misses."], "prompts": ["It sounds as though…", "There’s a part of this that feels…", "Have I understood that, or is it different for you?"], "dialogue": [{"speaker": "Client", "line": "Everyone says I should be happy, but I feel empty."}, {"speaker": "Counsellor", "line": "There’s pressure to look happy, while inside you’re experiencing something very different."}, {"speaker": "Client", "line": "Yes. I’m tired of pretending."}, {"speaker": "Counsellor", "line": "You’re exhausted by having to hide what is actually happening."}], "tip": "Reflect the client’s meaning rather than simply repeating their last words.", "caution": "Do not present an inference as certainty or use reflection to steer toward a predetermined conclusion."}, {"name": "Clarification and checking fit", "level": "foundation", "purpose": "Keep the client’s meaning primary and prevent therapist assumptions from becoming the official story.", "when": "When the client’s language is ambiguous, your response seems to land poorly, or an interpretation is emerging.", "steps": ["State what you think you heard in tentative language.", "Ask whether it fits and what needs changing.", "Welcome correction without defensiveness.", "Use the correction to deepen understanding."], "prompts": ["When you say ‘trapped’, what does that word mean for you?", "I may be getting this wrong. What would you change in what I’ve said?", "What feels important that I haven’t asked about?"], "tip": "A correction is useful clinical information, not a failure of empathy."}, {"name": "Facilitating emotional expression", "level": "foundation", "purpose": "Offer a relationship in which feelings can be approached at the client’s pace without pressure to perform emotion.", "when": "When feelings are difficult to name, are accompanied by shame, or seem to conflict with the client’s self-image.", "steps": ["Notice the emotion the client signals and reflect it tentatively.", "Allow silence without rushing to fill it.", "Ask what the client notices now, if they wish to explore further.", "Respect defences and protective strategies as meaningful; do not force disclosure.", "Check grounding and readiness if arousal rises significantly."], "prompts": ["What are you noticing as you say that?", "Would it be okay to stay with that feeling for a moment, or would you prefer to step back?", "What feels safe enough to say today?"], "caution": "Do not intensify affect as a goal in itself. Monitor dissociation, overwhelm and safety, and use stabilisation or referral when needed."}, {"name": "Summarising the client’s meaning", "level": "foundation", "purpose": "Bring together themes while leaving authorship of meaning with the client.", "when": "At transitions, after complex narratives, before closing or when checking a shared understanding.", "steps": ["Identify the themes the client has emphasised.", "Include ambivalence or contradictions without resolving them for the client.", "Offer the summary as provisional.", "Ask what is missing, inaccurate or most important."], "prompts": ["I’m hearing both the relief and the grief; what would you add?", "What feels most important to take from what we’ve explored?"], "tip": "A good summary opens space for the client to recognise, revise or deepen their own meaning."}, {"name": "Therapist congruence and judicious immediacy", "level": "advanced", "purpose": "Use honest, responsible presence to support the relationship when it is clinically relevant.", "when": "When a relational process needs gentle naming, a misunderstanding has occurred, or the therapist must acknowledge a real limit.", "steps": ["Notice your response and reflect on whether it is useful to disclose.", "Check power, timing, client vulnerability and whose need disclosure serves.", "Speak in first-person, specific, non-blaming language.", "Invite the client’s experience and remain open to disagreement.", "Return focus to the client rather than seeking reassurance."], "prompts": ["I wonder if my question felt like pressure. How was it for you?", "I realise I don’t know enough about that experience; would you help me understand?"], "caution": "Congruence is not permission for impulsive self-disclosure, emotional unloading or boundary crossing."}, {"name": "Working with silence", "level": "foundation", "purpose": "Allow time for experience to emerge without interpreting silence as resistance or failure.", "when": "When a client pauses, feels moved, searches for words or needs time to reflect.", "steps": ["Stay attentive and grounded rather than withdrawing.", "Allow a pause if it appears useful and tolerable.", "If needed, check gently whether the client wants time, a question or a change of focus.", "Respect that silence may mean many things, including discomfort, culture, fatigue or disconnection."], "prompts": ["We can take our time. What would be helpful right now?", "Would you like a little space, or shall I ask something to help us continue?"], "caution": "Do not romanticise silence; check when it appears to signal discomfort, dissociation or relational rupture."}, {"name": "Rupture recognition and relational repair", "level": "advanced", "purpose": "Address moments when the client feels misunderstood, judged, pressured or disconnected.", "when": "When the client withdraws, becomes compliant, corrects the therapist, shows irritation or reports that a response did not help.", "steps": ["Notice possible signs without assuming their meaning.", "Name your observation tentatively and take responsibility for your contribution where appropriate.", "Invite the client’s view and listen without arguing.", "Acknowledge impact, clarify intentions only after hearing impact, and agree how to proceed.", "Use supervision for repeated patterns or strong therapist reactions."], "prompts": ["I noticed you became quieter after I said that. Did it land badly, or am I reading it incorrectly?", "I’m sorry. I moved into advice before understanding what you needed."], "tip": "Repair can strengthen collaboration when it is genuine and does not pressure the client to forgive."}, {"name": "Offering information or options without taking over", "level": "advanced", "purpose": "Share professional knowledge while preserving informed choice and clarity about the therapist’s role.", "when": "When the client requests information, options are relevant to safety or care, or a referral/other service may help.", "steps": ["Ask permission where feasible and explain why information may be relevant.", "Present balanced options, uncertainties and limits in accessible language.", "Separate factual information from your preference or recommendation.", "Ask how the client understands the options and what matters in their decision.", "Act on non-negotiable safety or legal duties transparently."], "prompts": ["Would it be helpful if I shared a few options, including what we know and don’t know?", "You remain central in this decision; there are also some safety limits I need to explain."], "caution": "Non-directivity does not require withholding important information or leaving a client without guidance in an emergency."}], "technique_selection": {"diagram_id": "relationship-cycle", "table": [{"target": "Client feels unheard or misunderstood", "techniques": ["Empathic reflection", "Clarification", "Checking fit", "Relational repair"]}, {"target": "Complex or contradictory feelings", "techniques": ["Reflect both sides", "Allow silence", "Client-led exploration", "Tentative summaries"]}, {"target": "Shame or conditional self-worth", "techniques": ["Non-judgemental acceptance", "Explore conditions of worth collaboratively", "Notice self-evaluative language"]}, {"target": "Unclear client goals", "techniques": ["Open invitation", "Explore hopes and values", "Agree flexible client-defined markers"]}, {"target": "Client requests advice or information", "techniques": ["Clarify request", "Ask permission", "Share balanced options", "Return choice to client"]}, {"target": "Relational rupture", "techniques": ["Name observation tentatively", "Acknowledge impact", "Invite correction", "Repair and seek supervision"]}, {"target": "Acute risk or safeguarding concern", "techniques": ["Direct risk assessment", "Explain limits of confidentiality", "Activate approved safety/referral procedures"]}]}, "problem_applications": [{"problem": "Anxiety and persistent worry", "model": "Relational exploration of fear, self-expectations, uncertainty and context; not a stand-alone protocol for every anxiety disorder.", "maintaining_cycle": ["Client may feel pressure to hide anxiety or judge themselves for having it.", "Avoidance may provide short-term relief while restricting life; explore the client’s experience and function of avoidance without blame.", "External stressors, medical factors and safety realities may be important contributors."], "priority_techniques": ["Empathic reflection of fear and shame", "Explore the client’s own meanings and preferred changes", "Collaborative discussion of additional evidence-based options when needed"], "pitfall": "Do not imply that empathic listening alone is always sufficient for severe anxiety; discuss assessment and appropriate additional care."}, {"problem": "Depression, low self-worth and shame", "model": "Person-centred relational support with attention to risk, functioning, social context and treatment options.", "maintaining_cycle": ["Self-criticism and conditions of worth may make distress harder to disclose.", "Withdrawal can reduce access to support and valued activity, while fatigue and context may constrain action.", "Loss, illness, poverty, discrimination and relationship stress may be central, not peripheral."], "priority_techniques": ["Communicate non-possessive acceptance", "Explore the client’s self-evaluations and unmet needs without imposing an explanation", "Assess suicide/self-harm risk when indicated", "Coordinate additional support when appropriate"], "pitfall": "Avoid ‘positive thinking’ pressure, romanticising suffering or overlooking biological, social and safety factors."}, {"problem": "Grief and loss", "model": "Client-led accompaniment of grief and meaning-making.", "maintaining_cycle": ["Social expectations may dictate how long or how visibly a person should grieve.", "The client may experience mixed emotions, unfinished conversations, practical disruption or cultural obligations.", "Grief is not a uniform sequence and should not be forced into stages."], "priority_techniques": ["Follow the client’s language and pace", "Make room for contradictory feelings", "Explore continuing bonds, identity and practical needs if the client wishes", "Assess complications and risk without pathologising ordinary grief"], "pitfall": "Do not impose closure, a timeline, or a preferred narrative about what the loss should mean."}, {"problem": "Relationship conflict and boundaries", "model": "Individual PCT explores the client’s experience; couple/family work requires specific competence and assessment of safety and coercion.", "maintaining_cycle": ["The client may suppress needs to preserve acceptance or react strongly after prolonged self-silencing.", "Power imbalance, coercive control or abuse may make standard communication advice unsafe.", "Cultural expectations and practical dependencies may constrain choices."], "priority_techniques": ["Explore feelings, needs and perceived conditions of worth", "Support agency without dictating the decision", "Assess interpersonal safety and coercion", "Refer for specialist or safeguarding support when indicated"], "pitfall": "Do not frame abuse as merely mutual communication difficulty or recommend joint sessions where coercion makes them unsafe."}, {"problem": "Trauma-related distress", "model": "Relational safety and choice, coordinated with trauma-informed assessment and treatment where needed.", "maintaining_cycle": ["Threat responses and protective strategies may persist beyond the original context.", "Pressure to disclose can reproduce loss of control.", "Dissociation, medical needs, ongoing danger and environmental instability require attention."], "priority_techniques": ["Prioritise consent, pacing, choice and present safety", "Do not require trauma narrative disclosure", "Monitor overwhelm and dissociation", "Use stabilisation and specialist referral when appropriate"], "pitfall": "PCT does not replace specialist trauma treatment where indicated; never push exposure or disclosure outside competence."}, {"problem": "Identity, belonging and life transitions", "model": "Exploration of self-concept, values, relational expectations and social context.", "maintaining_cycle": ["Conflicting roles or expectations may make some experiences feel unacceptable.", "Fear of rejection can narrow the client’s choices or self-expression.", "Structural discrimination and practical constraints may shape available options."], "priority_techniques": ["Use the client’s own terms for identity and meaning", "Explore belonging, safety, values and chosen support", "Acknowledge systemic context rather than individualising injustice"], "pitfall": "Do not presume that autonomy must look individualistic or that the therapist’s cultural values are universal."}], "session_structure": {"single_session": ["Arrive and reconnect: ask what feels important today and check immediate needs or safety where indicated.", "Listen for the client’s frame of reference, emotional experience, meanings and context.", "Respond empathically and check fit; allow the client to correct the therapist.", "Follow emerging material at a pace the client can tolerate; avoid imposing a predetermined sequence.", "At a natural point, summarise themes and ask what feels most important or unfinished.", "Invite feedback about the session and relationship, including anything that did not fit.", "Agree on a client-chosen next step, continuation or ending; clarify practical arrangements."], "course": ["Beginning: establish informed consent, relationship, hopes, safety and a flexible shared understanding.", "Middle: deepen exploration, notice recurring meanings and self-evaluations, attend to relational process and adjust collaboratively.", "Review: ask what is changing, what remains difficult and whether the approach still fits the client’s needs.", "Ending: discuss ending early enough, explore feelings about separation, consolidate the client’s own learning and plan support if needed.", "Follow-up: when appropriate, invite reflection on what has remained useful and whether additional care is needed."], "ending_script": ["We are approaching the end of our time. What feels most important to take with you today?", "Is there anything we have not understood well enough or anything you want to correct?", "How was it for you to work with me today? Was there anything that felt unhelpful or difficult to say?", "What would you like to do between now and our next meeting, if anything?", "If we are ending the work, what feelings or concerns come up about ending, and what support would be useful?"]}, "worked_case": {"client": "Illustrative composite: an adult client says, ‘I’m successful at work, but I feel like a fraud. My family is proud of me, and I cannot tell them I’m unhappy.’", "presenting_problem": "The client reports anxiety, exhaustion and shame about disappointing family. The therapist avoids immediately labelling this as perfectionism or prescribing a decision to leave the job. The work explores the client’s own experience, relationships, values and constraints while assessing functioning and safety as appropriate.", "formulation_diagram_id": "pct-orientation", "goals": ["The client wants to understand the gap between what they show others and what they experience privately.", "The client wants to feel able to consider choices without being driven solely by shame or fear of disappointing others.", "The client and therapist will review progress in the client’s own terms, without requiring a predetermined career decision."], "sessions": [{"session": "1-2", "focus": "Establish relationship, consent, context and client-defined hopes", "highlights": "Therapist reflects pressure to appear grateful and the loneliness of concealing distress. The client corrects an early reflection, and the therapist welcomes the correction."}, {"session": "3-4", "focus": "Explore conditions of worth, mixed feelings and family meanings", "highlights": "The client begins to name resentment and affection together. The therapist does not treat these feelings as mutually exclusive or dictate what the client should do."}, {"session": "5-6", "focus": "Review agency, practical constraints and emerging choices", "highlights": "The client considers a conversation with a trusted family member, but chooses timing and wording. The therapist offers options only after asking permission."}, {"session": "Review", "focus": "Client feedback, change and further needs", "highlights": "Client reports greater clarity but continuing anxiety. Together they discuss whether to continue, seek additional support or focus on practical decision-making."}], "dialogue": [{"speaker": "Client", "line": "I should be grateful. Other people would love this job."}, {"speaker": "Counsellor", "line": "You feel you ought to be grateful, and that makes it harder to acknowledge how unhappy you are."}, {"speaker": "Client", "line": "Exactly. Then I feel selfish for even thinking about leaving."}, {"speaker": "Counsellor", "line": "There’s fear that wanting something different says something bad about you. What does ‘selfish’ mean in your own mind?"}, {"speaker": "Client", "line": "That I’m letting my parents down. They sacrificed a lot."}, {"speaker": "Counsellor", "line": "Their sacrifices matter deeply to you. And you’re trying to find room for your own experience without dismissing what they’ve given."}], "setback": "The client says the therapist’s question about family expectations felt like criticism of the family. The therapist acknowledges the impact, clarifies that no judgement was intended, asks what was missed, and lets the client redefine the issue. The event becomes a repair opportunity rather than an argument.", "outcome": "The client reports increased clarity and self-compassion, not a magically resolved dilemma. Outcomes vary; a real case requires individual assessment, ongoing feedback and appropriate care. This vignette is illustrative, not a prescribed course or evidence of guaranteed efficacy."}, "tools": [{"name": "Client-led session compass", "level": "foundation", "purpose": "Keep the session anchored in the client’s current priorities and lived experience.", "when": "At the beginning or when the conversation becomes diffuse or therapist-led.", "fields": ["What feels most important today?", "What would you like me to understand?", "What feels helpful or unhelpful in our conversation?", "What would you like to take from today, if anything?"], "example": "Use these as invitations, not a fixed questionnaire; skip or rephrase based on the client’s needs."}, {"name": "Empathy and fit reflection log", "level": "foundation", "purpose": "Support practitioner reflection on whether responses were accurate, tentative and open to correction.", "when": "After sessions, in supervision or when a client appears to withdraw.", "fields": ["Client’s words or experience (minimum necessary detail)", "My response and intention", "How the client responded", "What I may have missed", "How I checked fit or repaired", "What I will bring to supervision"], "example": "Record process and learning rather than a judgement that the client was ‘resistant’."}, {"name": "Client-defined change markers", "level": "foundation", "purpose": "Review progress without imposing a standardised idea of what improvement should look like.", "when": "At review points or when client and therapist need to revisit the purpose of therapy.", "fields": ["What would feel meaningfully different to you?", "How might you notice it in daily life?", "What has shifted, even slightly?", "What remains difficult?", "What would you like to change about our work?"], "example": "A client may define change as being able to name anger without shame, rather than simply reporting lower distress."}, {"name": "Rupture and repair reflection", "level": "advanced", "purpose": "Notice and learn from moments of disconnection.", "when": "When there is tension, silence, compliance, correction or a concern about therapist impact.", "fields": ["What did I observe without assuming?", "What did I feel or do?", "How might power or context matter?", "How did I invite the client’s account?", "What repair or follow-up occurred?", "What belongs in supervision?"], "example": "Treat the client’s disagreement as important information and avoid requiring reassurance that everything is fine."}], "troubleshooting": [{"if": "The client asks, ‘What should I do?’", "try": "Clarify what kind of help they want. Ask permission to share information or options, explain uncertainty and return the decision to them where possible. Do not hide necessary safety guidance behind non-directivity."}, {"if": "The client says your reflection is wrong", "try": "Thank them and invite them to explain what fits better. Avoid defending your interpretation. Use the correction to refine understanding."}, {"if": "The client is silent", "try": "Allow space if appropriate, stay present, and check whether they want time, a prompt, a change of focus or to stop. Do not assume resistance."}, {"if": "The client becomes distressed or overwhelmed", "try": "Slow down, check what is happening and what would help them feel safer. Offer grounding or a pause collaboratively; assess dissociation and risk where indicated, and use appropriate specialist support."}, {"if": "The therapist feels bored, frustrated, rescuing or unusually protective", "try": "Notice the reaction without shaming yourself or acting it out. Consider personal triggers, power, relationship patterns and practical context; take it to supervision."}, {"if": "Sessions feel supportive but no meaningful change is emerging", "try": "Ask the client how they experience the work and whether their hopes are being met. Revisit goals collaboratively and discuss other approaches or referrals without framing the client as failing."}, {"if": "The client repeatedly seeks reassurance", "try": "Explore what reassurance means and what happens after it is given. Avoid abruptly withholding support or reinforcing a pattern without understanding it; consider collaborative options and supervision."}, {"if": "The client discloses abuse or coercive control", "try": "Prioritise safety, confidentiality limits, safeguarding duties and specialist support. Do not frame coercion as ordinary mutual conflict or recommend joint work automatically."}, {"if": "The therapist wants to use a structured technique", "try": "Clarify the purpose, model and evidence; check competence and suitability; explain it and offer choice. Review whether it supports the client’s process or shifts control to the therapist."}, {"if": "The client says the work feels kind but is not helping, or asks for more structure.", "try": "Take the feedback seriously and resist defending a non-directive stance. Ask what would make the work more useful, agree a way to review progress, and discuss options openly. With the client’s consent, consider whether a structured or integrated intervention, consultation, or referral would better meet their needs."}, {"if": "The client becomes quiet or withdraws after an empathic reflection.", "try": "Do not assume the silence means the reflection was accurate or that the client is resisting. Pause, attend to the relationship, and check gently whether the response felt helpful, intrusive, or simply not right. Welcome correction and follow the client’s pace."}, {"if": "The client describes ongoing discrimination, coercion, poverty, unsafe housing or another external constraint.", "try": "Do not recast a realistic response to harm as personal incongruence or a failure of self-acceptance. Explore the client’s meaning and immediate safety, acknowledge material conditions, and collaborate on practical support or referral alongside relational work."}, {"if": "The client appears to agree with the therapist but later does not follow the suggested direction.", "try": "Consider whether professional authority, cultural expectations or fear of disappointing the therapist made disagreement difficult. Reaffirm that the client may decline or revise a proposal, and ask what they themselves want without treating compliance as evidence of readiness."}], "troubleshooting_added": true, "cultural_adaptation": ["Ask clients how they describe themselves and their concerns; do not assume that your preferred vocabulary for emotion, autonomy or growth fits them.", "Explore the role of family, community, faith, language, migration, caste, class, gender, disability and discrimination when relevant to the client.", "Do not treat interdependence, family duty or collective decision-making as inherently unhealthy; understand the client’s own values and choices.", "Use a qualified interpreter when needed, discuss confidentiality and speak to the client rather than about them. Avoid relying on children or untrained family members for sensitive interpretation.", "Recognise that non-directive practice can still carry cultural power. Be transparent about the service’s requirements and the limits of confidentiality.", "Attend to accessibility, neurodivergence, communication differences and sensory needs; ask what helps the client participate.", "Distinguish culturally meaningful practices from coercion or harm by exploring consent, context and impact rather than applying stereotypes.", "In Indian settings, consider family involvement only with appropriate consent and attention to privacy, age, safety and applicable law; family expectations should not replace the client’s voice.", "Ask what emotional expression, privacy, respect and a helpful relationship mean to this client; do not assume that eye contact, disclosure, individual goal-setting or a particular style of reflection signals trust.", "Explore how power, caste, racism, colonisation, migration, poverty, gender, disability and institutional barriers shape the client’s choices. Person-centred practice does not require the therapist to treat unequal conditions as neutral or to explain structural harm as an individual adjustment problem.", "When working through an interpreter, agree how first-person speech, pauses and emotional language will be handled; protect confidentiality and check the client’s experience of the three-way conversation rather than assuming meaning has transferred unchanged.", "Treat autonomy as the client’s own understanding of choice. For some people, family, community, faith or collective responsibilities are central sources of identity and support; explore tensions and resources without imposing an individualistic ideal."], "cultural_adaptation_added": true, "ethics_referral": ["Obtain informed consent for the service, approach, fees, records, confidentiality limits, communication and any use of measures or exercises.", "Work within competence and supervision; be clear about training, role, limitations and when a specialist opinion is needed.", "Explain confidentiality and its limits before sensitive disclosures where possible; follow local law and organisational policy for safeguarding and serious risk.", "Assess suicide/self-harm, harm from others, child/vulnerable-person safeguarding and acute psychiatric or medical concerns when indicated; document actions and rationale.", "Do not use unconditional positive regard to justify collusion, concealment of harm, boundary violations or failure to protect.", "Maintain professional boundaries, avoid exploitative dual relationships, and manage gifts, contact outside sessions and self-disclosure transparently.", "Discuss referral collaboratively where possible, including why, what information will be shared, with whom and under what consent or legal basis.", "Respect client autonomy while recognising legal duties and immediate safety responsibilities; do not promise absolute confidentiality.", "Use secure, proportionate records and protect sensitive information. Record facts, client words, professional hypotheses and actions distinctly.", "Follow the applicable professional code and local jurisdictional rules. The BACP framework is one useful reference but does not govern every practitioner or country.", "Do not present Rogers’ proposed conditions as a guarantee of recovery or as proof that person-centred work alone is sufficient for every concern. Review response and fit with the client, use appropriate outcome and risk processes, and discuss other evidence-informed options when needed.", "Make the limits of the service explicit, including availability between sessions, record-keeping, confidentiality, fees, cancellations, therapist role and what will happen if risk escalates. Revisit these agreements when circumstances change.", "When a client needs practical, medical, diagnostic, safeguarding or specialist support beyond the practitioner’s competence, discuss the reason and options transparently. Wherever safe and feasible, involve the client in the referral and coordinate care with consent."], "ethics_referral_added": true, "client_handouts": [{"title": "Your experience belongs in the room", "give_when": "When introducing a client-led, collaborative approach or discussing the client’s right to disagree.", "body": ["Counselling is a space to explore what life is like for you. You do not have to use the ‘right’ words, agree with the counsellor, or arrive with a clear goal.", "Your counsellor will try to understand your experience from your point of view. They may reflect what they hear, but they can misunderstand. You can correct them, ask them to slow down, change the subject, or say that a response does not fit.", "You can ask questions about the approach, confidentiality, records, fees and choices about your care. Some limits apply, especially where there is a serious safety or safeguarding concern; your counsellor should explain these clearly.", "Counselling is not a test. Progress may mean clearer feelings, greater self-understanding, a decision, asking for support, or recognising that another kind of help is needed."], "try_this": ["If a response does not fit, try saying: ‘That’s not quite it. What I mean is…’", "Before a session, note one thing you hope the counsellor understands, if that is useful to you."], "questions": ["Do I feel able to disagree or ask for a different pace?", "What helps me feel safe enough to speak honestly?", "What would I like my counsellor to understand about my life and context?"], "notes_prompt": "What I want my counsellor to understand"}, {"title": "Noticing feelings without judging yourself", "give_when": "When the client wants a simple reflection aid between sessions; offer it as optional, not as homework required for progress.", "body": ["Feelings can be mixed, confusing or difficult to name. Having a feeling does not automatically mean you must act on it or that it defines who you are.", "You might notice a feeling, a body sensation, a thought about what you ‘should’ feel, and a wish to hide the experience. There is no correct answer and you do not have to write anything you do not want to share.", "If this exercise increases distress, feels unsafe or is not useful, stop and discuss it with your counsellor. It is not a substitute for professional support or urgent help."], "try_this": ["What am I noticing right now?", "What name, if any, fits this feeling?", "What am I telling myself I should feel?", "What would I say to someone I care about who felt this way?", "What support or boundary might I need?"], "questions": ["Does this description fit, or is it more complicated?", "What do I want my counsellor to know about this experience?"], "notes_prompt": "My own words (optional)"}, {"title": "Checking whether counselling feels right for you", "give_when": "When a client wants to reflect on fit, safety and usefulness without being asked to judge themselves or complete compulsory homework.", "body": ["Counselling should make room for your experience and choices. You can take time, disagree, ask questions, request a different pace or decide that an approach is not right for you.", "A counsellor may misunderstand you. A helpful response is not one that sounds impressive; it is one that gives you more room to say what fits and what does not. You do not have to protect the counsellor from feedback.", "Change can be hard to notice and does not always follow a straight line. You and your counsellor can talk about what feels different, what is still difficult, and whether another kind of support may be useful.", "If you feel unsafe, pressured, overwhelmed or at risk, tell someone you trust or contact an appropriate local support service. This reflection sheet is optional and is not a substitute for urgent or professional help."], "try_this": ["What feels easier to say here, and what still feels difficult or unsafe?", "Have I felt listened to in my own words? What would I like the counsellor to understand differently?", "What would make the next conversation more useful for me?", "Would I like to continue, change the way we work, seek another opinion, or pause?"], "questions": ["Do I understand what counselling can and cannot offer?", "Do I know how to raise a concern or ask for a different kind of support?"], "notes_prompt": "What I want to remember or ask (optional)"}], "client_handouts_added": true, "counsellor_sheets": [{"sections": [{"heading": "Client-defined reason for coming and hopes", "items": [{"t": "guide", "text": "Begin with the client’s account. Record their words and meaning rather than converting them into a practitioner-defined goal."}, {"t": "line", "label": "What the client says brought them here", "lines": 3}, {"t": "line", "label": "What the client hopes the work may offer", "lines": 2}, {"t": "guide", "text": "Example prompt: “What feels most important for me to understand about what has brought you here?”"}]}, {"heading": "Context, functioning, relationships and resources", "items": [{"t": "guide", "text": "Explore context with the client’s permission. Note relationships, daily functioning and resources that the client considers relevant, without assuming a single cause."}, {"t": "line", "label": "Relevant current circumstances and effects on daily life", "lines": 3}, {"t": "line", "label": "Relationships and supports the client identifies", "lines": 2}, {"t": "line", "label": "Resources, values or activities that matter to the client", "lines": 2}]}, {"heading": "Feelings, meanings, self-concept and possible incongruence", "items": [{"t": "guide", "text": "Stay close to the client’s language. Explore feelings and meanings with empathy, checking whether a reflection fits. Treat possible incongruence as a tentative understanding, not a label to impose."}, {"t": "line", "label": "Feelings and meanings expressed by the client", "lines": 3}, {"t": "line", "label": "How the client describes themselves or what matters to them", "lines": 2}, {"t": "line", "label": "Possible tension between experience and self-understanding, in tentative language", "lines": 2}, {"t": "guide", "text": "Example reflection: “Part of you feels proud that you keep coping, and another part is exhausted. Have I understood that?”"}]}, {"heading": "Culture, identity, language and accessibility", "items": [{"t": "guide", "text": "Invite the client to say what is important about their identity, culture, language, relationships or access needs. Avoid treating a group identity as an explanation."}, {"t": "line", "label": "What the client wants the practitioner to understand", "lines": 2}, {"t": "line", "label": "Language, communication or accessibility preferences", "lines": 2}, {"t": "line", "label": "Power differences or contextual pressures affecting the work", "lines": 2}]}, {"heading": "Safety and safeguarding assessment or actions where indicated", "items": [{"t": "guide", "text": "A person-centred stance does not mean avoiding direct questions about safety. Explain why you are asking, listen without judgment, and follow the relevant local assessment and safeguarding procedure."}, {"t": "line", "label": "Concern raised or reason for enquiry", "lines": 2}, {"t": "line", "label": "Client’s account, supports and immediate needs", "lines": 3}, {"t": "line", "label": "Consultation, safeguarding or emergency action and follow-up", "lines": 3}], "page_after": true}, {"heading": "Provisional shared understanding in the client’s words", "items": [{"t": "guide", "text": "Offer a brief summary and invite correction. Preserve uncertainty and the client’s preferred language. Do not present the summary as a diagnosis."}, {"t": "line", "label": "Summary offered to the client", "lines": 3}, {"t": "line", "label": "What the client says fits, does not fit or needs changing", "lines": 3}, {"t": "line", "label": "What the client wants to explore next", "lines": 2}]}, {"heading": "Consent, approach, limits, referrals and review plan", "items": [{"t": "guide", "text": "Check the client understands the practitioner’s role, the approach, confidentiality limits and available choices. Revisit consent if the plan changes."}, {"t": "line", "label": "Client’s questions, preferences and consent discussion", "lines": 2}, {"t": "line", "label": "Limits of the service, consultation or referral discussed", "lines": 2}, {"t": "pair", "fields": ["Agreed next step", "Review date"]}, {"t": "guide", "text": "Example: The client asks to slow down and stay with current feelings rather than discuss family history. Record and respect that preference while continuing any necessary safety response."}]}], "title": "Person-centred initial assessment and shared understanding", "use_when": "Use alongside the organisation’s formal intake, consent and risk forms; do not substitute it for mandatory documentation.", "cover": {"title": "Initial assessment and shared understanding", "note": "Record the minimum necessary information. Store completed sheets securely and follow local law and service policy.", "items": [{"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}]}}, {"sections": [{"heading": "Client’s priorities and themes explored", "items": [{"t": "guide", "text": "Record what the client chose to focus on and what they said was important. Avoid replacing their language with a theory before checking it."}, {"t": "line", "label": "Client’s priorities in their words", "lines": 3}, {"t": "line", "label": "Themes explored and what the client wished to stay with or set aside", "lines": 3}]}, {"heading": "Empathic responses, client corrections and new understanding", "items": [{"t": "guide", "text": "Include a concise example of an empathic reflection and the client’s response. Record corrections as useful information."}, {"t": "line", "label": "Client statement or meaning reflected", "lines": 2}, {"t": "line", "label": "Practitioner response and client’s correction or confirmation", "lines": 3}, {"t": "guide", "text": "Example: Practitioner reflects “You felt overlooked in that meeting.” Client corrects: “It was more that nobody asked what I thought.” Record the correction."}]}, {"heading": "Relationship fit, feedback, rupture and repair", "items": [{"t": "guide", "text": "The client’s experience of the relationship matters. Invite feedback and note any strain, what the client identified, and how the practitioner responded."}, {"t": "line", "label": "What the client said about feeling understood or misunderstood", "lines": 2}, {"t": "line", "label": "Rupture, disagreement or change in pace requested", "lines": 2}, {"t": "line", "label": "Repair attempt and the client’s response", "lines": 2}]}, {"heading": "Risk, safeguarding, consultation and referrals if relevant", "items": [{"t": "guide", "text": "Record the enquiry and actions required by the situation and local procedure. A relational stance does not replace safeguarding or risk responsibilities."}, {"t": "line", "label": "Relevant concern and information gathered", "lines": 2}, {"t": "line", "label": "Consultation, referral, rationale and follow-up", "lines": 3}], "page_after": true}, {"heading": "Client-defined change markers and next steps", "items": [{"t": "guide", "text": "Ask how the client would notice change, if change is a current goal. The client may define progress differently from the practitioner."}, {"t": "line", "label": "Words or examples the client uses to describe change", "lines": 2}, {"t": "line", "label": "Client-chosen next step or decision to pause", "lines": 2}, {"t": "pair", "fields": ["Responsible person", "Review date"]}]}, {"heading": "Practitioner reflection and supervision questions", "items": [{"t": "guide", "text": "Reflect on the practitioner’s presence and use of empathy. Consider whether an assumption, urgency or personal reaction affected the work."}, {"t": "line", "label": "What felt clear or uncertain in the session?", "lines": 2}, {"t": "line", "label": "Where might I have led, interpreted or moved too quickly?", "lines": 2}, {"t": "line", "label": "Question to bring to supervision or consultation", "lines": 2}]}], "title": "Session process, relationship feedback and supervision record", "use_when": "Use after a session to document the work, the client’s feedback, any risk actions and practitioner learning securely.", "cover": {"title": "Session record", "note": "Use the approved record system and minimum necessary identifying information. Follow local privacy and retention procedures.", "items": [{"t": "pair", "fields": ["Client identifier", "Date and session number"]}, {"t": "pair", "fields": ["Practitioner and role", "Mode or setting"]}, {"t": "line", "label": "Others present and relevant context", "lines": 2}]}}, {"sections": [{"heading": "What the client says is useful, unhelpful or missing", "items": [{"t": "guide", "text": "Invite the client’s view without defending the work. Their feedback can guide pace, focus or referral decisions."}, {"t": "line", "label": "What the client says is useful", "lines": 2}, {"t": "line", "label": "What feels unhelpful, missing or too much", "lines": 2}, {"t": "line", "label": "What the client wants changed, if anything", "lines": 2}]}, {"heading": "Client language for hopes, meaning and change so far", "items": [{"t": "guide", "text": "Keep the client’s own words. Avoid substituting the practitioner’s preferred outcome."}, {"t": "line", "label": "Hopes the client wants to keep in view", "lines": 2}, {"t": "line", "label": "What the client says has changed or not changed", "lines": 3}, {"t": "line", "label": "What the client wants the work to mean for them", "lines": 2}]}, {"heading": "Moments of connection, misunderstanding, disagreement or repair", "items": [{"t": "guide", "text": "Notice the client’s experience of the relationship. A disagreement can be explored without treating the client as difficult."}, {"t": "line", "label": "Moment the client felt understood or connected", "lines": 2}, {"t": "line", "label": "Moment of misunderstanding, discomfort or disagreement", "lines": 2}, {"t": "line", "label": "What was said or done to repair, and how the client responded", "lines": 3}]}, {"heading": "Contextual pressures, identity, power and access needs", "items": [{"t": "guide", "text": "Consider how the service, practitioner role or wider context may affect the client’s choices and sense of safety."}, {"t": "line", "label": "Context or structural pressure the client wants considered", "lines": 2}, {"t": "line", "label": "Identity, language, disability or accessibility needs", "lines": 2}, {"t": "line", "label": "Power difference or practical barrier to participation", "lines": 2}]}, {"heading": "Current functioning, risk, protective factors and practical needs", "items": [{"t": "guide", "text": "Record relevant functioning and support. Ask directly about safety when indicated, and follow local procedures."}, {"t": "line", "label": "Changes in daily functioning the client considers important", "lines": 2}, {"t": "line", "label": "Protective supports and practical needs", "lines": 2}, {"t": "line", "label": "Safety enquiry, response and action if relevant", "lines": 3}], "page_after": true}, {"heading": "Options discussed: continue, adapt, integrate, consult or refer", "items": [{"t": "guide", "text": "Explore options transparently and collaboratively. Explain any limits or safety requirements. Do not promise an approach can meet needs outside its scope."}, {"t": "ticks", "label": "Options considered", "options": ["Continue at current pace", "Change pace or focus", "Consult or seek supervision", "Discuss a referral", "Other option raised by client"]}, {"t": "line", "label": "What the client wants to know about the options", "lines": 2}, {"t": "line", "label": "Client’s response or questions", "lines": 2}]}, {"heading": "Client’s choice, review date and agreed next step", "items": [{"t": "guide", "text": "Document the client’s choice, including a decision not to continue or to take time. Agree practical follow-up and who will do what."}, {"t": "line", "label": "Client’s choice and reasoning in their words", "lines": 2}, {"t": "table", "columns": ["Agreed next step", "Responsible person", "Review date"], "rows": 2}, {"t": "line", "label": "What should be revisited next time?", "lines": 2}]}], "title": "Relational process, fit and client-defined change review", "use_when": "Use periodically or when the client reports that the work is not helping, feels misunderstood, or wants a different pace or approach. This supports reflection and does not replace outcome measures or required records.", "cover": {"title": "Relational process and change review", "note": "Record the minimum necessary information. Store completed sheets securely and follow local law and service policy.", "items": [{"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}]}}], "counsellor_sheets_added": true, "session_note_template": {"fields": [{"label": "Session details", "guidance": "Date, duration, session number, modality, attendees and practitioner. Use the organisation’s secure identifier policy and avoid unnecessary identifying detail."}, {"label": "Client’s priorities", "guidance": "Record the client’s own stated focus and key concerns in concise, respectful language."}, {"label": "Experience and meaning", "guidance": "Summarise emotions, meanings, context, strengths and relevant functioning; distinguish client report from practitioner hypothesis."}, {"label": "Therapeutic process", "guidance": "Record significant empathic reflections, client corrections, relationship feedback, rupture/repair or changes in focus where clinically relevant."}, {"label": "Risk and safeguarding", "guidance": "Document assessment, rationale, protective factors, consultation, actions, referrals and follow-up where indicated. Use approved risk forms and local policy."}, {"label": "Client response and review", "guidance": "Note how the client experienced the session and any client-defined change marker or feedback."}, {"label": "Plan and sign-off", "guidance": "Record agreed next steps, referrals, review plan and practitioner sign-off. Avoid claiming that a client ‘agreed’ if they were compliant or uncertain."}, {"label": "Context, power and access", "guidance": "Record relevant social or material conditions, identity and accessibility factors, and how these shaped the session. Avoid treating structural barriers as individual pathology."}, {"label": "Fit of the work and client feedback", "guidance": "Note the client’s view of the relationship and approach, including disagreement or correction, and any agreed change in focus, pace, method or referral."}], "note": "This template supports, but does not replace, mandatory clinical records, risk forms, local legal requirements or the practitioner’s professional judgement."}, "session_note_template_added": true, "online_adaptations": ["Confirm the client’s identity, current location and a reliable call-back number at the start of each remote session, following organisational policy.", "Check privacy, who may overhear, whether the client can speak freely, and whether headphones or a safer setting would help.", "Agree on a reconnection plan if the call drops and an emergency plan appropriate to the client’s current location.", "Discuss limits of digital confidentiality, platform security, recording policy, data storage and messaging boundaries.", "Attend to camera-off preferences, delays, screen fatigue, accessibility, bandwidth and cultural differences in eye contact.", "Silence and emotional shifts can be harder to read online; check rather than infer.", "Use secure, approved systems and follow local licensing, jurisdiction, consent and record-keeping requirements.", "Do not conduct remote work when privacy, acute risk response or suitability cannot be adequately managed; arrange an appropriate alternative.", "At the start of remote work, agree how the client can signal that someone has entered the room, they need to pause, or the conversation no longer feels private; do not assume a camera view shows the whole setting.", "Notice how lag, camera framing, silence and screen fatigue affect the relationship. Check the client’s experience before interpreting a pause, limited eye contact or a brief response as emotional distance.", "If a client cannot speak safely or privately, collaborate on alternatives such as rescheduling, a different channel or an agreed neutral check-in. Follow local policy for identity, location, emergency response and secure records."], "online_adaptations_added": true, "tips": ["Empathy is an ongoing effort to understand, not a performance of perfect understanding.", "Acceptance is of the person’s dignity, not automatic approval of every behaviour.", "Congruence requires awareness and responsibility; it is not unfiltered disclosure.", "A question can be directive through its assumptions even when phrased gently.", "Invite feedback explicitly; clients may not volunteer disagreement when there is a power imbalance.", "Let goals evolve, but review whether the work remains useful and appropriate.", "Keep social and material context in view; not all distress is an intrapsychic problem.", "When offering a structured method, name its theoretical origin and do not present it as classical Rogersian practice without qualification."], "pitfalls": ["Reducing PCT to ‘just listening’ or repeating the client’s last sentence.", "Treating the six conditions as a checklist that guarantees recovery or as proof that other care is unnecessary.", "Confusing empathy with agreement, sympathy, reassurance or mind-reading.", "Assuming non-directivity means never asking questions, offering information, setting boundaries or acting on safety concerns.", "Using warmth to encourage compliance or avoid difficult conversations about risk and harm.", "Overusing therapist self-disclosure to meet the therapist’s emotional needs.", "Treating diagnostic labels as either the whole truth or inherently incompatible with person-centred work.", "Assuming the client’s family, culture or community is the problem without exploring their meaning and resources.", "Using experiential techniques without training, consent, suitability checks or a clear rationale.", "Failing to review outcomes, relationship fit or the possibility that another intervention would better meet the client’s needs."], "competency_checklist": ["I explained the approach, consent, confidentiality limits, records and professional boundaries.", "I invited the client to define what mattered and used their own language where possible.", "I listened for emotion and meaning rather than rushing to solve or classify.", "I offered empathic responses tentatively and checked whether they fit.", "I welcomed disagreement, correction and feedback without defensiveness.", "I communicated acceptance without approving harmful behaviour or abandoning boundaries.", "I monitored my congruence and used self-disclosure only when client-serving.", "I considered power, culture, identity, accessibility and material context.", "I assessed and acted on safety or safeguarding concerns when indicated.", "I offered information, structured methods and referrals transparently with meaningful choice where possible.", "I documented the client’s account, hypotheses, actions and decisions distinctly.", "I reviewed whether the client found the work helpful and sought supervision when needed.", "I checked whether the client experiences the relationship and approach as useful, safe and sufficiently collaborative.", "I recognised when external conditions, power or access barriers required practical action or coordination beyond exploratory therapy.", "I discussed limits or alternatives openly when the client wanted more structure or the current approach was not meeting their needs.", "I used supervision and consultation to examine my emotional responses, assumptions and possible blind spots without disclosing unnecessary identifying information."], "competency_checklist_added": true, "supervision_prompts": ["Where did I feel most genuinely present, and where did I become performative, avoidant or overly directive?", "What assumptions did I make about the client’s experience, identity, family or goals? How did I check them?", "What happened when the client disagreed with me? Did I welcome the correction in practice?", "How might my professional role, culture, social position or institutional constraints shape the client’s choices?", "Did my acceptance communicate dignity while remaining clear about harm, boundaries and safety?", "Was any self-disclosure or advice for the client’s benefit, or was it meeting my own need?", "What relational rupture might have occurred, including one the client did not name? How could I invite feedback safely?", "Am I using a structured experiential technique? What model is it from, what is the rationale, and am I trained and supervised to use it?", "Are there medical, psychiatric, trauma, substance-use, safeguarding or social-care needs that require coordinated support?", "What evidence or feedback would tell us that the current approach is helping, not helping or needs to change?", "What do I need to document, consult on or follow up before the next session?", "What did the client say about whether the work is useful? How did I respond without defending the approach?", "Did I mistake quietness, agreement or politeness for trust, readiness or shared meaning? What evidence supports my interpretation?", "How did structural conditions and access needs shape what was possible, and what practical or coordinated support should be considered?", "Is person-centred work alone an adequate fit at this stage? What options, consultation or referral should be discussed transparently with the client?"], "supervision_prompts_added": true, "quiz": [{"question": "Which statement best describes empathic understanding?", "options": ["Knowing exactly what the client feels", "Trying to understand the client’s frame of reference while remaining open to correction", "Agreeing with the client’s decisions", "Giving the client reassurance that everything will be fine"], "rationale": "Empathy is an active, tentative and revisable effort to understand the client’s internal frame of reference, not mind-reading or agreement.", "answer": 1}, {"question": "Unconditional positive regard means:", "options": ["Approving every action", "Avoiding all boundaries", "Respecting the client’s dignity without making their worth conditional on compliance", "Never naming harmful behaviour"], "rationale": "Acceptance of the person does not remove the need to discuss consequences, maintain boundaries or protect safety.", "answer": 2}, {"question": "Non-directivity is best understood as:", "options": ["Never asking questions", "Avoiding unnecessary control over the client’s agenda and meanings while remaining professionally responsible", "Never giving information", "Letting safety concerns remain unaddressed"], "rationale": "Non-directivity is not passivity. Practitioners remain responsible for transparent guidance, risk response and safeguarding.", "answer": 1}, {"question": "A client says your reflection is wrong. The most person-centred response is to:", "options": ["Explain why your interpretation is clinically correct", "Move on quickly", "Thank them and invite them to explain what fits better", "Tell them they may be resisting the work"], "rationale": "The client’s correction is important information about their experience and the relationship. Welcome it without defensiveness.", "answer": 2}, {"question": "Which is true about Rogers’ six conditions?", "options": ["They are a validated checklist that guarantees recovery", "They include therapist congruence, unconditional positive regard and empathic understanding communicated to the client", "They mean assessment is never needed", "They apply identically to every therapeutic approach"], "rationale": "Rogers’ 1957 statement specifies six conditions as a theoretical proposition. It should guide understanding without being treated as a guaranteed protocol.", "answer": 1}, {"question": "When considering a structured experiential technique, a practitioner should:", "options": ["Use it because all techniques are person-centred", "Avoid all structure regardless of client preference", "Explain its rationale, check competence and suitability, obtain consent and preserve meaningful choice", "Require completion to demonstrate progress"], "rationale": "The role of techniques is debated. Fit, transparency, consent, competence and the client’s experience matter.", "answer": 2}, {"question": "A non-directive stance during imminent risk means:", "options": ["The therapist must not intervene", "The client alone is responsible for deciding whether safety procedures occur", "The therapist should explain limits and activate appropriate safety procedures", "The therapist should only reflect feelings"], "rationale": "Person-centred values do not remove professional responsibilities for urgent risk, safeguarding or emergency care.", "answer": 2}], "quick_reference": ["Core stance: understand the client’s lived world without taking ownership of its meaning.", "Rogers’ three therapist attitudes: congruence, unconditional positive regard and empathic understanding.", "Non-directivity means not imposing the practitioner’s agenda; it does not mean passivity or neglecting safety duties.", "Offer interpretations, information, exercises and advice transparently, with consent and room to decline.", "Person-centred practice includes a family of related approaches; specify the model when using experiential methods.", "Evidence supports the importance of the therapeutic relationship across therapies; claims that relationship conditions alone are sufficient for every client and problem remain debated."], "glossary": [{"term": "Actualising tendency", "definition": "Rogers’ theoretical idea of an inherent tendency toward maintaining and developing capacities; not a guarantee of uncomplicated growth."}, {"term": "Congruence", "definition": "The therapist’s genuine, integrated presence and awareness in the relationship; not unfiltered self-disclosure."}, {"term": "Conditions of worth", "definition": "Perceived requirements for being acceptable or valued, which may shape self-evaluation and concealment of experience."}, {"term": "Empathic understanding", "definition": "An effort to understand the client’s internal frame of reference as if it were one’s own while remembering it is not one’s own."}, {"term": "Incongruence", "definition": "A mismatch between lived experience and self-concept or self-structure, as described in person-centred theory."}, {"term": "Non-directivity", "definition": "An orientation that avoids unnecessary imposition of the therapist’s agenda while retaining professional responsibility."}, {"term": "Organismic experience", "definition": "The person’s lived, felt experience, including bodily and emotional aspects, as conceptualised in Rogersian theory."}, {"term": "Person-centred therapy", "definition": "A humanistic approach grounded in the client’s subjective experience and the therapeutic relationship, associated with Carl Rogers."}, {"term": "Psychological contact", "definition": "A meaningful psychological relationship between client and therapist, part of Rogers’ six-condition formulation."}, {"term": "Unconditional positive regard", "definition": "Non-possessive acceptance and respect for the client as a person, without making their worth conditional on approval or compliance."}, {"term": "Rupture and repair", "definition": "A moment of strain or disconnection in the therapeutic relationship and the process of acknowledging and working through it."}, {"term": "Experiential therapy", "definition": "A family of approaches that emphasise immediate experience and emotional processing; related methods are not all identical to classical PCT."}], "related_modules": ["motivational-interviewing"], "safety_note": "If risk to life or safety emerges at any point, pause routine exploratory work and follow the applicable local risk-assessment, safeguarding, emergency and referral procedures. Explain limits of confidentiality clearly, document actions and seek appropriate consultation. In India, emergency services are available at 112 and Tele-MANAS mental health support at 14416. Person-centred principles do not remove professional duties to act when immediate safety is at stake."}};
