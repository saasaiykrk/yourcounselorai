<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourCounselor | Person-Centred Therapy</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* YourCounselor — module reader styles
 * Follows the YourCounselor Brand & Document System v1.1 (locked) and the
 * approved sample work-up. Colours, fonts and components below are the only
 * ones allowed. Light theme only: the brand system defines no dark palette.
 */
:root {
  --plum: #3D0A6B;        /* headings, body text */
  --muted: #6E587E;       /* secondary text */
  --purple: #6A1BB5;      /* primary accent, links, numbers, buttons */
  --pink: #E8336D;        /* brand accent: accent bar only */
  --pink-text: #C2185B;   /* pink for small text */
  --ink: #260644;         /* dark bands */
  --on-ink: #FAF7FD;
  --on-ink-muted: #CDBEDF;
  --paper: #FFFFFF;
  --lilac: #F7F3FB;       /* page tint */
  --soft: #FAF7FC;        /* table header, quiet boxes */
  --tint: #F0E8F9;        /* chips, note boxes */
  --line: #E7DFEF;
  --line-strong: #D1C0DF;
  --ok: #1E7E34;     --ok-bg: #EAF7EC;     --ok-border: #BFE3C6;
  --warn: #9A5B00;   --warn-bg: #FFF4E0;   --warn-border: #F2D9A8;
  --danger: #B4233F; --danger-bg: #FDECEF; --danger-border: #F4C2CC;
  --head: 'Nunito', 'Inter', sans-serif;
  --body: 'Nunito Sans', 'Inter', sans-serif;
  --sidebar: 264px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--lilac); color: var(--plum); font: 400 16px/1.6 var(--body); }
h1, h2, h3, h4 { font-family: var(--head); color: var(--plum); line-height: 1.2; margin: 0; }
p { margin: 0 0 10px; }
strong { font-weight: 700; }
a { color: var(--purple); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { margin: 4px 0 12px; padding-left: 22px; }
li { margin-bottom: 5px; }
.muted { color: var(--muted); }

/* ---------- content protection ---------- */
.yc-protected, .yc-protected * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.yc-protected input, .yc-protected textarea { -webkit-user-select: text; user-select: text; }
@media print {
  body * { display: none !important; }
  body::after { content: "Printing is disabled for YourCounselor modules."; display: block !important; padding: 40px; font: 18px var(--body); color: var(--plum); }
}

/* ---------- watermark (viewer name + email) ---------- */
.yc-watermark { position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .08; background-repeat: repeat; }

/* ---------- logo lockup (logo + wordmark, gap = 1/4 logo height) ---------- */
.yc-lockup { display: flex; align-items: center; gap: 8px; /* gap = 1/4 logo height */ font: 800 19px var(--head); color: var(--plum); text-decoration: none; padding: 16px 0; }
.yc-lockup img { width: 32px; height: 32px; display: block; }
.yc-lockup.cover { padding: 0 0 22px; }
.yc-skip { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--purple); color: #FFFFFF; padding: 8px 14px; border-radius: 8px; font: 700 14px var(--head); }
.yc-skip:focus { left: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- layout ---------- */
.yc-app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.yc-sidebar { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--paper); border-right: 1px solid var(--line); padding: 4px 18px 24px; display: flex; flex-direction: column; }
.yc-sidebar .eyebrow-label { font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .06em; color: var(--purple); margin: 18px 0 6px; }
.yc-modlist a, .yc-toc a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--plum); font-size: 14px; }
.yc-modlist a.active { background: var(--tint); color: var(--purple); font-weight: 700; }
.yc-toc a { color: var(--muted); font-size: 13.5px; }
.yc-toc a .n { color: var(--purple); font-weight: 700; margin-right: 6px; font-family: var(--head); }
.yc-toc a:hover { background: var(--soft); color: var(--plum); text-decoration: none; }
.yc-toc a.is-hidden, .yc-mobile-toc a.is-hidden { opacity: .45; }
.yc-toc a.active { background: var(--tint); color: var(--purple); font-weight: 700; box-shadow: inset 3px 0 0 var(--purple); }
.yc-owner { margin-top: auto; padding-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.yc-owner strong { color: var(--plum); }

.yc-main { min-width: 0; }
.yc-topbar { display: none; }
.yc-sticky { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.yc-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 28px; background: var(--paper); }
.yc-toolbar input[type=search] { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px var(--body); }
.yc-toolbar input[type=search]::placeholder { color: var(--muted); }
.yc-toolbar input[type=search]:focus { outline: 2px solid var(--purple); outline-offset: 0; border-color: var(--purple); }
.yc-seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--paper); }
.yc-seg button { border: 0; background: none; color: var(--muted); padding: 8px 14px; font: 700 13px var(--head); cursor: pointer; }
.yc-seg button + button { border-left: 1px solid var(--line); }
.yc-seg button[aria-pressed=true] { background: var(--purple); color: #FFFFFF; }
.yc-filter-status { padding: 8px 28px; font-size: 14px; background: var(--tint); color: var(--plum); border-top: 1px solid var(--line); }
.yc-filter-status .yc-jump { border: 0; background: none; padding: 4px 2px; font: inherit; color: var(--purple); text-decoration: underline; cursor: pointer; }
.yc-btn { border: 1px solid var(--purple); background: var(--paper); color: var(--purple); border-radius: 999px; padding: 4px 13px; font: 700 13px var(--head); cursor: pointer; }
.yc-btn:hover { background: var(--tint); }
.yc-filter-status .yc-clear { margin-left: 6px; }
.yc-content { max-width: 900px; margin: 0 auto; padding: 24px 28px 80px; }
.yc-mobile-toc { display: none; }

@media (max-width: 900px) {
  .yc-app { grid-template-columns: 1fr; }
  .yc-sidebar { display: none; }
  .yc-topbar { display: flex; align-items: center; padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .yc-topbar .yc-lockup { padding: 10px 0; font-size: 17px; gap: 7px; }
  .yc-topbar .yc-lockup img { width: 28px; height: 28px; }
  .yc-toolbar { padding: 8px 16px; }
  .yc-filter-status { padding: 6px 16px; font-size: 13.5px; }
  .yc-content { padding: 16px 16px 64px; }
  .yc-mobile-toc { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 8px; border-top: 1px solid var(--line); scrollbar-width: none; }
  .yc-mobile-toc a { flex: none; display: inline-flex; align-items: center; min-height: 36px; font: 700 12.5px var(--head); padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--tint); color: var(--purple); text-decoration: none; }
  .yc-mobile-toc a.active { background: var(--purple); border-color: var(--purple); color: #FFFFFF; }
  .yc-seg button { min-height: 40px; }
  .yc-btn { min-height: 36px; }
  .check { min-height: 44px; }
}

/* ---------- module cover (header) ---------- */
.yc-cover { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
.yc-cover-body { padding: 28px 28px 20px; }
.eyebrow { display: inline-block; font: 700 11px var(--head); letter-spacing: .06em; text-transform: uppercase; color: var(--purple); background: var(--tint); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; }
.yc-cover h1 { font-weight: 800; font-size: 36px; letter-spacing: -0.02em; margin: 14px 0 8px; max-width: 640px; }
.yc-cover .sub { font-size: 17px; color: var(--muted); max-width: 600px; margin: 0; }
.yc-cover-meta { display: grid; grid-template-columns: 140px 1fr; row-gap: 6px; margin: 20px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14.5px; }
.yc-cover-meta dt { color: var(--muted); }
.yc-cover-meta dd { margin: 0; color: var(--plum); }
.yc-cover-band { position: relative; background: var(--ink); color: var(--on-ink-muted); padding: 18px 28px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; align-items: flex-end; }
.yc-cover-band::before { content: ''; position: absolute; left: 0; top: 0; height: 5px; width: 100%; background: linear-gradient(90deg, var(--purple) 0 80%, var(--pink) 80% 100%); }
.yc-cover-band strong { color: var(--on-ink); }
@media (max-width: 520px) { .yc-cover h1 { font-size: 28px; } .yc-cover-body { padding: 22px 18px 16px; } .yc-cover-band { padding: 16px 18px 12px; } .yc-cover-meta { grid-template-columns: 110px 1fr; } }

/* ---------- quick reference (pinned) ---------- */
.yc-quickref { margin: 0 0 18px; }

/* ---------- sections ---------- */
details.section { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px; scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
details.section > summary { list-style: none; cursor: pointer; padding: 18px 22px; display: flex; align-items: center; gap: 10px; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary h2 { font-size: 22px; font-weight: 700; flex: 1; }
details.section > summary::after { content: "▾" / ""; color: var(--muted); transition: transform .2s; }
details.section:not([open]) > summary::after { transform: rotate(-90deg); }
details.section[data-always-open] > summary { cursor: default; }
details.section[data-always-open] > summary::after { content: none; }
h2 .num { color: var(--purple); margin-right: 6px; }
.section-body { padding: 0 22px 20px; }
h3 { font-size: 17px; font-weight: 700; margin: 18px 0 6px; }
h4 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; }
.item { border-top: 1px solid var(--line); padding: 18px 0; }
.item:first-child { border-top: 0; padding-top: 4px; }
.item { scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
.item > h3 { margin-top: 0; }
.label-line { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin: 12px 0 4px; display: block; }
.not-covered { color: var(--muted); }

/* ---------- chips (status pills) ---------- */
.chip { display: inline-block; font: 700 11px var(--head); padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--tint); color: var(--purple); white-space: nowrap; vertical-align: 2px; margin-left: 4px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.chip.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.chip.plain { background: var(--paper); color: var(--muted); }

/* ---------- callouts: Why this matters · Note · Caution · Risk ---------- */
.box { border-left: 4px solid var(--purple); background: var(--soft); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0; }
.box .label { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 3px; color: var(--purple); }
.box > :last-child { margin-bottom: 0; }
.box.why { background: var(--tint); }
.box.warn { border-color: var(--warn); background: var(--warn-bg); } .box.warn .label { color: var(--warn); }
.box.danger { border-color: var(--danger); background: var(--danger-bg); } .box.danger .label { color: var(--danger); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 6px 0 12px; }
table.yc { width: 100%; border-collapse: collapse; font-size: 15px; border-color: var(--line); }
table.yc thead, table.yc tbody, table.yc tr { border-color: var(--line); }
table.yc th { background: var(--soft); font: 700 14px var(--head); text-align: left; color: var(--plum); }
table.yc th, table.yc td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
table.yc td { color: var(--muted); }
table.yc td:first-child { color: var(--plum); font-weight: 700; }
table.yc td strong { color: var(--plum); }
table.yc.dialogue td:first-child { width: 96px; font-family: var(--head); }
table.yc.dialogue .note { display: block; font-size: 13.5px; color: var(--purple); margin-top: 3px; }
@media (max-width: 520px) {
  table.yc, table.yc tbody, table.yc tr, table.yc td { display: block; width: 100%; }
  table.yc thead { display: none; }
  table.yc tr { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; padding: 6px 10px; background: var(--paper); }
  table.yc td { border: 0; padding: 4px 0; }
  table.yc td::before { content: attr(data-label); display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); }
  table.yc.dialogue td:first-child { width: auto; }
}

/* ---------- diagrams ---------- */
figure.dg { margin: 12px 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
figure.dg figcaption { font-size: 13.5px; color: var(--muted); margin-top: 8px; text-align: center; }
figure.dg .dg-title { font: 700 14px var(--head); color: var(--plum); margin: 0 0 8px; text-align: center; }
.dg-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.dg-svg { width: 100%; height: auto; display: block; max-width: 680px; margin: 0 auto; }
.dg-hint { display: none; font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 4px; }
@media (max-width: 600px) { .dg-svg { min-width: 560px; } .dg-hint { display: block; } figure.dg { padding: 10px; } }
.dg-box { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1.4; }
.dg-context .dg-box, .dg-question .dg-box { fill: var(--tint); stroke: var(--line-strong); }
.dg-level-0 .dg-box { fill: var(--paper); } .dg-level-1 .dg-box { fill: var(--soft); }
.dg-level-2 .dg-box { fill: var(--tint); } .dg-level-3 .dg-box { fill: var(--line); }
.dg-text { fill: var(--plum); font-family: var(--body); }
.dg-edge { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.dg-edge-back { stroke-dasharray: 5 4; }
.dg-arrowhead { fill: var(--muted); }
.dg-label-bg { fill: var(--paper); stroke: var(--line); }
.dg-label-text, .dg-axis { fill: var(--muted); font-family: var(--body); }
.dg-branch { fill: var(--purple); font-weight: 700; font-family: var(--head); }
.dg-frame { fill: none; stroke: var(--line-strong); stroke-dasharray: 6 5; }

/* ---------- quiz & checklist (quiz uses neutral brand colours, never status colours) ---------- */
.quiz-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.quiz-head .quiz-score { margin: 0; }
.quiz-q { border-top: 1px solid var(--line); padding: 16px 0; }
.quiz-q > p { font-weight: 600; margin: 0 0 8px; }
.quiz-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px/1.5 var(--body); cursor: pointer; }
.quiz-opt:hover:not([aria-disabled]) { border-color: var(--purple); }
.quiz-opt[aria-disabled] { cursor: default; }
.quiz-opt.correct { background: var(--tint); border: 2px solid var(--purple); }
.quiz-opt.picked { background: var(--soft); color: var(--muted); border-style: dashed; }
.quiz-tag:empty { display: none; }
.quiz-tag { display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin-bottom: 2px; }
.quiz-opt.picked .quiz-tag { color: var(--muted); }
.quiz-why { display: none; outline: none; }
.quiz-q.answered .quiz-why { display: block; }
.quiz-score { font: 700 15px var(--head); color: var(--purple); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { color: var(--plum); margin-top: 5px; accent-color: var(--purple); width: 18px; height: 18px; flex: none; }

/* ---------- client handouts ---------- */
.handout-preview { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 8px 0; background: var(--paper); }
.handout-notes { margin: 6px 0 0; font-size: 14px; }
.yc-handout-dl { min-height: 40px; }

/* ---------- crisis lines ---------- */
.crisis-list { margin: 6px 0 0; padding-left: 20px; }
.crisis-list li { margin-bottom: 6px; }
.crisis-list a { font-weight: 700; display: inline-block; padding: 2px 0; }
.crisis-region { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* ---------- disclaimer + copyright & IP notice (always last) ---------- */
.disclaimer { border: 1px dashed var(--line-strong); background: var(--soft); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); margin-top: 22px; }
.disclaimer strong { color: var(--plum); }
.ip-notice { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; font-size: 13px; line-height: 1.55; color: var(--muted); }
.ip-notice strong { color: var(--plum); }

/* ---------- floating Home button + search landing highlight ---------- */
.yc-home-fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 60; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--purple); color: #FFFFFF; font: 800 14px var(--head); box-shadow: 0 5px 18px rgba(61, 10, 107, .24); cursor: pointer; }
.yc-home-fab[hidden] { display: none; }
.yc-home-fab:hover { background: var(--plum); }
.yc-home-fab:focus-visible { background: var(--plum); outline: 2px solid var(--purple); outline-offset: 3px; }
.yc-hit { border-radius: 4px; animation: yc-hit 2.2s ease-out; }
@keyframes yc-hit { 0%, 45% { background: var(--line-strong); box-shadow: 0 0 0 4px var(--line-strong); } 100% { background: transparent; box-shadow: 0 0 0 4px transparent; } }
.yc-sticky { transition: transform .2s ease; }
@media (max-width: 900px) { .yc-sticky.yc-compact { transform: translateY(calc(-1 * var(--yc-toolbar-h, 0px))); } }
@media (prefers-reduced-motion: reduce) { .yc-sticky { transition: none; } .yc-hit { animation-duration: .01s; outline: 2px solid var(--purple); } }
@media print { .yc-home-fab { display: none !important; } }

.hidden-by-filter { display: none !important; }
::highlight(yc-search) { background-color: var(--line-strong); color: var(--plum); }
.handout-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.yc-handout-dl:disabled { opacity: .55; cursor: not-allowed; }
.yc-handout-status { margin: 4px 0 0; font-size: 14px; min-height: 0; }
.yc-handout-status:empty { display: none; }
.yc-preview-toggle { display: none; }
@media (max-width: 520px) {
  .handout-preview:not(.expanded) { max-height: 240px; overflow: hidden; position: relative; }
  .handout-preview:not(.expanded)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(rgba(255,255,255,0), var(--paper)); }
  .yc-preview-toggle { display: inline-flex; }
}
.sheet-inside { font-size: 14px; color: var(--muted); }

/* ---------- responsive refinements: tablet and phone ---------- */
.yc-app, .yc-main, .yc-content, .section-body, .item { min-width: 0; }
.yc-content img, .yc-content video, .yc-content canvas, .yc-content iframe { max-width: 100%; }
.yc-content pre, .yc-content code { overflow-wrap: anywhere; }
.table-wrap, .dg-scroll { max-width: 100%; overscroll-behavior-inline: contain; }
.yc-content :focus-visible, .yc-mobile-toc a:focus-visible, .yc-toolbar button:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
@media (min-width: 901px) and (max-width: 1100px) {
  .yc-app { grid-template-columns: 240px minmax(0, 1fr); }
  .yc-content, .yc-toolbar { padding-left: 22px; padding-right: 22px; }
}
@media (max-width: 900px) {
  .yc-mobile-toc { scroll-snap-type: x proximity; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
  .yc-mobile-toc a { scroll-snap-align: start; min-height: 44px; }
  .yc-topbar { min-height: 52px; }
  .yc-content { width: 100%; }
  .yc-sticky { max-width: 100vw; }
  .yc-toolbar input[type=search] { flex: 1 1 100%; }
  .yc-seg { flex: 1 1 auto; }
  .yc-seg button { flex: 1 1 auto; }
  .yc-filter-status { overflow-wrap: anywhere; }
  details.section > summary { padding: 16px 18px; }
  .section-body { padding: 0 18px 18px; }
  figure.dg { max-width: 100%; }
}
@media (max-width: 520px) {
  html { scroll-padding-top: 150px; }
  .yc-content { padding: 12px 12px 48px; }
  .yc-toolbar { gap: 7px; padding: 8px 12px; }
  .yc-filter-status, .yc-mobile-toc { padding-left: 12px; padding-right: 12px; }
  details.section { margin-bottom: 10px; }
  details.section > summary { gap: 8px; padding: 14px 12px; }
  details.section > summary h2 { font-size: 19px; overflow-wrap: anywhere; }
  .section-body { padding: 0 12px 14px; }
  .item { padding: 14px 0; }
  .box { padding-left: 11px; padding-right: 12px; }
  .yc-cover-meta { grid-template-columns: minmax(88px, 34%) minmax(0, 1fr); }
  .yc-cover-meta dd, .yc-cover-meta dt { overflow-wrap: anywhere; }
  .handout-preview { padding: 12px; }
}

var DATA = {"slug": "person-centred-therapy", "title": "Person-Centred Therapy", "summary": "A comprehensive clinical learning module on Rogersian person-centred therapy: the philosophy, therapeutic conditions, relational practice, assessment, applications, ethics and contemporary debates.", "category": "Humanistic · Relational · Experiential", "audience": "Psychologists, professional counsellors, psychotherapists and supervised practitioners", "version": "2.0", "updated": "12 Oct 2026", "diagrams": [{"id": "pct-orientation", "title": "Person-centred therapeutic process (conceptual map)", "type": "flow", "nodes": [{"id": "experience", "label": "Client’s lived experience"}, {"id": "relationship", "label": "Empathic, genuine, accepting relationship"}, {"id": "symbol", "label": "Experience becomes more symbolised"}, {"id": "agency", "label": "Greater congruence and self-directed choice"}], "edges": [{"from": "experience", "to": "relationship"}, {"from": "relationship", "to": "symbol"}, {"from": "symbol", "to": "agency"}], "caption": "A teaching map of a possible process, not a linear sequence or guaranteed causal pathway."}, {"id": "six-conditions", "title": "Rogers’ six conditions (1957)", "type": "flow", "nodes": [{"id": "contact", "label": "Psychological contact"}, {"id": "incongruence", "label": "Client vulnerability / incongruence"}, {"id": "congruence", "label": "Therapist congruence"}, {"id": "regard", "label": "Unconditional positive regard"}, {"id": "empathy", "label": "Empathic understanding"}, {"id": "communicated", "label": "Empathy and regard communicated to client"}], "edges": [{"from": "contact", "to": "incongruence"}, {"from": "incongruence", "to": "congruence"}, {"from": "congruence", "to": "regard"}, {"from": "regard", "to": "empathy"}, {"from": "empathy", "to": "communicated"}], "caption": "Rogers’ theoretical statement of necessary and sufficient conditions; not a checklist that guarantees an outcome."}, {"id": "relationship-cycle", "title": "Relational micro-process: listen, check, repair", "type": "flow", "nodes": [{"id": "listen", "label": "Attend to the client’s frame of reference"}, {"id": "reflect", "label": "Offer a tentative empathic response"}, {"id": "check", "label": "Check fit; invite correction"}, {"id": "repair", "label": "Revise understanding and reconnect"}], "edges": [{"from": "listen", "to": "reflect"}, {"from": "reflect", "to": "check"}, {"from": "check", "to": "repair"}, {"from": "repair", "to": "listen"}], "caption": "A practical conversational loop; it is not a scripted intervention protocol."}], "sections": {"learning_objectives": ["Explain person-centred therapy as a coherent philosophical and relational approach rather than a collection of techniques.", "Describe Rogers’ view of psychological contact, incongruence, the actualising tendency and conditions for therapeutic change.", "Differentiate congruence, unconditional positive regard, empathic understanding, acceptance, sympathy and agreement.", "Use empathic listening, checking, clarification, reflection and repair without turning them into mechanical scripts.", "Develop a collaborative, client-led understanding of presenting concerns, strengths, context, risks and hopes.", "Apply person-centred principles to common clinical presentations while recognising when integrated or specialist care may be indicated.", "Identify power, culture, identity, social conditions, ethics and professional responsibilities in the relationship.", "Evaluate techniques and experiential developments in relation to client choice, theoretical fit, competence and evidence.", "Use self-reflection, feedback and supervision to examine congruence, ruptures, boundaries and impact.", "Document person-centred work clearly without reducing the client to a diagnosis or imposing a formulation."], "overview": {"text": "Person-centred therapy (PCT), developed by Carl Rogers and extended by later practitioners, places the client’s subjective experience and the quality of the therapeutic relationship at the centre of psychological change. Rogers proposed that psychological contact, client incongruence, therapist congruence, unconditional positive regard, empathic understanding and communication of empathy and regard form the necessary and sufficient conditions for constructive personality change. In practice, this is a disciplined way of being with a person: the therapist listens carefully, seeks to understand from the client’s frame of reference, remains genuine and non-possessive in acceptance, and avoids replacing the client’s meanings with professional authority. Contemporary person-centred and experiential traditions are diverse. Some retain a strong non-directive stance; others use more structured experiential methods. Their fit with PCT depends on the specific model, how an intervention is offered, and whether the client’s agency and experience remain central. This module combines foundational Rogersian theory with applied clinical guidance; it is educational and does not replace formal training, supervision or clinical judgement. Evidence-informed note: research supports the importance of the therapeutic relationship and several relational attitudes, while the strength and directness of evidence differ across specific models and clinical problems. The module therefore distinguishes Rogers’ theoretical claims from empirical findings and from practical recommendations. Selected references are listed under “Evidence, outcomes and limits of inference” in Core concepts.", "diagram_id": "pct-orientation"}, "when_to_use": {"indications": ["Clients seeking a respectful space to explore emotions, identity, relationships, life transitions, grief, shame, self-worth or conflicting experiences.", "Clients who have felt judged, controlled, pathologised or unheard and need a relationship that supports safety, dignity and agency.", "Exploration of incongruence between lived experience, self-concept, values, roles and perceived expectations.", "Work where the client’s goals and meanings are still emerging and a premature problem-solving agenda would be unhelpful.", "As a relational foundation within broader care, including collaborative work alongside medical, psychiatric, social or other psychological support when appropriate."], "populations": ["Adults and adolescents when the practitioner is trained to adapt communication and consent practices to developmental stage.", "Individuals and, with appropriate training, couples, groups, schools, community settings and culturally diverse contexts.", "Online or hybrid work when privacy, suitability, access, crisis response and jurisdictional requirements have been addressed."], "cautions": ["PCT is not a reason to postpone urgent assessment, safeguarding, medical evaluation or referral where indicated.", "Severe distress, psychosis, mania, intoxication/withdrawal, cognitive impairment, active suicidality or complex trauma may require additional assessment and coordinated care; a relational stance can remain valuable but may not be sufficient alone.", "Do not promise that empathy or acceptance alone will resolve every condition. Discuss options and evidence honestly.", "If offering a more structured experiential method, explain the method, assess suitability and competence, obtain consent and allow the client to stop or decline."]}, "core_concepts": [{"name": "The person as an experiencing subject", "originator": "Rogersian tradition", "level": "foundation", "definition": "The client is not merely a case to be classified. Their felt experience, meanings, relationships and social context are essential to understanding what is happening. The practitioner’s account is always partial and should remain open to correction.", "components": ["Begin with the client’s own language and frame of reference.", "Treat professional hypotheses as tentative, not as the final truth about the person.", "Notice the client’s strengths, values, relationships and constraints alongside distress."], "illustration": "Rather than declaring that a client is ‘avoiding intimacy’, ask what closeness feels like to them and what they fear or hope might happen."}, {"name": "Actualising tendency", "originator": "Carl Rogers", "level": "foundation", "definition": "Rogers proposed an inherent tendency in living organisms toward maintaining, developing and enhancing their capacities. In psychotherapy, this is a theoretical orientation toward the person’s potential for growth, not a guarantee that growth is easy, linear or independent of social conditions.", "components": ["Look for existing capacities, adaptive efforts and meanings, even when behaviour is harmful or costly.", "Do not confuse the actualising tendency with relentless positivity or individual responsibility for overcoming adversity.", "Recognise that oppression, deprivation, illness, trauma and unsafe environments can constrain opportunities."], "illustration": "A client’s withdrawal may have protected them in an unsafe setting; therapy explores what that strategy has meant and whether it still fits their present circumstances."}, {"name": "Incongruence and conditions of worth", "originator": "Rogers; person-centred theory", "level": "foundation", "definition": "Incongruence refers to a mismatch between organismic experience and the self-concept or self-structure. Conditions of worth develop when acceptance is experienced as conditional on meeting others’ expectations. These are theoretical concepts to explore collaboratively, not diagnoses to assign automatically.", "components": ["Explore what the person feels, what they believe they should feel, and what seems acceptable to show.", "Ask how family, culture, institutions and relationships shape self-evaluation.", "Avoid implying that all distress is caused by intrapsychic incongruence; material and interpersonal conditions matter too."], "illustration": "A client may feel angry but believe ‘good daughters never feel anger’; they may conceal the feeling to preserve belonging."}, {"name": "Congruence or genuineness", "originator": "Rogers", "level": "foundation", "definition": "Congruence is the therapist’s realness and integration in the relationship: awareness of their own experience and an honest, appropriate presence. It does not mean unfiltered disclosure or making the session about the therapist.", "components": ["Notice internal reactions and consider whether they belong in the conversation.", "Share personal responses only when relevant, proportionate, transparent and likely to serve the client.", "Acknowledge mistakes and limits rather than defending a professional image."], "illustration": "‘I notice I may have moved too quickly into questions. Would it help if we slowed down?’ is accountable and client-focused."}, {"name": "Unconditional positive regard", "originator": "Rogers", "level": "foundation", "definition": "A non-possessive acceptance of the client as a person, without making their worth dependent on approval or compliance. It does not require approving every action, ignoring harm or abandoning boundaries.", "components": ["Communicate dignity and respect while being able to name harmful consequences honestly.", "Avoid shaming, moralising, sarcasm or conditional warmth.", "Maintain clear boundaries and protect others when professional duties require it."], "illustration": "The therapist can respect a client who has harmed someone while being clear that the harm matters and safety must be addressed."}, {"name": "Empathic understanding", "originator": "Rogers", "level": "foundation", "definition": "An active attempt to sense the client’s internal frame of reference as if it were one’s own while remembering it is not one’s own. Empathy is accurate, tentative and revisable; it is not mind-reading, agreement or sympathy alone.", "components": ["Track emotion, meaning, bodily experience, ambiguity and what is difficult to say.", "Use reflections and summaries as offers that the client can correct.", "Notice when empathy misses and repair without asking the client to caretake the therapist."], "illustration": "‘Part of you feels relieved to have left, and another part feels guilty about disappointing them. Is that close, or have I missed something?’"}, {"name": "The six conditions for therapeutic change", "originator": "Rogers (1957)", "level": "foundation", "definition": "Rogers set out six conditions he proposed were necessary and sufficient for constructive personality change: psychological contact; client incongruence and vulnerability or anxiety; therapist congruence; therapist unconditional positive regard; empathic understanding; and at least some communication of empathy and regard to the client.", "components": ["The relationship must be psychologically meaningful, not merely a formal appointment.", "The therapist’s attitudes need to be experienced and communicated, not privately held only.", "Treat the conditions as Rogers’ theoretical proposition and a guide for practice, not a guarantee or universal substitute for outcome evidence."], "diagram_id": "six-conditions", "illustration": "A therapist may feel warmly toward a client, but if that regard is communicated as patronising reassurance, the client may not experience it as acceptance."}, {"name": "Non-directivity and client agency", "originator": "Rogersian tradition; ongoing debate", "level": "foundation", "definition": "Non-directivity means avoiding unnecessary control over the client’s agenda, interpretations and choices. It is an ethical stance of respect, not silence, lack of skill, avoidance of difficult topics or refusal to provide needed information.", "components": ["Ask what the client wants from the session and follow their priorities while keeping the work purposeful.", "Make suggestions and professional obligations explicit rather than disguising them as neutral questions.", "When immediate safety or safeguarding is involved, explain actions clearly and act within law and policy."], "illustration": "‘Would it be useful to hear two options, or would you rather stay with what this decision feels like right now?’ makes choice visible."}, {"name": "A family of person-centred and experiential approaches", "originator": "Person-centred / experiential traditions", "level": "advanced", "definition": "PCT is not a single unchanging set of procedures. Classical client-centred therapy, contemporary person-centred counselling and related experiential approaches overlap but are not identical. Some later approaches use more structured experiential tasks and theory-specific methods.", "components": ["Name the approach actually being practised and do not attribute every later technique to Rogers.", "Distinguish person-centred foundations from emotion-focused therapy, focusing-oriented work and other experiential developments.", "Use additional methods only within competence, with a clear rationale, informed consent and attention to client preference."], "illustration": "A focusing-oriented intervention may be compatible with a practitioner’s values but should be identified and taught as a particular experiential method, not a universal PCT technique."}, {"name": "Power, social location and the therapeutic relationship", "originator": "Relational and critical perspectives", "level": "advanced", "definition": "The relationship is shaped by professional authority, diagnosis, records, fees, institutional power, culture, language, class, caste, gender, disability, sexuality and other social positions. Good intentions do not make this power disappear.", "components": ["Explain confidentiality, records, fees, roles and limits in accessible language.", "Invite disagreement and examine whose values define ‘healthy’, ‘independent’ or ‘successful’.", "Recognise that social injustice and material barriers may contribute to distress and cannot be resolved by individual insight alone."], "illustration": "A client’s reluctance to disagree may reflect prior experiences with authority, not agreement with the therapist."}, {"name": "Techniques: fit, function and debate", "originator": "Person-centred practice debate", "level": "advanced", "definition": "The debate concerns whether a method can remain person-centred when it introduces a structure, task or therapist-led focus. The answer depends on theoretical commitments and the method’s use; there is no single uncontested position across the entire tradition.", "components": ["Ask whether the intervention follows the client’s experience or substitutes the practitioner’s agenda.", "Offer a clear rationale and a genuine option to decline or stop.", "Monitor the client’s experience and repair if the intervention feels coercive, shaming or mismatched."], "illustration": "A worksheet may support reflection when collaboratively chosen; it becomes controlling when completion is treated as proof of progress or compliance."}, {"name": "Evidence, outcomes and limits of inference", "originator": "Contemporary psychotherapy research", "level": "advanced", "definition": "Research supports the clinical importance of relational qualities such as empathy, positive regard, genuineness and the real relationship. This is not the same as proving that a purely non-directive person-centred approach is sufficient for every presentation, or that relational factors remove the need for assessment, specific interventions or coordinated care. Research varies by approach, population, comparator, outcome and study quality.", "components": ["Rogers’ 1957 article is a foundational theoretical statement of six conditions, not a modern randomised trial or a universal guarantee of change.", "A meta-analysis of the real relationship reported a moderate association with psychotherapy outcome across 16 studies (Gelso, Kivlighan & Markin, 2018; r = .38). Association does not by itself prove causation.", "A meta-analytic review of positive regard found a small positive association with outcome (Farber, Suzuki & Lynch, 2018; g = .28 in the primary analysis; a multilevel analysis reported g = .36).", "Reviews of humanistic-experiential therapies include a broad family of approaches; results for emotion-focused or other experiential methods should not automatically be attributed to classical non-directive PCT.", "Use current, population-specific guidance and clinical supervision when deciding whether PCT alone, an integrated approach or referral best fits the client."], "illustration": "Selected sources: Rogers (1957), “The Necessary and Sufficient Conditions of Therapeutic Personality Change,” https://doi.org/10.1037/h0045357; Gelso, Kivlighan & Markin (2018), “The Real Relationship and Its Role in Psychotherapy Outcome: A Meta-Analysis,” https://pubmed.ncbi.nlm.nih.gov/30335456/; Farber, Suzuki & Lynch (2018), “Positive Regard and Psychotherapy Outcome: A Meta-Analytic Review,” https://pubmed.ncbi.nlm.nih.gov/30335454/; Elliott et al. (2013), “Research on Humanistic-Experiential Psychotherapies,” https://strathprints.strath.ac.uk/37895/."}], "assessment_formulation": {"intake_guide": ["Explain role, approach, confidentiality and limits, record keeping, fees, consent, communication boundaries and complaint routes.", "Invite the client’s account: ‘What feels important for me to understand about what brings you here?’", "Explore what has been happening, when it began, how it affects daily life, relationships, sleep, work/study, health and functioning.", "Explore feelings, bodily experiences, meanings, self-evaluations, values, hopes and what the client has already tried.", "Ask about relationships, family, culture, language, spirituality, identity, discrimination, resources and material circumstances as relevant.", "Explore strengths, exceptions, sources of support, coping and what has helped even a little.", "Assess risk and safeguarding directly and proportionately; explain why questions are being asked and document decisions.", "Collaboratively summarise what has been heard and ask
