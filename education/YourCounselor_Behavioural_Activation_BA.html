<script>
var DATA = {"slug": "behavioural-activation", "title": "Behavioural Activation for Depression", "summary": "A structured, collaborative treatment that helps clients reconnect with meaningful and rewarding activity, understand avoidance patterns, and take feasible steps guided by their values, even when motivation is low.", "category": "Behavioural · Evidence-informed", "audience": "Psychologists, professional counsellors, psychotherapists and supervised practitioners", "version": "1.0", "updated": "13 Oct 2026", "diagrams": [{"id": "ba-cycle", "title": "The depression-avoidance cycle", "type": "cycle", "nodes": [{"id": "low", "label": "Low mood / low energy"}, {"id": "avoid", "label": "Withdrawal and avoidance"}, {"id": "loss", "label": "Less reward, connection and mastery"}, {"id": "rum", "label": "Rumination and self-criticism"}], "edges": [{"from": "low", "to": "avoid"}, {"from": "avoid", "to": "loss"}, {"from": "loss", "to": "rum"}, {"from": "rum", "to": "low"}], "caption": "A common maintaining loop, not a universal explanation. The formulation must fit the individual and their context."}, {"id": "ba-loop", "title": "The activation learning loop", "type": "flow", "nodes": [{"id": "values", "label": "Values and chosen direction"}, {"id": "small", "label": "Small, planned action"}, {"id": "observe", "label": "Notice mood, mastery and connection"}, {"id": "learn", "label": "Review and adjust next step"}], "edges": [{"from": "values", "to": "small"}, {"from": "small", "to": "observe"}, {"from": "observe", "to": "learn"}, {"from": "learn", "to": "small"}], "caption": "Action is an experiment in living, not a demand to feel better immediately."}, {"id": "ba-steps", "title": "A practical BA sequence", "type": "flow", "nodes": [{"id": "map", "label": "Map activity, mood and context"}, {"id": "function", "label": "Understand avoidance and consequences"}, {"id": "values", "label": "Choose valued or necessary activity"}, {"id": "plan", "label": "Make a specific achievable plan"}, {"id": "review", "label": "Review learning and barriers"}], "edges": [{"from": "map", "to": "function"}, {"from": "function", "to": "values"}, {"from": "values", "to": "plan"}, {"from": "plan", "to": "review"}, {"from": "review", "to": "map"}], "caption": "A collaborative cycle; steps can be revisited and adapted."}, {"id": "ba-selection", "title": "Choosing an activation task", "type": "decision", "nodes": [{"id": "root", "label": "What is the main barrier?"}, {"id": "energy", "label": "Low energy: tiny, time-limited step"}, {"id": "avoid", "label": "Avoidance: graded approach step"}, {"id": "overload", "label": "Overload: problem-solve / reduce scope"}, {"id": "meaning", "label": "Disconnection: values / social connection"}, {"id": "access", "label": "Practical or structural barrier: change conditions / seek support"}], "edges": [{"from": "root", "to": "energy", "label": "Exhaustion / inertia"}, {"from": "root", "to": "avoid", "label": "Fear or discomfort"}, {"from": "root", "to": "overload", "label": "Too much at once"}, {"from": "root", "to": "meaning", "label": "Nothing feels worthwhile"}, {"from": "root", "to": "access", "label": "Resources / environment"}], "caption": "Select based on function, feasibility, client preference and safety, not a generic activity prescription."}], "sections": {"learning_objectives": ["Explain behavioural activation (BA) as a structured treatment that targets patterns of avoidance, withdrawal and reduced access to reinforcement, not as simply “keeping busy.”", "Collaboratively map the relationship among activity, context, mood, avoidance, values and short- versus long-term consequences.", "Use activity monitoring, functional analysis, values clarification, graded task assignment and activity scheduling with client choice.", "Adapt activation plans to low energy, disability, caregiving, poverty, unsafe environments, culture and other real-world constraints.", "Monitor progress using meaningful outcomes and validated measures when appropriate, and revise the formulation when progress stalls.", "Recognise risk, complexity, scope-of-practice limits and indications for consultation, referral or a higher level of care."], "overview": {"text": "Behavioural activation is a structured, collaborative psychological treatment for depression. It helps people notice how withdrawal, avoidance and loss of contact with rewarding, meaningful or necessary activities can maintain distress, then plan small, feasible actions that reconnect them with life. The aim is not to force positivity or wait for motivation: it is to create opportunities for learning and reinforcement while responding compassionately to barriers. This module is an original clinical learning resource informed by the general themes of Nina Josefowitz and Stephen R. Swallow’s *The Behavioral Activation Workbook for Depression: Powerful Strategies to Boost Your Mood and Build a Better Life* (New Harbinger, 2024), established BA literature and clinical guidance. It is not a reproduction of the copyrighted book, and it does not claim to reproduce every exercise or chapter. NICE guideline NG222 includes structured behavioural activation materials among guided self-help options for less severe depression, with support from a trained practitioner and review of progress. [NICE guideline NG222](https://www.nice.org.uk/guidance/NG222/chapter/recommendations)", "diagram_id": "ba-cycle"}, "when_to_use": {"indications": ["Depressive symptoms with reduced activity, withdrawal, avoidance, loss of routine, or reduced access to reinforcement.", "Difficulty starting tasks despite valuing their outcomes; procrastination linked to low mood or distress.", "Reduced social contact, pleasurable activity, self-care, meaningful roles or mastery experiences.", "As a structured treatment option or component of a broader plan, based on assessment, preference, competence and clinical guidance.", "Structured guided self-help using behavioural activation materials may suit some adults with less severe depression when facilitated by a trained practitioner, with regular review and monitoring."], "populations": ["Adults with depression or depressive symptoms; adapt to age, cognition, physical health, neurodivergence, disability and context.", "People whose mood is affected by isolation, disrupted routine, caregiving strain, work or role changes, chronic illness, or reduced valued activity.", "Group, individual, face-to-face, telephone and supported digital delivery may be considered where appropriate and evidence-based."], "cautions": ["BA is not a substitute for immediate risk management, medical assessment or emergency care when indicated.", "Assess suicidality, self-neglect, mania/hypomania, psychosis, substance use, trauma, physical illness and environmental danger as clinically relevant.", "Do not frame structural barriers, discrimination, poverty, disability, unsafe relationships or exhaustion as mere avoidance or lack of effort.", "Coordinate with prescribers and other providers when appropriate; do not advise medication changes outside competence.", "For complex or severe presentations, use treatment-specific training, supervision and stepped-care guidance."]}, "core_concepts": [{"name": "Activity-mood relationship", "originator": "Behavioural and cognitive-behavioural traditions", "level": "foundation", "definition": "Activity, context and mood influence one another. Depression can reduce activity and access to reward; reduced contact with connection, mastery, pleasure and valued roles may then help maintain low mood. The pattern is individual, not a claim that activity alone explains depression.", "components": ["Track activity alongside mood, energy, context and consequences.", "Distinguish what feels rewarding, meaningful, necessary, connecting or mastery-building for this person.", "Look for patterns over time rather than assuming a single activity will improve mood."], "illustration": "A short walk may not immediately lift mood, but it may provide daylight, movement, routine or a sense of keeping a promise. These are useful data even if mood remains low."}, {"name": "Avoidance and withdrawal", "originator": "Behavioural activation models", "level": "foundation", "definition": "Avoidance can bring immediate relief from anxiety, shame, fatigue or anticipated failure, while reducing opportunities for longer-term reinforcement. Understand the function of a behaviour before trying to change it.", "components": ["Identify triggers, the avoided action, immediate relief and longer-term costs.", "Differentiate experiential avoidance from sensible protection, rest, boundaries or responses to genuine danger.", "Use graded, collaborative steps rather than confrontation or moralising."], "illustration": "Cancelling a social plan may reduce anxiety that evening but increase loneliness over the week; the therapist checks whether the pattern fits and what a tolerable alternative might be."}, {"name": "Reinforcement and environmental context", "originator": "Behavioural learning theory", "level": "foundation", "definition": "Behaviours are shaped by their consequences and by access to resources, cues and opportunities. BA seeks to increase contact with consequences that support functioning and personally meaningful living.", "components": ["Ask what follows an action immediately and later.", "Consider social, material, cultural and physical conditions.", "Do not assume all clients have equal access to safe, affordable or rewarding activities."], "illustration": "If a client wants social contact but cannot afford travel, activation may involve a phone call, community resource or practical support, not simply prescribing outings."}, {"name": "Values and valued direction", "originator": "Modern BA and related contextual approaches", "level": "foundation", "definition": "Values help identify directions that matter, while goals and actions are concrete steps in those directions. Values are chosen by the client, not imposed by the practitioner or equated with productivity.", "components": ["Explore relationships, care, learning, contribution, spirituality, creativity, health, autonomy or other client-defined domains.", "Separate values from externally imposed expectations and perfectionistic rules.", "Translate a broad direction into one observable, feasible action."], "illustration": "“Be a good parent” is a broad value statement; a possible step is ten minutes of child-led play, adapted to the family’s circumstances."}, {"name": "Action before motivation", "originator": "Behavioural activation", "level": "foundation", "definition": "Motivation often follows action rather than reliably preceding it. BA invites a small, planned experiment even when enthusiasm is low, while respecting illness, capacity and context.", "components": ["Make the first step small enough to begin.", "Avoid requiring a positive mood as proof of success.", "Review what was learned and adjust the plan."], "illustration": "The target may be opening the document and working for five minutes, not finishing the entire report."}, {"name": "Pleasure, mastery, connection and meaning", "originator": "Clinical BA practice", "level": "foundation", "definition": "Activities can provide different forms of reinforcement. Some are enjoyable, some build competence, some connect people, and some express values or meet necessary responsibilities.", "components": ["Track pleasure and mastery separately if useful.", "Include rest and replenishment as legitimate needs.", "Balance immediate reward, long-term purpose and realistic demands."], "illustration": "Paying one bill may be low in pleasure but high in mastery and future relief; calling a friend may support connection."}, {"name": "Functional analysis", "originator": "Behavioural assessment", "level": "foundation", "definition": "Functional analysis explores what happens before, during and after a behaviour to understand its role in context. It avoids labelling behaviour as simply good or bad.", "components": ["Antecedents: context, thoughts, feelings, body states and cues.", "Behaviour: what the person actually does or avoids.", "Consequences: immediate and delayed effects, including relief and lost opportunities."], "illustration": "The therapist maps the chain from waking late, shame, staying in bed, short-term escape and later missed meals before selecting a target."}, {"name": "Graded task assignment and shaping", "originator": "Behavioural treatment traditions", "level": "foundation", "definition": "Large, vague tasks are broken into small observable steps and increased gradually as appropriate. Shaping reinforces progress toward a goal rather than waiting for perfect performance.", "components": ["Specify the smallest meaningful action.", "Estimate difficulty and confidence; reduce the step if confidence is low.", "Build progression from learning, capacity and client choice, not rigid quotas."], "illustration": "“Clean the house” becomes “put five items in a basket for three minutes.”"}, {"name": "Activity monitoring and scheduling", "originator": "Behavioural activation", "level": "foundation", "definition": "Monitoring makes patterns visible; scheduling turns intentions into specific plans. These are learning tools, not compliance tests.", "components": ["Record what happened, mood/energy, context and consequences.", "Schedule what, when, where, duration and any support or cue.", "Review planned versus completed actions with curiosity rather than blame."], "illustration": "A missed plan prompts questions about timing, task size, fatigue or access, not a conclusion that the client is unmotivated."}, {"name": "Rumination and passive coping", "originator": "Behavioural models of depression", "level": "intermediate", "definition": "Repetitive abstract thinking can displace problem-solving, connection or valued action. BA focuses on the behavioural function and offers a concrete alternative without requiring thoughts to disappear.", "components": ["Notice when thinking becomes repetitive and unproductive.", "Distinguish reflection that helps from rumination that traps.", "Choose a small next action, sensory grounding or time-limited problem-solving as appropriate."], "illustration": "After noticing an hour of replaying a conversation, the client chooses to send a practical message or return to a planned meal."}, {"name": "Self-compassion and non-punitive change", "originator": "Integrative clinical practice", "level": "foundation", "definition": "Activation is not punishment, hustle culture or a demand to overcome symptoms through willpower. A compassionate stance helps the person respond to setbacks with information and adjustment.", "components": ["Validate the effort required by depression.", "Use collaborative language and avoid shame-based goals.", "Plan recovery and rest alongside action."], "illustration": "A plan is resized after a difficult night rather than treating reduced capacity as failure."}, {"name": "Measurement and feedback", "originator": "Evidence-based psychological practice", "level": "foundation", "definition": "Routine outcome monitoring can show whether symptoms and functioning are changing. Measures complement, not replace, clinical judgment, the client’s account and contextual understanding.", "components": ["Choose validated tools within competence, such as PHQ-9 where appropriate.", "Review functioning, valued activity, risk and client-defined outcomes.", "Respond to worsening symptoms or non-response by reassessing and adapting care."], "illustration": "Mood scores remain flat but the client is attending classes and reconnecting with a sibling; both symptom and functioning data inform the review."}, {"name": "Treatment is collaborative, not prescriptive", "originator": "BA clinical practice", "level": "foundation", "definition": "The therapist brings structure and expertise while the client contributes goals, preferences, knowledge of context and feedback. A plan should be jointly owned.", "components": ["Offer a rationale and seek agreement.", "Invite refusal, modification and feedback.", "Make the plan realistic for the client’s resources and responsibilities."], "illustration": "The client chooses a culturally meaningful family activity rather than the therapist’s preferred exercise."}, {"name": "Rest, pacing and physical limits", "originator": "Adapted BA practice", "level": "foundation", "definition": "Activation must account for disability, pain, fatigue, illness and recovery needs. Rest may be restorative and values-consistent; the clinical question is whether patterns support or undermine the client’s chosen life.", "components": ["Assess medical advice and energy fluctuations.", "Use pacing and flexible plans where relevant.", "Avoid equating stillness with avoidance without functional evidence."], "illustration": "A client with chronic pain plans two minutes of a valued task with rest breaks rather than an unrealistic exercise target."}, {"name": "Contextual and cultural responsiveness", "originator": "Culturally responsive practice", "level": "foundation", "definition": "Meaningful activity is culturally and personally situated. Family roles, community, faith, migration, gender, caste, class, language, safety and opportunity can shape what is feasible and rewarding.", "components": ["Ask what a meaningful life looks like to this client.", "Explore social constraints and power without individualising systemic problems.", "Co-design steps that respect identity, privacy and safety."], "illustration": "A client’s valued connection may be a religious community or multigenerational family role, if the client identifies it as meaningful."}, {"name": "BA is not simply pleasant-activity scheduling", "originator": "Behavioural activation", "level": "foundation", "definition": "Pleasant events can help, but BA also targets avoidance, functional patterns, values, necessary tasks, social context and sustained behaviour change.", "components": ["Use functional analysis to select targets.", "Include mastery, connection, values and responsibilities, not only fun.", "Review what maintains the problem and what the client learns from action."], "illustration": "Making a medical appointment may be a key activation task even if it is not enjoyable."}, {"name": "Relapse prevention and maintenance", "originator": "BA treatment practice", "level": "intermediate", "definition": "As symptoms improve, the client identifies personal early warning signs, helpful routines, support options and a flexible plan for responding to setbacks.", "components": ["Identify individual warning signs and protective routines.", "Plan small steps for predictable high-risk periods.", "Frame lapses as cues to respond early, not proof of failure."], "illustration": "A client notices increasing isolation and missed meals and reactivates a small daily routine while contacting supports."}], "assessment_formulation": {"assess": ["Presenting symptoms, onset, course, severity, impairment and the client’s own explanation.", "Activity patterns across a typical week: sleep/wake rhythm, self-care, work/study, relationships, responsibilities, pleasurable and meaningful activity.", "Mood, energy, anticipation, actual enjoyment, sense of mastery, connection and context before/after activities.", "Avoidance and withdrawal: triggers, short-term relief, longer-term effects, barriers and protective functions.", "Risk and safeguarding as indicated; suicidal thoughts, intent, plan, access to means, previous attempts, protective factors and immediate safety needs.", "Relevant physical health, medication, sleep, substance use, trauma, neurodevelopmental needs, mania/hypomania, psychosis and social determinants.", "Client strengths, supports, culture, resources, preferences, values and practical constraints."], "key_questions": ["“Walk me through a recent day, from waking to bedtime.”", "“What do you tend to stop doing when your mood drops?”", "“What happens just before you withdraw or put something off?”", "“What does avoiding it help with in the short term? What does it cost later?”", "“Which activities used to matter, or still matter even if they do not feel rewarding right now?”", "“What is getting in the way, energy, fear, money, time, access, pain, safety, or something else?”", "“What would be a small sign that life is becoming more workable?”"], "instruments": ["PHQ-9 may be used to monitor depressive symptoms when appropriate and within competence; review item-level responses and risk, not only the total score.", "Use a simple activity-mood log or hourly/half-day activity monitoring sheet to map patterns.", "Use locally validated, appropriate functioning or wellbeing measures if clinically useful.", "Measures are adjuncts; they do not replace interview, formulation, collaborative goals or risk assessment."], "formulation_steps": ["Define the client’s current difficulties and personally meaningful goals.", "Map a recent situation using context → internal experience → behaviour/avoidance → immediate consequence → delayed consequence.", "Identify what has been lost or reduced: reinforcement, routine, connection, mastery, valued roles or access to resources.", "Identify factors that make change harder and strengths/supports that make it more possible.", "Develop a shared, tentative maintenance hypothesis and check whether it fits the client’s lived experience.", "Choose one feasible behavioural experiment or activation step; specify what will be observed.", "Review outcomes, barriers, safety and fit; revise the formulation rather than blaming the client."], "safety_plan": ["Assess immediate risk when indicated before routine BA work proceeds.", "Agree a collaborative safety plan appropriate to risk and local policy; identify support people and urgent services.", "Document decisions, consultation, referrals and follow-up according to law, policy and professional standards.", "If imminent danger or inability to maintain safety is present, activate emergency procedures rather than relying on activity scheduling."], "goal_setting": ["Goals should be client-chosen, observable, feasible and linked to function or values.", "Start small enough to be attempted on a difficult day; define a minimum version and optional stretch version.", "Track process and learning, not only mood improvement or task completion.", "Review access, physical capacity, competing demands and the client’s confidence."], "tracking": ["Record activity, time/context, mood/energy before and after, pleasure/mastery/meaning if helpful, and what got in the way.", "Compare planned with actual activity without treating missed plans as failure.", "Review symptom measures and functional change at agreed intervals.", "Escalate or adapt if symptoms worsen, risk increases or there is little progress despite reasonable adjustments."], "instrument_note": "Use only measures for which the practitioner is trained and which are appropriate to the client and setting. Follow licensing, translation and scoring guidance.", "diagram_id": "ba-cycle", "intake_guide": ["Clarify presenting concerns, goals, previous treatment and preferences.", "Assess symptom severity, functioning, risk and differential considerations.", "Explore daily routine, activity, avoidance, values and environmental barriers.", "Agree a first monitoring task and explain that the aim is understanding, not judging performance."], "risk_script": "“I ask everyone experiencing this level of distress about safety. Have you had thoughts that life is not worth living, or thoughts of harming yourself? Have you thought about how you might do it, or taken any steps? What helps you stay safe right now?” Follow a full, competent risk assessment and local protocol; this example is not a substitute for training.", "measurement_schedule": "Agree baseline measures and activity monitoring; review briefly each session, repeat symptom/function measures at suitable intervals, and reassess promptly if symptoms or risk worsen.", "measurement_note": "Do not use a score alone to make high-stakes decisions. Consider clinical interview, functional change, client priorities, context and safety.", "added": true}, "techniques": [{"name": "Activity monitoring", "purpose": "Make patterns among activity, mood, energy, context and consequences visible before selecting change targets.", "steps": ["Explain monitoring as curiosity, not surveillance or a performance test.", "Choose a manageable recording interval (e.g. blocks of the day rather than every minute).", "Record what happened, mood/energy, context and any relevant pleasure, mastery or connection.", "Review patterns collaboratively; identify one possible link or exception."], "example": "“On days I stay in bed until noon, I feel less anxious initially but more isolated by evening.”", "pitfalls": ["Making monitoring so detailed it becomes burdensome.", "Treating mood ratings as objective truth or demanding perfect completion."], "safety": "Adapt monitoring if it increases rumination, shame or obsessive tracking; discontinue or simplify if it is counterproductive.", "id": "ba-monitor", "when": "Early in treatment, when the client feels stuck or cannot identify patterns.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Functional analysis of avoidance", "purpose": "Understand the trigger, behaviour, immediate relief and longer-term consequence that maintain a pattern.", "steps": ["Choose one recent, specific episode.", "Map what happened beforehand, including context and internal experience.", "Describe the behaviour precisely and non-judgmentally.", "Identify immediate consequences and delayed effects.", "Generate a small alternative response and test collaboratively."], "example": "A difficult email triggers shame; the client closes the laptop, feels brief relief, then faces a bigger backlog.", "pitfalls": ["Assuming all avoidance is maladaptive; it may protect from real danger or overload.", "Ignoring environmental barriers or disability."], "safety": "Do not use exposure-like steps where danger is real; prioritise safety and practical problem-solving.", "id": "ba-function", "when": "When a recurring avoidance or withdrawal behaviour is a key target.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Values clarification", "purpose": "Identify personally meaningful directions to guide activity choices.", "steps": ["Ask what matters or what kind of person the client wants to be in chosen life domains.", "Explore values without judging the content or imposing norms.", "Distinguish broad direction from a measurable goal.", "Select one small action that expresses the direction."], "example": "Value: connection. Step: send a low-pressure message to a trusted cousin.", "pitfalls": ["Turning values into demands or productivity standards.", "Assuming a value from culture, family role or religion without asking the client."], "safety": "Check that the action is safe, voluntary and consistent with the client’s boundaries.", "id": "ba-values", "when": "When the client says nothing feels enjoyable, or goals are dominated by external pressure.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Activity scheduling", "purpose": "Translate intention into a specific, realistic plan and create opportunities for new learning.", "steps": ["Select one activity linked to values, mastery, pleasure, connection or necessary functioning.", "Specify what, when, where, duration and cues/support.", "Rate anticipated difficulty and confidence; shrink the step if needed.", "Make a backup/minimum version for a low-energy day.", "Review what happened and what was learned, not just whether it was completed."], "example": "At 10:30 after tea, sit at the table and open the job-search page for five minutes; if energy is low, open the laptop only.", "pitfalls": ["Overloading the schedule, rigid quotas or equating completion with worth.", "Choosing activities that are inaccessible or unsafe."], "safety": "Balance activity with sleep, rest, physical health and clinician guidance; avoid abrupt overexertion.", "id": "ba-schedule", "when": "When monitoring and formulation suggest an activity target.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Graded task assignment / shaping", "purpose": "Break overwhelming tasks into small steps and build gradually.", "steps": ["Define the larger target and the smallest useful first action.", "Build a step ladder from easier to harder.", "Estimate difficulty and confidence for each step.", "Practice the agreed step and reinforce effort/learning.", "Adjust pace based on actual experience."], "example": "Instead of “clean my room”: pick up three items, then stop and review.", "pitfalls": ["Making steps too large or using a fixed pace regardless of the client.", "Rewarding only the final outcome instead of approach and learning."], "safety": "Adapt to physical limitations and medical advice.", "id": "ba-grading", "when": "When a task feels too large, confidence is low or avoidance has grown.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Approach behaviour / reducing avoidance", "purpose": "Help the client take a safe, chosen step toward a situation they avoid, where avoidance is maintaining the difficulty.", "steps": ["Clarify the feared or uncomfortable prediction and the function of avoidance.", "Collaboratively choose a small approach step.", "Identify supports and coping options without making them rigid safety rituals.", "Observe what happens and compare with the prediction.", "Repeat or adjust based on learning and consent."], "example": "Attend a community gathering for ten minutes with permission to leave, then review what was learned.", "pitfalls": ["Pressuring the client or moving too quickly.", "Mistaking abuse, discrimination or danger for irrational avoidance."], "safety": "Use specialist guidance for trauma-related exposure, severe anxiety or complex presentations.", "id": "ba-approach", "when": "When avoidance blocks valued activity and the situation is not objectively unsafe.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Pleasure and mastery review", "purpose": "Broaden the activity menu beyond immediate enjoyment and identify meaningful reinforcement.", "steps": ["List activities that could offer pleasure, mastery, connection, purpose or relief.", "Ask which are feasible and personally relevant.", "Try one activity and record anticipated versus actual experience.", "Review whether the outcome was enjoyable, meaningful, useful or simply informative."], "example": "Cooking a simple meal may provide nourishment and mastery even if pleasure is modest.", "pitfalls": ["Promising activities will make the client happy immediately.", "Overlooking cost, disability, culture, access or sensory needs."], "safety": "Do not turn the exercise into a compulsory gratitude or positivity task.", "id": "ba-reward", "when": "When the client cannot identify “fun” activities or dismisses small wins.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Social connection planning", "purpose": "Support chosen connection and reduce unwanted isolation.", "steps": ["Explore what kind and amount of connection the client wants.", "Identify safe, trusted people or communities.", "Plan a low-pressure contact step.", "Review the quality and impact of contact."], "example": "Send a voice note to a trusted friend rather than committing to a long social event.", "pitfalls": ["Assuming more social contact is always better.", "Ignoring unsafe relationships, stigma or social anxiety."], "safety": "Prioritise boundaries and safety; do not encourage contact with abusive people.", "id": "ba-social", "when": "When loneliness or withdrawal is relevant to the client’s formulation.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Routine and sleep-wake anchors", "purpose": "Re-establish predictable cues that support daily functioning.", "steps": ["Identify one anchor such as wake time, first meal, medication routine or daylight exposure.", "Choose a realistic, gradual adjustment.", "Pair it with an existing cue.", "Track feasibility and impact."], "example": "Open curtains and drink water after getting out of bed, with a flexible window rather than an unrealistic fixed schedule.", "pitfalls": ["Prescribing strict routines without considering shift work, caregiving or sleep disorders.", "Treating sleep problems without appropriate assessment."], "safety": "Medical or sleep-related symptoms may require assessment or referral.", "id": "ba-routine", "when": "When routine has become disrupted and the client wishes to rebuild structure.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Problem-solving practical barriers", "purpose": "Address real-world obstacles that activity scheduling alone cannot solve.", "steps": ["Name the barrier specifically.", "Separate what is controllable, influenceable and outside immediate control.", "Generate options and seek relevant resources or support.", "Choose a feasible next step and review."], "example": "If transport blocks a clinic appointment, explore phone consultation, travel assistance or rescheduling rather than labelling the client avoidant.", "pitfalls": ["Individualising structural hardship.", "Offering advice before understanding the client’s options."], "safety": "Refer to appropriate social, medical, legal or safeguarding resources when needed.", "id": "ba-barriers", "when": "When money, transport, care duties, access, conflict, workload or health limits action.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Values-aligned necessary tasks", "purpose": "Help clients approach essential tasks that support health, safety, stability or valued roles.", "steps": ["Choose one high-impact task.", "Reduce it to the next action, not the entire project.", "Add a cue, support person or body-double if desired.", "Review the effect and plan the next step."], "example": "Put the appointment card by the kettle and make the call after breakfast with a trusted person nearby.", "pitfalls": ["Prioritising productivity over rest or urgent needs.", "Using shame to force task completion."], "safety": "Consider consequences of missed essential care and support escalation where needed.", "id": "ba-necessary", "when": "When avoidance has consequences for bills, appointments, meals, care or administration.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}, {"name": "Reviewing and adjusting the plan", "purpose": "Use the outcome of each experiment to refine the plan and formulation.", "steps": ["Ask what happened without blame.", "Identify internal and external barriers.", "Review whether the step was too large, poorly timed or not meaningful.", "Decide whether to repeat, resize, change support or choose another target."], "example": "A planned walk was missed because pain flared; the plan becomes two minutes of stretching approved by the client’s clinician, or a non-movement alternative.", "pitfalls": ["Calling a plan failure without learning from it.", "Persisting with an intervention that does not fit."], "safety": "Reassess when symptoms worsen or new risk appears.", "id": "ba-review", "when": "At every review and especially after a missed or unhelpful activity.", "prompts": ["“Would this step fit your experience and feel manageable?”"], "dialogue": [], "level": "foundation"}], "technique_selection": {"diagram_id": "ba-selection", "table": [{"target": "Low energy / inertia", "consider": "Tiny action, routine anchor, activity scheduling", "avoid": "Large lists or waiting for motivation", "review": "Was the step feasible and did it create useful learning?"}, {"target": "Avoidance of a safe but uncomfortable situation", "consider": "Functional analysis, graded approach, behavioural experiment", "avoid": "Coercion or exposure to actual danger", "review": "What did the client learn and what barriers remain?"}, {"target": "Loss of meaning or “nothing matters”", "consider": "Values clarification, connection, personally meaningful action", "avoid": "Imposing the therapist’s values or forced positivity", "review": "Did the step express a chosen direction?"}, {"target": "Overwhelming task", "consider": "Task breakdown, shaping, support, minimum version", "avoid": "Vague goals such as “be more productive”", "review": "Was the next action specific and achievable?"}, {"target": "Practical / structural barrier", "consider": "Problem-solving, accommodations, resources, advocacy or referral", "avoid": "Labelling the barrier as avoidance", "review": "Did conditions or access change?"}, {"target": "Worsening depression or safety concern", "consider": "Risk assessment, care coordination, higher level of care when indicated", "avoid": "Routine activation as the only response", "review": "Is immediate safety managed and follow-up clear?"}]}, "problem_applications": [{"problem": "Depression with withdrawal", "model": "Behavioural activation functional formulation", "originator": "Behavioural activation", "maintaining_cycle": ["Low mood and low energy reduce activity; withdrawal removes routine, connection and reinforcement, which may further lower mood. Confirm the loop collaboratively."], "priority_techniques": ["Map a typical week and identify one lost valued activity.", "Schedule one small, feasible activity and review mood/function before and after.", "Use activity monitoring to identify exceptions and supportive contexts."], "pitfall": "Do not assume inactivity is the sole cause; assess severity, physical health, risk and social context.", "diagram_id": "ba-cycle", "added": true}, {"problem": "Procrastination and task avoidance", "model": "Behavioural activation functional formulation", "originator": "Behavioural activation", "maintaining_cycle": ["Tasks may cue shame, fear of failure, uncertainty or overwhelm. Avoidance provides immediate relief but increases backlog and distress."], "priority_techniques": ["Functional analysis of one recent episode.", "Define the first two-minute action and a time/place cue.", "Use support, body doubling or problem-solving if chosen by client."], "pitfall": "Assess ADHD/executive function, learning needs, workload and practical constraints where relevant.", "diagram_id": "ba-cycle", "added": true}, {"problem": "Social isolation and loneliness", "model": "Behavioural activation functional formulation", "originator": "Behavioural activation", "maintaining_cycle": ["Withdrawal may reduce exposure to rejection or effort but also remove wanted connection. The client’s desired level and type of contact must guide the plan."], "priority_techniques": ["Identify safe and meaningful forms of connection.", "Start with a low-pressure contact or structured community activity.", "Review quality of contact, not only frequency."], "pitfall": "Do not pressure contact with unsafe people or ignore discrimination and accessibility barriers.", "diagram_id": "ba-cycle", "added": true}, {"problem": "Loss of routine / self-care", "model": "Behavioural activation functional formulation", "originator": "Behavioural activation", "maintaining_cycle": ["Disrupted cues, low energy, sleep changes and avoidance may make basic routines difficult."], "priority_techniques": ["Choose one anchor routine and pair it with an existing cue.", "Make a minimum version for difficult days.", "Coordinate medical care for health or sleep concerns."], "pitfall": "Do not moralise hygiene, eating or sleep difficulties; assess medical and environmental factors.", "diagram_id": "ba-cycle", "added": true}, {"problem": "Chronic illness, pain or fatigue alongside low mood", "model": "Behavioural activation functional formulation", "originator": "Behavioural activation", "maintaining_cycle": ["Symptoms, reduced capacity and activity loss can interact. Overactivity and crash cycles may worsen functioning."], "priority_techniques": ["Use pacing and flexible plans within medical guidance.", "Choose values-consistent activity with rest built in.", "Problem-solve access and support needs."], "pitfall": "Do not prescribe exercise or alter medical management beyond competence.", "diagram_id": "ba-cycle", "added": true}, {"problem": "Rumination and self-criticism", "model": "Behavioural activation functional formulation", "originator": "Behavioural activation", "maintaining_cycle": ["Passive repetitive thinking may displace problem-solving and valued action; self-criticism may make starting harder."], "priority_techniques": ["Notice rumination’s cues and function.", "Choose a concrete next step or time-limited problem-solving.", "Use compassionate review after setbacks."], "pitfall": "Do not imply thoughts must disappear before action; consider other treatments when rumination is severe or complex.", "diagram_id": "ba-cycle", "added": true}], "session_structure": {"single_session": ["Check-in: mood, functioning, safety and important changes.", "Review last week’s activity experiment with curiosity; identify learning and barriers.", "Agree a collaborative agenda and target.", "Update functional analysis or formulation as needed.", "Choose one or a few feasible actions linked to the formulation and client values.", "Specify when/where/how, minimum version, support and expected barriers.", "Summarise rationale and invite feedback; agree monitoring and next review."], "course": ["Early phase: assessment, risk, shared formulation, activity monitoring and treatment rationale.", "Middle phase: functional analysis, values clarification, activity scheduling, graded tasks and review of barriers.", "Later phase: consolidate useful routines, address remaining avoidance, generalise skills and plan for setbacks.", "Session count varies by model, severity, response, comorbidity and service setting; follow the chosen treatment protocol and guidance."], "session_diagram_id": "ba-steps", "course_diagram_id": "ba-loop", "ending_script": "“What felt useful today, and what did not fit? What is the smallest action you want to try, when will you try it, and what might get in the way? If the plan does not happen, we will use that as information and adjust it together.”"}, "worked_case": {"client": "“R”, a fictional adult client; details are composite for teaching, not a real case.", "presenting_problem": "R reports low mood, loss of routine, missed work tasks and declining contact with friends. They spend evenings scrolling after work, which provides short-term escape but leaves them feeling disconnected. They also report fatigue and financial pressure.", "formulation_diagram_id": "ba-cycle", "goals": ["Rebuild one predictable daily anchor without imposing a rigid schedule.", "Reconnect with one safe, wanted social contact.", "Reduce avoidance of a manageable work task and understand barriers.", "Track learning and functioning rather than expecting immediate mood improvement."], "sessions": [{"number": "1-2", "focus": "Assess depression, functioning, risk and context; co-create a tentative avoidance/withdrawal formulation; begin a lightweight activity-mood log.", "between": "Record three time blocks a day for several days; note context and mood/energy."}, {"number": "3-4", "focus": "Review patterns; clarify values around connection and competence; select tiny action steps and plan cues.", "between": "Send one message to a trusted friend; open the work task for five minutes at an agreed time."}, {"number": "5-6", "focus": "Use functional analysis for missed tasks; reduce task size; problem-solve financial/work constraints; track what the client learns.", "between": "Complete the minimum task step twice; record barriers and any mastery or relief."}, {"number": "Review", "focus": "Reassess symptoms, risk and function; revise plan and consider additional treatment or referral if progress is insufficient.", "between": "Continue actions that fit; make a setback plan for high-fatigue days."}], "setback": "R misses the social contact after a difficult workday. The therapist avoids interpreting this as resistance, explores exhaustion and timing, and offers alternatives: schedule the message earlier, send a shorter note, or choose a restorative action. The plan remains client-led.", "outcome": "Teaching illustration only: progress is evaluated through symptom measures, daily functioning, connection and the client’s own priorities. No outcome is assumed or promised.", "dialogue": ["Therapist: “What happened between deciding to message your friend and the moment you chose not to?”", "R: “I felt exhausted and thought I would have nothing to say.”", "Therapist: “Not messaging may have helped you avoid that pressure in the moment. What was the effect later?”", "R: “I felt more alone. Maybe a short message would be possible.”", "Therapist: “Would you like to test that, or is there another step that fits better?”"], "relapse_prevention": ["Identify personal early warning signs such as increasing isolation, disrupted routine or abandoned valued activities.", "List small anchor actions and supports that have helped.", "Make a flexible plan for low-energy days and predictable stressors.", "Specify when to contact a clinician or seek urgent help if symptoms or safety worsen."]}, "tools": [{"name": "Activity-mood monitoring log", "purpose": "Notice patterns without judging them.", "fields": ["Time / activity", "Context and who was present", "Mood and energy (0-10, optional)", "Pleasure / mastery / connection / meaning (optional)", "What happened next?"], "instructions": "Use collaboratively with the client, or discuss verbally if completing a form does not fit. Use a manageable level of detail for several days. The goal is to learn about patterns, not to achieve perfect records."}, {"name": "Avoidance functional analysis", "purpose": "Map the function of a specific episode.", "fields": ["Trigger / context", "Thoughts, feelings, body state", "What I did or avoided", "Immediate effect", "Later effect", "Possible alternative step"], "instructions": "Use collaboratively with the client, or discuss verbally if completing a form does not fit. Choose one recent example and describe behaviour concretely. Include realistic barriers and safety concerns."}, {"name": "Values-to-action map", "purpose": "Translate chosen values into small actions.", "fields": ["Life area that matters to me", "What this value means in my words", "One action that expresses it", "Smallest version", "Support / barrier"], "instructions": "Use collaboratively with the client, or discuss verbally if completing a form does not fit. Values are directions, not standards to judge yourself against. You can change your mind."}, {"name": "Weekly activity planner", "purpose": "Plan a few realistic activities.", "fields": ["Activity", "Day / time / place", "Why it matters", "Minimum version", "Likely barrier / backup", "Review: what I learned"], "instructions": "Use collaboratively with the client, or discuss verbally if completing a form does not fit. Plan fewer activities than you think you “should.” Make room for rest and unpredictable demands."}, {"name": "Graded task ladder", "purpose": "Break a daunting task into manageable steps.", "fields": ["Larger goal", "Step 1 (easiest useful action)", "Step 2", "Step 3", "Confidence for each step", "What would make it easier?"], "instructions": "Use collaboratively with the client, or discuss verbally if completing a form does not fit. Start where confidence is reasonable. Steps can be repeated, changed or paused."}, {"name": "Pleasure and mastery review", "purpose": "Notice different kinds of reinforcement.", "fields": ["Activity tried", "Anticipated outcome", "Actual pleasure", "Actual mastery / meaning / connection", "What did I learn?"], "instructions": "Use collaboratively with the client, or discuss verbally if completing a form does not fit. Mood does not have to improve immediately for an activity to provide useful information."}, {"name": "Setback review", "purpose": "Turn a missed plan into useful information.", "fields": ["What was the plan?", "What happened?", "What got in the way?", "Was the step too large or poorly timed?", "Change for next time"], "instructions": "Use collaboratively with the client, or discuss verbally if completing a form does not fit. No blame. Adjust the plan or conditions; do not treat completion as a measure of personal worth."}, {"name": "Early-warning and staying-well plan", "purpose": "Respond early when old patterns return.", "fields": ["My early signs", "Small anchor actions", "People / supports to contact", "What I can adjust", "When I need professional or urgent help"], "instructions": "Use collaboratively with the client, or discuss verbally if completing a form does not fit. Create this with the client and keep it accessible. Follow local risk and crisis procedures."}], "troubleshooting": [{"if": "Client does not complete activity monitoring", "try": "Validate; simplify to one or two time blocks, do a sample together, use a cue or choose verbal review instead. Ask whether monitoring helps. Possible contributors: Task too complex, shame, forgetfulness, low energy, privacy concern or unclear rationale."}, {"if": "Client says “I have no motivation”", "try": "Agree on a tiny action that does not require motivation; assess confidence and reduce scope. Reassess symptoms and risk if this is worsening. Possible contributors: Low energy, hopelessness, fear, overload or unrealistic task size."}, {"if": "Mood does not improve after an activity", "try": "Review mastery, meaning, connection and what was learned. Do not promise an immediate lift. Revisit formulation and broader treatment plan. Possible contributors: Expected immediate mood change, activity mismatch, low dose, context or severe symptoms."}, {"if": "Plans repeatedly fail", "try": "Analyse one episode collaboratively; reduce, reschedule, add support or select another task. Treat non-completion as data. Possible contributors: Too many tasks, poorly timed plan, physical or structural barriers, ambivalence, executive-function needs."}, {"if": "Client feels judged or pressured", "try": "Acknowledge impact, repair alliance, clarify that plans are experiments and restore client choice. Possible contributors: Directive language, shame, cultural mismatch or prior coercive experiences."}, {"if": "Client is overactive then crashes", "try": "Assess mood elevation and health factors; introduce pacing and flexible plans; consult or refer when indicated. Possible contributors: All-or-nothing planning, perfectionism, hypomania, pacing difficulty or physical illness."}, {"if": "No rewarding activity seems available", "try": "Start with basic routine, connection, contribution, sensory or necessary actions; problem-solve access. Do not insist the client find something enjoyable. Possible contributors: Anhedonia, poverty, isolation, disability, restricted access or grief."}, {"if": "Symptoms worsen or suicidal risk emerges", "try": "Pause routine BA tasks, assess risk, follow safety and emergency procedures, consult and coordinate care as indicated. Possible contributors: Clinical deterioration or risk not adequately contained."}, {"if": "Activity plan ignores rest or pain", "try": "Reformulate with pacing, accommodations and medical guidance. Treat restorative rest as a legitimate planned activity when appropriate. Possible contributors: Overemphasis on productivity or misunderstanding the client’s capacity."}], "troubleshooting_added": true, "cultural_adaptation": ["Ask the client what a meaningful and workable life looks like in their own cultural and social context.", "Use the client’s language for mood, distress, activity and recovery; check the meaning of translated terms.", "Explore family and community roles as possible sources of meaning and support without assuming they are always safe or wanted.", "Consider stigma, caste, racism, gender, migration, economic hardship and discrimination as contextual factors, not individual deficits.", "Do not prescribe activities that create financial burden, travel risk or conflict with the client’s values.", "Adapt activity logs for literacy, language, disability, neurodivergence and sensory needs.", "Discuss privacy where family or household members may read worksheets or monitor devices.", "Respect religious or spiritual practices when the client identifies them as meaningful; do not impose them.", "Use collaborative problem-solving where access to transport, care, employment or healthcare is a major barrier.", "Distinguish avoidance from realistic safety strategies in threatening or discriminatory environments.", "Seek consultation when cultural or systemic factors exceed the practitioner’s knowledge."], "cultural_adaptation_added": true, "ethics_referral": ["Obtain informed consent and explain the rationale, expected effort, limits and alternatives.", "Use BA within competence and appropriate training; seek supervision for complex or non-responsive cases.", "Assess and respond to suicide risk, self-neglect, abuse, mania/hypomania, psychosis and medical concerns according to competence and local standards.", "Do not use activation to pressure a client into unsafe relationships, overwork, exercise or unwanted roles.", "Respect autonomy: plans are collaborative experiments, not compliance contracts.", "Protect worksheets and activity logs as confidential clinical information; minimise unnecessary data collection.", "Coordinate care with consent and in line with applicable law and professional obligations.", "Consider access and reasonable adjustments for disability, language, digital exclusion and poverty.", "Refer or consult for diagnostic uncertainty, severe or worsening symptoms, complex comorbidity, substance dependence or needs beyond scope.", "Do not recommend starting, stopping or changing medication unless appropriately licensed and authorised.", "Document formulation, agreed actions, response, risk decisions and referrals.", "Use validated measures and licensed materials according to their terms.", "For remote care, confirm location and emergency arrangements according to service policy.", "If immediate danger is present, prioritise emergency action over routine BA work."], "ethics_referral_added": true, "client_handouts": [{"id": "ba-handout-cycle", "title": "Understanding the activity-mood cycle", "give_when": "After the client and counsellor have mapped a personal example.", "body": ["Depression can make everyday activities feel difficult. When we withdraw, we may get short-term relief, but we can also lose contact with people, routines and things that matter.", "This is not laziness or a personal failure. Mood, health, circumstances and behaviour affect each other.", "Behavioural activation means choosing small, realistic actions that fit your needs and values. You do not have to wait until you feel motivated, and you do not have to feel better immediately for an action to be useful.", "The plan should fit your life, energy, access and safety. Rest and support can be part of a balanced plan."], "try_this": ["Choose one recent day and notice what you did, how you felt and what happened afterward.", "Identify one activity or routine you would like to reconnect with.", "Make the first step small and specific: what, when and where?", "If it does not happen, ask what got in the way and adjust the plan without blaming yourself."], "notes_prompt": "My small next step", "form": [{"t": "line", "label": "An activity that matters to me", "lines": 1}, {"t": "line", "label": "The smallest version I can try", "lines": 1}, {"t": "pair", "fields": ["When / where", "What might help"]}, {"t": "line", "label": "What I noticed afterward", "lines": 2}]}, {"id": "ba-handout-plan", "title": "My small activity plan", "give_when": "When an activity target has been chosen collaboratively.", "body": ["A useful plan is specific, small and chosen by you. It can be changed when life, health or energy changes.", "Pick an action linked to connection, mastery, pleasure, meaning or an important need. Make a minimum version for a difficult day.", "The purpose is to learn what works for you, not to score yourself or prove your worth."], "try_this": ["Choose one activity.", "Write down when and where you will try it.", "Decide on the minimum version and one possible support.", "Afterward, note what happened, including anything you learned."], "notes_prompt": "My plan", "form": [{"t": "line", "label": "What I will do", "lines": 1}, {"t": "pair", "fields": ["When", "Where"]}, {"t": "line", "label": "Minimum version / backup", "lines": 1}, {"t": "line", "label": "What I learned", "lines": 2}]}, {"id": "ba-handout-setback", "title": "When a plan does not happen", "give_when": "When the client is discouraged by missed or difficult activity plans.", "body": ["A missed plan is information, not a verdict about you. There may have been too little energy, a task that was too big, a practical barrier, a change in health or a plan that did not fit.", "You and your counsellor can use what happened to adjust the next step. You can also choose rest, support or problem-solving when those are what you need."], "try_this": ["Describe what happened without judging yourself.", "Name the main barrier.", "Make the step smaller, change the timing, add support or choose a different action.", "If mood or safety is getting worse, tell your counsellor or seek appropriate help."], "notes_prompt": "My setback review", "form": [{"t": "line", "label": "What happened", "lines": 2}, {"t": "line", "label": "What got in the way", "lines": 2}, {"t": "line", "label": "What I will change next time", "lines": 2}]}], "client_handouts_added": true, "counsellor_sheets": [{"id": "ba-sheet-assessment", "title": "BA assessment and functional formulation sheet", "use_when": "At intake and review. Complete collaboratively, record only necessary information and store securely.", "cover": {"title": "Confidential client details", "note": "Keep identifying information separate where service policy requires. Use a client identifier on working pages.", "items": [{"t": "pair", "fields": ["Client ID", "Date"]}, {"t": "pair", "fields": ["Preferred name", "Pronouns (optional)"]}, {"t": "line", "label": "Presenting concerns in client’s words", "lines": 2}, {"t": "line", "label": "Safe contact / emergency arrangements according to policy", "lines": 1}]}, "sections": [{"heading": "Current pattern", "items": [{"t": "guide", "text": "Build a specific, non-judgmental account with the client. Example: after a tiring shift, the client went home instead of making a planned call; staying home brought immediate relief, while loneliness was stronger the next morning. Check what fits and what does not."}, {"t": "line", "label": "Typical day / activity pattern", "lines": 3}, {"t": "line", "label": "Withdrawal or avoidance pattern", "lines": 3}, {"t": "line", "label": "Immediate relief and delayed consequences", "lines": 3}, {"t": "line", "label": "Values, roles and desired activities", "lines": 3}, {"t": "line", "label": "Practical, cultural, physical or safety barriers", "lines": 3}, {"t": "line", "label": "Strengths and supports", "lines": 2}]}, {"heading": "Plan and review", "items": [{"t": "guide", "text": "Link the activity to something the client values and agree a manageable version, cue and review point. Example: a short call with a friend, with a text as a lower-energy option. The client chooses whether either option fits."}, {"t": "line", "label": "Shared maintenance hypothesis", "lines": 3}, {"t": "line", "label": "Chosen target and rationale", "lines": 2}, {"t": "line", "label": "Specific activity plan / minimum version", "lines": 2}, {"t": "line", "label": "Risk assessment, consultation or referral as indicated", "lines": 2}, {"t": "line", "label": "Review date and outcome measures", "lines": 1}]}]}, {"id": "ba-sheet-weekly", "title": "Weekly activation review sheet", "use_when": "At each review of planned activities.", "sections": [{"heading": "Review without blame", "items": [{"t": "guide", "text": "Compare the plan with what actually happened, then ask what the experience suggests. Example: a planned visit felt too demanding, but a brief message felt manageable; the next plan can be adjusted around that information."}, {"t": "line", "label": "What was planned and what happened?", "lines": 3}, {"t": "line", "label": "What was learned about mood, mastery, meaning or connection?", "lines": 3}, {"t": "line", "label": "What barriers or supports mattered?", "lines": 3}, {"t": "line", "label": "What should be repeated, reduced, changed or dropped?", "lines": 3}, {"t": "line", "label": "Next small action, cue and backup", "lines": 2}]}], "cover": {"title": "Weekly activation review", "note": "Record the minimum necessary information. Store completed sheets securely and follow local law and service policy.", "items": [{"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}]}}], "counsellor_sheets_added": true, "session_note_template": {"fields": [{"label": "Session details", "guidance": "Client ID, date, session number, duration, mode, attendees and practitioner. For online sessions, record required location and contact/safety information according to policy."}, {"label": "Clinical update and measures", "guidance": "Current symptoms, functioning, activity pattern, client priorities and measures used; include changes and item-level risk concerns when relevant."}, {"label": "Formulation and intervention", "guidance": "Trigger/context, avoidance or behaviour pattern, immediate and delayed consequences, formulation updates, rationale for selected BA intervention."}, {"label": "Activity plan and review", "guidance": "Specific agreed action, minimum version, cue, support, barriers, client response and between-session plan."}, {"label": "Risk, consultation and follow-up", "guidance": "Risk assessment and actions when indicated, consultation/referral, coordination, next appointment and contingency plan."}], "example": "Example (fictional): Client reports increased isolation and low energy. Reviewed activity log; identified short-term relief from cancelling plans and later loneliness. Agreed a 5-minute call to a chosen support person on Wednesday, with a text as minimum version. Reviewed risk and support plan according to service protocol.", "note": "Use objective, respectful, relevant documentation. Record the client’s perspective, clinical reasoning and agreed plan; follow applicable law, professional standards and service policy."}, "session_note_template_added": true, "online_adaptations": ["Confirm client location, privacy, callback number and local emergency plan at the start, consistent with service policy.", "Use a shared digital activity log only with informed consent and appropriate data protection.", "Screen-share a simple weekly schedule; avoid overcomplicated tracking tools.", "Check accessibility, device/data limitations, language, literacy and private space.", "Plan low-tech alternatives if connectivity fails.", "For risk concerns, know the client’s location and local crisis pathway; follow service protocols.", "Use short, concrete steps and ask the client to explain the plan in their own words.", "Do not interpret camera-off, missed calls or digital non-completion as resistance without exploring context.", "Consider whether the client has safe opportunities to complete activities and whether household members may monitor devices.", "Maintain boundaries around between-session messaging and response times.", "Document telehealth adaptations and consent as required.", "If remote delivery cannot provide adequate safety or clinical care, arrange a more appropriate setting or referral."], "online_adaptations_added": true, "tips": ["Start with the client’s formulation and goals, not a preselected activity list.", "Use specific behavioural descriptions: what, when, where and how long.", "Ask about short-term relief and long-term costs without assuming the answer.", "Plan a minimum version and a backup for difficult days.", "Include connection, mastery, values, routine and necessary tasks, not only pleasurable activities.", "Review the learning from a task even when it was not completed.", "Look for exceptions: when does the client do a little more, and what makes that possible?", "Use self-compassionate, non-moralising language.", "Track function and client-defined outcomes alongside symptom scores.", "Reassess when activation is not helping; do not keep escalating activity automatically."], "pitfalls": ["Equating BA with “just exercise” or “keep busy.”", "Assuming inactivity is laziness, resistance or a character flaw.", "Setting too many activities or steps that are too difficult.", "Promising that every planned activity will improve mood.", "Ignoring pain, fatigue, disability, caregiving, finances, safety or access.", "Treating every form of rest or avoidance as pathological.", "Making values into rigid demands or productivity goals.", "Using worksheets as compliance tests rather than collaborative aids.", "Failing to reassess risk, diagnosis, comorbidity or treatment fit.", "Persisting with an ineffective plan without learning from outcomes.", "Using activation alone when urgent care or a broader treatment plan is needed."], "competency_checklist": ["Explains BA accurately and collaboratively without reducing it to “do more.”", "Assesses depression, functioning, risk and relevant differential/contextual factors.", "Uses activity monitoring in a manageable, non-judgmental way.", "Conducts functional analysis of avoidance and its short- and long-term consequences.", "Helps the client identify personally meaningful values and activity targets.", "Builds specific, graded, feasible plans with cues, support and backup options.", "Adapts to physical health, disability, culture, finances and environmental barriers.", "Reviews missed plans with curiosity and adjusts the formulation.", "Uses symptom and functional measures appropriately.", "Recognises deterioration, risk and need for consultation or referral.", "Documents decisions and maintains confidentiality.", "Uses supervision and outcome feedback to improve practice."], "competency_checklist_added": true, "supervision_prompts": ["Does the maintenance formulation fit the client’s lived experience, and what evidence might challenge it?", "Have I distinguished avoidance from rest, protection or a response to real danger?", "Are the selected activities meaningful to the client or mainly to me?", "Are the steps small enough, specific enough and realistically accessible?", "What immediate consequence makes the current pattern understandable?", "Am I overlooking poverty, discrimination, disability, care duties or other structural barriers?", "How does the client experience my structure, supportive, pressuring or shaming?", "What did we learn from activities that did not happen or did not help?", "Are symptoms, functioning or risk worsening? What change in care is needed?", "Am I using measures appropriately and interpreting them in context?", "Is this within my competence, and what consultation or referral is needed?", "What will I do differently next session based on the evidence so far?"], "supervision_prompts_added": true, "quiz": [{"question": "A client says they will start activities only when they feel motivated. What is the most BA-consistent response?", "options": ["Tell them they must try harder", "Collaboratively choose a very small, feasible action and review what happens", "Give them a long list of enjoyable activities", "Explain that their thoughts are irrational"], "answer": 1, "rationale": "BA often uses planned action to create opportunities for learning before motivation returns. The step must be collaborative, feasible and reviewed, not imposed."}, {"question": "Why can avoidance maintain low mood?", "options": ["It always proves the client is afraid", "It may bring short-term relief while reducing longer-term access to reward, connection or mastery", "Avoidance is always maladaptive", "It means the client lacks values"], "answer": 1, "rationale": "Functional analysis examines short- and long-term consequences. Some avoidance is protective; context determines function."}, {"question": "A client misses a scheduled walk because of a pain flare. What should the therapist do first?", "options": ["Label it resistance", "Increase the target to build discipline", "Explore what happened and adapt the plan to capacity and medical guidance", "Stop BA immediately"], "answer": 2, "rationale": "The missed plan is information. Physical health and pacing matter; do not moralise or prescribe beyond competence."}, {"question": "Which is the clearest activity plan?", "options": ["Be more social", "Feel happier this week", "After breakfast on Tuesday, send a brief message to a trusted friend", "Stop being avoidant"], "answer": 2, "rationale": "A useful plan specifies a concrete action and context while remaining chosen and realistic."}, {"question": "What is the purpose of activity monitoring?", "options": ["Prove the client is not trying", "Track every minute perfectly", "Notice patterns among activity, context and mood to guide formulation", "Replace clinical assessment"], "answer": 2, "rationale": "Monitoring is a collaborative learning tool and does not replace assessment or risk management."}, {"question": "A client has no money for suggested activities. What is the best next move?", "options": ["Repeat that exercise is free", "Explore meaningful no-cost options and practical barriers together", "Assume they are not ready", "Focus only on positive thinking"], "answer": 1, "rationale": "BA must account for access and structural conditions rather than individualise hardship."}, {"question": "A client reports suicidal intent and access to means during a BA session. What takes priority?", "options": ["Finish the activity schedule", "Ask them to do a pleasurable activity", "Follow risk assessment, safety and emergency procedures", "Give a values worksheet"], "answer": 2, "rationale": "Immediate safety takes precedence over routine activation tasks."}, {"question": "A client completes a task but mood stays low. What should the therapist conclude?", "options": ["The task was pointless", "The client did it incorrectly", "Review what was learned, including mastery, meaning, connection and fit; adapt as needed", "Increase all activity immediately"], "answer": 2, "rationale": "Mood is not the only outcome and improvement is not guaranteed after each task."}, {"question": "Which statement best reflects values work?", "options": ["The therapist decides which life goals are healthiest", "Values are productivity targets", "The client identifies meaningful directions and chooses small actions that express them", "Values never change"], "answer": 2, "rationale": "Values are personally chosen directions, not externally imposed standards."}, {"question": "A client repeatedly does too much on good days and crashes. What should be explored?", "options": ["A stricter activity quota", "Pacing, task size, health factors and possible mood elevation where indicated", "Whether the client cares enough", "Only thought distortions"], "answer": 1, "rationale": "Overactivity and crashes call for careful formulation, pacing and appropriate assessment, not automatic escalation."}], "quick_reference": ["Map activity, mood, context and consequences before selecting a target.", "Ask what avoidance helps with now and what it costs later.", "Choose an action linked to the client’s values, needs or functioning.", "Make the plan specific: what, when, where, duration, cue and support.", "Create a minimum version and a backup for difficult days.", "Review missed or disappointing plans with curiosity, not blame.", "Track meaningful functioning and symptoms; revise when the plan does not fit.", "Risk first: pause routine activation and follow local safety procedures when indicated."], "glossary": [{"term": "Activity monitoring", "definition": "Recording activities and related mood, energy or context to notice patterns."}, {"term": "Activity scheduling", "definition": "Planning a specific action at a time and place to increase opportunities for valued or reinforcing experiences."}, {"term": "Behavioural activation (BA)", "definition": "A structured psychological approach that targets avoidance and withdrawal and increases contact with meaningful or reinforcing activity."}, {"term": "Functional analysis", "definition": "Examining antecedents, behaviour and consequences to understand what maintains a pattern."}, {"term": "Graded task assignment", "definition": "Breaking a large task into smaller, manageable steps and progressing collaboratively."}, {"term": "Mastery", "definition": "A sense of competence, accomplishment or effectiveness from an activity."}, {"term": "Pleasure", "definition": "The enjoyable or rewarding quality of an activity; it may be low during depression."}, {"term": "Reinforcement", "definition": "A consequence that increases the likelihood of a behaviour recurring; in BA, access to reinforcement is examined in context."}, {"term": "Avoidance", "definition": "A behaviour that moves a person away from an experience or situation; its function and context must be assessed."}, {"term": "Values", "definition": "Personally chosen directions that express what matters, rather than fixed outcomes or standards."}, {"term": "Committed action", "definition": "A concrete action chosen in service of a valued direction."}, {"term": "Shaping", "definition": "Building a complex behaviour gradually by reinforcing successive manageable steps."}, {"term": "Rumination", "definition": "Repetitive thinking that may become unproductive and displace helpful action."}, {"term": "Activity-mood log", "definition": "A record used to explore associations between activity, context and mood; it does not prove causation."}, {"term": "Graded approach", "definition": "Taking manageable steps toward a safe but avoided situation."}, {"term": "Pacing", "definition": "Adjusting activity and rest to support sustainable functioning, especially with fluctuating capacity."}, {"term": "Relapse prevention", "definition": "Planning to recognise early warning signs and respond with helpful actions and supports."}, {"term": "Minimum version", "definition": "A deliberately small version of a planned activity that remains feasible on a difficult day."}, {"term": "Guided self-help", "definition": "Structured self-help materials with planned practitioner support and review."}, {"term": "Outcome monitoring", "definition": "Repeated review of symptoms, functioning and client-defined goals to guide care."}], "related_modules": ["cbt", "acceptance-commitment-therapy", "mindfulness-based-cognitive-therapy", "motivational-interviewing", "depression-assessment", "problem-solving-therapy"], "safety_note": "Behavioural activation is not a crisis intervention. If risk to life or safety emerges, pause routine activity planning and follow the applicable local risk-assessment, safeguarding, emergency and referral procedures. In India, emergency services: 112; Tele-MANAS mental health support: 14416. Assess and document risk within your competence and local policy; seek urgent consultation or higher-level care when indicated."}}
