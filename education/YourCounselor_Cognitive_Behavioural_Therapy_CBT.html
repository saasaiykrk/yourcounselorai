ntaining_cycle": ["Negative views of self, world and future (cognitive triad) colour how events are read.", "Low mood leads to withdrawal and inactivity.", "Fewer rewarding experiences and more time to ruminate.", "Rumination and self-criticism produce more negative thoughts, deepening low mood."], "priority_techniques": ["Activity scheduling and behavioural activation (start here when mood is very low)", "Thought records", "Socratic questioning", "Core belief work later: continuum, positive data log", "Relapse prevention"], "pitfall": "Starting with heavy cognitive work when the client can barely get out of bed. Behaviour first, then thoughts.", "diagram_id": "d-cycle-depression", "added": false}, {"problem": "Panic", "model": "Cognitive model of panic", "originator": "Clark", "maintaining_cycle": ["A trigger (internal or external) is perceived as a threat.", "Perceived threat produces apprehension.", "Apprehension produces body sensations (racing heart, breathlessness, dizziness).", "The sensations are interpreted catastrophically (“I’m having a heart attack”), which increases the perceived threat.", "Safety behaviours and selective attention to the body keep the misinterpretations from being disconfirmed."], "priority_techniques": ["Draw the cycle with the client’s own panic attack", "Behavioural experiments, including bringing on feared sensations deliberately", "Dropping safety behaviours", "Restructuring catastrophic interpretations"], "pitfall": "Teaching breathing or distraction as a way to prevent the catastrophe. This turns them into safety behaviours. Before bringing on sensations deliberately (over-breathing, spinning, running on the spot), make sure panic-like symptoms have had a medical review; avoid or adapt these exercises, with medical advice, where there is a heart or lung condition, asthma, epilepsy, pregnancy, recent injury or a history of fainting.", "diagram_id": "d-cycle-panic", "added": true}, {"problem": "Social anxiety", "model": "Cognitive model of social anxiety", "originator": "Clark & Wells", "maintaining_cycle": ["Entering a social situation activates assumptions about being judged.", "The situation is perceived as socially dangerous.", "Attention shifts inward; the person processes themselves as a social object, often from an observer’s perspective.", "Safety behaviours and bodily and cognitive symptoms feed this self-image and each other.", "Worry before the event and post-event rumination keep the cycle going."], "priority_techniques": ["Experiments comparing self-focus with external focus, and with and without safety behaviours", "Shifting attention outward", "Surveys of others’ views", "Graded exposure without safety behaviours"], "pitfall": "Doing exposure while the client keeps safety behaviours and self-focus. Little new learning happens.", "diagram_id": "d-cycle-social", "added": true}, {"problem": "Persistent worry", "model": "Intolerance of uncertainty model", "originator": "Dugas", "maintaining_cycle": ["**Intolerance of uncertainty:** finding not-knowing unbearable.", "**Positive beliefs about worry:** “Worrying helps me prepare.”", "**Negative problem orientation:** seeing problems as threats and doubting one’s ability to solve them.", "**Cognitive avoidance:** pushing away disturbing images and thoughts."], "priority_techniques": ["Psycho-education about worry", "Behavioural experiments with tolerating uncertainty", "Re-evaluating the usefulness of worry", "Problem-solving training", "Worry exposure for hypothetical worries"], "pitfall": "Trying to answer each worry with reassurance. Every answer invites another “what if”.", "diagram_id": "d-cycle-gad", "added": true}, {"problem": "Obsessive-compulsive difficulties", "model": "Cognitive-behavioural model of OCD", "originator": "Salkovskis", "maintaining_cycle": ["Unwanted intrusive thoughts are normal and common.", "Problems arise when an intrusion is appraised as meaning the person is responsible for causing or preventing harm.", "This appraisal brings distress.", "The person neutralises through compulsions, reassurance seeking, avoidance or thought suppression.", "Neutralising brings short-term relief but prevents the appraisal being disconfirmed and makes intrusions more frequent."], "priority_techniques": ["Normalising intrusions", "Exposure and response prevention", "Responsibility pie chart", "Behavioural experiments", "Comparing two explanations: “I am dangerous” vs “I am a worrier who tries too hard not to be dangerous”"], "pitfall": "The counsellor giving reassurance. It works exactly like a compulsion. Refer severe OCD to a specialist.", "diagram_id": "d-cycle-ocd", "added": true}, {"problem": "Post-traumatic stress", "model": "Cognitive model of PTSD", "originator": "Ehlers & Clark", "maintaining_cycle": ["PTSD persists when the trauma is processed in a way that creates a sense of serious current threat.", "This arises from (1) excessively negative appraisals of the trauma and/or its aftermath, and (2) a disturbance of autobiographical memory: the trauma memory is poorly elaborated and poorly integrated with its context, with strong associative and perceptual priming.", "The threat is maintained by (3) problematic behaviours and cognitive strategies (thought suppression, avoidance of reminders, rumination, excessive checking, social withdrawal) that prevent change in the appraisals and the memory."], "priority_techniques": ["Psycho-education about trauma reactions", "Reclaiming activities and relationships", "Responsibility pie chart for guilt", "Reducing suppression, avoidance and rumination", "Memory-focused work (reliving, updating), for specialist-trained counsellors only"], "pitfall": "Starting memory work without training or stabilisation. Counsellors without trauma-focused training should assess, support and refer.", "diagram_id": "d-ptsd", "added": false}], "session_structure": {"single_session": ["**Mood check:** a brief rating or measure and an update on the week.", "**Bridge:** link back to what was learned last session.", "**Review action plan:** go over homework: what was learned, what got in the way.", "**Set agenda:** agree today’s topics together; keep it to one or two.", "**Explore the agenda item:** gather detail about the problem.", "**Plan and practise a strategy:** apply a technique in session.", "**Summarise:** client and counsellor recap the key points.", "**Confirm action plan:** agree specific between-session practice.", "**Feedback:** ask what was helpful and what wasn’t."], "course": ["**Typical length:** around 16 sessions of 30-60 minutes, weekly, twice weekly or fortnightly; this varies widely by client and problem.", "**Initial phase (assessment, sessions 1-3):** build rapport; assess through interview, observation and questionnaires; draw up a problem list; begin catching automatic thoughts; explain the cognitive model and the link between events, beliefs and consequences; obtain consent; discuss expectations; establish the role of homework.", "**Middle phase (cognitive work, sessions 4-11):** help the client take ownership of change; increase activity; replace negative automatic thoughts with more helpful ones; build social, problem-solving and coping skills; prepare for setbacks; coach the client to run these skills independently.", "**Ending phase (consolidation, sessions 12-16):** review gains and acknowledge genuine effort; prepare for ending; set longer-term practice; plan relapse prevention; address barriers to ending.", "**Follow-up:** can be planned during the ending phase; helps monitor and maintain progress.", "**Session 1 is different:** no bridge or homework review; it focuses on rapport, assessment, risk, socialising to the model, the problem list, goals and consent.", "**Phases overlap:** these stages are a guide, not a fixed sequence."], "session_diagram_id": "d-session", "course_diagram_id": "d-course", "ending_script": ["**Raise the ending early:** mention the planned number of sessions from the start and remind the client a few sessions before the last one: “We have three sessions left; let’s use them to make sure you can keep this going on your own.”", "**Review progress together:** compare first and latest measures and goals: “When we started, you rated your mood 3 out of 10; today it’s 6. What do you think made the difference?”", "**Space out the final sessions:** where possible, move from weekly to fortnightly or monthly towards the end, so the client practises managing on their own with support still in place.", "**Let the client name what helped:** they remember their own words best.", "**Build the staying-well plan:** early warning signs, action plan, who to turn to; give the “Staying well after counselling” handout.", "**Normalise setbacks:** “A bad week is not a failure; it’s a signal to use your plan.”", "**Acknowledge feelings about ending:** some clients feel anxious or sad; name it and make space for it.", "**Agree what happens next:** booster sessions, how to get back in touch, and any referrals.", "**Close warmly:** recognise the client’s effort and courage."]}, "worked_case": {"client": "Sam (name changed), 34, accountant, married with one young child.", "presenting_problem": "Four months of low mood after being passed over for promotion. Poor sleep, tiredness, guilt, stopped playing weekend cricket, working late into the night, avoiding family meals. Mild passive thoughts (“What’s the point?”) with no plan or intent; risk assessed and a safety plan agreed in session 1. Depression measure in the moderate range.", "formulation_diagram_id": "d-case", "goals": ["Return to weekend cricket at least twice a month within six weeks.", "Eat dinner with family on at least five evenings a week.", "Stop work by 8 p.m. on weekdays.", "Raise his own belief that “I’m good enough as I am” from 10% to 50% or more."], "sessions": [{"session": "1-2", "focus": "Assessment and engagement", "highlights": "Risk assessment and safety plan; recent example mapped on the five-part model; Sam spots that working late keeps the “failure” thought going. Working late is a compensatory strategy for “If I don’t excel, I’m worthless”."}, {"session": "3-5", "focus": "Behavioural activation", "highlights": "Activity monitoring shows evenings are the lowest point. Small steps: one family dinner, a walk with his son, a call to a cricket friend. Mood ratings begin to lift."}, {"session": "6-9", "focus": "Thought records and Socratic questioning", "highlights": "Works on “I’m a failure” and “I’ve let my family down”. Evidence includes a strong appraisal two years ago and his wife’s support. Belief in “failure” falls from 90% to 45%."}, {"session": "10-12", "focus": "Rules and core belief", "highlights": "Downward arrow reveals “I’m not good enough”, linked to childhood comparison with his elder brother. Cognitive continuum and a positive data log build “I’m good enough as I am”."}, {"session": "13-14", "focus": "Assertiveness", "highlights": "Role play to ask his manager for feedback on the promotion decision and a development plan. Conversation goes better than predicted."}, {"session": "15-16", "focus": "Relapse prevention and ending", "highlights": "Reviews gains with his own graphs, writes a personal blueprint, sets booster sessions."}], "setback": "After a critical comment from a senior colleague in week 9, Sam’s mood dipped and he stopped his activities for several days. Together they treated it as information: mapped the episode, spotted the old rule switching on, and restarted the schedule at a smaller level. The setback became a rehearsal for relapse prevention.", "outcome": "By the end Sam was playing cricket regularly, eating with his family most evenings and finishing work at a reasonable time. Depression scores were in the mild range and belief in “I’m good enough as I am” was 60%.", "dialogue": [{"speaker": "Counsellor", "line": "Your manager gave the promotion to someone else. If that meant he rated them more highly than you, what would that mean to you?", "note": "Downward arrow, session 10: treat the thought as true for now."}, {"speaker": "Client", "line": "That I’m not as good as the others.", "note": ""}, {"speaker": "Counsellor", "line": "And if you weren’t as good as the others, what would that say about you?", "note": "Varies the wording to avoid interrogation."}, {"speaker": "Client", "line": "That I’m just not good enough. Like when I was a kid and my brother was always better.", "note": "Core belief reached, with its early link."}, {"speaker": "Counsellor", "line": "That sounds like an old and painful belief. Let’s write it down and just notice it for now. We’ll look at it carefully together over the next few sessions.", "note": "Names the belief without challenging it yet; leaves time to settle."}], "relapse_prevention": ["**Early warning signs:** working past 9 p.m., skipping cricket, “What’s the point?” thoughts.", "**Action plan:** restart the activity schedule, complete a thought record, talk to his wife.", "**High-risk times:** appraisal season, family comparisons at gatherings.", "**When to seek help:** two weeks of low mood that his plan isn’t shifting, or any thoughts of self-harm.", "**Booster sessions:** at one and three months."]}, "tools": [{"name": "Thought record", "level": "foundation", "purpose": "To catch, examine and rebalance negative automatic thoughts in a systematic way.", "when": "From around session 3 onwards; the main between-session cognitive task.", "fields": ["**Situation:** what, where, when, who.", "**Emotion:** name it and rate its intensity (0-100%).", "**Automatic thought:** exact words or image, with belief rating (0-100%).", "**Behaviour:** what the client did.", "**Evidence for and against** the thought.", "**Balanced response:** an alternative view built from the evidence.", "**Thinking traps:** tick any that fit: all-or-nothing, expecting the worst, mind-reading, jumping to conclusions, overgeneralising, mental filter, discounting positives, emotional reasoning, labelling, personalising, “should” rules.", "**Balancing questions:** choose the ones that fit: What do I know for certain, and what am I assuming? What supports this view, and what complicates it? Is there another explanation? What would I say to someone I care about? What is a fair way to describe what happened? What useful next step fits my goals?", "**Re-rating:** emotion intensity and belief after the balanced response."], "example": "Situation: manager moved meeting. Emotion: anxious 80%. Thought: “I’m in trouble” 85%. Behaviour: didn’t reply all evening. For: her message was short and gave no reason. Against: nothing in the message mentioned a problem; she praised my report last week. Balanced: “Meetings move all the time; I don’t know why yet.” Re-rate: anxious 35%, belief 30%.", "added": false}, {"name": "Activity schedule", "level": "foundation", "purpose": "To monitor and plan daily activity, and track its link with mood.", "when": "Low mood, withdrawal, poor routine.", "fields": ["**Day and hour grid.**", "**Activity:** what was done or is planned.", "**Achievement rating** (0-10).", "**Enjoyment rating** (0-10)."], "example": "Wednesday 7-8 p.m.: cooked dinner with partner; achievement 6, enjoyment 5 (predicted 1).", "added": false}, {"name": "Fear ladder", "level": "foundation", "purpose": "To plan graded exposure step by step.", "when": "Phobias, panic avoidance, social anxiety.", "fields": ["**Feared situation** at the top.", "**Steps** from easiest to hardest.", "**Distress rating** (0-100) for each step.", "**Date tried** and distress before, at peak and after.", "**What I learned.**"], "example": "Taking the lift: stand by the lift (20) → ride one floor with a friend (45) → ride one floor alone (60) → ride to the top floor alone (85).", "added": true}, {"name": "Cost-benefit sheet", "level": "advanced", "purpose": "To weigh the pros and cons of holding a belief or pattern.", "when": "When a client clings to an unhelpful belief.", "fields": ["**Belief or pattern under review.**", "**Benefits:** short-term and long-term.", "**Costs:** emotional, practical, relational, work.", "**Conclusion:** keep, modify or replace."], "example": "Belief: “I must never make mistakes.” Benefit: careful work. Costs: works late, exhausted, avoids new tasks. Conclusion: aim for “high standards, human limits”.", "added": false}, {"name": "Responsibility pie chart", "level": "advanced", "purpose": "To spread blame realistically across all contributing factors.", "when": "Guilt, trauma, OCD.", "fields": ["**Event.**", "**Initial self-responsibility rating** (%).", "**Contributing factors**, each with a percentage.", "**Pie diagram** with the client’s share drawn last.", "**Re-rating** and reflections."], "example": "Car accident: initial self-blame 90%. Other driver asleep 50%, wet road 15%, poor lighting 10%, other car’s speed 15%, me 10%. Re-rate: 15%.", "added": false}, {"name": "Cognitive continuum", "level": "advanced", "purpose": "To place an absolute self-judgement on a scale.", "when": "Absolute core beliefs.", "fields": ["**Belief** being tested.", "**Scale 0-100** with concrete descriptions of each end.", "**Initial self-placement.**", "**Others placed** on the line.", "**Revised self-placement** and what changed."], "example": "“I’m a bad mother”: first placed at 5; after placing others and reviewing evidence, re-placed at 65.", "added": false}, {"name": "Behavioural experiment record", "level": "foundation", "purpose": "To plan and review a test of a specific thought.", "when": "Whenever a belief can be tested as a prediction.", "fields": ["**Thought** and belief rating (%).", "**Prediction:** what exactly will happen.", "**Alternative prediction:** what else might happen, and how strongly it is believed.", "**Experiment plan**, including safety behaviours to drop.", "**Possible obstacles** and how to handle them.", "**Outcome.**", "**What was learned** and re-rated belief."], "example": "Thought: “If I ask a question in class, people will laugh” 80%. Outcome: two people nodded, the lecturer said “good question”. Re-rate: 30%.", "added": true}, {"name": "Five-part map", "level": "foundation", "purpose": "To map a recent episode across situation, thoughts, emotions, body and behaviour.", "when": "Assessment and socialisation; any time a new episode needs understanding.", "fields": ["**Situation** at the top.", "**Thoughts**, **emotions**, **physical sensations** and **behaviour**, each with arrows showing influence on the others."], "example": "Situation: loan letter. Thought: “I’ll lose everything.” Emotion: dread. Body: tight chest. Behaviour: left letter unopened.", "added": false}, {"name": "Formulation map", "level": "advanced", "purpose": "To show how a problem has developed and how it is maintained over time.", "when": "Built up over the first sessions, refined throughout.", "fields": ["**Early experiences.**", "**Core beliefs.**", "**Rules and assumptions.**", "**Critical incident(s).**", "**Automatic thoughts and meaning.**", "**Emotional and behavioural consequences**, with the loop back to thoughts."], "example": "See the worked case diagram for Sam.", "added": false}, {"name": "Rule and coping-strategy record", "level": "advanced", "purpose": "To make a rule or assumption, and the strategy used to live with it, visible so they can be tested and loosened.", "when": "Once rapport and early coping skills are in place, usually in the middle phase of therapy.", "fields": ["**Rule or assumption:** in “If…, then…” or “I must…” form.", "**What it tries to prevent or achieve.**", "**Coping strategy used:** for example avoidance, over-preparing, perfectionism, people-pleasing, reassurance-seeking.", "**Short-term benefit** of the strategy.", "**Long-term cost:** what it maintains.", "**A more flexible rule** to practise, and a behavioural experiment to test it."], "example": "Rule: “If I don’t do everything perfectly, people will see I’m incompetent.” Prevents: criticism. Strategy: re-checks every email three times, works late. Benefit: few errors. Cost: exhaustion; never learns that small mistakes are tolerated. Flexible rule: “Good enough is usually enough; mistakes can be fixed.” Experiment: send two routine emails after one check and note what happens.", "added": true}, {"name": "Core-belief exploration prompts", "level": "advanced", "purpose": "To help surface core beliefs around a theme.", "when": "When working towards deeper beliefs.", "fields": ["**Sentence stems:** complete a stem about the theme (e.g. “Failure is…”) several times in a row.", "**About self:** reflective questions on worth, competence and lovability.", "**About others:** questions on fairness, luck and comparison.", "**About the world:** questions on absolutes (“everyone”, “no one”) and balance of good and bad."], "example": "“Mistakes mean… I’m careless / people will see I’m not good enough / I’ll be found out.”", "added": false}, {"name": "Relapse prevention blueprint", "level": "foundation", "purpose": "To consolidate learning and plan for future difficulties.", "when": "Final sessions.", "fields": ["**What I learned** about my problem.", "**What helped most.**", "**Early warning signs.**", "**My action plan** if they appear.", "**High-risk situations.**", "**Who I can turn to**, and when to seek professional help."], "example": "See Sam’s relapse-prevention plan in the worked case.", "added": true}], "troubleshooting": [{"if": "The client doesn’t do the action plan", "try": "Review it anyway, without blame. Explore what got in the way (practical, beliefs such as “it won’t help”, too big a task). Make the next one smaller, set it together, and start it in session."}, {"if": "The client can’t identify thoughts", "try": "Use a vivid recent example, imagery and slowing down; ask for pictures and meanings rather than words; offer tentative guesses for them to accept or reject."}, {"if": "The client agrees intellectually but feels no change", "try": "Move from talking to doing: a behavioural experiment brings head-level knowledge to gut level."}, {"if": "Strong emotion floods the session", "try": "Slow down, validate, use grounding or slow breathing, then return to the work in a smaller step. Leave time to settle before ending."}, {"if": "The client keeps talking and the session drifts", "try": "Gently return to the agreed agenda; summarise often; ask permission to interrupt when needed."}, {"if": "Low motivation or hopelessness", "try": "Check risk. Shrink goals, use behavioural activation, link tasks to the client’s values, and revisit the formulation to show why change is possible."}, {"if": "Strain in the relationship", "try": "Name it openly and non-defensively, ask for feedback, own your part, and adjust pace or approach."}, {"if": "No progress after several sessions", "try": "Revisit the formulation and goals, check for missed maintaining factors (safety behaviours, substances, life stressors), seek supervision, and consider referral or a different approach."}, {"if": "The client asks for reassurance repeatedly", "try": "Notice whether reassurance works like a compulsion; reflect the pattern and help the client test tolerating uncertainty instead."}], "troubleshooting_added": true, "cultural_adaptation": ["**Ask, don’t assume:** explore what the client’s culture, faith, family and community mean to them personally.", "**Family and community:** in collectivist settings, including family or elders (with consent) can strengthen engagement; goals may be shared rather than individual.", "**Physical language of distress:** many clients describe distress through the body (headaches, tiredness, “tension”). Start with the body and link it to thoughts and feelings.", "**Stigma:** use non-pathologising language such as “stress” or “strain” if it helps engagement; explain confidentiality clearly.", "**Faith and spirituality:** work with beliefs that support coping; distinguish shared religious or cultural beliefs from distorted thoughts before questioning anything.", "**Language:** work in the client’s preferred language where possible; translate key ideas into everyday words and local sayings.", "**Literacy and learning style:** use drawings, voice notes or verbal records instead of written forms when needed.", "**Power and gender dynamics:** consider whether the client can safely make the changes discussed at home; plan experiments that are realistic within their situation.", "**Directive style:** some clients expect advice from an expert; explain collaboration while offering enough structure to feel helped.", "**Practical realities:** cost, travel, shift work, shared living space and privacy for online sessions affect attendance and homework; plan around them.", "**Examples:** choose examples and metaphors that fit the client’s life, not the counsellor’s."], "cultural_adaptation_added": true, "ethics_referral": ["**Informed consent:** explain what CBT involves, its active nature, homework, likely length, alternatives, and the right to stop at any time.", "**Confidentiality and its limits:** explain at the start when information may be shared (serious risk to self or others, safeguarding, legal requirements).", "**Competence:** work within your training. Trauma-focused CBT, eating disorders, severe OCD and psychosis need specific training and supervision.", "**Refer to psychiatry or medical review:** severe depression, suspected bipolar or psychotic symptoms, medication questions, significant physical symptoms, or substance withdrawal risk.", "**Refer urgently:** imminent risk to life; follow your risk protocol and local emergency pathways.", "**Safeguarding:** know your local duties for children and vulnerable adults.", "**Minors:** consent from a parent or guardian plus the young person’s own agreement; know local mandatory-reporting duties.", "**Supervision:** regular supervision is standard practice, especially when learning CBT.", "**Documentation:** record assessment, risk, formulation, goals, interventions, measures and progress clearly and securely.", "**Boundaries:** keep a professional relationship; be careful with dual relationships in small communities.", "**Ending well:** plan endings and onward referral; do not leave clients without a pathway.", "**Minors:** obtain guardian consent as your local law requires and the young person’s own assent; explain confidentiality in words they understand, including when you would have to share.", "**Language and interpreters:** use a trained interpreter where needed; avoid family members, especially for risk and safeguarding questions.", "**Emergency contact:** agree with the client when the emergency contact may be used, and record that agreement."], "ethics_referral_added": true, "client_handouts": [{"id": "h-connect", "title": "How thoughts, feelings and actions connect", "give_when": "Session 1 or 2, after mapping a recent example together.", "body": ["When something happens, our mind quickly gives it a meaning. That meaning is the thought, and it shapes how we feel, what our body does and what we do next.", "Two people can go through the same event and feel very differently, partly because they are thinking different things about it.", "These parts feed each other. A worried thought can tighten your chest; a tight chest can make the worry feel more true; avoiding the situation can keep the worry going.", "A small change in any one part can start to break the cycle. It might be a thought, something you do, or the way you breathe."], "diagram_id": "d-h-connect", "try_this": ["Think of one moment this week when your mood changed.", "Write down what happened, what went through your mind, how you felt, what your body did and what you did next.", "Then write what happened next: how it felt straight away, and what it led to later.", "Bring it to your next session so you can look at it together."], "notes_prompt": "My example this week", "form": [{"t": "line", "label": "What happened", "lines": 1}, {"t": "line", "label": "What went through my mind", "lines": 1}, {"t": "line", "label": "How I felt", "lines": 1}, {"t": "line", "label": "What my body did", "lines": 1}, {"t": "line", "label": "What I did", "lines": 1}, {"t": "pair", "fields": ["Straight away, it…", "Later, it led to…"]}]}, {"id": "h-thought", "title": "Catching and checking an upsetting thought", "give_when": "Once the client can notice thoughts, usually from session 3 onwards.", "body": ["Upsetting thoughts often feel like facts, especially when we are tired, low or anxious. Writing them down helps you step back and look at them.", "You are not trying to force a happy thought. You are looking for a fairer, more balanced view that fits all the facts.", "If your thoughts turn to harming yourself or not wanting to be alive, stop the exercise. If you feel you might act on these thoughts, call your local emergency number now. Otherwise, contact your counsellor or a crisis line as soon as you can."], "diagram_id": "", "try_this": ["**Situation:** where were you, what was happening?", "**Feeling:** name it and rate how strong it was, from 0 to 100.", "**Thought:** what went through your mind? Rate how much you believed it, 0 to 100.", "**What supports the thought?** Facts only.", "**What does not fit the thought?** Anything you might be missing.", "**A fairer view:** what would you say to a friend in the same situation?", "**Re-rate:** how strong is the feeling now, and how much do you believe the first thought?"], "notes_prompt": "My thought record", "questions": ["What do I know for certain, and what am I assuming?", "What supports this view, and what does not fit it?", "Is there another way to explain what happened?", "What would I say to someone I care about in the same situation?", "What is a fair, balanced way to describe it?", "What useful next step fits what matters to me?"], "form": [{"t": "table", "columns": ["Situation", "Feeling (0-100)", "Thought, and how much I believe it (0-100)"], "rows": 2}, {"t": "ticks", "label": "Thinking traps I noticed", "options": ["All-or-nothing", "Expecting the worst", "Mind-reading", "Jumping to conclusions", "Overgeneralising", "Only seeing the bad", "Ignoring the good", "“I feel it, so it must be true”", "Labelling myself", "Blaming myself", "“Should” rules"]}, {"t": "line", "label": "What supports the thought (facts only)", "lines": 2}, {"t": "line", "label": "What does not fit the thought", "lines": 2}, {"t": "line", "label": "A fairer view", "lines": 2}, {"t": "pair", "fields": ["Belief in the first thought now (0-100)", "Feeling now (0-100)"]}]}, {"id": "h-activity", "title": "Planning activities that lift your mood", "give_when": "When mood is low and the client has been withdrawing or doing less.", "body": ["When we feel low, we often wait to feel better before doing things. Usually it works the other way round: doing small things comes first, and mood follows.", "Two kinds of activity are especially useful: things you enjoy, and things that give you a sense of getting something done."], "diagram_id": "", "try_this": ["Choose one small, specific activity for each day. For example, “walk to the shop and back after breakfast”.", "Write down the day and time you will do it.", "Afterwards, rate how much you enjoyed it (0-10) and how much it felt like an achievement (0-10).", "Rate your mood once a day (0-10) and notice how it compares on days you did more and days you did less.", "If a step was too big, make the next one smaller. Smaller steps still count."], "notes_prompt": "My plan for this week"}, {"id": "h-breathing", "title": "Slow breathing to settle your body", "give_when": "To practise in session and at home; useful when anxiety shows up in the body. Not for use during exposure, where it can become a way of escaping the fear. Check first with clients who have asthma, a heart or lung condition, or another medical condition that affects breathing, or who are pregnant; agree any changes with their doctor.", "body": ["When we feel anxious, breathing often becomes fast and shallow, which can make us feel dizzy, shaky or tight in the chest. Slower, gentler breathing helps the body settle.", "Practise when you are calm first, so it is easier to use when you need it."], "diagram_id": "", "try_this": ["Sit comfortably and let your shoulders drop.", "Breathe in gently through your nose for a count of about four, letting your belly rise.", "Breathe out slowly for a count of about six.", "Keep the breaths small and smooth. They should not be big or deep.", "Carry on for two or three minutes. If you feel light-headed, make the breaths smaller."], "notes_prompt": "When I practised and what I noticed"}, {"id": "h-ladder", "title": "Facing fears step by step", "give_when": "When avoidance is keeping a fear going; build the ladder together in session first.", "body": ["Avoiding something we fear brings quick relief, but it also teaches us that the fear was right. So the fear grows.", "Facing it in small, planned steps lets you discover that you can cope, and the fear usually becomes smaller.", "Only work on situations that are actually safe. Plan every step with your counsellor.", "Your fear may rise at first. That is expected. It does not mean something is going wrong, and it usually settles with practice."], "diagram_id": "d-h-ladder", "try_this": ["With your counsellor, list situations from easiest to hardest and rate how frightening each one is, from 0 (not at all) to 100 (the most frightening you can imagine).", "Start with a step that feels hard but doable.", "Stay with it long enough to notice what really happens.", "With your counsellor, plan how to drop the little things you usually do to feel safe, so you can learn that you cope without them.", "Repeat the step until it feels easier, then move up one.", "Write down what you expected and what actually happened."], "notes_prompt": "My ladder and what I learned"}, {"id": "h-staying-well", "title": "Staying well after counselling", "give_when": "In the final sessions, while building the relapse-prevention plan together.", "body": ["Ups and downs are a normal part of life. A difficult week does not mean you are back at the start.", "Having a plan written down makes it easier to act early, before things build up."], "diagram_id": "", "try_this": ["**What I learned:** the main ideas that helped me.", "**What helped most:** the skills I want to keep using.", "**My early warning signs:** changes in sleep, mood, thoughts or habits that tell me to take care.", "**My action plan:** the first three things I will do if I notice them.", "**Who I can turn to:** people I trust, and when I will contact a professional again."], "notes_prompt": "My staying-well plan"}, {"id": "h-prediction", "title": "Testing a prediction", "give_when": "When a worry is a prediction that can be tested safely. Plan the experiment together in session first, including what the client will stop doing to feel safe.", "body": ["Worries often make predictions: “If I speak up, they’ll laugh.” Arguing with a prediction rarely changes it. Testing it often does.", "A small, safe experiment lets you find out what really happens. Whatever the result, you learn something useful."], "diagram_id": "", "try_this": ["With your counsellor, write the prediction and how strongly you believe it.", "Plan a small, safe experiment. Decide which of the little things you usually do to get through it you will drop this time.", "Do it, and notice what actually happens.", "Write what you learned and re-rate the prediction."], "notes_prompt": "Anything else I noticed", "form": [{"t": "line", "label": "My prediction", "lines": 1}, {"t": "line", "label": "How strongly I believe it (0 = not at all, 100 = completely)", "lines": 1}, {"t": "line", "label": "What else might happen", "lines": 1}, {"t": "line", "label": "My small, safe experiment", "lines": 1}, {"t": "line", "label": "The little extra things I usually do to get through it, which I will drop this time", "lines": 1}, {"t": "line", "label": "What actually happened", "lines": 2}, {"t": "line", "label": "What I learned", "lines": 2}, {"t": "line", "label": "How strongly I believe the prediction now (0-100)", "lines": 1}]}, {"id": "h-grounding", "title": "Grounding when you feel overwhelmed", "give_when": "For clients who feel overwhelmed, detached or caught in memories. Practise it together first and agree a cue to stop. During planned exposure, agree in advance whether and when it is used, as it can stop new learning.", "body": ["When feelings get very strong, or you feel far away or unreal, grounding helps you come back to the here and now.", "Practise when you feel calm, so it is easier to use when you need it. If it makes you feel worse, stop and try something else."], "diagram_id": "", "try_this": ["Press your feet into the floor and notice the chair holding you.", "Name 5 things you can see, 4 you can feel, 3 you can hear, 2 you can smell, and 1 kind thing about yourself or one thing you are looking forward to.", "Say where you are, today’s date and the month.", "Hold something safe with an interesting texture, or something cool.", "Breathe slowly and comfortably, if that helps."], "notes_prompt": "When I used it and what I noticed", "form": [{"t": "scale", "label": "How I felt before (0 = calm, 10 = overwhelmed)", "low": "calm", "high": "overwhelmed", "top": 10}, {"t": "scale", "label": "How I felt after", "low": "calm", "high": "overwhelmed", "top": 10}, {"t": "line", "label": "What helped most", "lines": 1}, {"t": "line", "label": "My cue to stop if it is making things worse", "lines": 1}]}, {"id": "h-practice-plan", "title": "My practice plan for this week", "give_when": "At the end of any session, to agree the between-session task in writing.", "body": ["Much of the change happens between sessions, in everyday life. A small, clear plan makes it more likely you will actually do it.", "If something gets in the way, write down what happened and bring it to your next session. It shows us what to change."], "diagram_id": "", "try_this": ["Write exactly what you will do, when and how often.", "Rate how manageable it feels; if it is below 7, make it smaller.", "Think ahead: what might get in the way, and what you could do then.", "Bring this sheet to your next session."], "notes_prompt": "Questions for my next session", "form": [{"t": "line", "label": "What I will do", "lines": 2}, {"t": "pair", "fields": ["When", "How often"]}, {"t": "scale", "label": "How manageable it feels", "low": "not manageable", "high": "very manageable", "top": 10}, {"t": "line", "label": "What might get in the way", "lines": 1}, {"t": "line", "label": "If that happens, I could…", "lines": 1}, {"t": "table", "columns": ["Day", "Did I do it?", "What I noticed"], "rows": 7, "first": ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]}]}, {"id": "h-new-belief", "title": "Building a new belief", "give_when": "Later in therapy only, after rapport and coping skills are established and an old core belief has been explored together. Pause if it increases distress.", "body": ["Old beliefs about ourselves, such as “I’m not good enough”, often formed long ago and can feel like facts. A new, more balanced belief needs evidence to grow.", "Small, everyday experiences count. Over weeks, they add up."], "diagram_id": "", "try_this": ["Write the new belief you want to build, in your own words.", "Each day, note one thing that fits it, however small.", "Once a week, rate how much you believe the old belief and the new one.", "Bring the log to your sessions."], "notes_prompt": "What I am noticing", "form": [{"t": "line", "label": "My old belief", "lines": 1}, {"t": "line", "label": "My new belief", "lines": 1}, {"t": "table", "columns": ["Date", "What happened", "What it might show"], "rows": 7}, {"t": "pair", "fields": ["Old belief now (0-100)", "New belief now (0-100)"]}]}, {"id": "h-safety-plan", "title": "My safety plan", "give_when": "Make it together in session with any client who has had thoughts of suicide or self-harm, and review it at every session. Write the plan in the client’s own words; agree steps to make their surroundings safer.", "body": ["This plan is for times when you feel unsafe or think about harming yourself. Keep it somewhere you can find it quickly, and share it with someone you trust if you can.", "Work through the steps in order until you feel safer. If you feel you might act on these thoughts, go straight to the crisis numbers or emergency services."], "diagram_id": "", "try_this": [], "notes_prompt": "Anything else that helps me stay safe", "form": [{"t": "line", "label": "1. My warning signs: thoughts, feelings or situations that tell me a crisis may be building", "lines": 2}, {"t": "line", "label": "2. Things I can do on my own to feel calmer or distract myself", "lines": 2}, {"t": "line", "label": "3. People and places that help me feel better or take my mind off things", "lines": 2}, {"t": "line", "label": "4. People I can ask for help, and their phone numbers", "lines": 2}, {"t": "line", "label": "5. Professionals I can contact (my counsellor, my doctor, out-of-hours services)", "lines": 2}, {"t": "line", "label": "6. Making my surroundings safer: what I will remove, lock away or ask someone to keep (for example medicines, sharp objects, ropes, weapons, pesticides)", "lines": 2}, {"t": "line", "label": "7. My reasons for living, and what matters most to me", "lines": 2}, {"t": "crisis"}]}, {"id": "h-remember", "title": "What I want to remember from today", "give_when": "Optional, at the end of a session: the client writes the key points in their own words.", "body": ["We tend to forget much of what we talk about in a session. Writing the key points in your own words helps them stay with you."], "diagram_id": "", "try_this": [], "notes_prompt": "Other notes", "form": [{"t": "line", "label": "The most important thing from today", "lines": 2}, {"t": "line", "label": "What ines": 2}, {"t": "line", "label": "Recent changes that raise or lower risk", "lines": 1}, {"t": "line", "label": "What keeps them safe, what matters to them, what helps them pause", "lines": 2}, {"t": "line", "label": "Who can support them, and are they available now", "lines": 1}, {"t": "subhead", "text": "Safety from other people"}, {"t": "ticks", "label": "Afraid of anyone, or someone hurting, threatening, controlling or exploiting them", "options": ["No", "Yes", "Unsure", "Declined"]}, {"t": "ticks", "label": "Children, dependent adults or others at home affected or at risk", "options": ["No", "Yes", "Unsure", "Not applicable", "Declined"]}, {"t": "guide", "text": "Refer to other people by their role (partner, parent, employer), not by name."}, {"t": "line", "label": "Client’s words and immediate safeguarding need", "lines": 2}, {"t": "subhead", "text": "Level of concern and action"}, {"t": "guide", "text": "Record your reasoning, not only a level. Risk levels cannot predict who will act on suicidal thoughts; they guide how quickly to respond."}, {"t": "ticks", "label": "Level of concern and urgency of response", "options": ["Routine", "Raised: review sooner", "High: act today", "Emergency: act now", "Unable to determine"]}, {"t": "guide", "text": "If you cannot determine the level, treat it as at least “High: act today” until it is clarified, and consult your supervisor today."}, {"t": "line", "label": "Reasoning, including risk factors and protective factors", "lines": 2}, {"t": "ticks", "label": "Done today", "options": ["Safety plan made or reviewed", "Means discussed and safer steps agreed", "Support person involved (with consent)", "Supervisor or senior clinician consulted", "Safeguarding lead consulted", "Crisis team or emergency services contacted", "Urgent medical assessment arranged"]}, {"t": "line", "label": "Who was contacted or told, when, and on what basis (or why no one was)", "lines": 2}, {"t": "crisis"}, {"t": "pair", "fields": ["Local service or on-call contact", "Next safety check (date)"]}, {"t": "ticks", "label": "Client given these crisis contacts", "options": ["Yes", "No"]}]}, {"heading": "Five-part map", "items": [{"t": "guide", "text": "Build it with the client from one specific, recent example. It is a working idea to check together, not a verdict."}, {"t": "diagram", "diagram_id": "d-five-part"}, {"t": "line", "label": "Situation: what was happening", "lines": 1}, {"t": "line", "label": "Thoughts and images", "lines": 1}, {"t": "line", "label": "Emotions, and how strong (0-100)", "lines": 1}, {"t": "line", "label": "Physical reactions: sensations and urges", "lines": 1}, {"t": "line", "label": "Behaviour: what they did, avoided, or sought reassurance about", "lines": 1}, {"t": "pair", "fields": ["Short-term effect", "Longer-term effect"]}, {"t": "ticks", "label": "Client agrees this is a fair map", "options": ["Yes", "Partly", "No"]}, {"t": "line", "label": "What the client would change in it", "lines": 1}]}, {"heading": "Problem list and goals", "items": [{"t": "table", "columns": ["Priority", "Problem in the client’s words", "Goal: what will be different", "How we will notice progress"], "rows": 3, "first": ["1", "2", "3"]}, {"t": "scale", "label": "Client’s confidence in working towards these goals", "low": "not at all", "high": "completely", "top": 10}, {"t": "line", "label": "What could make progress difficult", "lines": 1}]}, {"heading": "Treatment plan", "items": [{"t": "ticks", "label": "Planned methods", "options": ["Psychoeducation", "Thought records", "Behavioural activation", "Graded tasks", "Behavioural experiments", "Exposure (if suitable)", "Problem-solving", "Sleep and routine", "Grounding", "Belief work (later phase)", "Referral or shared care"]}, {"t": "pair", "fields": ["Planned number or range of sessions", "Review after session"]}, {"t": "line", "label": "Information and handouts given", "lines": 1}, {"t": "ticks", "label": "Plan agreed with the client", "options": ["Yes", "Partly", "No"]}, {"t": "line", "label": "Changes the client asked for", "lines": 1}, {"t": "ticks", "label": "To take to supervision", "options": ["No", "Yes"]}]}, {"heading": "Sign-off", "items": [{"t": "pair", "fields": ["Counsellor name", "Signature", "Date and time completed"]}]}]}, {"id": "s-tracking", "title": "CBT case tracking sheet", "use_when": "Every follow-up session, with the progress page kept at the front of the case file. Use the assessment sheet’s full safety check whenever any risk answer is “Yes” or “Declined”.", "sections": [{"heading": "Case progress over sessions", "page_after": true, "items": [{"t": "guide", "text": "One row per session. Mood: 0 = very low, 10 = very good. Distress: 0 = none, 10 = extreme. Goal ratings: 0 = not at all, 10 = fully reached."}, {"t": "pair", "fields": ["Client ID", "Counsellor"]}, {"t": "table", "columns": ["No.", "Date", "PHQ-9", "GAD-7", "Mood start / end", "Distress start / end", "Goal 1 / 2 / 3", "Level of concern"], "rows": 14}, {"t": "ticks", "label": "Review point reached (around every four sessions)", "options": ["Progress on track", "Little or no change: formulation reviewed and taken to supervision", "Getting worse: risk rechecked today, formulation reviewed, taken to supervision"]}]}, {"heading": "Session details", "items": [{"t": "diagram", "diagram_id": "d-session"}, {"t": "pair", "fields": ["Client ID", "Session number", "Date"]}, {"t": "ticks", "label": "Mode", "options": ["In person", "Online", "Phone"]}, {"t": "pair", "fields": ["Start time", "End time", "Counsellor"]}, {"t": "ticks", "label": "Online: location confirmed, private, call-back number confirmed", "options": ["Yes", "Partly", "Not applicable"]}]}, {"heading": "Check-in", "items": [{"t": "scale", "label": "Mood at start", "low": "very low", "high": "very good", "top": 10}, {"t": "scale", "label": "Distress at start", "low": "none", "high": "extreme", "top": 10}, {"t": "pair", "fields": ["Short measure this session (name and score)", "Change since last time"]}, {"t": "line", "label": "What has happened since last session", "lines": 2}]}, {"heading": "Safety check", "danger": true, "items": [{"t": "guide", "text": "Ask every session. If any answer is “Yes” or “Declined”, complete the full safety check on the assessment sheet today."}, {"t": "ticks", "label": "Not wanting to be alive or thoughts of ending life", "options": ["No", "Yes", "Declined"]}, {"t": "ticks", "label": "Hurting themselves", "options": ["No", "Yes", "Declined"]}, {"t": "ticks", "label": "Hurting another person", "options": ["No", "Yes", "Declined"]}, {"t": "ticks", "label": "Afraid of anyone, or anyone at home at risk", "options": ["No", "Yes", "Unsure", "Declined"]}, {"t": "ticks", "label": "Level of concern", "options": ["Routine", "Raised: review sooner", "High: act today", "Emergency: act now", "Unable to determine: treat as high"]}, {"t": "line", "label": "What was done and who was told", "lines": 1}, {"t": "crisis"}]}, {"heading": "Action plan review and agenda", "items": [{"t": "line", "label": "Last action plan: what was tried, what happened, what was learned", "lines": 2}, {"t": "line", "label": "What got in the way, and the adjustment agreed", "lines": 1}, {"t": "line", "label": "Agreed agenda (one or two topics)", "lines": 2}]}, {"heading": "Work done", "items": [{"t": "ticks", "label": "Methods used", "options": ["Thought record", "Socratic questioning", "Behavioural activation", "Graded task", "Behavioural experiment", "Exposure", "Problem-solving", "Grounding", "Rules and coping strategies", "Core belief work", "Relapse prevention"]}, {"t": "table", "columns": ["Thought or belief worked on", "Belief before (0-100)", "Belief after (0-100)", "Emotion before → after (0-100)"], "rows": 2}, {"t": "ticks", "label": "Thinking traps noticed", "options": ["All-or-nothing", "Expecting the worst", "Mind-reading", "Jumping to conclusions", "Overgeneralising", "Mental filter", "Discounting positives", "Emotional reasoning", "Labelling", "Personalising", "“Should” rules"]}, {"t": "line", "label": "Behavioural experiment: prediction (and how strongly believed), safety behaviours dropped, result, belief now", "lines": 2}, {"t": "line", "label": "Client response: what shifted, what did not help", "lines": 1}, {"t": "line", "label": "Formulation update: anything new about what keeps the problem going", "lines": 1}]}, {"heading": "New action plan", "items": [{"t": "line", "label": "What, when and how often", "lines": 2}, {"t": "scale", "label": "How manageable it feels", "low": "not manageable", "high": "very manageable", "top": 10}, {"t": "line", "label": "What might get in the way, and “if that happens, I could…”", "lines": 1}, {"t": "line", "label": "Handout given", "lines": 1}]}, {"heading": "Close of session", "items": [{"t": "scale", "label": "Mood at end", "low": "very low", "high": "very good", "top": 10}, {"t": "scale", "label": "Distress at end", "low": "none", "high": "extreme", "top": 10}, {"t": "line", "label": "Key points the client wants to remember", "lines": 1}, {"t": "line", "label": "Client feedback on the session", "lines": 1}, {"t": "ticks", "label": "Follow-up", "options": ["Repeat measures", "Continue assessment", "Contact provider (with consent)", "Safeguarding follow-up", "Referral", "Take to supervision"]}, {"t": "ticks", "label": "Ending phase", "options": ["Not yet", "Ending discussed", "Sessions spaced out", "Staying-well plan done and handout given"]}, {"t": "line", "label": "Plan for next session", "lines": 1}, {"t": "pair", "fields": ["Next appointment", "Counsellor signature", "Date and time completed"]}]}], "cover": {"title": "CBT case tracking", "note": "Record the minimum necessary information. Store completed sheets securely and follow local law and service policy.", "items": [{"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}]}}], "counsellor_sheets_added": true, "session_note_template": {"fields": [{"label": "Session details", "guidance": "Client identifier (not full name), date, start time and duration, session number, in person or online, who attended, and the counsellor’s name. For online sessions: the client’s location, that they were private, and a contact number confirmed."}, {"label": "Measures and mood", "guidance": "Scores on the measures used this session and the client’s mood rating; note any change from last time."}, {"label": "Risk check", "guidance": "Whether risk was asked about, what the client said, and any action taken (safety plan reviewed, contacts given, referral made). Never leave this blank."}, {"label": "Action plan review", "guidance": "What the client did between sessions, what they learned, what got in the way."}, {"label": "Agenda", "guidance": "The one or two topics agreed for this session."}, {"label": "Work done", "guidance": "Techniques used, key thoughts or beliefs worked on, with belief and emotion ratings before and after."}, {"label": "Client response", "guidance": "How the client engaged, what shifted, anything they found unhelpful."}, {"label": "Formulation update", "guidance": "Anything new that changes your understanding of the problem."}, {"label": "New action plan", "guidance": "The specific between-session task agreed, and any handout given."}, {"label": "Plan for next session", "guidance": "What to follow up, and anything to take to supervision."}, {"label": "Sign-off", "guidance": "Counsellor’s name, signature or electronic sign-off, and the date and time the note was completed."}], "example": "Client A-102 · 14 Mar · 17:00 · 50 min · session 6 of 16 · online. Online checks: client at home, alone in a private room, phone number confirmed. PHQ-9 14 (session 1: 19); mood 5/10 (last week 4/10). Risk: asked about self-harm thoughts; none this week; safety plan still in place. Action plan: did 4 of 5 planned activities; enjoyed football with friends more than predicted. Agenda: the thought “I’m a failure” after a critical email. Work done: thought record and Socratic questioning; belief in “I’m a failure” 85 → 50 (0-100); low mood 70 → 40. Client response: engaged; said the evidence list surprised him. Formulation: rule “If I don’t excel, I’m worthless” is active at work. New action plan: two thought records; handout “Catching and checking an upsetting thought” given. Next session: review thought records; begin looking at the rule. Supervision: none needed this week. Signed: Maya (name changed), counsellor, 14 Mar, 18:10.", "note": "Keep notes factual, brief and stored securely, in line with your local record-keeping rules. Write as if the client may one day read them."}, "session_note_template_added": true, "online_adaptations": ["**Get informed consent for online work:** explain how sessions will run, the limits of privacy online, how records are kept, and what you will do in an emergency. Use a secure, encrypted platform, not an ordinary social messaging app.", "**Check that online work suits this client:** it may not be right for clients at high or rising risk, with severe symptoms, without a private space, or who struggle with the technology. Offer in-person sessions or a referral when it does not.", "**Check the set-up at the start of every session:** where the client is, whether they are alone and can talk privately, and a phone number to reach them if the call drops.", "**Confirm their location, an emergency contact and the local emergency number at every session:** clients move around, so you need to know where they are now to act if risk rises.", "**Agree a back-up plan:** if video fails, switch to a phone call at the same time.", "**Use screen-sharing for worksheets:** fill in the thought record or five-part map together on screen, then send the handout afterwards.", "**Adapt behavioural experiments:** clients can try some experiments at home during the session (for example, a short phone call they have been avoiding) and report back straight away.", "**Exposure online:** build the fear ladder together; some steps can be done with the counsellor present on video, others are set as between-session tasks.", "**Watch for privacy at home:** family members nearby may stop a client speaking freely; offer headphones or a chat box, and agree a code word in advance that means “I can’t talk freely now” or “I am not safe”.", "**Slow down:** check understanding more often, because subtle reactions are harder to see on screen.", "**End with a grounding moment:** leave a few minutes so the client is settled before they go straight back into home life.", "**Follow local rules:** consent, record-keeping and cross-border rules for online counselling vary by country. Check that you are allowed to practise where the client is located, not only where you are."], "online_adaptations_added": true, "tips": ["**Socialise to the model early:** use the client’s own example to show how thought, feeling and action connect.", "**Formulate before you intervene:** a shared map keeps techniques purposeful.", "**Work with recent, specific moments:** “last Tuesday at the bus stop” beats “I’m always anxious”.", "**Rate everything:** belief and emotion ratings make change visible.", "**Write it down:** summaries and coping cards help between sessions.", "**Tailor homework:** small, specific, agreed together and always reviewed next session.", "**Behaviour first in severe low mood:** activity before analysis.", "**Start with automatic thoughts:** move to deeper beliefs once skills are in place.", "**Ask for feedback every session:** it strengthens the alliance and catches ruptures early.", "**Practise on yourself:** completing your own thought records builds understanding and empathy."], "pitfalls": ["**Debating instead of discovering:** arguing with the client’s thoughts breeds resistance.", "**Jumping to technique:** intervening before rapport and formulation are in place.", "**Forcing positive thinking:** balanced and believable matters more than cheerful.", "**Skipping homework review:** unreviewed homework stops being done.", "**Overloading the session:** too many agenda items leaves nothing finished.", "**Using distraction as a long-term fix:** it becomes avoidance.", "**Ignoring safety behaviours:** they quietly undo behavioural experiments and exposure.", "**Aversive or suppression techniques:** snapping a band on the wrist or “thought stopping” adds self-punishment and suppression, which tends to increase unwanted thoughts. Use distraction, counting thoughts and mindfulness instead.", "**Giving reassurance:** especially in OCD and health anxiety, it feeds the problem.", "**Working beyond competence:** trauma memory work or severe presentations without training.", "**Missing risk:** structured work must pause if safety concerns emerge."], "competency_checklist": ["Sets a collaborative agenda and keeps to it flexibly.", "Checks mood or measures and reviews the previous action plan every session.", "Builds and shares a formulation that the client recognises as theirs.", "Uses guided discovery more than telling.", "Elicits specific automatic thoughts with ratings.", "Chooses techniques that fit the formulation, not habit.", "Uses behavioural methods (activation, experiments, exposure) as well as talk.", "Agrees specific, realistic between-session tasks with a clear rationale.", "Summarises regularly and asks for feedback.", "Shows warmth, empathy and genuineness while staying structured.", "Assesses and responds to risk appropriately.", "Plans endings and relapse prevention from early on."], "competency_checklist_added": true, "supervision_prompts": ["Does my formulation still explain what keeps this client’s problem going? What does not fit?", "Am I choosing techniques from the formulation, or from habit?", "Where am I doing more talking or persuading than guiding the client to discover things?", "Is the client completing action plans? If not, what might be getting in the way for them, or in how I set them?", "What safety behaviours or avoidance might I be missing?", "How is our working relationship? Have there been any strains I have not named?", "What feelings does this client bring up in me, and how might they be affecting my work?", "Are we making measurable progress? If not, what should change: the plan, the approach, or a referral?", "Is anything outside my competence or training here?", "Have I assessed risk well enough, and is the safety plan up to date?", "How am I taking the client’s culture, family and context into account?", "What will I do differently in the next session?"], "supervision_prompts_added": true, "quiz": [{"question": "Maya (name changed) says, “I felt stupid when my boss frowned.” What is the best next step to identify the automatic thought?", "options": ["Tell her that feeling stupid is a cognitive distortion", "Teach her slow breathing", "Ask what went through her mind when she saw the frown", "Ask about her childhood relationship with authority"], "answer": 2, "rationale": "“Felt stupid” mixes a self-judgement with an unnamed emotion (embarrassment or shame). Asking what went through her mind separates the thought (e.g. “He thinks my work is rubbish”) from the feeling. Labelling it a distortion is premature, breathing doesn’t target the thought, and childhood history comes later in formulation."}, {"question": "A client believes 90%, “If I don’t check the door ten times, we’ll be burgled.” Which technique most directly tests this?", "options": ["Behavioural experiment / exposure with response prevention", "Distraction", "Activity scheduling", "Cognitive rehearsal"], "answer": 0, "rationale": "This is a testable prediction maintained by checking; reducing the checking and observing the outcome directly tests it. Distraction acts as avoidance, activity scheduling targets low mood, and rehearsal doesn’t produce real-world evidence."}, {"question": "In the cognitive model of panic (Clark), what turns ordinary anxiety sensations into a panic attack?", "options": ["Low blood sugar", "Lack of willpower", "Early childhood trauma", "Catastrophic misinterpretation of body sensations"], "answer": 3, "rationale": "The model centres on misreading sensations as signs of immediate disaster, which raises the threat further. The other options are not part of the model."}, {"question": "Which is an intermediate belief rather than an automatic thought or a core belief?", "options": ["“I’m unlovable.”", "“She’s ignoring me.”", "“If I ask for help, people will think I’m weak.”", "“My hands are shaking.”"], "answer": 2, "rationale": "Conditional “if… then…” rules are intermediate beliefs. “I’m unlovable” is a core belief, “She’s ignoring me” is an automatic thought, and “My hands are shaking” is a physical observation."}, {"question": "Sam (name changed) hasn’t done his thought record for two weeks. What is the most helpful response?", "options": ["Drop homework, as it obviously doesn’t suit him", "Explore what got in the way and complete one together in session", "Remind him firmly that CBT only works with homework", "Move straight to the next technique"], "answer": 1, "rationale": "Exploring barriers without blame and starting the task in session builds skill and shows the work matters. Dropping it loses a key ingredient, a firm lecture risks shame and disengagement, and moving on ignores the problem."}, {"question": "A client with severe depression has thoughts of ending her life and has started giving away possessions. What comes first?", "options": ["A thought record on “I’m a burden”", "Activity scheduling", "Cost-benefit analysis of her beliefs", "Risk assessment and following your risk protocol"], "answer": 3, "rationale": "Giving away possessions alongside suicidal thoughts is a warning sign; safety comes before any structured technique. The other techniques can follow once risk is managed."}, {"question": "A client says, “I feel like a failure, so I must be one.” Which distortion is this?", "options": ["Emotional reasoning", "Personalisation", "Mental filter", "Should statement"], "answer": 0, "rationale": "Treating a feeling as proof of reality is emotional reasoning. Personalisation is taking blame for outside events, mental filter is dwelling on one negative detail, and should statements are rigid demands."}, {"question": "Why is reassurance from the counsellor unhelpful for a client with OCD?", "options": ["It is rude", "It works like a compulsion: brief relief that prevents the belief being tested", "It makes the session too short", "Clients with OCD never believe reassurance"], "answer": 1, "rationale": "Reassurance neutralises anxiety in the short term, just like checking, so the client never learns the feared outcome wouldn’t happen. The other options miss the maintaining mechanism."}, {"question": "During a behavioural experiment on speaking up in a meeting, Nina (name changed) rehearses every sentence in her head and avoids eye contact. What is the main risk?", "options": ["None, as anything that helps her get through is fine", "She will become too relaxed", "These are safety behaviours, so she may credit them for the good outcome and keep her belief", "The experiment will take too long"], "answer": 2, "rationale": "Safety behaviours let the client explain away a good outcome (“It only went well because I rehearsed”), so the feared belief survives. Getting through isn’t the aim. New learning is, and the other options don’t address that mechanism."}, {"question": "In the longitudinal formulation, what is the role of a critical incident?", "options": ["It activates existing beliefs and rules that were dormant", "It creates the core belief for the first time", "It is the same as an automatic thought", "It is only relevant in trauma"], "answer": 0, "rationale": "Early experiences lay down beliefs and rules; a later critical incident that matches them switches them on, triggering automatic thoughts. It does not create the belief, it is an event rather than a thought, and it applies across problems, not just trauma."}], "quick_reference": ["**Situation → thought → feeling, body, behaviour:** find the thought first.", "**Ask:** “What was going through your mind just then?”", "**Rate it:** belief in the thought and intensity of the emotion, 0-100%.", "**Test it:** evidence for, evidence against, alternative view, or a behavioural experiment.", "**Spot the distortion:** all-or-nothing, mind reading, catastrophising, shoulds, labelling.", "**Go deeper:** “If that were true, what would it mean about you?”", "**Session flow:** mood → bridge → homework → agenda → work → summary → new plan → feedback.", "**Risk first:** pause the technique if safety concerns arise."], "glossary": [{"term": "Automatic thought", "definition": "A quick, situation-specific thought or image that pops up without deliberate effort."}, {"term": "Behavioural activation", "definition": "Planned increase in rewarding and meaningful activity to lift mood."}, {"term": "Behavioural experiment", "definition": "A planned real-world test of a specific belief or prediction."}, {"term": "Cognitive distortion", "definition": "A systematic error in thinking that biases how events are interpreted."}, {"term": "Cognitive restructuring", "definition": "Identifying, examining and revising unhelpful thoughts."}, {"term": "Core belief", "definition": "A deep, global, stable belief about the self, others or the world."}, {"term": "Exposure", "definition": "Approaching feared situations, sensations or memories to allow new learning."}, {"term": "Formulation", "definition": "A shared explanation of how a problem developed and what keeps it going."}, {"term": "Guided discovery", "definition": "Helping the client reach their own conclusions through questions and reflection."}, {"term": "Intermediate belief", "definition": "A rule, attitude or assumption, often in “if… then…” form."}, {"term": "Maintaining cycle", "definition": "A loop of thoughts, feelings and behaviours that keeps a problem going."}, {"term": "Negative automatic thought (NAT)", "definition": "An automatic thought with a negative, distressing content."}, {"term": "Neutralising", "definition": "Any action taken to cancel out or reduce the distress of an intrusive thought."}, {"term": "Relapse prevention", "definition": "Planning to spot and manage early signs of difficulty after therapy."}, {"term": "Response prevention", "definition": "Deliberately not carrying out a compulsion or safety behaviour."}, {"term": "Rumination", "definition": "Repetitive, passive dwelling on problems, causes and consequences."}, {"term": "Safety behaviour", "definition": "An action taken to prevent a feared outcome, which stops the fear being disconfirmed."}, {"term": "Schema", "definition": "An organised mental framework; in CBT, often used interchangeably with core belief."}, {"term": "Socratic questioning", "definition": "A style of questioning that helps the client examine their own thinking."}, {"term": "SUDS / distress rating", "definition": "A 0-100 self-rating of in-the-moment distress."}], "related_modules": ["rebt", "behavioural-activation", "mbct", "acceptance-commitment-therapy", "dbt", "motivational-interviewing"], "safety_note": "If risk to life or safety emerges at any point, pause the technique and follow your risk protocol."}};
