<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourCounselor | Cognitive Behavioural Therapy (CBT)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* YourCounselor — module reader styles
 * Follows the YourCounselor Brand & Document System v1.1 (locked) and the
 * approved sample work-up. Colours, fonts and components below are the only
 * ones allowed. Light theme only: the brand system defines no dark palette.
 */
:root {
  --plum: #3D0A6B;        /* headings, body text */
  --muted: #6E587E;       /* secondary text */
  --purple: #6A1BB5;      /* primary accent, links, numbers, buttons */
  --pink: #E8336D;        /* brand accent: accent bar only */
  --pink-text: #C2185B;   /* pink for small text */
  --ink: #260644;         /* dark bands */
  --on-ink: #FAF7FD;
  --on-ink-muted: #CDBEDF;
  --paper: #FFFFFF;
  --lilac: #F7F3FB;       /* page tint */
  --soft: #FAF7FC;        /* table header, quiet boxes */
  --tint: #F0E8F9;        /* chips, note boxes */
  --line: #E7DFEF;
  --line-strong: #D1C0DF;
  --ok: #1E7E34;     --ok-bg: #EAF7EC;     --ok-border: #BFE3C6;
  --warn: #9A5B00;   --warn-bg: #FFF4E0;   --warn-border: #F2D9A8;
  --danger: #B4233F; --danger-bg: #FDECEF; --danger-border: #F4C2CC;
  --head: 'Nunito', 'Inter', sans-serif;
  --body: 'Nunito Sans', 'Inter', sans-serif;
  --sidebar: 264px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--lilac); color: var(--plum); font: 400 16px/1.6 var(--body); }
h1, h2, h3, h4 { font-family: var(--head); color: var(--plum); line-height: 1.2; margin: 0; }
p { margin: 0 0 10px; }
strong { font-weight: 700; }
a { color: var(--purple); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { margin: 4px 0 12px; padding-left: 22px; }
li { margin-bottom: 5px; }
.muted { color: var(--muted); }

/* ---------- content protection ---------- */
.yc-protected, .yc-protected * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.yc-protected input, .yc-protected textarea { -webkit-user-select: text; user-select: text; }
@media print {
  body * { display: none !important; }
  body::after { content: "Printing is disabled for YourCounselor modules."; display: block !important; padding: 40px; font: 18px var(--body); color: var(--plum); }
}

/* ---------- watermark (viewer name + email) ---------- */
.yc-watermark { position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .08; background-repeat: repeat; }

/* ---------- logo lockup (logo + wordmark, gap = 1/4 logo height) ---------- */
.yc-lockup { display: flex; align-items: center; gap: 8px; /* gap = 1/4 logo height */ font: 800 19px var(--head); color: var(--plum); text-decoration: none; padding: 16px 0; }
.yc-lockup img { width: 32px; height: 32px; display: block; }
.yc-lockup.cover { padding: 0 0 22px; }
.yc-skip { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--purple); color: #FFFFFF; padding: 8px 14px; border-radius: 8px; font: 700 14px var(--head); }
.yc-skip:focus { left: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- layout ---------- */
.yc-app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.yc-sidebar { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--paper); border-right: 1px solid var(--line); padding: 4px 18px 24px; display: flex; flex-direction: column; }
.yc-sidebar .eyebrow-label { font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .06em; color: var(--purple); margin: 18px 0 6px; }
.yc-modlist a, .yc-toc a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--plum); font-size: 14px; }
.yc-modlist a.active { background: var(--tint); color: var(--purple); font-weight: 700; }
.yc-toc a { color: var(--muted); font-size: 13.5px; }
.yc-toc a .n { color: var(--purple); font-weight: 700; margin-right: 6px; font-family: var(--head); }
.yc-toc a:hover { background: var(--soft); color: var(--plum); text-decoration: none; }
.yc-toc a.is-hidden, .yc-mobile-toc a.is-hidden { opacity: .45; }
.yc-toc a.active { background: var(--tint); color: var(--purple); font-weight: 700; box-shadow: inset 3px 0 0 var(--purple); }
.yc-owner { margin-top: auto; padding-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.yc-owner strong { color: var(--plum); }

.yc-main { min-width: 0; }
.yc-topbar { display: none; }
.yc-sticky { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.yc-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 28px; background: var(--paper); }
.yc-toolbar input[type=search] { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px var(--body); }
.yc-toolbar input[type=search]::placeholder { color: var(--muted); }
.yc-toolbar input[type=search]:focus { outline: 2px solid var(--purple); outline-offset: 0; border-color: var(--purple); }
.yc-seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--paper); }
.yc-seg button { border: 0; background: none; color: var(--muted); padding: 8px 14px; font: 700 13px var(--head); cursor: pointer; }
.yc-seg button + button { border-left: 1px solid var(--line); }
.yc-seg button[aria-pressed=true] { background: var(--purple); color: #FFFFFF; }
.yc-filter-status { padding: 8px 28px; font-size: 14px; background: var(--tint); color: var(--plum); border-top: 1px solid var(--line); }
.yc-filter-status .yc-jump { border: 0; background: none; padding: 4px 2px; font: inherit; color: var(--purple); text-decoration: underline; cursor: pointer; }
.yc-btn { border: 1px solid var(--purple); background: var(--paper); color: var(--purple); border-radius: 999px; padding: 4px 13px; font: 700 13px var(--head); cursor: pointer; }
.yc-btn:hover { background: var(--tint); }
.yc-filter-status .yc-clear { margin-left: 6px; }
.yc-content { max-width: 900px; margin: 0 auto; padding: 24px 28px 80px; }
.yc-mobile-toc { display: none; }

@media (max-width: 900px) {
  .yc-app { grid-template-columns: 1fr; }
  .yc-sidebar { display: none; }
  .yc-topbar { display: flex; align-items: center; padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .yc-topbar .yc-lockup { padding: 10px 0; font-size: 17px; gap: 7px; }
  .yc-topbar .yc-lockup img { width: 28px; height: 28px; }
  .yc-toolbar { padding: 8px 16px; }
  .yc-filter-status { padding: 6px 16px; font-size: 13.5px; }
  .yc-content { padding: 16px 16px 64px; }
  .yc-mobile-toc { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 8px; border-top: 1px solid var(--line); scrollbar-width: none; }
  .yc-mobile-toc a { flex: none; display: inline-flex; align-items: center; min-height: 36px; font: 700 12.5px var(--head); padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--tint); color: var(--purple); text-decoration: none; }
  .yc-mobile-toc a.active { background: var(--purple); border-color: var(--purple); color: #FFFFFF; }
  .yc-seg button { min-height: 40px; }
  .yc-btn { min-height: 36px; }
  .check { min-height: 44px; }
}

/* ---------- module cover (header) ---------- */
.yc-cover { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
.yc-cover-body { padding: 28px 28px 20px; }
.eyebrow { display: inline-block; font: 700 11px var(--head); letter-spacing: .06em; text-transform: uppercase; color: var(--purple); background: var(--tint); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; }
.yc-cover h1 { font-weight: 800; font-size: 36px; letter-spacing: -0.02em; margin: 14px 0 8px; max-width: 640px; }
.yc-cover .sub { font-size: 17px; color: var(--muted); max-width: 600px; margin: 0; }
.yc-cover-meta { display: grid; grid-template-columns: 140px 1fr; row-gap: 6px; margin: 20px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14.5px; }
.yc-cover-meta dt { color: var(--muted); }
.yc-cover-meta dd { margin: 0; color: var(--plum); }
.yc-cover-band { position: relative; background: var(--ink); color: var(--on-ink-muted); padding: 18px 28px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; align-items: flex-end; }
.yc-cover-band::before { content: ''; position: absolute; left: 0; top: 0; height: 5px; width: 100%; background: linear-gradient(90deg, var(--purple) 0 80%, var(--pink) 80% 100%); }
.yc-cover-band strong { color: var(--on-ink); }
@media (max-width: 520px) { .yc-cover h1 { font-size: 28px; } .yc-cover-body { padding: 22px 18px 16px; } .yc-cover-band { padding: 16px 18px 12px; } .yc-cover-meta { grid-template-columns: 110px 1fr; } }

/* ---------- quick reference (pinned) ---------- */
.yc-quickref { margin: 0 0 18px; }

/* ---------- sections ---------- */
details.section { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px; scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
details.section > summary { list-style: none; cursor: pointer; padding: 18px 22px; display: flex; align-items: center; gap: 10px; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary h2 { font-size: 22px; font-weight: 700; flex: 1; }
details.section > summary::after { content: "▾" / ""; color: var(--muted); transition: transform .2s; }
details.section:not([open]) > summary::after { transform: rotate(-90deg); }
details.section[data-always-open] > summary { cursor: default; }
details.section[data-always-open] > summary::after { content: none; }
h2 .num { color: var(--purple); margin-right: 6px; }
.section-body { padding: 0 22px 20px; }
h3 { font-size: 17px; font-weight: 700; margin: 18px 0 6px; }
h4 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; }
.item { border-top: 1px solid var(--line); padding: 18px 0; }
.item:first-child { border-top: 0; padding-top: 4px; }
.item { scroll-margin-top: calc(var(--sticky-h, 64px) + 12px); }
.item > h3 { margin-top: 0; }
.label-line { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin: 12px 0 4px; display: block; }
.not-covered { color: var(--muted); }

/* ---------- chips (status pills) ---------- */
.chip { display: inline-block; font: 700 11px var(--head); padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--tint); color: var(--purple); white-space: nowrap; vertical-align: 2px; margin-left: 4px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.chip.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.chip.plain { background: var(--paper); color: var(--muted); }

/* ---------- callouts: Why this matters · Note · Caution · Risk ---------- */
.box { border-left: 4px solid var(--purple); background: var(--soft); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0; }
.box .label { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 3px; color: var(--purple); }
.box > :last-child { margin-bottom: 0; }
.box.why { background: var(--tint); }
.box.warn { border-color: var(--warn); background: var(--warn-bg); } .box.warn .label { color: var(--warn); }
.box.danger { border-color: var(--danger); background: var(--danger-bg); } .box.danger .label { color: var(--danger); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 6px 0 12px; }
table.yc { width: 100%; border-collapse: collapse; font-size: 15px; border-color: var(--line); }
table.yc thead, table.yc tbody, table.yc tr { border-color: var(--line); }
table.yc th { background: var(--soft); font: 700 14px var(--head); text-align: left; color: var(--plum); }
table.yc th, table.yc td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
table.yc td { color: var(--muted); }
table.yc td:first-child { color: var(--plum); font-weight: 700; }
table.yc td strong { color: var(--plum); }
table.yc.dialogue td:first-child { width: 96px; font-family: var(--head); }
table.yc.dialogue .note { display: block; font-size: 13.5px; color: var(--purple); margin-top: 3px; }
@media (max-width: 520px) {
  table.yc, table.yc tbody, table.yc tr, table.yc td { display: block; width: 100%; }
  table.yc thead { display: none; }
  table.yc tr { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; padding: 6px 10px; background: var(--paper); }
  table.yc td { border: 0; padding: 4px 0; }
  table.yc td::before { content: attr(data-label); display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); }
  table.yc.dialogue td:first-child { width: auto; }
}

/* ---------- diagrams ---------- */
figure.dg { margin: 12px 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
figure.dg figcaption { font-size: 13.5px; color: var(--muted); margin-top: 8px; text-align: center; }
figure.dg .dg-title { font: 700 14px var(--head); color: var(--plum); margin: 0 0 8px; text-align: center; }
.dg-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.dg-svg { width: 100%; height: auto; display: block; max-width: 680px; margin: 0 auto; }
.dg-hint { display: none; font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 4px; }
@media (max-width: 600px) { .dg-svg { min-width: 560px; } .dg-hint { display: block; } figure.dg { padding: 10px; } }
.dg-box { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1.4; }
.dg-context .dg-box, .dg-question .dg-box { fill: var(--tint); stroke: var(--line-strong); }
.dg-level-0 .dg-box { fill: var(--paper); } .dg-level-1 .dg-box { fill: var(--soft); }
.dg-level-2 .dg-box { fill: var(--tint); } .dg-level-3 .dg-box { fill: var(--line); }
.dg-text { fill: var(--plum); font-family: var(--body); }
.dg-edge { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.dg-edge-back { stroke-dasharray: 5 4; }
.dg-arrowhead { fill: var(--muted); }
.dg-label-bg { fill: var(--paper); stroke: var(--line); }
.dg-label-text, .dg-axis { fill: var(--muted); font-family: var(--body); }
.dg-branch { fill: var(--purple); font-weight: 700; font-family: var(--head); }
.dg-frame { fill: none; stroke: var(--line-strong); stroke-dasharray: 6 5; }

/* ---------- quiz & checklist (quiz uses neutral brand colours, never status colours) ---------- */
.quiz-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.quiz-head .quiz-score { margin: 0; }
.quiz-q { border-top: 1px solid var(--line); padding: 16px 0; }
.quiz-q > p { font-weight: 600; margin: 0 0 8px; }
.quiz-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--plum); font: 400 15px/1.5 var(--body); cursor: pointer; }
.quiz-opt:hover:not([aria-disabled]) { border-color: var(--purple); }
.quiz-opt[aria-disabled] { cursor: default; }
.quiz-opt.correct { background: var(--tint); border: 2px solid var(--purple); }
.quiz-opt.picked { background: var(--soft); color: var(--muted); border-style: dashed; }
.quiz-tag:empty { display: none; }
.quiz-tag { display: block; font: 700 11.5px var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--purple); margin-bottom: 2px; }
.quiz-opt.picked .quiz-tag { color: var(--muted); }
.quiz-why { display: none; outline: none; }
.quiz-q.answered .quiz-why { display: block; }
.quiz-score { font: 700 15px var(--head); color: var(--purple); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { color: var(--plum); margin-top: 5px; accent-color: var(--purple); width: 18px; height: 18px; flex: none; }

/* ---------- client handouts ---------- */
.handout-preview { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 8px 0; background: var(--paper); }
.handout-notes { margin: 6px 0 0; font-size: 14px; }
.yc-handout-dl { min-height: 40px; }

/* ---------- crisis lines ---------- */
.crisis-list { margin: 6px 0 0; padding-left: 20px; }
.crisis-list li { margin-bottom: 6px; }
.crisis-list a { font-weight: 700; display: inline-block; padding: 2px 0; }
.crisis-region { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* ---------- disclaimer + copyright & IP notice (always last) ---------- */
.disclaimer { border: 1px dashed var(--line-strong); background: var(--soft); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); margin-top: 22px; }
.disclaimer strong { color: var(--plum); }
.ip-notice { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; font-size: 13px; line-height: 1.55; color: var(--muted); }
.ip-notice strong { color: var(--plum); }

/* ---------- floating Home button + search landing highlight ---------- */
.yc-home-fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 60; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--purple); color: #FFFFFF; font: 800 14px var(--head); box-shadow: 0 5px 18px rgba(61, 10, 107, .24); cursor: pointer; }
.yc-home-fab[hidden] { display: none; }
.yc-home-fab:hover { background: var(--plum); }
.yc-home-fab:focus-visible { background: var(--plum); outline: 2px solid var(--purple); outline-offset: 3px; }
.yc-hit { border-radius: 4px; animation: yc-hit 2.2s ease-out; }
@keyframes yc-hit { 0%, 45% { background: var(--line-strong); box-shadow: 0 0 0 4px var(--line-strong); } 100% { background: transparent; box-shadow: 0 0 0 4px transparent; } }
.yc-sticky { transition: transform .2s ease; }
@media (max-width: 900px) { .yc-sticky.yc-compact { transform: translateY(calc(-1 * var(--yc-toolbar-h, 0px))); } }
@media (prefers-reduced-motion: reduce) { .yc-sticky { transition: none; } .yc-hit { animation-duration: .01s; outline: 2px solid var(--purple); } }
@media print { .yc-home-fab { display: none !important; } }

.hidden-by-filter { display: none !important; }
::highlight(yc-search) { background-color: var(--line-strong); color: var(--plum); }
.handout-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.yc-handout-dl:disabled { opacity: .55; cursor: not-allowed; }
.yc-handout-status { margin: 4px 0 0; font-size: 14px; min-height: 0; }
.yc-handout-status:empty { display: none; }
.yc-preview-toggle { display: none; }
@media (max-width: 520px) {
  .handout-preview:not(.expanded) { max-height: 240px; overflow: hidden; position: relative; }
  .handout-preview:not(.expanded)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(rgba(255,255,255,0), var(--paper)); }
  .yc-preview-toggle { display: inline-flex; }
}
.sheet-inside { font-size: 14px; color: var(--muted); }

/* ---------- responsive refinements: tablet and phone ---------- */
.yc-app, .yc-main, .yc-content, .section-body, .item { min-width: 0; }
.yc-content img, .yc-content video, .yc-content canvas, .yc-content iframe { max-width: 100%; }
.yc-content pre, .yc-content code { overflow-wrap: anywhere; }
.table-wrap, .dg-scroll { max-width: 100%; overscroll-behavior-inline: contain; }
.yc-content :focus-visible, .yc-mobile-toc a:focus-visible, .yc-toolbar button:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
@media (min-width: 901px) and (max-width: 1100px) {
  .yc-app { grid-template-columns: 240px minmax(0, 1fr); }
  .yc-content, .yc-toolbar { padding-left: 22px; padding-right: 22px; }
}
@media (max-width: 900px) {
  .yc-mobile-toc { scroll-snap-type: x proximity; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
  .yc-mobile-toc a { scroll-snap-align: start; min-height: 44px; }
  .yc-topbar { min-height: 52px; }
  .yc-content { width: 100%; }
  .yc-sticky { max-width: 100vw; }
  .yc-toolbar input[type=search] { flex: 1 1 100%; }
  .yc-seg { flex: 1 1 auto; }
  .yc-seg button { flex: 1 1 auto; }
  .yc-filter-status { overflow-wrap: anywhere; }
  details.section > summary { padding: 16px 18px; }
  .section-body { padding: 0 18px 18px; }
  figure.dg { max-width: 100%; }
}
@media (max-width: 520px) {
  html { scroll-padding-top: 150px; }
  .yc-content { padding: 12px 12px 48px; }
  .yc-toolbar { gap: 7px; padding: 8px 12px; }
  .yc-filter-status, .yc-mobile-toc { padding-left: 12px; padding-right: 12px; }
  details.section { margin-bottom: 10px; }
  details.section > summary { gap: 8px; padding: 14px 12px; }
  details.section > summary h2 { font-size: 19px; overflow-wrap: anywhere; }
  .section-body { padding: 0 12px 14px; }
  .item { padding: 14px 0; }
  .box { padding-left: 11px; padding-right: 12px; }
  .yc-cover-meta { grid-template-columns: minmax(88px, 34%) minmax(0, 1fr); }
  .yc-cover-meta dd, .yc-cover-meta dt { overflow-wrap: anywhere; }
  .handout-preview { padding: 12px; }
}

 a shared formulation that links early experiences, beliefs, triggers and maintaining cycles.", "**Identify** automatic thoughts, intermediate beliefs and core beliefs, and name common thinking errors.", "**Apply** core techniques in a structured session: thought records, Socratic questioning, behavioural experiments and activity scheduling.", "**Select** a technique that fits the presenting problem and the factor maintaining it, using the selection guide.", "**Evaluate** progress with session ratings and standard measures, and recognise when to adapt, pause for risk or refer."], "overview": {"text": "CBT starts from a simple position: it is not the event itself but the meaning a person gives it that shapes how they feel, act and react physically. Under stress those meanings tend to become rigid and one-sided. The person then avoids, withdraws or checks, and these actions quietly confirm the meanings. Counsellor and client work as a team to catch these meanings as they happen, weigh them against real-world evidence and try out different ways of responding. A shift in thinking makes new behaviour possible, and new behaviour produces fresh evidence, so each change strengthens the other. The longer-term aim is for the client to carry these skills on their own and become their own therapist.", "diagram_id": "d-core-model"}, "when_to_use": {"indications": ["**Low mood and depression:** especially where self-criticism and withdrawal are prominent.", "**Anxiety presentations:** panic, specific phobias, social anxiety and persistent worry.", "**Obsessive-compulsive difficulties.**", "**Post-traumatic stress:** trauma-related guilt, intrusive memories and avoidance (trauma-focused work needs specific training).", "**Eating difficulties:** restriction and binge-purge patterns, usually within a specialist team.", "**Sleep problems:** such as insomnia.", "**Substance-use problems.**", "**Stress-linked physical complaints:** irritable bowel symptoms, chronic pain, adjustment to long-term illness.", "**Anger, everyday stress and relationship strain.**"], "populations": ["**Adults, individually:** the most common format.", "**Groups:** psycho-education and skills groups.", "**Couples and families.**", "**Workplace, student and personal-growth settings.**", "**Children and adolescents:** with age-appropriate language, visuals, games and caregiver involvement.", "**Varying intellectual ability:** workable when material is simplified, concrete and visual.", "**Online and in person:** the structure transfers well to video sessions."], "cautions": ["**Active risk to life:** where suicidal ideas are severe, complete a risk assessment and safety plan first; structured cognitive work comes after safety is secured.", "**Severe thought disorder or prominent positive psychotic symptoms:** standard CBT in this form is not the first-line choice; work alongside psychiatric care.", "**Organic brain conditions or significant cognitive impairment:** abstract thought-challenging may not land; lean on behavioural methods and simplify, or refer.", "**Limited grasp of the therapy language:** adapt wording, use the client’s preferred language, examples and diagrams before concluding CBT is unsuitable.", "**Client does not accept the model:** explore expectations and the rationale first; pushing ahead without agreement usually stalls.", "**Ongoing real danger** (current abuse, domestic violence, unsafe work): prioritise safety planning and practical protection; do not use exposure or “test the threat” experiments where the threat is real.", "**Specialist presentations:** trauma-focused CBT, eating disorders and severe OCD call for specific training and supervision; refer if outside your competence."]}, "core_concepts": [{"name": "Core propositions of cognitive therapy", "originator": "", "definition": "Cognitive therapy rests on a few linked assumptions about how difficulties form and persist.", "components": ["**Schemas are learned:** deep beliefs are built up through childhood experience.", "**Symptoms are interlinked:** problem emotions, overt and covert behaviours, and automatic thoughts feed one another.", "**Unhelpful schemas underpin distress:** they concern the self, others, the world and the future.", "**Schemas work quietly:** they can bias thinking and behaviour without the person being aware of it."], "illustration": "", "level": "foundation", "diagram_id": "", "added": false}, {"name": "Cognitive model", "originator": "Beck", "definition": "A person’s emotional, behavioural and physical reactions to a situation are shaped by their perception of that situation, expressed as automatic thoughts, rather than by the situation itself.", "components": ["Situation", "Automatic thought (interpretation)", "Reaction: emotional, behavioural and physiological"], "illustration": "Maya (name changed), 24, a new graduate, sees that a team lunch was planned without her. Thought: “They don’t want me around.” She feels hurt, eats alone and stays out of the team chat. A colleague in the same spot thinks “They probably forgot to add me” and simply asks.", "level": "foundation", "diagram_id": "d-core-model", "added": false}, {"name": "Five-part (hot cross bun) model", "originator": "Padesky & Mooney", "definition": "A cross-sectional map showing how thoughts, emotions, behaviour and physical reactions interact with one another within a person’s situation or environment; a change in any one part affects the others.", "components": ["Situation / environment", "Thoughts", "Emotions (moods)", "Behaviour", "Physical reactions (bodily sensations)"], "illustration": "Leo (name changed), 35, runs a small shop and has a loan payment due. Thought: “I’ll lose everything.” Emotion: dread. Body: tight chest, poor sleep. Behaviour: stops opening letters from the bank, which keeps the worry alive.", "level": "foundation", "diagram_id": "d-five-part", "added": false}, {"name": "Levels of cognition", "originator": "Beck", "definition": "Cognition is organised in three levels, from the deepest and most stable to the most surface-level and situation-bound.", "components": ["**Core beliefs (schemas):** the deepest level: global, rigid, over-generalised beliefs about oneself, other people and the world. In well-adjusted people they support realistic appraisal; when dysfunctional they distort reality.", "**Intermediate beliefs:** often unspoken attitudes, rules and assumptions (frequently conditional, “if… then…”) that shape how a situation is viewed.", "**Automatic thoughts and images:** the most surface-level cognitions: quick, situation-specific words or pictures that arise without deliberate control."], "illustration": "Core belief: “I am a failure.” Rule: “If I don’t come top, my parents will be ashamed of me.” Automatic thought before a practice exam: “I’m going to mess this up.”", "level": "foundation", "diagram_id": "d-levels", "added": false}, {"name": "Core beliefs: how they show up", "originator": "", "definition": "Core beliefs form early, are held as absolute truths when activated, and can switch with context. A person may hold “I am weak” under threat and “I am capable” when calm. A useful clinical sign is a thought that carries strong emotion and does not budge when contrary evidence is shown.", "components": ["**About self:** e.g. “I’m unlovable”, “I can’t get anything right”.", "**About others:** e.g. “People will use me”, “Everyone else has it easier”.", "**About the world:** e.g. “The world is unsafe”, “Nothing ever works out”.", "**Confirmation bias:** information that fits the belief is noticed; information that contradicts it is discounted or explained away."], "illustration": "", "level": "advanced", "diagram_id": "", "added": false}, {"name": "Compensatory strategies", "originator": "J. Beck", "definition": "Behaviours a person develops to cope with, or protect themselves from, a painful core belief. Helpful in moderation, they become a problem when rigid and excessive, and they often keep the core belief from being tested.", "components": ["**Over-working or perfectionism:** to avoid being seen as inadequate.", "**Avoidance:** of challenges, closeness or conflict.", "**Approval-seeking or people-pleasing:** to avoid rejection.", "**Over-control or checking:** to avoid feeling helpless."], "illustration": "Sam (name changed) works late every night to live up to “If I don’t excel, I’m worthless”; the exhaustion fuels his low mood, and he never learns that he is valued without it.", "level": "advanced", "diagram_id": "", "added": false}, {"name": "Cognitive triad", "originator": "Beck", "definition": "A pattern of negative thinking about three domains (the self, the world and the future) that is characteristic of depression. The three interact and disrupt normal processing of perception, memory and problem-solving.", "components": ["Self: “I am worthless”", "World: “Everything is against me”", "Future: “It will never get better”"], "illustration": "Omar (name changed), recently out of work: “I’m useless (self), nobody hires people like me (world), and it will always be like this (future).” Each view makes the others feel more true.", "level": "foundation", "diagram_id": "d-triad", "added": false}, {"name": "Cognitive content specificity", "originator": "Beck", "definition": "Each emotional state has its own typical cognitive theme, linked to the person’s personal domain (whatever they consider important in their life).", "components": ["**Depression:** loss or devaluation", "**Anxiety:** danger or threat", "**Panic:** catastrophic misreading of body sensations", "**Anger:** another’s transgression of one’s rules", "**Guilt:** one’s own moral lapse", "**Paranoia:** unjustified intrusion or ill-intent by others"], "illustration": "Use it as a listening guide: if a client is anxious, listen for the threat; if guilty, listen for the rule they believe they broke.", "level": "advanced", "diagram_id": "", "added": false}, {"name": "Longitudinal formulation", "originator": "Beck", "definition": "Explains how a problem develops over time: early experiences shape core beliefs and conditional rules; these may stay dormant until a critical incident activates them, which then triggers negative automatic thoughts and the resulting emotional, behavioural and physical reactions that keep the problem going.", "components": ["Early experiences", "Core beliefs", "Rules / conditional assumptions", "Critical incident(s)", "Negative automatic thoughts (and their meaning)", "Reactions (emotional, behavioural, physical, motivational and cognitive), which feed back into the thoughts"], "illustration": "See the worked case: Sam’s history of constant comparison, his rule about excelling and the promotion setback that switched it on.", "level": "advanced", "diagram_id": "d-longitudinal", "added": false}, {"name": "Safety behaviours and avoidance", "originator": "", "definition": "Actions a person takes to prevent a feared outcome: avoiding situations, escaping early, checking, seeking reassurance, over-preparing, or subtle in-situation behaviours such as gripping a chair or rehearsing sentences. They bring short-term relief but stop the person discovering that the feared outcome would not have happened, so the belief survives.", "components": ["**Overt avoidance:** not going.", "**Escape:** leaving early.", "**Subtle safety behaviours:** doing something in the situation to “stay safe”.", "**Reassurance seeking and checking.**"], "illustration": "Nina (name changed) always sits near the exit at events “in case I panic”. She has never learned that she can stay through the anxiety and be fine.", "level": "foundation", "diagram_id": "", "added": true}, {"name": "Cognitive distortions", "originator": "Beck · list of ten by Burns", "definition": "Systematic errors in thinking that bias a person’s view of themselves, other people and the future. The commonly used set of ten (as listed by Burns) is given below.", "components": ["**All-or-nothing thinking:** seeing things in black-and-white categories; anything short of perfect counts as total failure.", "**Overgeneralisation:** treating one negative event as a never-ending pattern (“always”, “never”).", "**Mental filter:** dwelling on a single negative detail so the whole picture looks dark.", "**Disqualifying the positive:** insisting good experiences “don’t count”.", "**Jumping to conclusions:** negative conclusions without supporting facts: *mind reading* and *fortune telling*.", "**Magnification (catastrophising) or minimisation:** blowing up problems or shrinking strengths.", "**Emotional reasoning:** “I feel it, so it must be true.”", "**Should statements:** rigid shoulds, musts and oughts; turned inward they bring guilt, outward they bring anger.", "**Labelling and mislabelling:** attaching a global label (“I’m a loser”) instead of describing a behaviour.", "**Personalisation:** seeing oneself as the cause of an outside event one was not mainly responsible for; often brings guilt."], "illustration": "Alex (name changed), 41, a teacher, receives one parent complaint after twenty thank-you notes and thinks, “I’m a useless teacher.” That one thought shows mental filter, disqualifying the positive and labelling at once.", "level": "foundation", "diagram_id": "", "added": false}, {"name": "Other unhelpful thinking patterns seen in practice", "originator": "", "definition": "Two further patterns are useful to name with clients, though they sit outside the standard list of ten.", "components": ["**Comparison:** measuring oneself against others on thin evidence, leading to feeling superior or inferior.", "**Perfectionism:** expecting oneself and others to be flawless and becoming upset when even minor things fall short."], "illustration": "", "level": "foundation", "diagram_id": "", "added": false}, {"name": "ABC model", "originator": "Ellis", "definition": "Emotional and behavioural consequences (C) are not caused directly by an activating event (A) but by the beliefs (B) the person holds about that event.", "components": ["A: Activating event", "B: Beliefs (in REBT, especially rigid demands such as musts and shoulds, with awfulising, low frustration tolerance and putting down self or others)", "C: Consequences (emotions and behaviours)", "D: Disputing the irrational belief: is it logical, realistic, helpful?", "E: Effective new belief and its healthier consequences"], "illustration": "A: Ana’s (name changed) mother-in-law comments on the dinner. B: “She thinks I’m a bad wife; I must have her approval.” C: tearful, over-cooks for days, resentful. D: “Where is the evidence that I *must* have her approval? One comment doesn’t make me a bad wife.” E: “I’d like her approval, but I don’t need it.” She feels disappointed rather than tearful and cooks as usual.", "level": "foundation", "diagram_id": "d-abc", "added": false}, {"name": "Ego disturbance and discomfort disturbance", "originator": "Ellis", "definition": "Two broad forms of psychological disturbance arising from rigid demands.", "components": ["**Ego disturbance:** demands about oneself; distress arises when personal worth feels threatened, leading to avoidance of possible failure or disapproval, approval-seeking and unassertiveness.", "**Discomfort disturbance:** demands about others and life conditions (“People must treat me fairly”, “Life must be easy”).", "**Low frustration tolerance:** a form of discomfort disturbance: demanding that frustration should not happen and catastrophising when it does.", "**Low discomfort tolerance:** also described in REBT: demanding not to feel emotional or physical discomfort, and catastrophising when it occurs."], "illustration": "Ego: “I must not fail or I’m worthless” → never applies for the course. Discomfort: “This must not be this hard” → drops the course in week two.", "level": "advanced", "diagram_id": "", "added": false}, {"name": "Learning principles behind behavioural work", "originator": "Pavlov · Skinner · Bandura", "definition": "The behavioural side of CBT draws on three established accounts of how responses are learned, and so how they can be unlearned and relearned.", "components": ["**Classical conditioning (Pavlov):** a neutral stimulus repeatedly paired with one that naturally triggers a response comes to trigger that response itself.", "**Operant conditioning (Skinner):** behaviour followed by reinforcement becomes more likely; behaviour followed by punishment or no reinforcement becomes less likely.", "**Observational learning (Bandura):** people learn by watching others’ behaviour and its outcomes, then later reproducing it."], "illustration": "Avoidance is negatively reinforced: leaving a feared place brings relief, so leaving becomes more likely next time.", "level": "foundation", "diagram_id": "", "added": false}, {"name": "Defining features of CBT", "originator": "", "definition": "What makes a piece of work recognisably CBT.", "components": ["**Here and now:** focus on current difficulties; understanding origins alone rarely relieves symptoms.", "**Formulation-led:** a shared explanation of how the problem developed, what triggers it and what keeps it going; an explanation, not a label.", "**Collaborative empiricism:** client and counsellor work as a team, treating thoughts as hypotheses to be tested against evidence.", "**Active counsellor:** more than listening; the counsellor structures, asks, teaches and encourages.", "**Goal-directed:** specific agreed goals, reviewed and revised over time.", "**Structured:** a jointly set agenda each session.", "**Examines unhelpful thinking:** systematic questioning of whether thoughts are accurate and helpful.", "**Between-session practice:** homework carries change into daily life.", "**Time-limited:** an ending is in view from the start; the aim is independence, not reliance on therapy."], "illustration": "", "level": "foundation", "diagram_id": "", "added": false}], "assessment_formulation": {"assess": ["**Presenting problem:** what, since when, how often, how intense, how long each episode lasts.", "**A recent, specific example:** mapped onto the five parts (situation, thoughts, emotions, body, behaviour).", "**Maintaining factors:** avoidance, safety behaviours, reassurance seeking, rumination, substance use, others’ responses.", "**Risk:** thoughts of self-harm or suicide, harm to others, self-neglect, safeguarding concerns for children or vulnerable adults.", "**History:** onset, earlier episodes, relevant early experiences and family patterns.", "**Health:** physical conditions, medication, sleep, appetite; whether a medical review is needed.", "**Context:** family, work or study, finances, culture, faith, supports and strengths.", "**Goals and expectations:** what the client wants to be different, and what they expect therapy to be like.", "**Suitability:** ability to identify thoughts and feelings, acceptance of the model, readiness for between-session practice."], "key_questions": ["“Can you take me through the last time this happened, moment by moment?”", "“What went through your mind just before you felt that?”", "“What did you do next? And what did that do to the feeling?”", "“What do you avoid, or do to keep yourself safe, because of this?”", "“If this problem disappeared tomorrow, what would you be doing differently?”", "“Have things ever felt so bad that you’ve thought of harming yourself or ending your life?”"], "instruments": [{"name": "PHQ-9", "measures": "Severity of depressive symptoms. Any positive answer on the self-harm item needs a direct risk conversation in the same session."}, {"name": "GAD-7", "measures": "Severity of generalised anxiety symptoms."}, {"name": "PCL-5", "measures": "Post-traumatic stress symptoms."}, {"name": "Y-BOCS", "measures": "Severity of obsessions and compulsions (clinician-rated)."}, {"name": "SPIN", "measures": "Social anxiety symptoms."}, {"name": "Distress rating (0-100)", "measures": "In-the-moment distress, used during exposure and between sessions."}], "formulation_steps": ["**Start small:** map one recent, specific episode on the five-part model with the client.", "**Agree a problem list:** two or three problems in the client’s words, in the order the client wants to work on them.", "**Check it is a fair map:** ask “Does this fit your experience? What would you change?” and correct it together.", "**Find the loop:** ask what the client did next and what that did to the thought and feeling; draw the maintaining cycle.", "**Check for patterns:** compare two or three episodes; look for recurring themes, rules and triggers.", "**Add history gently:** once trust is built, link early experiences, core beliefs and rules to today’s triggers.", "**Share it as a hypothesis:** present it on paper as “our best guess so far” and invite corrections.", "**Use it to choose interventions:** target whichever part of the loop is easiest to shift first.", "**Revise as you go:** the formulation is updated whenever new information emerges."], "safety_plan": ["**When to make one:** whenever thoughts of self-harm or suicide are present; agree it in writing and give the client a copy.", "**Warning signs:** the client’s own signs that a crisis may be building.", "**Coping on my own:** things the client can do alone to get through the moment.", "**People and places:** that help distract or lift mood.", "**People to ask for help:** named family members or friends.", "**Professional and crisis contacts:** the counsellor, services and local crisis lines.", "**Making the environment safer:** reducing access to means.", "**Reasons for living:** in the client’s own words.", "**Review:** at every session while risk persists."], "goal_setting": ["**Specific:** “Go to the market alone twice a week”, not “feel less anxious”.", "**Measurable:** something both can see or rate.", "**Achievable:** a stretch, not a leap.", "**Relevant:** something the client cares about, put in their words.", "**Time-bound:** a review point is agreed.", "**Phrase goals as things to start doing**, not only things to stop.", "**Write the treatment plan together:** the agreed goals, how progress will be noticed, the main methods planned, the expected number of sessions and a review date. Record whether the client agrees with it."], "tracking": ["**Session measures:** a brief standard measure at the start of each session or at set intervals.", "**Belief and emotion ratings** (0-100%) on key thoughts, before and after work on them.", "**Goal ratings** (0-10) at regular reviews.", "**Action-plan completion:** what was done, what got in the way.", "**Review together:** show the client their own graph. Clients often find it more convincing than anything you say.", "**Use the same rating scales throughout:** mood 0 (very low) to 10 (very good); distress 0 (none) to 10 (extreme); belief and emotion 0 (not at all) to 100 (completely, the strongest imaginable); goals 0 (not at all) to 10 (fully reached)."], "instrument_note": "Use validated versions in the client’s language where available, score them by the official guidance, and treat scores as a support to clinical judgement, never a replacement for it.", "diagram_id": "d-five-part", "intake_guide": ["**Set the frame:** introduce yourself, how sessions work, records, confidentiality and its limits; obtain consent (and, for under-18s, guardian consent plus the young person’s own assent). Arrange an interpreter if needed; do not use family members to interpret risk questions.", "**Agree contact and emergency details:** the client’s preferred safe way to be contacted, an emergency contact, and exactly when the client agrees it may be used.", "**Presenting concern in their words:** what brings them now, when it began, how often, how long it lasts, what brings it on, what helps even a little.", "**Effect on daily life:** rate mood, work or study, relationships, sleep and self-care from 0 (no effect) to 10 (unable to manage).", "**Safety check:** ask directly about thoughts of not wanting to be alive, suicide, self-harm and harming others, and about safety from other people (see the safety check script in this section). Do this in the first session, not later.", "**History and context:** previous help and what worked, current medication and prescriber, alcohol and drug use with amounts, physical health and whether physical causes have been checked, sleep and appetite, relationships, caring roles, recent pressures, strengths and values.", "**Difficult experiences, with permission:** ask whether past frightening experiences affect them now; do not seek a detailed account unless it is clinically needed, within your competence and agreed.", "**Baseline measures:** the standard measure for the main problem and the client’s goal ratings; share the scores with the client.", "**First map and goals:** map one recent episode on the five-part model, agree a short problem list in priority order and one or two goals.", "**Close:** summarise, agree the plan and the next appointment, and check how the session felt."], "risk_script": ["**At the start of every online session,** confirm where the client is right now and that they can talk privately; you need their location to send emergency help.", "**Ask every session, directly and calmly:** “Since we last met, have you had thoughts of not wanting to be alive?” · “Any thoughts of ending your life?” · “Any thoughts of hurting yourself without wanting to die?” · “Any thoughts of hurting someone else?”", "**Ask about safety from others:** “Is anyone hurting, threatening or controlling you? Is anyone at home, such as a child, at risk?” Ask only when the client is alone and it is safe to talk; on video or phone, agree a word that means “I can’t talk freely”.", "**For any yes, or if the client declines to answer:** ask what the thoughts are and how often; whether there is a method or plan, any timing or preparation; intention to act; access to means; past attempts or self-harm; what has changed recently; what keeps them safe and who can support them now.", "**A declined answer is never “no risk”.** Explore gently what makes it hard to answer, and record that it was declined.", "**Record your reasoning, not only a level.** Risk levels cannot predict who will act; they set how quickly you respond. Record the level of concern (routine · raised: review sooner · high: act today · emergency: act now), the risk and protective factors behind it, and what you did.", "**If you cannot determine the level,** treat it as at least high until clarified, and consult your supervisor the same day.", "**Act on the level:** make or review the safety plan, agree steps to reduce access to means, involve a support person with consent, consult your supervisor or safeguarding lead, and contact crisis or emergency services when risk is imminent. Give the client the crisis numbers for their country.", "**If risk is imminent,** do not end the session or leave the client alone; keep them on the line or in the room while you contact emergency services or arrange urgent assessment, then inform your supervisor the same day.", "**Under-18s:** tell the young person beforehand that risk to their safety may mean informing a parent, guardian or safeguarding lead, and follow local child-protection procedures."], "measurement_schedule": [{"when": "Session 1 (baseline)", "measure": "The main standard measure for the presenting problem (e.g. PHQ-9, GAD-7), a risk check, and the client’s own goal ratings (0-10).", "look_for": "A clear starting point to compare against; any risk item answered positively needs a risk conversation in that session."}, {"when": "Every session", "measure": "A brief mood or distress rating, the main measure if it is a short one, and belief ratings for the thoughts being worked on.", "look_for": "The direction of change across several sessions, not one week’s score. A sudden worsening needs discussion and a risk check."}, {"when": "About every four sessions", "measure": "Goal ratings and a review of the formulation.", "look_for": "Whether goals are moving. If they are not, revisit the plan together."}, {"when": "Around the middle of the course", "measure": "Main measure and goals, reviewed with the client.", "look_for": "If there is little or no improvement by now, review the formulation, take the case to supervision, and consider a different approach or a referral."}, {"when": "Final session", "measure": "Repeat the baseline measures and goal ratings.", "look_for": "Change since session 1, shown to the client as evidence of their own progress, and any remaining difficulties to include in the staying-well plan."}, {"when": "Follow-up or booster sessions", "measure": "The main measure and goal ratings.", "look_for": "Whether gains are holding, and early signs of relapse."}], "measurement_note": "Share scores with the client and look at the pattern together; it builds hope and keeps the work collaborative. Use a validated translation when the client is more comfortable in another language, and remember that cut-off scores may differ between languages and cultures.", "added": true}, "techniques": [{"name": "Socialising to the model", "level": "foundation", "purpose": "To help the client see, using their own experience, how thoughts, feelings, body and behaviour connect. Everything else in CBT builds on this.", "when": "First or second session, and again whenever the client loses sight of the rationale.", "steps": ["Ask for a recent, specific upsetting moment.", "Map it together on paper using the five parts.", "Point out the links: how the thought fed the feeling, how the behaviour fed the thought.", "Ask what might change if one part changed.", "Explain how sessions work: agenda, action plans, feedback, time-limited."], "prompts": ["“Shall we draw out what happened on Tuesday, step by step?”", "“Looking at this, where do you think we could break the loop?”"], "dialogue": [{"speaker": "Counsellor", "line": "When you saw the message from your manager, what went through your mind?", "note": "Starts with a concrete moment."}, {"speaker": "Client", "line": "That I’d done something wrong and was in trouble.", "note": ""}, {"speaker": "Counsellor", "line": "And how did you feel, and what did your body do?", "note": "Gathers emotion and physical parts."}, {"speaker": "Client", "line": "Panicky. My stomach dropped. I didn’t reply all evening.", "note": ""}, {"speaker": "Counsellor", "line": "So not replying kept the ‘I’m in trouble’ thought going all night. What did the message actually say the next day?", "note": "Shows the maintaining link."}, {"speaker": "Client", "line": "Just that she wanted to move our meeting.", "note": ""}, {"speaker": "Counsellor", "line": "Interesting. What do you make of that?", "note": "Lets the client draw the conclusion."}], "if_client_says": [{"says": "“So you’re saying it’s all in my head?”", "respond": "“Not at all. The situation is real. We’re looking at how your mind and body respond to it, because that’s the part we can work on together.”"}], "tip": "Use the client’s words on the diagram, not textbook terms.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Eliciting automatic thoughts", "level": "foundation", "purpose": "To catch the in-the-moment thoughts and images that drive an emotional shift.", "when": "Whenever emotion shifts in session, and when reviewing a recent upsetting event.", "steps": ["Notice a visible change in emotion in the session, or ask for a recent upsetting moment.", "Ask what was going through the client’s mind just before the feeling.", "Probe for meaning: what does it say about them, others or the future?", "Ask for images as well as words.", "Write the thought down word for word and rate how strongly it is believed (0-100%)."], "prompts": ["“Just now, when you mentioned your sister’s wedding, your face changed. What went through your mind?”", "“Was there a picture in your mind, as well as words?”", "“If that were true, what would it mean about you?”"], "dialogue": [], "if_client_says": [{"says": "“I wasn’t thinking anything, I just felt awful.”", "respond": "“That’s common. Thoughts can be very fast. Let’s slow it down: picture the moment again. What did you imagine might happen next?”"}], "tip": "Clients often report feelings (“I felt bad”) as thoughts. Gently separate the two before working on either.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Thought records and cognitive restructuring", "level": "foundation", "purpose": "To spot upsetting thoughts and check them against the evidence, so they become more accurate and less rigid.", "when": "Once the client can catch automatic thoughts; the main cognitive tool through the middle phase.", "steps": ["**Self-monitor:** record the situation, emotion and automatic thought, with ratings.", "**Question the thought:** is it based on feeling or fact? Is it really black-and-white?", "**Gather evidence:** list what supports the thought and what does not.", "**Weigh costs and benefits:** what does holding this thought give and take?", "**Build an alternative:** write a balanced statement that takes in all the evidence.", "**Re-rate** belief in the original thought and the intensity of the emotion.", "Start with automatic thoughts; move to intermediate and core beliefs once the client is confident with the skill."], "prompts": ["“What makes you think that thought is true? What doesn’t quite fit?”", "“If a close friend told you this exact thought, what would you say to them?”", "“Is there another way of looking at what happened?”"], "dialogue": [], "if_client_says": [{"says": "“I know it’s not logical, but it still feels true.”", "respond": "“That gap between head and heart is normal. Feelings often lag behind. Trying it out in real life can help the new view sink in.”"}, {"says": "“I didn’t do the record, I forgot.”", "respond": "“Let’s do one together now, from this week, and then look at what would make it easier to remember.”"}], "tip": "Aim for a believable balanced thought, not a cheerful one. If the client rates their belief in the new thought below 50 out of 100, keep working.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Guided discovery through Socratic questioning", "level": "foundation", "purpose": "To help the client bring their own thoughts to light and test them for themselves rather than being told what to think. In Padesky’s description, Socratic questions are ones the client has the knowledge to answer; that draw attention to relevant information outside the client’s current focus; that generally move from the concrete to the more abstract; and that let the client finally apply the new information to re-evaluate a previous conclusion or construct a new idea.", "when": "Throughout therapy. It is the default style of questioning in CBT.", "steps": ["Ask concrete, answerable questions about the situation.", "Bring in overlooked information gently.", "Listen and reflect what you hear, without leading.", "Summarise the information gathered.", "Ask a synthesising question: “How does this fit with your original belief?”"], "prompts": ["“You said you’re a total failure. Who arranged your father’s hospital visits last month?”", "“What do you make of that, putting it alongside ‘total failure’?”"], "dialogue": [{"speaker": "Client", "line": "I’m a complete failure at everything.", "note": ""}, {"speaker": "Counsellor", "line": "That sounds painful to carry. Can we look at last week? What did you manage to do?", "note": "Concrete, answerable question."}, {"speaker": "Client", "line": "Not much. I took my dad to his hospital appointments and sorted his medicines.", "note": ""}, {"speaker": "Counsellor", "line": "How did that go for him?", "note": "Draws attention to information outside the client’s focus."}, {"speaker": "Client", "line": "He said he couldn’t have managed without me.", "note": ""}, {"speaker": "Counsellor", "line": "So you looked after your father’s health this week. How does that fit with ‘failure at everything’?", "note": "Synthesising question."}, {"speaker": "Client", "line": "I suppose not everything. I just feel like it.", "note": "Opens the door to emotional reasoning work."}], "if_client_says": [{"says": "“You’re just trying to make me feel better.”", "respond": "“I’m not trying to change your mind. I’m curious whether the facts fit the thought. You decide what they show.”"}], "tip": "If you already know the answer you want, it isn’t guided discovery. Stay curious. The client’s conclusion may differ from yours and still be useful.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Activity scheduling and behavioural activation", "level": "foundation", "purpose": "To rebuild routine, pleasure and a sense of achievement, breaking the withdrawal and low mood cycle.", "when": "Early in work with low mood, and whenever the client is inactive or withdrawn.", "steps": ["Monitor a week of current activity hour by hour.", "Rate each activity for achievement and enjoyment (0-10) and notice links with mood.", "Plan specific activities for the coming days, starting small and including both pleasure and achievement.", "Agree on what will be done, not how much will be achieved.", "Review, troubleshoot and build up; over time the client plans the next day themselves."], "prompts": ["“What is one small thing you used to enjoy that we could fit into Tuesday evening?”", "“On a 0-10 scale, how much did you enjoy it? And how did your mood compare with the day before?”"], "dialogue": [{"speaker": "Counsellor", "line": "Looking at your week, the evenings were the lowest points. What happens then?", "note": "Uses monitoring data."}, {"speaker": "Client", "line": "I just lie on the bed with my phone.", "note": ""}, {"speaker": "Counsellor", "line": "What did you use to do in your free time before things got hard?", "note": ""}, {"speaker": "Client", "line": "Play cricket with friends on Sundays. Cook sometimes.", "note": ""}, {"speaker": "Counsellor", "line": "Could we choose one small piece of that for this week? Say, cooking one dish on Wednesday?", "note": "Small, specific, agreed together."}, {"speaker": "Client", "line": "I could try. I probably won’t enjoy it.", "note": ""}, {"speaker": "Counsellor", "line": "That’s a fair prediction. Let’s rate it afterwards and see.", "note": "Turns doubt into a mini-experiment."}], "if_client_says": [{"says": "“I’ll do things when I feel more motivated.”", "respond": "“That’s how it usually feels. With low mood, though, motivation tends to come after you start. Let’s start with something small enough to do even without motivation.”"}], "tip": "Schedule a time and place, not just a task: “Walk to the park and back at 7 a.m.” beats “exercise more”.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Behavioural experiments", "level": "foundation", "purpose": "To gather real-world evidence for or against a thought or prediction.", "when": "When a belief is held as a prediction (“If I…, then…”), and to move new views from the head to the heart.", "steps": ["Identify the thought and rate belief (0-100%).", "State a clear, testable prediction.", "Design the experiment together, including what will count as evidence.", "Anticipate obstacles and agree to drop safety behaviours.", "Carry it out, record what happened, and re-rate belief.", "Compare competing approaches on different occasions where useful (e.g. self-criticism vs self-kindness after a setback)."], "prompts": ["“Your prediction is that if you speak up in the meeting, people will laugh. How could we find out?”", "“What exactly would we need to see to know your prediction was right?”"], "dialogue": [{"speaker": "Counsellor", "line": "You believe 80% that if you ask a question in class, people will think you’re stupid. How could we test that?", "note": "Rated, specific prediction."}, {"speaker": "Client", "line": "I could ask one question and watch their faces.", "note": ""}, {"speaker": "Counsellor", "line": "What would tell you they thought you were stupid?", "note": "Agrees evidence in advance."}, {"speaker": "Client", "line": "If they laughed or rolled their eyes.", "note": ""}, {"speaker": "Counsellor", "line": "And would you be tempted to do anything to protect yourself, like rushing the question?", "note": "Spots safety behaviours."}, {"speaker": "Client", "line": "Yes, I’d speak fast and look down.", "note": ""}, {"speaker": "Counsellor", "line": "Then let’s plan to ask it slowly and look up. We’ll review what you noticed next week.", "note": ""}], "if_client_says": [{"says": "“What if the worst does happen?”", "respond": "“Then we’ll have learned something important, and we’ll work out together how you coped and what it means. Either way, you’ll know more than you do now.”"}], "tip": "Frame it as a no-lose test: either outcome teaches something. Drop safety behaviours during the experiment or the result won’t count.", "caution": "Experiments must be safe and agreed; never design one that could cause real harm or humiliation.", "added": false, "diagram_id": ""}, {"name": "Problem solving", "level": "foundation", "purpose": "To address real-life difficulties that keep distress going.", "when": "When distress is tied to a genuine practical problem rather than a distorted view of it.", "steps": ["Define the problem specifically.", "Brainstorm possible solutions without judging them.", "Weigh the pros and cons of each.", "Choose one and plan the steps: who, what and when.", "Try it and review; if it didn’t work, go back to the list."], "prompts": ["“Let’s list every option, even the silly ones, before we pick.”", "“What’s the smallest first step you could take this week?”"], "dialogue": [], "if_client_says": [], "tip": "Separate problems that can be solved from worries that need cognitive work.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Graded exposure", "level": "foundation", "purpose": "To reduce fear and avoidance by approaching feared situations step by step.", "when": "Phobias, panic with avoidance, social anxiety and other fear-driven avoidance.", "steps": ["Build a fear ladder together, rating each step for distress (0-100).", "Start with a step that is challenging but manageable.", "Stay in the situation long enough to learn something new, without safety behaviours.", "Repeat until the step feels easier, then move up.", "Review what was learned after each exposure."], "prompts": ["“Which step on our ladder feels hard but doable this week?”", "“What did you expect to happen, and what actually happened?”"], "dialogue": [], "if_client_says": [{"says": "“I tried and had to leave.”", "respond": "“That tells us something. The step may be too big. Let’s find one halfway, and look at what you learned before you left.”"}], "tip": "Plan the steps together and never force one. What the client learns matters more than how far the anxiety drops.", "caution": "", "added": true, "diagram_id": ""}, {"name": "Role play and role reversal", "level": "foundation", "purpose": "To practise responses to difficult interactions and model new behaviour.", "when": "Before an important conversation, and to build assertiveness or social skills.", "steps": ["Identify the interaction to practise.", "Counsellor first plays the client’s part to model a response.", "Swap roles so the client practises.", "Debrief: what worked, what felt hard?", "Repeat with adjustments."], "prompts": ["“Let me be you for a moment, and you be your landlord. Watch how I ask for the repair.”", "“Now swap. How did it feel to say it yourself?”"], "dialogue": [], "if_client_says": [], "tip": "Role reversal also lets the client voice the other person’s side, which often softens mind-reading.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Slow breathing", "level": "foundation", "purpose": "To lower physical arousal, particularly in anxiety.", "when": "When high physical arousal is getting in the way, and as a general calming skill.", "steps": ["Sit comfortably.", "Breathe in gently through the nose for a count of about four, letting the belly rather than the chest rise.", "Pause briefly only if comfortable.", "Breathe out slowly for a slightly longer count (about six).", "Keep breaths small and smooth, not big or deep, with attention on the breath.", "Continue for a few minutes until calmer."], "prompts": ["“Let’s slow things down together. In gently… and a long, slow breath out.”"], "dialogue": [], "if_client_says": [], "tip": "Practise when calm first, so the skill is available when anxious. If the client feels light-headed, make the breaths smaller.", "caution": "In panic work, breathing used to “stop disaster” can become a safety behaviour; present it as a way to ride out sensations, not to prevent catastrophe.", "added": false, "diagram_id": ""}, {"name": "Progressive muscle relaxation", "level": "foundation", "purpose": "To reduce physical tension by systematically tensing and releasing muscle groups.", "when": "Tension, stress, sleep difficulties.", "steps": ["Sit or lie comfortably.", "Tense one muscle group for about five seconds.", "Release and notice the difference for 10-20 seconds.", "Move through the body group by group.", "Finish with a few slow breaths."], "prompts": ["“Make a tight fist… hold… now let go and notice how the hand feels.”"], "dialogue": [], "if_client_says": [], "tip": "Skip or soften any group where there is pain or injury.", "caution": "", "added": true, "diagram_id": ""}, {"name": "Autogenic training and guided imagery", "level": "foundation", "purpose": "To reach deep relaxation using body awareness and calming imagery.", "when": "Stress, tension, sleep difficulties; as a skill for winding down.", "steps": ["Settle and imagine a peaceful place.", "Move attention from feet to head.", "Attend to calming body sensations: heavy, warm arms and legs, an unforced breath, a steady heartbeat.", "For guided imagery, follow the counsellor’s voice through a calming scene.", "Notice any realisations or feelings that arise and discuss afterwards."], "prompts": ["“Picture a quiet place where you feel safe. What can you see there?”"], "dialogue": [], "if_client_says": [], "tip": "Let the client choose their own scene. A beach you suggest may be someone else’s trauma site.", "caution": "For trauma survivors, offer eyes-open practice and check in often; stop if imagery brings up distressing memories.", "added": false, "diagram_id": ""}, {"name": "Mindfulness practice", "level": "foundation", "purpose": "To build steady, non-judging attention to the present moment.", "when": "Rumination, worry, and as a general skill for stepping back from thoughts.", "steps": ["Sit upright with the eyes closed or lowered.", "Rest attention on the rise and fall of the abdomen while breathing.", "When the mind wanders, notice where it went and return to the breath.", "Start with a few minutes and build up."], "prompts": ["“Each time your mind drifts, that’s fine. Just notice where it went and come back to the breath.”"], "dialogue": [], "if_client_says": [], "tip": "The mind will wander. Noticing that and coming back is the practice.", "caution": "For trauma survivors, offer eyes-open practice and let the client choose the focus (sounds, feet on the floor). Attention on the breath or body can be distressing.", "added": false, "diagram_id": ""}, {"name": "Distraction techniques", "level": "foundation", "purpose": "To give short-term relief from overwhelming thoughts by redirecting attention.", "when": "Brief respite during intense distress; a safer alternative to harmful coping.", "steps": ["**Focus on an object:** describe it in detail: where it is, its colour, material and use.", "**Sensory awareness:** notice what can be seen, heard, felt and smelled around you.", "**Mental exercises:** count back from 100 in sevens; name animals starting with a chosen letter.", "**Pleasant memories:** recall an enjoyable event in detail.", "**Absorbing activities:** puzzles, games, sport, a hobby; pair low-attention tasks with music.", "**Purposeful activity:** begin a useful task that needs doing."], "prompts": ["“Look around this room and tell me five things you can see, as if describing them to someone who can’t.”"], "dialogue": [], "if_client_says": [], "tip": "A short-term tool only. It gives respite and can replace harmful coping, but over-use becomes avoidance.", "caution": "Do not use distraction during exposure or behavioural experiments. There it works as a safety behaviour.", "added": false, "diagram_id": ""}, {"name": "Counting thoughts", "level": "foundation", "purpose": "To create distance from negative automatic thoughts rather than engaging with each one.", "when": "Frequent, repetitive negative thoughts or rumination.", "steps": ["Agree on a counting method (tally on a phone or notebook).", "Each time a negative automatic thought appears, note it and count it.", "Set the thought aside rather than letting it steer mood.", "Review counts to see patterns and progress."], "prompts": ["“For this week, just count them. You don’t need to argue with them.”"], "dialogue": [], "if_client_says": [], "tip": "A falling count over a few weeks is encouraging evidence for the client.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Downward arrow", "level": "advanced", "purpose": "To trace a surface thought down to the underlying belief that gives it its emotional charge.", "when": "When the same themes recur across situations, or a thought carries more emotion than it seems to warrant.", "steps": ["Start with a specific automatic thought.", "Assume for now that it is true and ask what it would mean.", "Repeat the question with each answer.", "Stop when the answer is a global statement about the self, others or the world with no further meaning beneath it.", "Note the belief for the formulation; do not challenge it yet."], "prompts": ["“Suppose your manager did notice your hands shaking. What would that mean about you?”", "“And if that were true, what would be so bad about it?”"], "dialogue": [], "if_client_says": [{"says": "“I don’t know, it would just be bad.”", "respond": "“Take your time. If the worst version of that came true, what would you fear people would think of you? Or what would you think of yourself?”"}], "tip": "Keep a calm, warm tone. Repeated “and then?” can feel like interrogation. Vary your wording and check in with the client’s distress.", "caution": "Reaching a core belief can be distressing. Leave time to settle and summarise before the session ends.", "added": false, "diagram_id": "d-downward"}, {"name": "Responsibility pie chart", "level": "advanced", "purpose": "To loosen excessive self-blame, especially after trauma or adverse events.", "when": "Guilt and inflated responsibility after accidents, losses or trauma, and in OCD.", "steps": ["Ask the client to rate their own responsibility (%) for the event.", "Brainstorm every factor and person that contributed, listing the client last.", "Assign a percentage to each factor.", "Draw the pie with each slice, the client’s share drawn from what is left.", "Compare the final share with the starting rating and discuss."], "prompts": ["“Before we decide how much of this sits with you, let’s list everything else that played a part.”"], "dialogue": [], "if_client_says": [], "tip": "Do not argue the client out of all responsibility. The goal is an accurate, proportionate share.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Cost-benefit analysis", "level": "advanced", "purpose": "To weigh whether holding an old belief or thinking pattern is worth it.", "when": "When a client clings to a belief they partly know is unhelpful.", "steps": ["Name the belief or pattern (e.g. calling oneself an idiot).", "List what it gives, short-term and long-term.", "List what it costs: emotional, practical, relational and work-related.", "Consider how it affects people around the client.", "Weigh the lists and decide whether to keep, modify or drop the belief."], "prompts": ["“What does telling yourself ‘I’m a burden’ actually do for you? And what does it cost?”"], "dialogue": [], "if_client_says": [], "tip": "Take the benefits seriously. Beliefs usually survive because they protect something. Name that, then look for a cheaper way to get it.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Cognitive continuum", "level": "advanced", "purpose": "To soften all-or-nothing self-judgements by placing them on a scale.", "when": "Absolute core beliefs such as “I’m completely stupid” or “I’m a bad mother”.", "steps": ["Take the absolute belief.", "Draw a line from 0 to 100 and define the extremes concretely.", "Ask the client to place themselves first.", "Place other people, then re-place the client using evidence.", "Discuss the gap between the first and final positions."], "prompts": ["“If 0 is someone who can’t manage anything at all and 100 is the most capable person you know, where would you put yourself? And where would you put your neighbour who runs the corner shop?”"], "dialogue": [], "if_client_says": [], "tip": "Define the ends in extreme, concrete terms; vague ends keep the client stuck at the bottom.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Positive data log", "level": "advanced", "purpose": "To strengthen a new, more balanced core belief by collecting everyday evidence for it.", "when": "Later in therapy, once an alternative belief has been named.", "steps": ["Agree the new belief (e.g. “I am good enough as I am”).", "Each day, note small pieces of evidence that fit it.", "Include things the client would normally dismiss.", "Review weekly and re-rate belief in old and new views."], "prompts": ["“What happened today, however small, that fits ‘I’m good enough’?”"], "dialogue": [], "if_client_says": [], "tip": "Expect the old belief to filter evidence out at first; reviewing together catches what the client misses.", "caution": "", "added": true, "diagram_id": ""}, {"name": "Cognitive rehearsal", "level": "advanced", "purpose": "To prepare for a difficult situation by mentally practising helpful thoughts and responses.", "when": "Before a stressful event the client can see coming, such as an interview, a difficult talk or a return to a feared place.", "steps": ["Recall or anticipate a problem situation.", "Work out a response together.", "Ask the client to imagine the situation in detail.", "Rehearse the helpful thoughts and actions in imagination.", "Repeat until the response feels natural; then try it for real."], "prompts": ["“Close your eyes and picture walking into the interview room. What will you say to yourself as you sit down?”"], "dialogue": [], "if_client_says": [], "tip": "Rich sensory detail makes imaginal rehearsal more effective.", "caution": "", "added": false, "diagram_id": ""}, {"name": "Grounding", "level": "foundation", "purpose": "To help a client come back to the present when they feel overwhelmed, detached, unreal or caught in a flashback.", "when": "When distress is so high that the client cannot think or talk, during dissociation or flashbacks, or at the end of an intense session. Not as a way of escaping fear during planned exposure work.", "steps": ["Agree in advance what grounding is for, and a signal the client can give if it makes them feel worse.", "Invite the client to notice their feet on the floor and their body supported by the chair.", "Guide attention outwards: name five things they can see, four they can feel, three they can hear, two they can smell, and one kind thing about themselves.", "If helpful, orient to the present: where they are, the date, their age, the season.", "Offer something to hold that is safe and textured or cool, and slow, comfortable breathing if they wish.", "Check the effect (distress 0-10 before and after) and agree when they will use it between sessions."], "prompts": ["“Let’s bring you back to the room for a moment. Can you feel your feet on the floor?”", "“Tell me five things you can see right now, wherever your eyes land.”"], "dialogue": [], "if_client_says": [{"says": "“This isn’t working, I still feel far away.”", "respond": "Slow down and make it more physical: press feet into the floor, hold the object, say the date out loud together. Use the agreed stop signal if it is making things worse."}], "tip": "Practise grounding when the client is calm first, so it is familiar when they need it.", "caution": "During planned exposure, grounding can become a safety behaviour that stops new learning; decide with the client when it is and is not used. Stop if it increases distress.", "added": true, "diagram_id": ""}], "technique_selection": {"diagram_id": "d-selection", "table": [{"target": "Risk to safety", "techniques": ["Risk assessment and safety plan before anything else"]}, {"target": "A specific upsetting thought", "techniques": ["Thought record", "Socratic questioning"]}, {"target": "A deep, recurring belief", "techniques": ["Downward arrow", "Cognitive continuum", "Cost-benefit analysis", "Positive data log"]}, {"target": "A fearful prediction", "techniques": ["Behavioural experiment"]}, {"target": "Fear and avoidance", "techniques": ["Graded exposure", "Dropping safety behaviours"]}, {"target": "Low activity and low mood", "techniques": ["Activity scheduling and behavioural activation"]}, {"target": "Excessive self-blame or guilt", "techniques": ["Responsibility pie chart", "Socratic questioning"]}, {"target": "High physical arousal", "techniques": ["Slow breathing", "Progressive muscle relaxation"]}, {"target": "A real practical problem", "techniques": ["Problem solving"]}, {"target": "A difficult conversation ahead", "techniques": ["Role play", "Cognitive rehearsal"]}, {"target": "Repetitive negative thinking", "techniques": ["Mindfulness practice", "Counting thoughts"]}]}, "problem_applications": [{"problem": "Depression", "model": "Cognitive model of depression", "originator": "Beck", "mai
