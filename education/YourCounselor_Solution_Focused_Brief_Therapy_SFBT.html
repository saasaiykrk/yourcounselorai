": "Make progress, confidence, hope, readiness or another chosen dimension discussable in the client’s terms.", "when": "To explore current position, identify evidence of progress, or make a next step more concrete.", "steps": ["Choose one dimension with the client.", "Co-define what 0 and 10 mean.", "Ask for a rating and invite the client’s explanation.", "Explore what supports the current number.", "Ask what a small move up would look like and what support might help."], "prompts": ["Where are you on a scale from 0 to 10, where 10 means… and 0 means…?", "What makes it that number rather than lower?", "What would be the first sign of moving up by one point?"], "dialogue": "Client: “I’m at 4.” Practitioner: “What is already happening that makes it a 4? What might you or someone else notice if it moved to 4½?”", "if_client_says": ["“Zero”: validate the rating and assess immediate needs and risk; ask what has kept things from being worse only if appropriate.", "“Ten” despite concerns: be curious about what 10 means to them; do not argue or force a lower rating."], "tip": "Use the scale to generate useful conversation, not to score the client’s cooperation.", "caution": "A conversational scale is not a validated symptom measure and cannot replace risk assessment.", "added": true, "diagram_id": "sfbt-scale"}, {"name": "Coping questions", "level": "foundation", "purpose": "Acknowledge effort and identify how the client has managed when there are few visible exceptions or hope feels distant.", "when": "During crisis, grief, exhaustion, demoralisation or when the client cannot identify successes.", "steps": ["Acknowledge the severity of what the client described.", "Ask how they have managed to get through, or what has prevented things worsening.", "Listen for supports, actions, values and practical survival strategies.", "Reflect these specifically and check the client’s response.", "Address safety and material needs directly where indicated."], "prompts": ["How have you managed to get through this much?", "What has helped you make it through today?", "What is keeping you going, if anything?"], "dialogue": "“I hear how exhausting this has been. How have you managed to get through the last few days? And what support would make the next day safer or more manageable?”", "if_client_says": ["“I haven’t coped”: respect their description; ask what they need now and assess risk or urgent support.", "“I just have to”: explore constraints without romanticising endurance."], "tip": "Coping questions can acknowledge effort and open the door to support; they are not a substitute for practical help.", "caution": "Avoid praising endurance in abusive, exploitative or dangerous circumstances as if the person should simply keep coping.", "added": true}, {"name": "Resource and strength questions", "level": "foundation", "purpose": "Identify capacities, relationships, knowledge, values and practical resources the client considers useful.", "when": "When developing a preferred future, planning a next step or broadening the client’s sense of options.", "steps": ["Ask what the client already knows or has tried.", "Explore who or what supports them, if safe and wanted.", "Ask how a resource might be used in the client’s own way.", "Check whether the client recognises the resource and whether it is available now."], "prompts": ["What have you learned about handling this?", "Who understands you in a way that helps?", "What personal or practical resources might be useful here?"], "dialogue": "“You noticed you can pause before replying when you have a moment to yourself. How do you make that moment possible, and could any part of it be useful again?”", "if_client_says": ["“I have no strengths”: do not contradict; ask about what they value, know, care about or have managed to survive."], "tip": "Resources may be relational, cultural, material or community-based, not only personal traits.", "caution": "Do not assume family, community, religion or a particular identity is a safe or desired resource.", "added": true}, {"name": "Constructive listening and acknowledgement", "level": "foundation", "purpose": "Show accurate understanding while noticing client-defined effort, preferences and possibilities.", "when": "Throughout the conversation, especially after meaningful descriptions or difficult disclosures.", "steps": ["Reflect the client’s words accurately.", "Name a specific action, intention or value only when grounded in their account.", "Offer the observation tentatively.", "Invite correction or elaboration."], "prompts": ["What feels important about that to you?", "How did you manage to do that under those circumstances?", "Have I understood that correctly?"], "dialogue": "“You were worried about the conversation, and you still asked for a pause rather than walking away. What helped you choose that?”", "if_client_says": ["If the acknowledgement does not fit, apologise and return to the client’s meaning."], "tip": "Credible specificity is more useful than generic praise.", "caution": "Do not use compliments to steer clients toward compliance or minimise pain.", "added": true}, {"name": "Relationship-perspective questions", "level": "advanced", "purpose": "Explore how a preferred future might be noticed by relevant people and identify relational signs of change.", "when": "In family, couple, parenting or school work when the client wants to understand relational outcomes.", "steps": ["Ask whose perspective matters to the client.", "Invite a tentative description of what that person might notice.", "Check whether the client’s assumption is known or imagined.", "Explore communication, boundaries and safety before using the perspective to plan."], "prompts": ["Who would notice first that things were a little better?", "What might they see you doing differently?", "What would you hope they would notice, without needing to guess their thoughts?"], "dialogue": "“If your daughter noticed a small change, what might she see you doing differently? What would you want to ask her rather than assume?”", "if_client_says": ["If no safe person is available, use the client’s own perspective or another chosen observer."], "tip": "Use relationship questions to clarify observable interaction, not to claim access to another person’s mind.", "caution": "Avoid conjoint questioning when coercion, intimidation or violence makes it unsafe.", "added": true}, {"name": "Pre-session / between-session change", "level": "foundation", "purpose": "Notice changes that may already have occurred before or between appointments.", "when": "At the beginning of first and follow-up sessions.", "steps": ["Ask whether anything has changed since arranging or attending the last session.", "If yes, ask what the client noticed and what contributed.", "If no, accept that answer and ask what needs attention today.", "Use the answer to guide the next conversation."], "prompts": ["What, if anything, has changed since we last spoke?", "Have you noticed anything that you would want to keep?"], "dialogue": "“Since booking this appointment, has anything shifted, even a little, or has it been much the same?”", "if_client_says": ["“Nothing”: acknowledge and continue without implying they should have improved."], "tip": "This question communicates that change can happen in many forms and is not the therapist’s exclusive achievement.", "caution": "Do not overstate small changes or ignore deterioration.", "added": true}, {"name": "Coping-to-next-step bridge", "level": "foundation", "purpose": "Move gently from survival and current resources toward a tolerable next step when the client is ready.", "when": "When the client has described difficult circumstances but wants help identifying what comes next.", "steps": ["Acknowledge current coping and constraints.", "Ask what would make the immediate future a little more manageable.", "Identify what support or practical change is needed.", "Agree one client-chosen step and a backup."], "prompts": ["What would help you get through the next day?", "What would make things one small degree more manageable?", "Who or what could help with that?"], "dialogue": "“We do not need to solve everything today. What is one thing that would make tomorrow a little more manageable, and what support would make it possible?”", "if_client_says": ["If the client cannot identify a step, focus on safety, connection, practical resources or simply clarify what they need from the session."], "tip": "The next step may be contacting a service, setting a boundary, asking for help or pausing, not necessarily a self-improvement task.", "caution": "Do not substitute a small step for urgent medical, safeguarding, housing or legal assistance.", "added": true}, {"name": "End-of-session reflection and feedback", "level": "foundation", "purpose": "Consolidate what was useful, recognise client-defined learning and check whether the session met the client’s hopes.", "when": "At the end of each meeting.", "steps": ["Pause and invite the client’s summary of what was useful.", "Offer a specific acknowledgement based on what the client said.", "Ask what they want to take away or notice before the next meeting.", "Check feedback about the session and agree next appointment or follow-up."], "prompts": ["What has been most useful to talk about today?", "What will you take away from our conversation?", "How was this session for you; is there anything you would like me to do differently?"], "dialogue": "“We explored what a calmer morning would look like and the small step you chose. What feels most useful to take with you? Is there anything about how we worked that you would change?”", "if_client_says": ["If nothing was useful, thank them for saying so and explore what would make future work more relevant."], "tip": "The client’s feedback is data for adapting the process.", "caution": "Do not present an unagreed task as a required homework assignment.", "added": true}, {"name": "Follow-up: amplify what is better", "level": "foundation", "purpose": "Understand the detail and significance of progress since the previous meeting.", "when": "At follow-up, including when change is small or inconsistent.", "steps": ["Ask what is better, different or worth noticing since last time.", "Request specific examples.", "Explore what the client did, what others contributed and what conditions helped.", "Ask what the client wants to continue or build on."], "prompts": ["What is better, even a little, since we last met?", "What did you notice yourself doing that helped?", "How would you like to build on that, if at all?"], "dialogue": "“You said the mornings were slightly easier twice this week. What happened on those mornings, and what would you like to carry forward?”", "if_client_says": ["“Same”: ask what needs attention now, what has helped them maintain stability, or whether the goal/process needs revising.", "“Worse”: validate, assess risk and clinical deterioration, and adapt the care plan."], "tip": "Amplify client-defined learning, not just symptom reduction.", "caution": "Progress questions must not pressure clients to report improvement.", "added": true}, {"name": "Identity and meaning questions", "level": "advanced", "purpose": "Explore how the client understands themselves when they act in line with their hopes, values or preferred relationships.", "when": "When the client finds identity, self-respect or meaning relevant to the desired change.", "steps": ["Ask permission before exploring identity or meaning.", "Link the question to a specific event or preferred-future sign.", "Invite the client to define the meaning.", "Avoid turning one action into a fixed personality label."], "prompts": ["What does that action say about what matters to you?", "What have you learned about yourself from that moment?"], "dialogue": "“When you spoke up respectfully, what did that mean to you about the kind of person you want to be?”", "if_client_says": ["If the client does not find identity language useful, return to observable actions and goals."], "tip": "Identity questions are optional and should follow the client’s priorities.", "caution": "Avoid imposing cultural, moral or spiritual meanings.", "added": true}], "technique_selection": {"diagram_id": "sfbt-conversation", "table": [{"situation": "Client’s hopes are vague", "technique": "Best-hopes and preferred-future questions", "rationale": "Clarify the client’s own desired difference and observable signs."}, {"situation": "No exceptions are apparent", "technique": "Coping questions, resource questions, practical-needs assessment", "rationale": "Acknowledge difficulty without demanding a success story."}, {"situation": "Client identifies a better moment", "technique": "Exception-finding", "rationale": "Explore specific context, actions and supports."}, {"situation": "Progress is hard to describe", "technique": "Client-defined scaling", "rationale": "Make the current position and small movement discussable."}, {"situation": "Client is mandated or unsure", "technique": "Transparent contract-building and permission-based questions", "rationale": "Clarify autonomy, remit and referral context honestly."}, {"situation": "Client reports worsening or risk", "technique": "Direct assessment, safeguarding and referral", "rationale": "Safety and necessary care take priority over routine SFBT techniques."}]}, "problem_applications": [{"problem": "Client says “I just want the anxiety/depression to stop”", "model": "Problem relief is important, but the client may also have a preferred life beyond symptom absence.", "originator": "SFBT practice", "maintaining_cycle": "Goal remains abstract → session lacks observable target → progress is hard to recognise.", "priority_techniques": ["Best-hopes question", "Preferred-future / tomorrow question", "Scaling questions"], "pitfall": "Rushing to a miracle-style question before acknowledging distress.", "diagram_id": "sfbt-conversation", "added": true}, {"problem": "Client cannot identify exceptions", "model": "The problem may feel constant; the practitioner should not argue that exceptions must exist.", "originator": "SFBT practice", "maintaining_cycle": "Repeated demands for success examples → client feels misunderstood → disengagement.", "priority_techniques": ["Coping questions", "Resource and strength questions", "Pre-session / between-session change"], "pitfall": "Turning exception-finding into a test the client can fail.", "diagram_id": "sfbt-exception", "added": true}, {"problem": "Client says “I don’t know”", "model": "Uncertainty may reflect ambivalence, distress, limited experience of choice, a mandated referral or needing more time.", "originator": "SFBT practice", "maintaining_cycle": "Practitioner asks increasingly forceful questions → pressure rises → client withdraws.", "priority_techniques": ["Best-hopes question", "Constructive listening and acknowledgement", "End-of-session reflection and feedback"], "pitfall": "Treating “don’t know” as resistance rather than meaningful information.", "diagram_id": "sfbt-conversation", "added": true}, {"problem": "Client says things are the same", "model": "Stability may matter, or goals/process may not fit; absence of visible change is useful feedback.", "originator": "SFBT practice", "maintaining_cycle": "Therapist assumes progress must have occurred → client feels pressure → honest feedback decreases.", "priority_techniques": ["Follow-up: amplify what is better", "Scaling questions", "Best-hopes question"], "pitfall": "Insisting on finding a small improvement when the client reports none.", "diagram_id": "sfbt-scale", "added": true}, {"problem": "Client says things are worse", "model": "Worsening may indicate risk, unmet needs, treatment mismatch or new contextual events.", "originator": "Clinical assessment integrated with SFBT", "maintaining_cycle": "Therapist stays future-focused and misses deterioration.", "priority_techniques": ["Direct assessment and safeguarding", "Coping-to-next-step bridge", "Follow-up: amplify what is better"], "pitfall": "Treating worsening as simply another opportunity for positive reframing.", "diagram_id": "sfbt-safety", "added": true}, {"problem": "Client is referred or mandated by someone else", "model": "The client may not share the referrer’s goals; transparency and a negotiated project are central.", "originator": "SFBT practice", "maintaining_cycle": "Hidden agenda or coercive tone → mistrust → little useful collaboration.", "priority_techniques": ["Best-hopes question", "Constructive listening and acknowledgement", "Outcome and process clarification"], "pitfall": "Pretending participation is fully voluntary when it is not.", "diagram_id": "sfbt-conversation", "added": true}, {"problem": "Family or couple conflict", "model": "Relational goals may differ and power/safety dynamics must be assessed before conjoint work.", "originator": "SFBT practice with safeguarding integration", "maintaining_cycle": "Assuming equal power or shared goals → unsafe disclosure or escalation.", "priority_techniques": ["Relationship-perspective questions", "Preferred-future / tomorrow question", "Scaling questions"], "pitfall": "Using couple/family sessions where coercion, intimidation or violence makes them unsafe.", "diagram_id": "sfbt-safety", "added": true}, {"problem": "Client faces poverty, homelessness or unmet basic needs", "model": "Preferred futures depend on material conditions, access and systems; individual coping is not enough.", "originator": "SFBT integrated with social care", "maintaining_cycle": "Questions focus only on personal choices → structural barriers are minimised → needs remain unmet.", "priority_techniques": ["Best-hopes question", "Coping questions", "Coping-to-next-step bridge"], "pitfall": "Mistaking endurance for adequate support or treating housing, food or safety as a mindset problem.", "diagram_id": "sfbt-safety", "added": true}, {"problem": "Child or adolescent referred by school or caregiver", "model": "Young person’s voice, developmental needs, assent/consent and safeguarding must be considered alongside adult concerns.", "originator": "SFBT practice with child safeguarding", "maintaining_cycle": "Adult-defined goals dominate → young person disengages or feels blamed.", "priority_techniques": ["Best-hopes question", "Preferred-future / tomorrow question", "Scaling questions"], "pitfall": "Using adult language, assuming family involvement is safe, or promising confidentiality beyond its limits.", "diagram_id": "sfbt-conversation", "added": true}, {"problem": "Client has experienced trauma or abuse", "model": "Choice, safety, stabilisation and control are essential; preferred-future talk should not displace trauma-informed care.", "originator": "Trauma-informed practice integrated with SFBT", "maintaining_cycle": "Premature future questions → client feels unseen or unsafe.", "priority_techniques": ["Constructive listening and acknowledgement", "Coping questions", "Direct assessment and safeguarding"], "pitfall": "Treating trauma as a problem to solve through positive language or asking for details unnecessarily.", "diagram_id": "sfbt-safety", "added": true}], "session_structure": {"single_session": [{"phase": "1. Welcome, consent and immediate priorities", "purpose": "Establish contact, clarify confidentiality and identify urgent needs or risks.", "prompts": ["What would be important for us to talk about today?", "Is there anything that needs attention first so you can take part safely?"]}, {"phase": "2. Best hopes and working agreement", "purpose": "Understand the client’s preferred outcome and negotiate a realistic joint project.", "prompts": ["What are your best hopes from this meeting?", "What would make it useful for you?"]}, {"phase": "3. Preferred future and observable signs", "purpose": "Make the desired difference concrete and client-defined.", "prompts": ["What would you notice first?", "What would be different in an ordinary day?"]}, {"phase": "4. Resources, exceptions and coping", "purpose": "Explore existing knowledge, actions, supports and moments that may inform change.", "prompts": ["When is this less difficult?", "How have you managed so far?"]}, {"phase": "5. Progress and next step", "purpose": "Use a scale or other client-chosen summary; identify a feasible next step if wanted.", "prompts": ["Where are things now on a scale you define?", "What would a small next sign look like?"]}, {"phase": "6. Summary, acknowledgement and feedback", "purpose": "Consolidate the client’s learning, check usefulness and agree follow-up.", "prompts": ["What has been useful?", "What would you like to take away?", "How was this conversation for you?"]}], "course": [{"session": "Initial contact / first session", "focus": "Best hopes, contract, preferred future, resources and any immediate safety or practical needs.", "review": "Client-defined outcomes and how the work will be evaluated."}, {"session": "Follow-up", "focus": "What is better, what has changed, what has stayed the same or worsened, and what the client wants to work on now.", "review": "Reassess risk, context and fit; do not assume improvement."}, {"session": "Further work as needed", "focus": "Amplify progress, revise goals, use scales or coping questions where useful, and integrate other interventions or supports.", "review": "Continue, change approach, refer or end collaboratively according to need."}, {"session": "Ending / transition", "focus": "Review achievements, resources, remaining needs, warning signs and support pathways.", "review": "Agree maintenance or referral plan without assuming all difficulties are resolved."}], "session_diagram_id": "sfbt-conversation", "course_diagram_id": "sfbt-conversation", "ending_script": "“We have talked about what you hoped for and what you want to notice next. What stands out as useful to you? What would you like to keep in mind? Before we finish, is there anything important we have missed, and how was this session for you?”"}, "worked_case": {"client": "Fictional composite: “Maya,” a 29-year-old referred for recurring conflict with a family member and feeling overwhelmed. No single case represents all clients.", "presenting_problem": "Maya says, “I want home to be peaceful, but I don’t know where to start.” The practitioner first clarifies referral context, confidentiality, safety and whether conjoint work is appropriate.", "formulation_diagram_id": "sfbt-conversation", "goals": ["Maya’s own definition of what a calmer home would look like.", "Observable early signs that conflict is less controlling.", "Identify resources and one small, safe step chosen by Maya."], "sessions": [{"number": "1", "focus": "Best hopes and preferred future", "dialogue": "Practitioner: “What would be the first small sign that home was becoming calmer?” Maya: “I would be able to finish dinner without an argument.” Practitioner: “What would you notice yourself doing, and what might be different around you?”", "learning": "Clarifies a concrete desired difference without assuming Maya alone controls the family environment."}, {"number": "2", "focus": "Exceptions and context", "dialogue": "Maya describes one evening when she took a short pause and a trusted relative helped change the subject. The practitioner asks what made that possible and whether any part is safe and useful to repeat.", "learning": "Explores context and support; does not imply that all conflict is preventable by Maya."}, {"number": "3", "focus": "Scale and next step", "dialogue": "Maya defines 0 as “constant conflict with no safe pause” and 10 as “we can disagree without intimidation.” She rates the situation at 3 and identifies one boundary and one support contact.", "learning": "Scale anchors are Maya’s own; the practitioner monitors safety and avoids conjoint work if coercion is present."}], "setback": "If Maya reports escalation, threats or fear, the practitioner stops routine solution-building and reassesses safety, safeguarding and referral options. A small conversational step is not a substitute for protection.", "outcome": "Illustrative only: Maya identifies a clearer preferred outcome and a safer support plan. No clinical outcome is guaranteed or inferred from this teaching example.", "dialogue": "“What would tell you that the step was useful? What would you want to do if it did not help or if things became less safe?”", "relapse_prevention": "Identify early signs that conflict is escalating, safe people and services to contact, client-chosen responses, and circumstances requiring urgent help. Review the plan in context."}, "tools": [{"name": "Best-hopes and working-agreement sheet", "level": "foundation", "purpose": "Clarify why the client has come, their hoped-for outcome and the service’s remit.", "when": "Clarify why the client has come, their hoped-for outcome and the service’s remit.", "fields": ["Client’s best hopes in their own words.", "What would make the work useful?", "What can this service offer and not offer?", "Agreed outcomes, process, review and referral needs."], "example": "Use collaboratively and adapt to the client’s language, access needs and circumstances.", "added": true}, {"name": "Preferred-future detail map", "level": "foundation", "purpose": "Translate broad hopes into observable early signs.", "when": "Translate broad hopes into observable early signs.", "fields": ["What would be different in an ordinary day?", "What would the client do, say, notice or experience?", "Who might notice, if relevant and safe?", "What is the first small sign?"], "example": "Use collaboratively and adapt to the client’s language, access needs and circumstances.", "added": true}, {"name": "Exception and resource record", "level": "foundation", "purpose": "Explore specific times when the problem was less influential and what supported that difference.", "when": "Explore specific times when the problem was less influential and what supported that difference.", "fields": ["Describe one specific instance.", "What happened before, during and after?", "What did the client do? What did others or context contribute?", "What, if anything, is worth taking from it?"], "example": "Use collaboratively and adapt to the client’s language, access needs and circumstances.", "added": true}, {"name": "Client-defined scaling sheet", "level": "foundation", "purpose": "Track a chosen dimension in the client’s language.", "when": "Track a chosen dimension in the client’s language.", "fields": ["Define 0 and 10 clearly.", "Record current rating and why it fits.", "What supports the current rating rather than a lower one?", "What would a small move look like?", "What support or conditions are needed?"], "example": "Use collaboratively and adapt to the client’s language, access needs and circumstances.", "added": true}, {"name": "Follow-up and progress review", "level": "foundation", "purpose": "Review what is better, the same or worse and adapt the plan.", "when": "Review what is better, the same or worse and adapt the plan.", "fields": ["What has changed since last time?", "Specific examples and context.", "Client’s interpretation and priorities.", "Risk/clinical update.", "Continue, adapt, integrate or refer."], "example": "Use collaboratively and adapt to the client’s language, access needs and circumstances.", "added": true}, {"name": "Group / school solution-focused check-in", "level": "foundation", "purpose": "Invite participants to define preferred outcomes and small signs of progress while protecting privacy.", "when": "Invite participants to define preferred outcomes and small signs of progress while protecting privacy.", "fields": ["Set group safety and confidentiality expectations.", "Ask what participants hope to gain.", "Use accessible, non-stigmatising questions.", "Invite optional responses and multiple perspectives.", "Clarify referral pathways and limits."], "example": "Use collaboratively and adapt to the client’s language, access needs and circumstances.", "added": true}], "troubleshooting": [{"if": "Client says “I don’t know”", "try": "Slow down and acknowledge uncertainty. Ask what led them to attend, what they would like to be less difficult, or whether they want time to think. Do not force a miracle question."}, {"if": "Client cannot imagine a preferred future", "try": "Start with a smaller time horizon, ask what they would like less of, explore a past better moment or shift to coping and immediate needs."}, {"if": "No exceptions are identified", "try": "Accept this. Explore coping, resources, pre-session change, or what would make the next day safer and more manageable."}, {"if": "Client feels the approach is too positive or dismissive", "try": "Acknowledge the impact, apologise if needed, return to the client’s account of suffering, and ask what kind of conversation would feel useful."}, {"if": "Client’s goal is outside service remit", "try": "Be transparent about limits, separate desired outcome from available process, and help identify an appropriate referral or practical route."}, {"if": "Client is mandated and does not want to attend", "try": "Name the mandate honestly, explain confidentiality and consequences accurately, and ask what would make participation least unhelpful or what the client wants recorded."}, {"if": "Client says things are the same", "try": "Do not insist on finding progress. Ask what needs attention today, whether stability matters, and whether the goal or process needs changing."}, {"if": "Client says things are worse", "try": "Validate, reassess risk and functioning directly, consider new stressors or unmet needs, and revise care or refer as indicated."}, {"if": "Scale rating seems inconsistent with practitioner view", "try": "Ask what the number means to the client and what evidence supports it. Do not argue or replace the client’s definition with yours."}, {"if": "Family members have different preferred futures", "try": "Make differences explicit, assess safety and power, and negotiate shared and separate goals only where appropriate. Do not manufacture agreement."}, {"if": "A client describes abuse or coercion", "try": "Prioritise safety, direct assessment, safeguarding and specialist pathways. Do not use conjoint sessions or “communication” tasks by default."}, {"if": "Practitioner feels compelled to ask every SFBT question", "try": "Return to curiosity, client language and the purpose of the next question. The model is a guide, not a formula."}], "troubleshooting_added": true, "cultural_adaptation": ["Ask what a better future means to the client in their own cultural, linguistic, family and social context.", "Do not assume individual independence is the preferred outcome; some clients prioritise interdependence, family roles or community belonging.", "Use interpreters and translated materials where needed; speak to the client, not about them.", "Explore caste, class, gender, disability, migration, racism, economic precarity and discrimination as contextual realities.", "Do not treat structural barriers as a lack of hope, resilience or motivation.", "Ask before involving family, community or religious supports; these may be unwanted or unsafe.", "Adapt questions to literacy, age, neurodivergence, cognitive needs and communication preferences.", "Avoid assuming that a client’s scale, metaphors or preferred-future description means the same thing across cultures.", "Attend to privacy and confidentiality in crowded households, schools and online settings.", "Use culturally relevant examples only with the client’s permission and meaning.", "Seek consultation when cultural, legal or safeguarding questions exceed competence."], "cultural_adaptation_added": true, "ethics_referral": ["Obtain informed consent/assent and explain confidentiality and its limits in accessible language.", "Clarify the referral mandate, information-sharing arrangements and the client’s choices honestly.", "Use SFBT within competence and training; seek supervision for complex or stalled cases.", "Assess suicide risk, self-harm, violence, abuse, neglect, severe deterioration and other clinical concerns directly when indicated.", "Follow safeguarding law, professional obligations and service protocols; immediate danger takes priority over routine conversation.", "Do not imply that clients are responsible for structural hardship or that positive thinking will solve unsafe conditions.", "Respect client autonomy and avoid imposing goals, scales, homework or preferred futures.", "Consider whether family or couple work is safe; assess coercion and power dynamics before conjoint sessions.", "Document formulation, client-defined goals, risk decisions, consent, consultation, referrals and agreed next steps.", "Protect notes, worksheets and digital data; collect only necessary information and follow privacy policy.", "Coordinate with other providers with consent and according to law and policy.", "Refer for diagnostic uncertainty, severe or worsening symptoms, complex comorbidity, specialist treatment or needs outside scope.", "For remote work, follow policy for location, privacy, emergency contacts and response to disconnection during risk.", "Use validated measures and copyrighted materials according to their permissions."], "ethics_referral_added": true, "client_handouts": [{"id": "sfbt-preferred-future", "title": "My preferred future: first signs", "give_when": "When the client wants to describe what they hope will be different.", "body": ["Use this page only if it is useful. You do not have to solve everything at once.", "A preferred future can be described in small, ordinary details. It does not need to be perfect, and it is your description to shape."], "try_this": ["What do I hope will be different?", "What would I notice first in an ordinary day?", "What might I be doing, saying or experiencing?", "What is one small sign that things are moving in the direction I want?"], "notes_prompt": "What matters most to me about this change?", "form": [{"t": "guide", "text": "Example: “I might notice that I get dressed before checking my messages.” Your first sign can be different."}, {"t": "line", "label": "My best hope is…", "lines": 2}, {"t": "line", "label": "The first sign I might notice is…", "lines": 2}, {"t": "line", "label": "A small step I choose is…", "lines": 2}, {"t": "line", "label": "Support or conditions I need are…", "lines": 2}]}, {"id": "sfbt-scale", "title": "My progress scale", "give_when": "When a scale helps the client reflect on progress or confidence.", "body": ["Choose your own meaning for the scale. There are no right or wrong numbers, and you can choose a different way to describe progress.", "The number is a conversation aid, not a score or a prediction. You can change the scale or leave it blank."], "try_this": ["0 means…", "10 means…", "Right now I would place myself at…", "What makes it this number rather than lower?", "What would a small move forward look like?"], "notes_prompt": "What would make the next step more possible?", "form": [{"t": "guide", "text": "For example, a move from 3 to 4 might mean taking one break with a colleague, if that matters to you."}, {"t": "line", "label": "My scale is about…", "lines": 2}, {"t": "line", "label": "0 means…", "lines": 2}, {"t": "line", "label": "10 means…", "lines": 2}, {"t": "line", "label": "My current number and why…", "lines": 2}, {"t": "line", "label": "My next sign…", "lines": 2}]}, {"id": "sfbt-exceptions", "title": "Noticing what helps", "give_when": "When the client wants to reflect on a moment that was a little less difficult.", "body": ["This is not a test of whether you are trying hard enough. Some problems have no clear exceptions, and that is okay.", "If you notice a moment that was a little different, you can explore what was happening without treating it as proof that the problem is solved."], "try_this": ["Describe one moment that was a little different, if any.", "What was happening around you?", "What helped, including other people or circumstances?", "Is any part worth remembering or repeating?"], "notes_prompt": "What would I like my practitioner to understand about this?", "form": [{"t": "guide", "text": "Example: “I felt less alone when I sent a message to my cousin.” The detail that matters is the one you choose."}, {"t": "line", "label": "The moment…", "lines": 2}, {"t": "line", "label": "What was different…", "lines": 2}, {"t": "line", "label": "What helped…", "lines": 2}, {"t": "line", "label": "What I want to take from it…", "lines": 2}]}, {"id": "sfbt-coping", "title": "Getting through a difficult time", "give_when": "When the client is overwhelmed and a future-focused exercise feels too much.", "body": ["You do not have to turn hardship into a positive story. This page can help identify what support is needed now.", "If things feel unsafe or too difficult to manage alone, use the support and local crisis information on this page and tell your practitioner."], "try_this": ["What has helped me get through today, even a little?", "What makes the next few hours safer or more manageable?", "Who or what could support me?", "What practical help do I need?"], "notes_prompt": "What support should we discuss together?", "form": [{"t": "guide", "text": "For example, support might mean asking someone to stay nearby or arranging practical help. Choose what feels relevant and safe."}, {"t": "line", "label": "What is hardest right now…", "lines": 2}, {"t": "line", "label": "What has helped me manage…", "lines": 2}, {"t": "line", "label": "What I need next…", "lines": 2}, {"t": "line", "label": "Who I can contact…", "lines": 2}]}], "client_handouts_added": true, "counsellor_sheets": [{"sections": [{"heading": "Client’s best hopes", "items": [{"t": "guide", "text": "Begin with what the client wants from the conversation or work. Keep the client’s wording and make the focus useful to them."}, {"t": "line", "label": "Client’s best hopes, in their words", "lines": 3}, {"t": "line", "label": "What would make this conversation useful today?", "lines": 2}, {"t": "guide", "text": "Example prompt: “What are your best hopes from our meeting today?”"}]}, {"heading": "Preferred future and signs", "items": [{"t": "guide", "text": "Invite a description of a preferred future only if it fits the client. Ask for small, observable details and who might notice. Do not assume the client wants a “miracle question”."}, {"t": "line", "label": "What might be different in an ordinary day?", "lines": 3}, {"t": "line", "label": "What might the client notice first? Who else might notice?", "lines": 2}, {"t": "line", "label": "What would be a small sign that things are moving in the preferred direction?", "lines": 2}, {"t": "guide", "text": "Example: “If tomorrow were a little better, what is the first small thing you might notice at work?”"}]}, {"heading": "Resources and exceptions", "items": [{"t": "guide", "text": "Explore times the concern was less intense, coping the client already uses, and people or conditions that help. Avoid treating an exception as proof that the problem is solved."}, {"t": "line", "label": "A recent time the concern was less present or more manageable", "lines": 3}, {"t": "line", "label": "What the client did that may have helped", "lines": 2}, {"t": "line", "label": "Skills, relationships or circumstances the client wants to draw on", "lines": 2}, {"t": "guide", "text": "Example prompt: “When was this a little less difficult, even briefly? What was different then?”"}]}, {"heading": "Progress and next step", "items": [{"t": "guide", "text": "Use a scale only if the client finds it useful. Let the client define what the numbers mean and what would count as one small movement. A scale is a conversation prompt, not a clinical risk prediction."}, {"t": "scale", "label": "Where would the client place things on their own scale today?", "low": "Lowest point for this concern", "high": "Preferred direction", "top": 10}, {"t": "line", "label": "What makes the current number higher than zero?", "lines": 2}, {"t": "line", "label": "What would one small step forward look like to the client?", "lines": 2}, {"t": "line", "label": "What would the client like to notice or try before the next meeting?", "lines": 2}], "page_after": true}, {"heading": "Safety and scope", "items": [{"t": "guide", "text": "Solution-focused questions do not replace risk assessment, safeguarding or referral. Ask directly about safety when indicated, explore immediate needs and supports, and follow the relevant local procedure."}, {"t": "line", "label": "Safety or safeguarding concern and client’s account", "lines": 3}, {"t": "line", "label": "Protective support, consultation or referral needed", "lines": 2}, {"t": "line", "label": "Agreed action, responsible person and follow-up time", "lines": 2}]}], "id": "sfbt-session-planner", "title": "SFBT session planner", "use_when": "For preparing a session and reviewing whether the conversation fits the client. Use as a prompt, not a mandatory sequence.", "cover": {"title": "SFBT session planner", "note": "Record the minimum necessary information. Store completed sheets securely and follow local law and service policy.", "items": [{"t": "pair", "fields": ["Client identifier or approved record reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and role", "Setting or mode"]}]}}, {"sections": [{"heading": "Collaboration", "items": [{"t": "guide", "text": "Review whether the work followed the client’s best hopes and language. Note where the practitioner’s focus may have differed from the client’s priority."}, {"t": "line", "label": "Client’s stated hope and agreed session focus", "lines": 2}, {"t": "line", "label": "Evidence that the client shaped the direction of the conversation", "lines": 2}, {"t": "line", "label": "Where collaboration could be strengthened", "lines": 2}]}, {"heading": "Question choice", "items": [{"t": "guide", "text": "Review the question in context and what it invited the client to notice. Do not use question types mechanically or force a preferred-future question when it does not fit."}, {"t": "table", "columns": ["Question or prompt used", "What the client said or did next"], "rows": 3}, {"t": "line", "label": "Which question seemed useful, and what suggested that?", "lines": 2}, {"t": "line", "label": "Which question did not fit or needs adapting?", "lines": 2}]}, {"heading": "Context and ethics", "items": [{"t": "guide", "text": "Consider culture, identity, power, access needs and practical pressures. Check consent, confidentiality, scope, safeguarding and referral responsibilities."}, {"t": "line", "label": "Context the client wants considered", "lines": 2}, {"t": "line", "label": "Ethical, access or scope concern for consultation", "lines": 2}, {"t": "line", "label": "Safety or safeguarding enquiry and action if relevant", "lines": 3}], "page_after": true}, {"heading": "Outcome and next decision", "items": [{"t": "guide", "text": "Review what the client says is different, unchanged or still important. Agree whether to continue, adjust the focus, consult or refer, and document the client’s view."}, {"t": "line", "label": "Client’s description of progress or no progress", "lines": 2}, {"t": "line", "label": "Resources or exceptions the client wants to keep using", "lines": 2}, {"t": "line", "label": "Client-chosen next step or decision to pause", "lines": 2}, {"t": "pair", "fields": ["Responsible person", "Review date"]}, {"t": "line", "label": "Question for supervision", "lines": 2}]}], "id": "sfbt-supervision-review", "title": "SFBT supervision review", "use_when": "When reviewing a session, stalled work, mandated referrals or complex contexts. Bring the client’s language and relevant risk/context information; de-identify where possible.", "cover": {"title": "Supervision review", "note": "De-identify where possible and follow confidentiality and supervision agreements.", "items": [{"t": "pair", "fields": ["Case reference", "Date"]}, {"t": "pair", "fields": ["Practitioner and supervisor", "Setting"]}]}}], "counsellor_sheets_added": true, "session_note_template": {"fields": [{"label": "Session details and consent", "guidance": "Client ID, date, session number, duration, mode, attendees, consent/assent and relevant confidentiality limits."}, {"label": "Referral context and best hopes", "guidance": "Self-referral or mandate, client’s own stated hopes, service remit and agreed joint project."}, {"label": "Preferred future, resources and progress", "guidance": "Client-defined signs, exceptions/coping/resources, scaling anchors and current rating if used."}, {"label": "Clinical assessment and formulation", "guidance": "Current presentation, relevant context, direct risk/safeguarding assessment and clinical reasoning when indicated."}, {"label": "Agreed next step and follow-up", "guidance": "Client-chosen next step, support needed, outcome indicators, consultation/referral, safety plan and next appointment."}], "example": "Fictional example: Client’s best hope is a calmer morning routine. Client described one recent morning that felt more manageable and identified a supportive text from a friend. Agreed to notice what helped and decide whether to repeat one element. Risk and referral context reviewed according to service policy.", "note": "Document objectively and respectfully. Do not imply that a conversational scale is a validated measure. Follow applicable law, professional standards and service policy."}, "session_note_template_added": true, "online_adaptations": ["Confirm identity, privacy, the client’s location and an appropriate emergency contact process according to service policy.", "Check whether anyone else can overhear; do not assume a client can speak freely at home or school.", "Use accessible scale formats: spoken, chat, visual card or another client-preferred method.", "Explain what happens if the connection drops during a risk concern.", "Avoid sending worksheets or messages to shared devices without checking privacy.", "For children and adolescents, clarify who is present, consent/assent, caregiver involvement and safeguarding limits.", "Use short summaries and check understanding across language and connectivity barriers.", "Remote SFBT does not reduce the need for direct risk assessment or referral."], "online_adaptations_added": true, "tips": ["Ask what makes the next question useful before asking it.", "Follow the client’s exact wording; do not replace it with jargon.", "Acknowledge distress before asking about hope or exceptions.", "Ask for concrete examples rather than abstract generalities.", "Use client-defined scales and anchors.", "Treat exceptions as learning opportunities, not proof that the client could always solve the problem.", "Notice coping and effort without romanticising suffering.", "Check whether your compliment or summary fits the client’s experience.", "Separate the client’s desired outcome from what the service can offer.", "Review what is better, the same or worse at follow-up.", "Use direct risk assessment when clinically indicated.", "Adapt or abandon a technique if the client finds it unhelpful."], "pitfalls": ["Reducing SFBT to positivity, cheerleading or “look on the bright side.”", "Using a rigid sequence of miracle, exception and scale questions with every client.", "Rushing past distress, grief or trauma to reach a preferred future.", "Assuming clients can change any circumstance through personal choice.", "Treating exceptions as evidence that the client is to blame for the problem.", "Using vague compliments or praise that feels patronising.", "Treating a conversational scale as a validated clinical measure.", "Ignoring referral mandate, consent, confidentiality or power differences.", "Assuming family involvement is safe or desired.", "Failing to reassess when the client reports worsening or risk.", "Promising brief treatment or a guaranteed outcome.", "Continuing SFBT alone when other interventions, practical help or specialist care are needed."], "competency_checklist": ["Explains SFBT as collaborative and goal-directed, not simply positive thinking.", "Clarifies best hopes, referral context and realistic remit.", "Helps clients describe observable signs of a preferred future.", "Uses exceptions, resources and coping questions without blame or pressure.", "Defines scaling anchors with the client and interprets them collaboratively.", "Uses acknowledgement grounded in the client’s own words.", "Adapts questions to developmental stage, culture, language and context.", "Assesses risk and safeguarding independently of solution-focused questioning.", "Recognises when family/couple work may be unsafe.", "Reviews progress honestly, including no change or deterioration.", "Documents the joint project, decisions and referrals.", "Uses supervision, outcome feedback and evidence to adapt practice."], "competency_checklist_added": true, "supervision_prompts": ["What are the client’s best hopes, in their own words?", "Have I followed the client’s language or imposed my own description?", "Did the client experience the questions as respectful, useful and appropriately paced?", "What evidence supports the preferred-future description, and what remains unclear?", "Have I acknowledged distress and context before asking about possibilities?", "Are exceptions being explored without blame or invalidation?", "What do the client’s scale anchors actually mean?", "Have I clarified the referral mandate and confidentiality limits?", "Could power, coercion, violence or safeguarding issues make conjoint work unsafe?", "Are practical or structural barriers being mistaken for individual deficits?", "What changed, stayed the same or worsened, and what does that require clinically?", "Is SFBT sufficient here, or do I need consultation, integration or referral?"], "supervision_prompts_added": true, "quiz": [{"question": "What best characterises SFBT?", "options": ["It requires a complete explanation of the problem before any change", "A collaborative, goal-directed conversation exploring preferred futures, resources and progress", "A form of generic positive thinking", "A fixed four-session protocol"], "answer": 1, "rationale": "SFBT emphasises client-defined outcomes, preferred futures, resources and signs of change. It does not deny problems or prescribe a universal session count."}, {"question": "What is the main purpose of a preferred-future question?", "options": ["Convince the client that everything will improve", "Create a detailed, client-defined picture of desired differences", "Diagnose the client", "Prove the client is motivated"], "answer": 1, "rationale": "The preferred future is described in observable terms and remains grounded in the client’s context and hopes."}, {"question": "A client says there are no exceptions. What should the practitioner do?", "options": ["Insist that exceptions must exist", "Tell the client to be more positive", "Accept the answer and consider coping, resources, needs or safety", "End the session"], "answer": 2, "rationale": "Exception-finding is not a test. Coping questions and direct assessment may be more appropriate."}, {"question": "What makes a scaling question useful?", "options": ["The practitioner assigns standard meanings to every number", "The client and practitioner define the anchors and explore the client’s explanation", "It replaces risk assessment", "It provides a diagnosis"], "answer": 1, "rationale": "Scaling is a collaborative conversational tool unless a validated measure is specifically used."}, {"question": "A mandated client says, “I don’t want to be here.” What is the best response?", "options": ["Pretend attendance is voluntary", "Explain the mandate honestly and explore what, if anything, the client wants from the meeting", "Insist on a miracle question", "Tell the referrer the client is resistant"], "answer": 1, "rationale": "Transparency about context and limits supports an honest working agreement."}, {"question": "Which is an example of a coping question?", "options": ["Why do you keep making bad choices?", "How have you managed to get through the hardest part of this week?", "Why don’t you just change?", "What is your diagnosis?"], "answer": 1, "rationale": "Coping questions acknowledge effort and survival, while practical support and risk assessment remain necessary."}, {"question": "A client reports worsening symptoms and suicidal intent. What takes priority?", "options": ["Continue scaling questions", "Complete a worksheet first", "Direct risk assessment, safety procedures and urgent care as indicated", "Ask the client to find an exception"], "answer": 2, "rationale": "Safety and appropriate care take precedence over routine SFBT techniques."}, {"question": "What is the risk of generic compliments?", "options": ["They always improve engagement", "They can feel patronising or steering if not grounded in the client’s experience", "They are required in every session", "They replace reflection"], "answer": 1, "rationale": "Acknowledgement should be specific, credible and checked for fit."}, {"question": "Why clarify outcome and process separately?", "options": ["The practitioner should choose the outcome", "A client’s desired result may differ from what the service can provide or how the work will proceed", "It makes consent unnecessary", "It guarantees brief treatment"], "answer": 1, "rationale": "A joint project requires clarity about desired change and realistic service remit."}, {"question": "What does “brief” mean in SFBT?", "options": ["A fixed number of sessions for everyone", "No assessment is needed", "A focus on useful change and efficient collaboration, with duration determined by need and context", "Sessions must always be under 20 minutes"], "answer": 2, "rationale": "Brief does not mean rushed or omit assessment; care should fit need and response."}, {"question": "A family member discloses coercion and fear. What should the practitioner consider?", "options": ["Schedule conjoint communication exercises immediately", "Assess safety and power dynamics and consider safeguarding/specialist pathways", "Ask everyone to rate the relationship", "Treat it as a communication problem only"], "answer": 1, "rationale": "Conjoint work may be unsafe in coercive or violent contexts; safeguarding and specialist judgement take priority."}, {"question": "What is the best way to use a missed or absent change?", "options": ["Blame the client", "Pretend improvement occurred", "Treat it as feedback to reassess the goal, process, context, risk and support needs", "End all care automatically"], "answer": 2, "rationale": "No change or worsening is meaningful clinical information and may require adapting or stepping up care."}], "quick_reference": ["Clarify the client’s best hopes and the actual referral context.", "Ask what would be different if the preferred future began to emerge.", "Listen for resources, coping and exceptions without demanding them.", "Use client-defined scaling only when it helps.", "Ask what a small, observable next sign would look like.", "At follow-up, explore what is better, the same or worse.", "Keep the conversation collaborative, culturally responsive and non-blaming.", "Assess risk and safeguarding directly when indicated; SFBT does not replace clinical assessment.", "Be transparent about scope, limitations, referrals and what the service can offer.", "Review fit and outcome; adapt, integrate or refer when needed."], "glossary": [{"term": "Solution-Focused Brief Therapy (SFBT)", "definition": "A collaborative, goal-directed approach that explores preferred futures, resources, exceptions, coping and signs of progress."}, {"term": "Preferred future", "definition": "The client’s description of how life would be different if their hopes began to be realised."}, {"term": "Best hopes", "definition": "The client’s hoped-for outcomes from the conversation or work."}, {"term": "Joint project / working agreement", "definition": "A negotiated understanding of goals, process, roles, remit and review."}, {"term": "Exception", "definition": "A time when the problem was absent, less severe, shorter or less influential."}, {"term": "Coping question", "definition": "A question acknowledging how a person has managed during difficult circumstances."}, {"term": "Scaling question", "definition": "A collaboratively defined numeric continuum used to discuss progress, confidence or another chosen dimension."}, {"term": "Constructive listening", "definition": "Listening for client-defined preferences, resources, agency and possibilities while still hearing distress and context."}, {"term": "Acknowledgement", "definition": "Specific, credible recognition of effort, action, values or experience grounded in the client’s account."}, {"term": "Pre-session change", "definition": "A change that may occur between deciding to seek help and the first session."}, {"term": "Outcome", "definition": "The change the client hopes to see in life or circumstances."}, {"term": "Process", "definition": "How the client and practitioner will work together toward the desired outcome."}, {"term": "Co-construction", "definition": "Meaning and next steps developed collaboratively in conversation."}, {"term": "Not-knowing stance", "definition": "A posture of genuine curiosity that treats the client as expert on their own experience while preserving practitioner responsibility."}, {"term": "Relationship-perspective question", "definition": "A question exploring what relevant others might observe if a preferred future begins to emerge."}, {"term": "Safeguarding", "definition": "Actions and duties to protect children or adults at risk from abuse, neglect or harm."}, {"term": "Mandated referral", "definition": "A referral where attendance or involvement is requested or required by another person or institution."}, {"term": "Outcome monitoring", "definition": "Repeated review of client-defined goals and relevant clinical measures to guide care."}, {"term": "Cultural humility", "definition": "Ongoing curiosity about how culture, power, identity and context shape meaning and access to change."}, {"term": "Brief therapy", "definition": "Therapy organised around efficient, useful change; it does not imply a fixed number of sessions or omitted assessment."}], "related_modules": ["person-centred-therapy", "cbt", "behavioural-activation", "motivational-interviewing", "acceptance-commitment-therapy", "family-counselling", "child-and-adolescent-counselling", "crisis-assessment"], "safety_note": "Solution Focused Brief Therapy is not a crisis intervention and does not replace diagnostic assessment, safeguarding, medical care or practical support. If immediate risk to life or safety emerges, prioritise direct risk assessment and the applicable emergency, safeguarding and referral procedures. In India, emergency services: 112; Tele-MANAS mental health support: 14416. Use these pathways according to the situation and local policy; do not delay emergency response to complete a solution-focused conversation."}};
